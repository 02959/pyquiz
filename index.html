(function(){
  var P = {"py124": {"why": "右边三个值先按顺序取好是 (2, 3, 1)，再依次赋给 a、b、c，原来的 a=1、b=2、c=3 变成 2、3、1。如果拆成三行 `a = b; b = c; c = a`，a 的旧值在第 1 行就被覆盖了，第 3 行拿到的是新的 a=2，结果是 `2 3 2`——这就是必须用一行元组赋值的原因。", "detail": "三变量多重赋值同样是「右边先算成整体，再按位置赋回去」。\n\n推导：右边 `b, c, a` 此时是 `2, 3, 1`，算成元组 `(2, 3, 1)`，再依次赋给 a、b、c，得 `2 3 1`，相当于整体循环左移一位。\n\n- `1 2 3` 是以为交换没生效。\n- `3 2 1` 是把它当成整体反转。\n- `2 1 3` 是位置对应看错了。\n\n坑：拆成三行 `a = b; b = c; c = a` 会得到 `2 3 2`（实测），因为 a 的旧值 1 早被覆盖，最后一步读到的 a 已经是 2。\n\n记忆点：一行能转，拆行就丢；右边先取齐，左边再落位。"}, "q23": {"detail": "`//` 叫地板除，规则是取“不大于真实商的最大整数”，方向朝负无穷，而不是把小数部分砍掉。\n\n`-5 / 2` 的真实商是 `-2.5`，不大于它的最大整数是 `-3`，所以 `-5 // 2` 得 `-3`。\n\n用整除恒等式验算：`2 * (-3) + (-5 % 2)`，其中 `-5 % 2` 是 `1`，`-6 + 1` 正好回到 `-5`。\n\n选 `-2` 是把它当成了 C 语言的 `/`（向 0 截断）；Python 想在负数上截断，得写 `int(-5 / 2)`。\n\n真正的坑在于：只有“除不尽且符号不同”时才差 1，`-6 // 2` 仍是 `-3`，所以别背成“负数就减一”。\n\n记忆点：地板除永远朝数轴左边踩一脚，正数变小，负数变得更小。"}, "q24": {"detail": "Python 的 `%` 不是“取余数”，而是和 floor 除法配套的取模：`n % d` 的符号永远跟除数 `d` 一致。\n\n`-12 // 7` 是 `-2`，代回恒等式 `n = d * (n // d) + (n % d)`：`7 * (-2) = -14`，`-12 - (-14) = 2`。\n\n所以结果是 `2` 而不是 `-5`；`-5` 是 C 语言那种“先取绝对值再取余、最后贴被除数符号”的算法。\n\n直观理解：余数负责把被除数“补”到除数的整数倍，`-12` 要加 `2` 才够到 `7` 的倍数 `-14`。\n\n别把 `%` 只当“求余”：除数为正时 `n % d` 一定落在 `0` 到 `d-1`，这个性质常用来算星期、做循环取模。\n\n记忆点：余数的正负号看除数，大小看被除数和除数的距离。"}, "q25": {"detail": "`%` 的结果符号跟除数走，除数是 `-7`，所以结果只能是 `0` 或负数。\n\n`12 // -7` 是 `-2`（`-1.71` 向下取整），代回恒等式：`-7 * (-2) = 14`，`12 - 14 = -2`。\n\n和上一题对照：两题都是一正一负，只是符号位置换了，余数就从 `2` 变成 `-2`——起决定作用的是除数的符号。\n\n常见坑：以为 `12 % -7` 和 `-12 % 7` 结果相同，实际一个是 `-2`、一个是 `2`；除数可能为负时，用 `n % abs(d)` 才能拿到标准的非负余数。\n\n记忆点：`n % d` 的正负只由 `d` 决定，和 `n` 的符号无关。"}, "q26": {"detail": "考点是增强赋值：`x += 5` 完全等价于 `x = x + 5`，每一步都拿上一步的新值继续算。\n\n逐步走一遍：`10 + 5 = 15`；`15 - 3 = 12`；`12 * 2 = 24`；`24 // 5 = 4`。\n\n最后一步最容易错：`//=` 是整除不是真除，`24 / 5` 才是 `4.8`；两个操作数都是 int，所以 `24 // 5` 仍是 int `4`。\n\n增强赋值对可变对象是原地修改：`a += [2]` 会改原列表，`a = a + [2]` 会新建一个列表，涉及别名时结果完全不同。\n\n记忆点：`x op= y` 读作“把 x 和 y 运算的结果存回 x”，先算右边，再落回左边。"}, "q27": {"detail": "考算术优先级，从高到低是：`**`、一元 `+ -`、`* / // %`、`+ -`。\n\n所以先算 `2 ** 3 = 8`，再算 `1 + 8 = 9`。\n\n干扰项 `27` 来自 `(1 + 2) ** 3`：`**` 比加法结合得紧，只有括号能改变顺序。\n\n易混点：`**` 甚至比一元负号还紧，`-2 ** 2` 是 `-(2 ** 2) = -4`，写成 `(-2) ** 2` 才是 `4`。\n\n拿不准就加括号，可读性比背优先级表划算。"}, "q28": {"detail": "`*` 和 `/` 同级，同级运算符从左到右结合，所以先 `50 / 2` 再 `* 4`。\n\n`50 / 2` 得 `25.0`：真除 `/` 的结果一定是 float，即使能整除也带小数点。\n\n`25.0 * 4` 得 `100.0`，所以输出 `100.0` 而不是 `100`。\n\n如果误以为先算 `2 * 4`，会得到 `50 / 8 = 6.25`，这就是“同级从左到右”要强调的原因。\n\n想先算后面必须加括号：`50 / (2 * 4)`；想得到整数用 `//`，`50 // 2 * 4` 是 `100`。"}, "q29": {"detail": "三个运算符叠在一起，按 `**`、`*`、`+` 的顺序一层层拆开算。\n\n`4 ** 2 = 16`；`3 * 16 = 48`；`2 + 48 = 50`。\n\n如果按从左到右硬算，会得 `(2 + 3) * 4 ** 2 = 80`，这是最常见的错法。\n\n`**` 只作用于紧挨着它的底数，`3 * 4 ** 2` 里的 `3 *` 不参与乘方。\n\n建议把复杂表达式拆成两步赋值，既好读，也方便打印中间值调试。"}, "q30": {"detail": "考点是 `and` / `or` 的短路求值：左边一旦能定结果，右边根本不会执行。\n\n`x = 0` 时 `x != 0` 为 `False`，`and` 见到 False 立刻返回，`10 / x` 一次都没算。\n\n所以既不报 `ZeroDivisionError`，也不进 if，屏幕上什么都不输出。\n\n这正是 `if x != 0 and 10 / x > 1` 这种“先判零再运算”写法的价值；顺序反过来写成 `10 / x > 1 and x != 0` 就会崩。\n\n`or` 同理，左边为真就返回左边：`name = input() or '匿名'`。\n\n注意 `and` / `or` 返回的是操作数本身而不是 bool，`0 and 1` 得 `0`，`1 and 2` 得 `2`。"}, "q31": {"detail": "`=` 是赋值语句，`==` 才是比较运算符，两者在 Python 里不能互换。\n\n`if` 后面要的是一个表达式，`x = 5` 是语句，在编译阶段就被拒绝，抛 `SyntaxError`，程序一行都跑不起来。\n\n报错信息还会提示 Maybe you meant '==' or ':=' instead of '='?，这是 3.8 之后加的智能提示。\n\n想“边赋值边判断”要用海象运算符 `if (x := 5):`，它是表达式、合法，但可读性差，初学阶段别用。\n\n这类错误连字节码都不会生成，所以既没有输出，也不会走到任何一行代码。"}, "q32": {"detail": "判 `None` 用 `is`：`None` 是全局唯一对象，`is` 比的是“是不是同一个对象”，一次身份比较就够。\n\n`x == None` 能跑，但它会调用 `__eq__`；自定义类可以重写 `__eq__` 让 `x == None` 返回 True，判断就失效了（PEP 8 也因此明确推荐 `is None`）。\n\n`not x` 的语义完全不同：`0`、`''`、`[]`、`{}`、`False` 都会被判成“空”，而它们都不是 `None`。\n\n函数返回 `0` 表示结果是 0，返回 `None` 表示没有结果，用 `not x` 会把这两种情况混成一种。\n\n记忆点：`is` 问“是不是同一个东西”，`==` 问“值等不等”。"}, "q33": {"detail": "`in` 是成员运算符，返回 bool，但“成员”的含义随容器类型变化。\n\n对字符串，`'a' in 'cat'` 查的是子串，等价于 `'cat'.find('a') != -1`；空串 `'' in 'cat'` 恒为 True。\n\n对列表，`3 in [1, 2, 3]` 按 `==` 逐个比较元素，命中就 True。\n\n两边类型不匹配会报错：`1 in '123'` 抛 `TypeError`，因为左操作数必须是 str。\n\n别指望它查子列表：`[1, 2] in [1, 2, 3]` 是 False，列表只看单个元素。\n\n需要下标就换 `'cat'.index('a')`，找不到会抛 `ValueError`，不会静默返回 -1。"}, "py139": {"detail": "两个负数相除：`-7 / -2 = 3.5`，`//` 向下取整得 `3`，负负得正，结果是正数。\n\n用恒等式验算：`-7 == -2 * 3 + (-7 % -2)`，其中 `-7 % -2` 是 `-1`，`-6 + (-1) = -7`，对得上。\n\n所以“负数做地板除一定变小”是错的：变小还是变大要看商的符号，这里 `3.5` 变 `3` 确实变小，但结果仍是正数。\n\n对照：`-7 // 2` 是 `-4`（`-3.5` 向下），`7 // -2` 也是 `-4`，只有两个负数才得正。\n\n记忆点：`//` 只看数轴方向，别套符号口诀，拿不准就代恒等式。"}, "py140": {"detail": "`and` / `or` 是短路运算符，返回的是“决定结果的那个操作数”，不是 `True` / `False`。\n\n`or` 从左往右找第一个真值：`0` 为假，继续看 `'x'`，为真就返回 `'x'`。\n\n`and` 从左往右找第一个假值，全为真就返回最后一个：`2` 为真，于是返回 `3`。\n\n所以 `print` 输出 `x 3`；`0 or 'x'` 在 if 里判断为真，但它的值是字符串 `'x'` 而不是 `True`。\n\n实用写法：`name = input() or '匿名'` 取默认值，`ok = a and b` 在 a 为假时不去碰 b。\n\n注意 `if a or b:` 和 `a = a or b` 是两件事，后者会把变量本身改掉。"}, "py141": {"detail": "`**` 是右结合：多个 `**` 连写时从右往左算，`2 ** 3 ** 2` 等价于 `2 ** (3 ** 2)`。\n\n先算 `3 ** 2 = 9`，再算 `2 ** 9 = 512`；写成 `(2 ** 3) ** 2` 才是 `64`。\n\n右结合符合数学惯例，`a ** b ** c` 就是指数塔 `a ** (b ** c)`，从顶上往下算。\n\n易混：`**` 比一元负号优先级高，`-2 ** 2` 是 `-(2 ** 2) = -4`，`(-2) ** 2` 才是 `4`。\n\n顺带一提，`2 ** -1` 合法，得 `0.5`——负指数返回 float，不再是整数。"}, "q34": {"detail": "`if / elif / else` 是一条链，从上往下逐个判断，命中第一个 True 就执行该分支并跳出整条链。\n\n`75 >= 90` 为 False，继续往下；`75 >= 75` 为 True，打印 `B` 后立即结束。\n\n后面的 `elif score >= 60` 虽然也为真，但根本不会被求值——elif 不是“并列的 if”。\n\n如果把中间的 `elif` 误写成 `if`，三个条件都会被判断，可能打印多行，这是关键字层面的常见 bug。\n\n所以分支要按“从窄到宽”或“从高到低”排，顺序错了结果就错。"}, "q35": {"detail": "三元表达式的形式是 `A if 条件 else B`：条件为真取 A，否则取 B，整个式子是一个有值的表达式。\n\n`age = 20`，`20 >= 18` 为 True，取前面的 `30`，再赋给 `ticket_price`。\n\n顺序是“结果在前、条件在中、else 结果在后”；`else` 分支不能省，写 `30 if cond` 会报 `SyntaxError: expected 'else' after 'if' expression`。\n\n它适合一行取值，嵌套两层以上就该换回 if-elif，否则可读性崩得很快。\n\n只想“做动作、不要值”的场景用普通 if 语句，别硬套三元。"}, "q36": {"detail": "Python 用缩进表示代码块，`if` 冒号后面必须跟一条缩进的语句。\n\n这里 `print('big')` 顶格写，解释器在期待缩进块的位置看到了行首非空白，于是抛 `IndentationError`。\n\n`IndentationError` 是 `SyntaxError` 的子类（`issubclass` 返回 True），但报错更具体；选项里既然单列了它，就该选更精确的那个。\n\n修正：把 `print` 缩进 4 个空格；写成一行 `if x > 2: print('big')` 也完全合法。\n\n坑：同一文件里 Tab 和空格混用，肉眼看着对齐也会报 `TabError`，统一用 4 个空格。"}, "q37": {"detail": "这题考的是“缩进层级决定归属”，不是考条件真假。\n\n`age = 13`，`13 >= 18` 为 False，if 块整体跳过，`可以喝酒` 不会打印。\n\n最后一行 `print('来点威士忌！')` 顶格，不在 if 里，属于顺序执行，所以照样输出。\n\n程序不报错、结果却错——这类逻辑错误比语法错误更难查，因为解释器认为你写的就是这个意思。\n\n判断某行属不属于 if，看它的缩进是否和 if 下面第一行对齐；想两句都受控就一起缩进。"}, "q38": {"detail": "`pass` 是空语句：语法上需要一个代码块，但逻辑上什么都不做。\n\n它最常用于搭骨架：`def f(): pass`、`if cond: pass`、`class A: pass`，先让程序能跑起来，再往里填内容。\n\n对照记忆：`continue` 跳过本次循环、`break` 跳出整个循环、`return` 结束函数并返回值、`pass` 只占位。\n\n`pass` 和注释不同：注释被解释器忽略，`pass` 是真实语句，能占住缩进块；只写注释的 `if` 块照样报 `IndentationError`。\n\n忘了它最容易写出“空块”语法错误，比如 `def f():` 下面直接写下一行。"}, "q39": {"detail": "`if / elif` 是互斥的：第一个条件成立后，后面的 elif 全部跳过。\n\n`x = 5`，`5 > 0` 为 True，打印 `A`，整条链随之结束。\n\n`x > 1` 也成立，但它排在后面，永远轮不到——elif 只在前面所有条件都为 False 时才被求值。\n\n想两个都判断必须写两个独立的 `if`，那种情况下两行都会打印。\n\n坑：范围条件要“窄的在前”，比如先判 `x > 1` 再判 `x > 0`，否则宽条件会把窄条件整个吃掉。"}, "py142": {"detail": "每个对象都有“真值”，`bool()` 把它显式转成 `True` / `False`。\n\n字符串的真值规则只有一条：空串为假，非空为真。`'0'` 里有一个字符，所以是 `True`。\n\n`''` 长度为 0，是 `False`；它和 `' '`（一个空格）不同，空格串是 `True`。\n\n假值家族：`0`、`0.0`、`''`、`[]`、`()`、`{}`、`set()`、`None`、`False`，其余基本为真。\n\n坑：表单读到的 `'0'`、`'False'` 都是非空字符串，`if s:` 会判真，必须显式比较内容。\n\n`if name:` 这种写法依赖的就是这条规则，简洁，但要清楚“空”指的是长度 0。"}, "py143": {"detail": "Python 支持链式比较：`0 < x < 10` 等价于 `0 < x and x < 10`，中间的操作数只求值一次。\n\n写成 `0 < x or x < 10` 几乎永远为真：任何实数要么大于 0、要么小于 10，不可能两边都不满足。\n\n`&&` 是 C / Java 的写法，Python 用 `and` / `or` / `not`，写 `&&` 直接 `SyntaxError`。\n\n`x > 0 and < 10` 少了左操作数，`<` 是二元运算符，同样过不了语法。\n\n链式可以更长：`0 <= x < 10 <= y` 合法，按相邻两两比较、彼此用 and 连接。\n\n注意整条链是 and 关系，想要 or 必须拆成两个比较再手写 `or`。"}, "q40": {"detail": "f-string 的格式说明符用冒号引出：`{值:格式}`，整个串形如 `f'价格：{price:.2f} 元'`。\n\n`.2f` 拆开看：`f` 表示定点小数，`.2` 表示小数点后保留 2 位。\n\n`89.5` 只有 1 位小数，`.2f` 会补一个 `0`，所以是 `89.50` 而不是 `89.5`。\n\n它同时管“四舍五入”和“补齐”：`f'{1/3:.2f}'` 得 `0.33`，`f'{0.5:.2f}'` 得 `0.50`。\n\n坑：浮点数是二进制近似，`f'{2.675:.2f}'` 实际得 `2.67`，做金额要用 `decimal.Decimal`。\n\n常用变体：`:.0f` 取整、`:,` 千分位、`:.2%` 百分比（`f'{0.333:.2%}'` 得 `33.30%`）。"}, "q41": {"detail": "`%d` 是老式格式化里的“整数”占位符，遇到 float 会先转成整数。\n\n转换规则是截断（向 0 取整），不是四舍五入：`3.9` 变 `3`，`-3.9` 变 `-3`。\n\n对照：`int(3.9)` 也是 `3`，而 `round(3.9)` 是 `4`，`f'{3.9:.0f}'` 也是 `4`，三者行为并不相同。\n\n坑：想四舍五入却写 `%d`，会稳定地差 1；要保留小数就用 `%.2f`。\n\n现在更推荐 f-string：`f'{3.9:.0f}'` 会四舍五入，和 `%d` 的截断正好相反，迁移时容易踩。"}, "q42": {"detail": "`+` 是运算符重载：两边都是 str 时做拼接，两边都是数字时做加法，str 和 int 混用没有定义。\n\n所以抛 `TypeError`，意思是 str 只能和 str 拼接、不能和 int 相加，属于类型错误。\n\n正确写法是显式转型：`'a' + str(1)` 得 `'a1'`，或者直接用 `f'a{1}'`。\n\n别和 `*` 搞混：`'a' * 3` 合法（重复），`'a' + 3` 不合法——一个允许“字符串乘整数”，一个不允许“字符串加整数”。\n\n`ValueError` 是“类型对、值不对”（比如 `int('abc')`），`TypeError` 是“类型不匹配”，两个别选错。"}, "q43": {"detail": "`*` 对字符串是重复：`'-' * 20` 生成由 20 个 `-` 组成的新字符串。\n\n`len()` 数的是字符个数（不是字节数），对它来说每个 `-` 算 1 个，所以输出 `20`。\n\n边界：`'-' * 0` 和 `'-' * -1` 都得到空串 `''`，长度为 0，不报错。\n\n常见用途是画分隔线 `print('-' * 40)`、拼表头对齐。\n\n坑：`len()` 按码位算，一个汉字是 1，但显示宽度通常是 2，拿它做表格对齐会歪。"}, "q44": {"detail": "三种格式化写法：`%` 占位（最老）、`str.format()`（2.7+）、f-string（3.6+）。\n\nf-string 在字符串前加 `f`，花括号里直接写表达式，`f'{x}'` 不用数参数位置，可读性最好，也是本课推荐。\n\n`'%s' % x` 要记占位符和参数的对应关系，参数一多容易错位；`'{}'.format(x)` 稍好，但仍要数和顺序。\n\n`'x' + str(x)` 不算格式化，只是拼接，遇到小数位、对齐、千分位就无能为力。\n\nf-string 里能放表达式：`f'{price * 2:.2f}'`；也能取 repr：`f'{name!r}'`。\n\n注意引号嵌套：3.12 之前 f-string 内外不能复用同一种引号，`f'{d['k']}'` 会语法错误，3.12 起才放开。"}, "py144": {"detail": "`03d` 拆开看：`d` 是十进制整数，`3` 是最小总宽度，`0` 表示左边补零。\n\n宽度是“总共占几位”，不是“补几个 0”：7 只占 1 位，补到 3 位就是 `007`。\n\n所以 `0007` 错在把它当成了“加三个 0”（那是宽度 4），`700` 错在补到了右边。\n\n补空格写 `:3d`，得 `'  7'`；宽度不够时不截断，`f'{12345:03d}'` 原样输出 `12345`。\n\n带负号时符号占一位：`f'{-7:03d}'` 得 `'-07'`，不是 `'-007'`。\n\n常用于编号和日期：`f'{m:02d}'` 得 `01` 到 `09`。"}, "py145": {"detail": "`.2f` 表示定点小数、小数点后 2 位，并对第 3 位做舍入。\n\n`1 / 3` 是 `0.3333…`，保留两位得 `0.33`。\n\n`.2f` 一定会补齐两位：`f'{0.5:.2f}'` 是 `0.50`，`f'{89.5:.2f}'` 是 `89.50`，末尾的 0 不会省。\n\n坑：浮点数是二进制近似，`f'{2.675:.2f}'` 实际得 `2.67`，`f'{1.005:.2f}'` 得 `1.00`，金额计算要用 `decimal.Decimal`。\n\n变体：`:.2g` 是两位有效数字（`f'{0.3333:.2g}'` 得 `0.33`），`:.2%` 是百分比（得 `33.30%`）。"}, "q45": {"detail": "`range(start, stop, step)` 三个参数：起点、终点（不含）、步长。\n\n从 10 开始每次减 2：10、8、6、4、2；再减就是 0，但 `stop=0` 不含，所以停在 2。\n\n元素个数等于 `(stop - start) / step` 向上取整，`(0 - 10) / -2 = 5`，正好 5 个。\n\n步长为负时必须 `start > stop` 才有元素，`range(0, 10, -2)` 是空序列，不报错。\n\n`range` 是惰性对象，`print(range(10, 0, -2))` 只显示 `range(10, 0, -2)`，要看内容得 `list()`。\n\n坑：`range(10, 0)` 少了 `-2`，默认步长是 `+1`，结果为空。"}, "q46": {"detail": "`range(1, 8, 2)`：从 1 起，每次加 2，到 8 之前停，序列是 `1、3、5、7`。\n\n逐个走：取 1，下一个 3；取 3，下一个 5；取 5，下一个 7；取 7，下一个 9 已经不小于 8，停。\n\n个数公式是 `ceil((8 - 1) / 2) = 4`，所以循环体执行 4 次。\n\n坑：以为“到 8 为止”会含 8，或者以为步长 2 就是从 2 开始的偶数——步长永远从起点开始加。\n\n`range(8, 1, -2)` 才是 `8、6、4、2`；起点终点写反不会自动倒过来，只会得到空序列。"}, "q47": {"detail": "`while … else` 的 else 属于循环，不属于 if；它在“循环自然结束”时执行，被 `break` 打断就不执行。\n\n第一轮 `i = 0`，`0 < 3` 成立，`i == 1` 为 False，`i` 变成 1。\n\n第二轮 `i == 1` 成立，`break` 立刻跳出整个 while，else 被跳过。\n\n所以屏幕上什么都不输出；把 `break` 换成 `i += 1` 让循环跑完，才会打印 `done`。\n\n关键区别：else 不看“循环体执行了几次”，只看“有没有 break”；连一次都不跑的空循环也会执行 else。\n\n这个结构常用于“找遍了都没找到”：for 里找到就 break，else 里写未找到的处理。"}, "q48": {"detail": "`not i % 2` 的优先级是 `not (i % 2)`：`%` 先算、`not` 最后，所以它等价于 `i % 2 == 0`，即“i 是偶数”。\n\n一开始 `i = 0`，`0 % 2` 是 `0`，`not 0` 为 True，直接 `continue` 回到循环开头。\n\n`i += 1` 写在 continue 后面，永远执行不到，`i` 永远是 0，`0 < 5` 永远成立，于是死循环。\n\n选项对照：`输出 0 2 4` 是把条件看反了；`正常输出 1 3 5` 是“把 `i += 1` 挪到 continue 之前”之后的结果。\n\n修正：自增放到 continue 之前，或者干脆改用 `for i in range(5)`，从根上避免忘记自增。\n\n规律：`while` 里用 continue，先确认“改变循环变量的语句”在它前面。"}, "q49": {"detail": "嵌套 for 的执行次数是乘法：外层跑几次，内层整体就跑几遍。\n\n`range(1, 11)` 是 `1` 到 `10` 共 10 个值，外层 10 次，每次内层也 10 次。\n\n`10 * 10 = 100`，这是“内层循环体”的执行次数；`print` 写在内层会打印 100 行，写在外层只有 10 行。\n\n坑：把 `range(1, 11)` 当成 11 个（含 11），会算成 121；含头不含尾是固定规则。\n\n复杂度上这是 O(n²)，规模上万就该考虑换算法或改用 `itertools.product`。"}, "q50": {"detail": "嵌套 while 的两个计数器必须各自初始化，而且内层计数器要写在外层循环体内部。\n\n如果只在最外面写一次 `j = 0`：第一轮内层把 `j` 跑到 3，退出后 `j` 一直是 3。\n\n第二轮外层再进内层时，`3 < 3` 直接为假，内层一次都不跑，结果只剩第一轮的三对 `(0,0)(0,1)(0,2)`。\n\n程序不报错，只是“少做了”，这类 bug 肉眼很难发现，通常表现为结果莫名偏小。\n\n修正：把 `j = 0` 缩进到外层循环体内；用 `for j in range(3)` 则不存在这个问题，每轮自动重置。"}, "q51": {"detail": "`iter()` 把可迭代对象变成迭代器，`next()` 每次取一个，取完再取就抛 `StopIteration`。\n\n元组只有 3 个元素，前三次 `next` 依次返回 `red`、`green`、`blue`，第四次已经没有元素了。\n\n所以最后一行抛 `StopIteration`，既不是返回 `None`，也不是 `IndexError`。\n\n`for` 循环内部就是“`iter()` 加反复 `next()`，捕获 `StopIteration` 后静默结束”，所以 for 不会崩。\n\n不想让它抛就传默认值：`next(it, None)` 取完返回 `None`；但迭代器是一次性的，取空后不会自己重置。\n\n想重新遍历，得重新 `iter(数据)`，别把 `iter()` 的结果当列表反复用。"}, "q52": {"detail": "字符串是可迭代对象，`for ch in 'JC1001'` 会逐个取出 `J、C、1、0、0、1`。\n\n一共 6 个字符，所以循环体执行 6 次；`0` 和 `1` 也各算一个字符，不会因为像数字就合并。\n\n`len('JC1001')` 同样是 6，两个数字一致，可以交叉验证。\n\n坑：它看着像“4 位编号”，字符数却是 6；如果是从 `input()` 读进来且用户多敲了空格，长度还会更长。\n\n要按下标取用 `s[i]`，要逐个字符用 for，两者的下标都从 0 开始。"}, "q53": {"detail": "`range` 是惰性序列对象，不把数字一次性存进内存，只在迭代时按需生成。\n\n`print(range(5))` 调用的是 repr，显示成 `range(0, 5)`——起点 0 被补全，但内容不展开。\n\n想看内容必须 `list(range(5))`，得 `[0, 1, 2, 3, 4]`；`type(range(5))` 是 `range` 类型，不是 list。\n\n好处是省内存：`range(10**8)` 瞬间返回，`list(range(10**8))` 会吃掉几个 GB。\n\n坑：它支持下标和 `in`（`range(5)[2]` 得 `2`、`3 in range(5)` 为 True），看着像列表，但不能 `append`，也不能和列表相加（会抛 `TypeError`）。"}, "q54": {"detail": "选循环看两个问题：次数是否已知、靠什么停下来。\n\n“一直读输入直到 quit”次数未知，靠读到的内容决定停不停，正是 `while` 的场景。\n\n写法：`while True:` 里读一行，`if s == 'quit': break`；或者先读一次，再 `while s != 'quit':`。\n\n`for` 适合遍历已知序列或跑固定次数，`range(n)` 要求 n 事先确定。\n\n列表推导式是“生成列表”的表达式，不是循环控制结构；递归能写但没必要，还多一层栈开销。"}, "py146": {"detail": "累加模式的固定套路：初值 `total = 0`，循环里 `total += i`。\n\n`range(1, 5)` 含头不含尾，取 `1、2、3、4`，累加得 `10`。\n\n如果误以为含 5，会算成 `15`——差一错误（off-by-one）是循环求和里最常见的 bug。\n\n校验方法：`sum(range(1, 5))` 得 `10`，或用等差数列公式 `n(n+1)/2`，`4 * 5 / 2 = 10`。\n\n想加到 5 写 `range(1, 6)`；写 `range(5)` 则是 `0` 到 `4`，和也是 10，但含义完全不同。"}, "py147": {"detail": "`range(start, stop)` 只给两个参数时步长默认 `+1`，从 10 往上走：10、11、12……\n\n终点 0 在起点左边，正步长永远碰不到它，所以这个 range 是空序列。\n\nfor 遍历空序列，循环体一次都不执行，屏幕上什么都不输出，也不报错。\n\n倒着数必须写 `range(10, 0, -1)`，得 `10` 到 `1`。\n\n坑：空 range 静默通过，for 后面的代码照常执行，容易让人误以为“循环没生效”。\n\n排查技巧：先 `print(list(range(...)))` 看序列对不对，比盯着循环体猜快得多。"}, "py148": {"detail": "`for … else` 的 else 在“循环没有被 break 打断”时执行，和循环跑了几次无关。\n\n`range(3)` 是 `0、1、2`，`i == 5` 永远不成立，break 一次都没执行。\n\n循环自然结束，else 被执行，打印 `else`。\n\n注意它和“循环一次都没跑”无关：即使序列为空，else 也照样执行。\n\n典型用法：`for x in lst:` 里找到就 `break`，下面的 `else:` 写“找遍了都没找到”的分支。\n\n坑：把 else 当成循环体缩进进去，或以为它等价于 `if not found`，语义会跑偏。"}, "py149": {"detail": "`break` 只跳出“最近的一层循环”，也就是它所在的那个 for。\n\n外层 `i` 跑 `0、1、2` 三轮；每轮内层从 `j = 0` 开始，`j == 1` 时 break，所以内层只判断了 `j = 0` 和 `j = 1`。\n\n内层退出后外层继续，三轮都跑完，循环结束后 `i = 2`、`j = 1`。\n\n`print(i, j)` 写在循环外，用的是循环变量的最终值——Python 的循环变量在循环结束后依然存在。\n\n想一次跳出两层：加标志变量、把循环包进函数用 `return`，或者用 `itertools.product` 配合 for-else。\n\n坑：以为 break 会连外层一起停，结果外层还在跑。"}, "py159": {"detail": "综合题看三件事：循环次数、累加值、改参数后的变化，核心都是 `range` 的边界。\n\n`range(1, 4)` 含头不含尾，只有 `1、2、3` 三个值，外层 3 次、内层 3 次，内层体执行 `3 × 3 = 9` 次。\n\n求 total 可以按分配律合并：`(1+2+3) × (1+2+3) = 6 × 6 = 36`，不必手列 9 项。\n\n改成 `range(1, 4, 2)` 后只取 `1、3`，和是 `4`，所以 `4 × 4 = 16`，内层体执行 4 次。\n\n坑：步长 2 不是“把 36 除以 2”，而是换一批数重新算；`range(1, 4, 2)` 只是砍掉了 2，并没有砍掉一半。\n\n校验：加个计数器 `cnt += 1` 打印出来，9 和 4 能一眼对上。"}, "py160": {"detail": "`input()` 的返回值永远是 str，即使输入的是 `10`，拿到的也是两个字符 `'1'`、`'0'`。\n\n`'10' * 2` 是字符串重复，得 `'1010'`；`*` 对 str 表示重复，对数字才是乘法。\n\n`int(price) * int(count)` 先转型再乘，`10 * 3 = 30`，这才是算术。\n\n加法更隐蔽：`'10' + '3'` 得 `'103'`，不报错、结果却错，比报错更难查。\n\n`count * 1` 对字符串毫无作用，仍是 `'3'`；`str(price) + str(count)` 同样只是拼接。\n\n结论：读数字一律 `int(input())` 或 `float(input())`，在读入那一行就转，别拖到后面。"}, "py161": {"detail": "核心是“变量是标签不是盒子”：`b = a` 让两个名字指向同一个列表对象，`b is a` 为 True。\n\n`b.sort()` 是原地排序，改的就是 `a` 指向的那份数据，返回值是 `None`；千万别写 `b = b.sort()`，那会把列表弄丢。\n\n`a.append(4)` 之后，`a` 和 `b` 看到的都是 `[1, 2, 3, 4]`，print 输出两份相同的列表。\n\n`c = a.copy()` 在排序之前执行，拿到的是当时的副本 `[3, 1, 2]`，之后 a 怎么变都与它无关，`a is c` 为 False。\n\n若把 `c = a.copy()` 改成 `c = a`，`c` 就变成别名，最终同样是 `[1, 2, 3, 4]`。\n\n补充：`copy()` 是浅拷贝，列表里若嵌套列表，内层仍然共享，要彻底独立得用 `copy.deepcopy`。"}, "py162": {"detail": "结构是“先自增、再判奇偶、偶数 continue、奇数计数”。\n\n逐轮走：i 变 1 是奇数 count=1；2 是偶数跳过；3 奇数 count=2；4 跳过；5 奇数 count=3，回到条件 `5 < 5` 为假，退出。\n\n退出时 `i = 5`、`count = 3`，输出 `5 3`。\n\n换成 `break`：第一轮 i=1、count=1；第二轮 i=2 是偶数直接 break，循环结束，输出 `2 1`——break 跳整层，continue 只跳本次。\n\n删掉 `i += 1`：`i` 永远是 0，`0 % 2 == 0` 恒成立，continue 无限循环，程序卡死（死循环）。\n\n规律：`while` 里用 continue 之前，先确认“改条件的那一步”在它前面。"}, "py163": {"detail": "函数用字典做计数器：键是字符，值是次数，`result[ch]` 直接读写。\n\n遍历 `'aba'`：第一个 `a` 不在字典里，走 else 建 `{'a': 1}`；`b` 同样建 1；第二个 `a` 命中 if，`1 + 1 = 2`。\n\n`print` 输出 `{'a': 2, 'b': 1}`，字典保持插入顺序，所以 `a` 在前、`b` 在后。\n\n只写 `count_chars('aba')` 什么都不显示：`return` 只把值交回调用处，不打印；只有交互式环境才会回显。\n\n`count_chars('aba')['a']` 先调用函数得到字典，再取键 `'a'`，输出 `2`——调用和下标可以连写。\n\n更简洁的写法：`result[ch] = result.get(ch, 0) + 1` 一行代替 if/else，或者直接用 `collections.Counter`。"}, "q55": {"detail": "列表的下标既能正着数也能倒着数：`a[-1]` 取最后一项，所以打印 `item4`。\n\n负下标的映射是 `-1` 最后、`-2` 倒数第二、`-len(a)` 正好是第一项；4 个元素的列表写 `a[-5]` 就越界，抛 IndexError。\n\n正负下标指的是同一批位置，这里 `a[-1]` 和 `a[3]` 等价，负号只是省掉了自己算长度这一步。\n\n注意 `print(a[-1])` 打印的是元素本身 `item4`，不带方括号；想要 `['item4']` 那种结果得写切片 `a[-1:]`。\n\n空列表上 `a[-1]` 一样抛 IndexError，取末项前先确认列表非空更稳妥。"}, "q56": {"detail": "切片 `a[1:3]` 的两个数字是起点和终点，含起点、不含终点，所以取下标 1 和 2，输出 `['item2', 'item3']`。\n\n口诀是“含头不含尾”，结果长度等于 `3 - 1 = 2`；想把下标 3 的 `item4` 也拿进来必须写 `a[1:4]`。\n\n切片返回的是新列表，和原列表不共享内存，所以 `a[1:3].append('x')` 只改了那个临时列表，`a` 一点没变。\n\n省略端点的写法很常用：`a[:3]` 从头取三个，`a[1:]` 取到末尾，`a[:]` 是整表的浅拷贝。\n\n切片越界不会报错，`a[1:100]` 会截到末尾为止，`a[5:9]` 直接给空列表；但索引 `a[100]` 会抛 IndexError，两者规则不同。"}, "q57": {"detail": "切片完整形式是 `a[起点:终点:步长]`，`a[::-1]` 省略起点终点、步长写 -1，就是倒着一个个取，整表反转成 `['item4', 'item3', 'item2', 'item1']`。\n\n步长为负时默认从最后一项起步、到第一项之前结束，所以 `[::-1]` 覆盖全部；`[::-2]` 隔一个取一个，得 `['item4', 'item2']`。\n\n这一步生成新列表，原来的 `a` 顺序没变；要原地倒序得用 `a.reverse()`，它改 a 本身并返回 None。\n\n正负步长的默认端点方向相反，`a[3:0:-1]` 得 `['item4', 'item3', 'item2']`，下标 0 的 `item1` 取不到。\n\n字符串和元组也支持同一套切片，`'abc'[::-1]` 得 `'cba'`，只是它们不可变，结果只能是新对象。"}, "q58": {"detail": "`append(x)` 只收一个参数，把 x 当成一个整体元素挂到末尾，传进去的 `[3, 4]` 不会被拆开，所以是 `[1, 2, [3, 4]]`。\n\n想逐个并入要用 `extend([3, 4])`，它把可迭代对象的元素依次追加，得到 `[1, 2, 3, 4]`。\n\n两者都原地修改、都返回 None，写成 `a = a.append(3)` 会把 a 变成 None。\n\n- `[1, 2, 3, 4]` 是 `extend` 或 `a + [3, 4]` 的结果，append 不展开参数。\n- `[3, 4, 1, 2]` 相当于 `insert(0, ...)` 往头部插，append 只加末尾。\n- `TypeError` 不对，append 接受任意对象，嵌套列表合法。\n\n判断依据是 `len(a)`：append 之后从 2 变 3，不是变 4。"}, "q59": {"detail": "`remove(x)` 的参数是值不是下标，它找“等于 2 的元素”并删掉第一个；`c` 里只有字符串，找不到就抛 `ValueError: list.remove(x): x not in list`。\n\n按下标删要用 `pop(2)`（删 `'blue'` 并返回它）或 `del c[2]`（只删不返回）。\n\n`remove` 的返回值是 None，它改原列表；有重复值时只删最左边那一个。\n\n- 删掉第 2 项 `'green'` 是把 remove 当按下标删，它只看值不看位置。\n- 删掉 `'blue'` 是 `pop(2)` 或 `del c[2]` 的效果。\n- `TypeError` 不对，2 是合法参数，只是列表里没有这个值。\n\n分工要记牢：`remove` 按值删，`pop` 按下标删并把元素返回给你。"}, "q60": {"detail": "`lst.sort()` 原地排序：把 lst 自己排好，然后返回 `None`，答案就是 None。\n\n同族方法也都返回 None，比如 `reverse()`、`append()`、`extend()`、`remove()`，这个约定用来标记“副作用在原对象上”。\n\n因此 `x = lst.sort()` 之后 x 是 None，再写 `x[0]` 会 TypeError，因为 None 不能被下标访问。\n\n- 排好序的新列表是 `sorted(lst)` 的行为，原列表不动。\n- 原列表本身也不对，返回自身就能链式调用，但 sort 明确返回 None。\n- `True` 是混淆了返回值和“排序成功”，Python 不用布尔表示成功。\n\n正确写法：`lst.sort()` 后继续用 `lst`，或 `new = sorted(lst)` 保住原件。"}, "q61": {"detail": "要求“原列表不动、另拿一份排好序的新列表”，只有 `sorted(lst)` 符合：它是内置函数，返回全新的有序列表。\n\n写法是 `sorted(lst)` 而不是 `lst.sorted()`，列表没有 sorted 方法；它还能直接吃元组、字符串和字典的键。\n\n- `lst.sort()` 原地排序并返回 None，原列表被改掉，两个条件都不满足。\n- `lst.reverse()` 只倒序不排序，同样原地改、返回 None。\n- `lst.copy()` 只复制，顺序不变，`[3, 1, 2]` 复制出来还是 `[3, 1, 2]`。\n\n记法：`sorted` 有返回值，`sort` 返回 None；拿不准就先 `print(lst.sort())` 看它吐不吐 None。\n\n两者都支持 `reverse=True` 和 `key=`，区别只在改原件还是出新件。"}, "q62": {"detail": "这是列表推导式，模板是 `[表达式 for 变量 in 可迭代对象 if 条件]`，把循环、筛选、收集压在一行，结果是一个新列表。\n\n`range(1, 11)` 含头不含尾，产生 1 到 10；`if x % 2 == 0` 只放行偶数，于是得到 `[2, 4, 6, 8, 10]`。\n\n执行顺序是“取一个 x、过 if、算表达式、加进结果”，if 在表达式之前生效，不合格的值进不了结果。\n\n等价的 for 写法要先建空列表再追加：`out = []`，`for x in range(1, 11):`，`if x % 2 == 0: out.append(x)`。\n\n常见错法：写成 `range(1, 10)` 漏掉 10，或把条件写成 `x % 2`，那样留下的是奇数 `[1, 3, 5, 7, 9]`。"}, "q63": {"detail": "`s[2:3]` 选出下标 2 这一个元素 `'soup'`，`s[2:3] = ['pasta', 'tomato']` 把这段切片整体换成右边两个元素，列表因此变长。\n\n切片赋值不要求等长：右边多则列表变长，右边少则变短，右边给 `[]` 就等于删掉这一段。\n\n它改的是原列表对象本身、不生成新列表，所以执行完再读 `s` 就已经是改过的样子。\n\n和普通赋值 `s[2] = 'pasta'` 的区别是：后者一个位置换一个值、长度永远不变，右边给列表还会变成嵌套的 `['pasta']`。\n\n带步长的切片赋值另有约束，`s[::2] = [...]` 要求两边长度严格相等，否则抛 ValueError，只有步长为 1 才允许变长。"}, "q64": {"detail": "`list()` 是类型转换函数，把可迭代对象逐个元素收集成列表；字符串可迭代，逐个元素就是单个字符，所以得到 `['a', 'e', 'i', 'o', 'u']`。\n\n注意它拆的是字符不是单词：`list('aeiou')` 的五个元素各是一个字符，不是包含一个 `'aeiou'` 的列表。\n\n想按空格拆词要用 `'a b'.split()`，那才得 `['a', 'b']`；`list('a b')` 会把空格也当成一个元素。\n\n`list()` 也能转元组、range 和字典，转字典拿到的是键列表（`list({'a': 1})` 得 `['a']`），返回值永远是新的列表对象。\n\n引号别丢：`list(aeiou)` 会把 aeiou 当变量名去找，抛 `NameError: name 'aeiou' is not defined`。"}, "q65": {"detail": "要同时拿下标和元素，最直接的写法是 `for i in range(len(c))`，再用 `c[i]` 取值。\n\n`range(len(c))` 给出的是下标序列；直接 `for i in c` 里的 i 是元素本身。\n\n- `for i in c: print(i, c[i])` 里 i 已是元素，再当下标会 `TypeError`。\n- `for i, c[i] in c` 想解包每个元素，字符长度是 1，会 ValueError。\n- `for i in c: print(c[i])` 把元素当下标，还漏掉了下标。\n\n本题问“最直接”，所以 `range(len(c))` 是答案；更地道的 `enumerate(c)` 第 14 章才讲。\n\n边界：`range(len(c) - 1)` 会漏掉最后一个元素，`range(len(c) + 1)` 则 IndexError。"}, "q66": {"detail": "字典用 `d[k]` 取值时，k 必须是已经存在的键；`'isbn'` 不在 book 里，所以直接抛 `KeyError: 'isbn'`。\n\n这和列表的 IndexError 不是一回事：字典按键查找，键不存在是 KeyError；IndexError 是序列下标越界才有的异常。\n\n想“键不存在也不炸”就用 `book.get('isbn')`，返回 None；`book.get('isbn', '无')` 则返回自定义默认值。\n\n- 输出 None 是 `get` 的行为，方括号取值不会给默认值。\n- 输出空字符串没有依据，Python 不会为缺失的键编造空值。\n- IndexError 是序列下标越界用的，字典里根本没有下标这个概念。\n\n判断该用哪个：确定键一定在（比如刚写入过）就用 `[]` 让错误早点暴露，不确定就用 `get`。"}, "q67": {"detail": "`get(k, 默认值)` 的第二个参数是“键不存在时的返回值”，`'isbn'` 不在 book 里，所以返回 `'无'`，输出就是 `无`。\n\n`get` 只读不写：这次查询不会把 `'isbn'` 加进字典，`len(book)` 仍然是 2，这是它和 `setdefault` 的关键区别。\n\n只写一个参数 `book.get('isbn')` 时默认值是 None，打印出来是 `None` 而不是 `无`，参数个数不同结果就不同。\n\n键存在时默认值被忽略，`book.get('year', 0)` 返回 2021 而不是 0，所以 get 适合“有则取、无则给默认”。\n\n对比 `book['isbn']` 会 KeyError，`get` 的价值就在于不抛异常，处理外部输入和可选字段时优先用它。"}, "q68": {"detail": "`popitem()` 删掉最后一个插入的键值对，并以元组 `(键, 值)` 返回，所以选它。\n\n`pop(k)` 必须给键、返回的是值而非元组；写 `pop()` 不给参数会 `TypeError: pop expected at least 1 argument`。\n\n- `d.pop()` 少了键参数，直接 TypeError。\n- `d.remove()` 不存在，字典没有 remove 方法，会 AttributeError。\n- `del d[-1]` 把 -1 当键删，抛 `KeyError: -1`，字典没有“第 -1 项”。\n\n空字典上 `popitem()` 会 `KeyError`，用前先 `if d:` 判空。\n\n分工：`del d[k]` 只删不返回，`d.pop(k)` 删并返回值，`d.popitem()` 删最后一项并返回键值对。"}, "q69": {"detail": "字典的键必须唯一，字面量里写两个 `'title'` 时后一个值会静默覆盖前一个、不报任何错误，所以结果是 `{'title': 'v2'}`。\n\n覆盖只换值不换位置：`{'a': 1, 'b': 2, 'a': 3}` 得到 `{'a': 3, 'b': 2}`，'a' 仍留在第一次出现的位置。\n\n长度也按去重算：`len({'title': 'v1', 'title': 'v2'})` 是 1 而不是 2，因为只有一个键。\n\n这种覆盖在循环建字典时很常见，`d[k] = v` 撞到重复 k 就是覆盖；想保留多个值应该把值改成列表再 append。\n\n对比一下读写不对称：键不存在时读 `d[k]` 抛 KeyError，而写 `d[k] = v` 会新建键。"}, "q70": {"detail": "`for k in user` 遍历字典拿到的是键，所以打印 `id` 和 `age` 两行。\n\n三个视图各管一件事：`d.keys()` 给键、`d.values()` 给值、`d.items()` 给 `(键, 值)`；`for k in d` 等价于遍历 `keys()`。\n\n顺序是插入顺序（3.7 起有保证），先写的 `id` 先打印。\n\n- `1234` 和 `25` 是 `d.values()` 的结果。\n- `(id, 1234)` 和 `(age, 25)` 是 `d.items()` 的结果，`for k in d` 不会解包。\n- 报错不成立，遍历字典合法，只有遍历时增删键才 RuntimeError。\n\n想同时拿键和值写 `for k, v in user.items()`；`for v in user` 拿到的还是键，这是最常犯的错。"}, "q71": {"detail": "会抛 `RuntimeError: dictionary changed size during iteration`：for 正走在字典的键视图上，中途大小变了，迭代器就判定遍历不安全。\n\n同理 `for k in d: d[k + '_new'] = 1` 新增键也报同一个错；只有“改值不改大小”的 `d[k] = d[k] + 1` 允许。\n\n- 正常删除不成立，语言层面直接拦住了这种写法。\n- `KeyError` 是键不存在的异常，和迭代中改大小是两回事。\n- 死循环也不会，迭代器检测到变化会立刻报错。\n\n正确做法是先复制键再删：`for k in list(d.keys()): del d[k]`，`list()` 把视图固化成快照，遍历快照、改原字典。\n\n只是想清空就直接 `d.clear()`；要按条件批量删，用字典推导式重建一个反而更清晰。"}, "q72": {"detail": "`b = a` 不做副本，只是同一对象再起一个名字；所以 `b['x'] = 99` 改的就是 a 本身，跑完 `a['x']` 是 99。\n\n`c = a.copy()` 在那一行就造出新字典，而它执行在改值之前，抓到的是旧值 1，所以 `c['x']` 是 1，答案是 99 和 1。\n\n判断依据是 `a is b` 还是 `a is c`：前者 True（同一对象），后者 False；`==` 相等不代表 `is` 相同。\n\n- 99 和 99 是以为 copy 也共享顶层，其实顶层键值独立。\n- 1 和 1 忽略了别名会把 a 一起改掉。\n- 1 和 99 把两行代码的先后顺序搞反了。\n\ncopy 是浅拷贝：顶层独立，但值若是列表或字典，里层对象仍共享，要彻底隔离得 `copy.deepcopy(a)`。"}, "q73": {"detail": "这是字典推导式，模板是 `{键: 值 for 变量 in 可迭代对象 if 条件}`，它按 `p2.items()` 逐个取出 `(p, v)`，再过滤组装。\n\n条件是 `v < 40`，`drive` 的 90 被挡掉，`bag` 的 25 和 `cable` 的 10 留下，输出 `{'bag': 25, 'cable': 10}`。\n\n顺序沿用原字典的插入顺序，`bag` 在 `cable` 前面，字典推导式不会因为过滤就重排。\n\n写成循环要三步：建空字典、`for p, v in p2.items()`、`if v < 40: out[p] = v`。\n\n常见错法：把过滤写成 `p < 40` 拿键比大小（字符串和整数比会 TypeError），或漏掉 `.items()`（会 ValueError）。"}, "q74": {"detail": "`cars['Kia']` 先取出内层字典 `{'model': 'Rio', 'year': 2019}`，再对它取 `['model']`，得到 `'Rio'`。\n\n连续方括号就是从外往内一层层剥，等价于先 `tmp = cars['Kia']` 再 `tmp['model']`。\n\n每层都可能抛 KeyError：`cars['VW']['year']` 会 `KeyError: 'year'`，报错的是后一个方括号。\n\n不确定时用 get 链：`cars.get('Kia', {}).get('model', '无')`；第一个 get 的默认值必须给 `{}`，否则第二层会在 None 上取键。\n\n嵌套字典适合表达“一条记录的多个字段”，代价是层级一深就要重复写方括号，取值前先确认路径存在。"}, "q75": {"detail": "字典的键必须可哈希，而可哈希的前提是对象不可变；列表能 append、能修改，所以不能当键，写 `d[[1, 2]] = 'x'` 会抛 TypeError（unhashable type: 'list'）。\n\n字符串、整数、元组都不可变，都能当键；元组的条件更细，元组里每个元素也得可哈希，`([1],)` 这种装着列表的元组同样不行。\n\n- 字符串和整数是最常见的键，当然可以。\n- 元组整体上可以，只有含可变元素的元组例外，所以这一项不是答案。\n\n键不可变是为了让哈希值稳定：如果键中途能变，存进去时的位置和查找时的位置就对不上，字典再也找不到它。\n\n确实需要“用列表当键”时，通常改写成 `tuple(lst)`，或者把列表序列化成字符串再用。"}, "py150": {"detail": "不带参数的 `a.pop()` 删掉最后一个元素并把它的值返回，所以 x 拿到 3、a 剩下 `[1, 2]`，打印 `3 [1, 2]`。\n\n`print(x, a)` 两个参数按空格分隔输出，顺序是先 3 后列表，不是 `[1, 2] 3`。\n\n- `pop(0)` 删第一个元素并返回它，得 `1` 和 `[2, 3]`。\n- `remove(3)` 按值删第一个 3 并返回 None，想拿被删的值就做不到。\n- `del a[-1]` 按下标删，是语句不是函数，返回不了任何东西。\n\n`pop` 同时具备删除和取值两种效果，这是它和 `del` 的最大区别。\n\n边界也要注意：空列表上 `pop()` 抛 `IndexError: pop from empty list`，`pop(10)` 抛 `IndexError: pop index out of range`。"}, "py151": {"detail": "列表的 `+=` 不是“造新列表再赋值”，而是原地方法，效果相当于 `a.extend([3])`，改的是 a 指向的那个对象。\n\n因为 `b = a` 是别名，a 和 b 指向同一个列表，a 原地变长后 b 也变成 `[1, 2, 3]`。\n\n换成 `a = a + [3]` 结果不同：`+` 造新列表再让 a 指过去，b 还指着旧列表，仍是 `[1, 2]`。\n\n- `[1, 2]` 是 `a = a + [3]` 的结果，本题用的是 `+=`。\n- `[3]` 既不是加法的结果也不是 extend 的结果。\n- `TypeError` 不对，列表之间 `+=` 和 `+` 都合法，`a + 3` 才 TypeError。\n\n结论：`+=` 是原地、`= ... + ...` 是新建，在可变对象上并不等价；想让 b 独立就写 `b = a.copy()`。"}, "py152": {"detail": "`a[10]` 会抛 `IndexError: list index out of range`，因为单个下标必须落在 -3 到 2 之间，10 超出了范围。\n\n切片则宽松得多，它把越界的端点截断到合法边界。\n\n- `a[1:10]` 起点 1 合法、终点截到末尾，结果是 `[2, 3]`。\n- `a[-10:]` 负下标超出后截到开头，结果是整表。\n- `a[:100]` 终点截到末尾，结果也是整表。\n\n根本原因是索引要求精确命中一个位置，而切片描述一段区间，区间超出去就取交集，取不到就是空列表（`a[5:9]` 得 `[]`）。\n\n实用结论：切片可以放心写大数字，不用先判长度；索引必须先确认 `0 <= i < len(a)` 或捕获 IndexError。"}, "py153": {"detail": "`append` 原地修改，返回值固定是 None，所以 `print([1, 2].append(3))` 打印 `None`；列表确实变成 `[1, 2, 3]` 了，只是没被打印。\n\n这是设计而非缺陷：Python 用“返回 None”标记方法改的是原对象，让你一眼看出副作用在哪儿。\n\n同族还有 `sort()`、`reverse()`、`extend()`、`insert()`、`remove()` 都返回 None；只有 `pop()` 例外，返回被删元素。\n\n- `[1, 2, 3]` 是列表本身的样子，但 print 打的是返回值。\n- `3` 是 append 的参数，不是返回值。\n- `TypeError` 不对，append 接受任意对象，调用完全合法。\n\n要打印结果就分两步：先 `lst.append(3)`，再 `print(lst)`。"}, "py154": {"detail": "`copy()` 是浅拷贝，只新建最外层字典，值还是原来那些对象，所以 `b['x']` 和 `a['x']` 指向同一个列表。\n\n`b['x'].append(3)` 改的是那个共享的列表，并没有动 b 的键，因此 a 和 b 都看到 `{'x': [1, 2, 3]}`。\n\n- `{'x': [1, 2]}` 是以为 copy 连内层一起复制了。\n- `{'x': [3]}` 把 append 误当成替换整个列表。\n- KeyError 不会出现，`'x'` 在字典里，取键合法。\n\n判别方法是看改的到底是什么：`b['x'] = [9]` 只换 b 的指向，a 不受影响；`b['x'].append(3)` 会波及 a。\n\n要彻底隔离得用 `copy.deepcopy(a)`（先 `import copy`），它递归复制内层对象，之后改 b 怎么都不影响 a。"}, "py155": {"detail": "字典上的 `in` 查的是键不是值：`'a'` 是键所以 True，`1` 只是值所以 False，输出 `True False`。\n\n`print('a' in d, 1 in d)` 两个布尔值按空格分隔打印，顺序和参数顺序一致，所以是 `True False` 而不是反过来。\n\n要查值必须显式写 `1 in d.values()`（返回 True），要查键值对写 `('a', 1) in d.items()`；`in d` 永远不会去看值。\n\n这也解释了 `d[k]` 的语义：方括号里的东西永远被当作键，`d[1]` 找的是“键 1”，不是“值为 1 的那一项”。\n\n效率上 `in d` 是哈希查找，接近 O(1)；`1 in d.values()` 要逐个比较，是 O(n)，数据量大时差别很明显。"}, "py156": {"detail": "`items()` 每次产出 `(键, 值)` 元组，`for k, v in d.items()` 用元组解包拆成两个变量，打印 `a 1` 和 `b 2` 两行。\n\n题目要求合成一行，两行用空格接起来就是 `a 1 b 2`；`print(k, v)` 本身用空格分隔参数。\n\n只写 `for k in d` 或 `for v in d` 拿到的都是键，要值必须 `d.values()`，要键值对必须 `d.items()`。\n\n解包要求长度匹配：写成 `for k, v, w in ...` 会 `ValueError: not enough values to unpack (expected 3, got 2)`。\n\n顺序是插入顺序，先 `a` 后 `b`；`items()` 返回视图，遍历期间不要增删键，否则 RuntimeError。"}, "py157": {"detail": "安全的是第一种：`d[k] = d[k] + 1` 只改已有键的值，字典大小没变，迭代器不会抗议。\n\n其余三种都在增加或删除键，字典大小一变就抛 `RuntimeError: dictionary changed size during iteration`。\n\n- `d[k + '_new'] = d[k]` 每轮新增一个键，第一次就报错。\n- `d.pop(k)` 在遍历中删键，立刻 RuntimeError。\n- `d[k] = d[k] + 1` 之所以安全，是因为键集合原封不动，只替换了值。\n\n确实要边遍历边删，先固化键的快照：`for k in list(d.keys())`，遍历快照、改原字典就不会触发检查。\n\n或者干脆用推导式重建：`d = {k: v + 1 for k, v in d.items()}`，既避开迭代中修改，代码也更短。"}, "q76": {"detail": "答案是「什么都不显示」。`return` 只把值交回调用处，本身不产生任何输出；真正往屏幕上写字的是 `print`。\n\n这段代码确实算出了 3，但没人接住、也没打印，结果直接被丢掉。要看到它必须二选一：把调用包进 print，或者先赋给变量再打印。\n\n错项逐个说：选 3 是把 return 当成了 print；选 None 也不对——写了 return 就返回 3，只有不写 return 才返回 None；选 TypeError 更不会发生，两个参数完全合法。\n\n一句话记住：print 是给人看的，return 是给程序用的。在解释器里直接敲 `add(1, 2)` 会回显 3，那是交互环境额外帮你打印，写成脚本跑就没这待遇。\n\n调试技巧：分不清时先用 `repr` 打印返回值，能同时看清值和类型；屏幕上真出现 None 字样，说明函数漏了 return。"}, "q77": {"detail": "答案是 `None`。执行到函数体末尾还没遇到 return，Python 就自动返回 None；写一个光秃秃的 return 效果完全一样。\n\n写成空函数体和显式返回 None 是等价的，后者只是把省略写全。None 是 NoneType 的唯一值，它不等于 0 和空字符串，但在布尔判断里算假。\n\n错项：0 和空字符串是别的类型，Python 根本没有「按返回类型补默认值」这种机制；说报错也不对，不写 return 完全合法。\n\n判断时该用 `is None` 而不是 `== None`；另外别用 `if not f():` 来判「没结果」，它会把 0、空串、空列表也一起当成没结果，容易误判。\n\n常见坑：函数本该返回结果却忘了写 return，调用处拿到 None，接着做加法或拿去遍历都会抛 TypeError。排查时先打印 repr 看是不是 None。"}, "q78": {"detail": "输出 `3`。这次外面套了 print，return 出来的 3 被打印到屏幕上了。\n\n执行顺序是：先算函数调用得到 3，再把这个 3 作为参数交给 print。和同章那道只写调用的题相比，同一份计算只差一个 print，屏幕结果就从空白变成了 3。\n\n这是填空题，只写数字 3，不要写成带引号的字符串，也不要写 `print(3)` 或 None。\n\n顺带一个坑：print 自己的返回值是 None，所以把它赋给变量之后拿到的是 None，不能拿这个结果继续参与运算。\n\n还有：打印 3 和打印字符串 3 在屏幕上一模一样，但一个是整数一个是字符串，后面参与运算差别就出来了，字符串加数字会直接报类型错误。"}, "q79": {"detail": "答案是 `NameError`。Python 从上往下执行，def 是一条可执行语句：走到那一行才创建函数对象、把函数名绑进命名空间。\n\n在 def 执行之前就调用，这个名字还不存在，于是报名字未定义。注意它和「函数里引用了未定义变量」是同一个异常类型。\n\n错项：TypeError 是类型或参数个数不对，名字都没绑定根本轮不到它；SyntaxError 是解析阶段就失败、一行都跑不了，而这里语法没问题；IndentationError 是缩进错，本例缩进正常。\n\n补充一点：只要调用发生在 def 执行之后就行，不要求写在同一位置。在函数 A 里调用稍后定义的函数 B 是合法的，因为 A 被调用时两个 def 都执行过了。\n\n常见坑：把调用写在主入口判断之前；或者 def 放在某个没走到的 if 分支里，调用时同样报这个错。递归函数在自己体内调用自己没问题，因为那时名字已绑定。"}, "q80": {"detail": "答案是第二个。Python 函数定义的形式是 def 加函数名加参数列表加冒号，然后跟缩进的函数体，冒号不能少。\n\n冒号后面直接跟语句是合法的单行写法，但只适合一条语句；工程上还是换行缩进，可读性好，也方便加注释和文档字符串。\n\n错项：第一个用了花括号，那是 JS 和 C 的风格，Python 靠缩进划分代码块，会语法错误；第三个用了 function 关键字，Python 里没有它，定义函数用 def；第四个把箭头当成分隔符了——箭头是返回值类型标注，后面必须跟类型，写成函数调用是语法错误。\n\n完整形式可以参考：def 加参数，参数里能有默认值、星号收集的多余位置参数、双星号收集的关键字参数，最后箭头加返回类型。这些标注只是提示，运行时不检查。\n\n常见坑：忘冒号、括号不配对、函数体没缩进（会报 expected an indented block）、以及 tab 和空格混用。"}, "q81": {"detail": "答案是逻辑错误：语法没问题、运行也不抛异常，程序能完整跑完，只是结果和预期不符。\n\n三类对比一下：语法错误在解析阶段就被拦下，一行都不执行；运行时错误跑到一半崩掉，有 traceback 指路；逻辑错误什么都不报，连崩的地方都没有。\n\n为什么最难查：没有任何报错信息，甚至大部分输入都正确，只在边界上错。典型例子有大于写成大于等于、循环差一、平均值分母写错、and 和 or 用反。\n\n错项：语法错误是根本跑不起来；运行时错误会抛异常并打印 traceback，不符合「完全不报错」；缩进错误是语法错误的子类，同样在解析阶段就失败。\n\n排查手段：用已知答案的小数据集跑、在关键位置打印中间值、写断言、下断点、补单元测试，重点测 0、空、负数、最大值这些边界。"}, "q82": {"detail": "答案是 `ValueError`。int 拿到的是字符串，类型没错，但这段内容不是合法整数——错在「值」而不是「类型」。\n\n完整报错是 invalid literal for int with base 10。注意这个 base 10：带小数点的字符串同样报 ValueError，因为 int 不认小数点，得先转 float 再转 int。\n\n错项：TypeError 是类型不对，比如把 None 或列表传进去；NameError 是名字没定义；SyntaxError 是写法错，根本执行不到这一行。\n\n口诀：类型错报 TypeError，类型对但内容不合法报 ValueError。另外前后带空格的数字字符串反而合法，int 会自动去掉两边空白。\n\n实战写法：用 try 接住 ValueError 给个默认值，或者先判断是否全是数字字符再转（注意负号和小数会被这种判断误杀）。"}, "q83": {"detail": "答案是 `IndexError`，报错说下标越界。\n\n列表下标从 0 开始，长度 3 的合法下标只有 0、1、2，写 5 就越界了。负下标合法，最后一个元素用 -1 取，但 -4 一样越界。\n\n错项：KeyError 是字典取不存在的键，列表不用键；ValueError 是值不合法；TypeError 是类型不对，比如拿字符串当下标。\n\n易混点：切片不报错，越界切片返回空列表；空列表调用 pop 报的也是 IndexError；但从空迭代器取下一个元素报的是 StopIteration，不是 IndexError。\n\n防御写法：先判断下标在范围内，或用条件表达式给默认值，或用 try 接住 IndexError。"}, "q84": {"detail": "答案是 `ZeroDivisionError`，报错信息是 division by zero。\n\n触发场景不止斜杠除：整除、取余、以及 divmod 的除数为零，都会抛同一个异常。\n\n浮点也一样：整数除浮点零同样抛 ZeroDivisionError，不会返回无穷大或非数——Python 的除零一律抛异常，不像 numpy 会给个 inf 加条警告。\n\n错项：ValueError 是类型对但值不合法；TypeError 是类型不对，比如拿数字除字符串；说「什么都不抛」显然不对，除零一定崩。\n\n防御：除之前先判断分母不为零，或用 try 给兜底值。批量算平均分、转化率时最容易崩，尤其分母来自用户输入或统计结果。"}, "q85": {"detail": "答案是第一个。等号是赋值语句，不能出现在 if 的条件位置，这是解析阶段就报的语法错误。\n\n新版 Python 的提示很贴心，会直接问你是不是想写双等号或海象运算符。正确写法：比较用双等号，想在条件里顺手赋值就用括号包住的海象写法。\n\n错项：剩下三个语法都完全合法，要执行到那一行才分别抛 ValueError、IndexError、ZeroDivisionError——它们属于「能跑起来、跑一半才崩」。\n\n关键区别：语法错误一行都不执行，连前面的 print 都不会有输出；运行时异常是执行到那行才炸，之前的输出已经打印出来了。调试时很有用：什么都没输出先怀疑语法。\n\n同类语法错误：少冒号、括号不配对、if 后面缺条件、把等号当比较用、引号不闭合、中文全角符号。"}, "q86": {"detail": "答案是第二个，`if (n := len(a)) > 3:`。\n\n完整形式是「名字 := 表达式」，叫赋值表达式，俗称海象运算符，3.8 起支持。它把值算出来绑到名字，同时整个表达式的值也是它，所以能塞进 if 或 while 的条件里。\n\n括号绝不能省，因为 := 的优先级极低。不加括号时整个比较会先算完，n 拿到的是布尔值而不是长度：实测取四个元素时 n 是 True，分支照样进，但 n 已经不是 4，不报错但结果错，这是最阴的坑。\n\n错项：把 := 写成等号是语法错误，if 里不能写赋值语句；反过来写成「函数调用 := 名字」也语法错误，:= 左边只能是单个名字，不能是函数调用。\n\n等价老写法是先赋值再比较，两行。海象省一行且避免重复计算，典型场景是 while 里读一行判一行。\n\n什么时候别用：嵌套太深、团队不熟、或本来就有更直白的写法。它不开新作用域，n 留在当前作用域可继续用。"}, "q87": {"detail": "输出 `12`。\n\n执行顺序：先取列表最大值得到 12 并绑给 big，括号整体的值也是 12；12 大于 10 成立，进入分支打印 big，也就是 12。\n\n等价的老写法是两行：先赋值再判断。海象还保证最大值只算一次——如果写成判断里算一次、打印里再算一次，就白算了一遍。\n\n本题的陷阱是括号：漏掉括号会变成「big := 比较结果」，big 成了 True，于是打印出 True 而不是 12，这种不报错但结果错的情况最难发现。\n\n补充：big 绑定在当前作用域，出了 if 还能读；但 := 不能给属性赋值，写成点号加名字的形式是语法错误。"}, "q88": {"detail": "输出是 `x + y = 30`，注意等号两边各有一个空格。\n\n完整形式：在 f-string 的表达式后面加一个等号，会打印出「表达式源码文本 + 等号 + 结果」。这是 3.8 加入的调试辅助，不是新运算符。\n\n空格规则我实测了三种：写成「表达式空格等号空格」时输出两边都有空格；等号紧贴表达式时，等号后面没有空格；只写变量名加等号时输出「变量名=值」。\n\n等价老写法是手写标签再加结果，但表达式要抄第二遍，改了代码忘改标签就会打印出骗人的标签。等号写法让标签永远和代码一致。\n\n它还能接格式说明符：加保留两位小数的格式，或加感叹号 r 用 repr 显示，后者能看出字符串带引号。\n\n3.7 及更早不支持这种写法会语法错误；它只适合调试，别留在生产日志里。"}, "q89": {"detail": "输出是 `{'a': 9, 'b': 2}`，也就是选项 2。\n\n完整形式是用竖线合并两个字典，3.9 起支持；加上等号是原地更新版，等价于对左边调用 update。冲突的键一律以右边为准。\n\n等价老写法是双星号解包进新字典，或者先复制再 update。竖线的意图更直白，也不用先复制一份。\n\n错项：第一项是左边优先，方向反了；第三项以为键能重复，但字典的键唯一，后写的会覆盖先写的；第四项说类型错误也不对，两个字典用竖线完全合法。\n\n细节：竖线不修改原字典，带等号才改左边；两边必须都是字典，拿列表去合并会抛 TypeError。\n\n常用于合并配置默认值和用户覆盖项。注意它是浅合并，嵌套字典会被整个替换，不会递归合并。"}, "q90": {"detail": "输出 `test_file`。\n\n完整形式是字符串的 removeprefix 和 removesuffix 两个方法，3.9 起新增。只在开头或结尾匹配到才削掉一次，返回新字符串，原串不动。\n\n等价老写法有三种：按前缀长度切片但要自己判断有没有前缀；按固定长度切尾巴但长度写死很脆；用 replace 会误伤中间出现的同名片段。\n\n安全点：不匹配就原样返回、不报错。实测对 `a.py.bak` 去后缀 `.py` 会原样返回，因为结尾不是它，中间的同名片段不会被误删。\n\n用于去扩展名、去网址前缀、去命名空间前缀。3.8 及更早没有这两个方法会报属性错误；它只删一层，`.tar.gz` 去 `.gz` 得到 `.tar`。\n\n别和 strip 混用：strip 删的是字符集合，不是固定串。实测对 `xxx.py` 调 strip 传点加 py，开头连续的 x 也会被当字符删掉，语义完全不同。"}, "q91": {"detail": "第一次打印 `1 a`，第二次是 `2 b`。\n\n完整形式是 enumerate 加可选参数 start，默认从 0 开始。它产出「下标, 元素」二元组，start 只改起始编号，不做切片，这个参数很早的版本就支持。\n\n等价老写法是用 range 配长度索引，啰嗦还容易越界；或者把编号序列和原序列 zip 起来。\n\n错项：0 a 是默认从 0 开始的结果，本题显式指定了从 1 开始；1 b 把编号和元素错位了；a 1 顺序反了，解包是先下标后元素。\n\n用于报表行号、排行榜从 1 开始计数。坑：它返回迭代器，只能遍历一次；循环里别增删列表，否则下标会错位。"}, "q92": {"detail": "输出是键 a 配 90、键 b 配 80 的字典。\n\n两步走：zip 像拉链一样把两个序列按位置配成二元组，dict 再接受这种二元组序列，直接转成字典。\n\n等价老写法是循环里逐个赋值，或者用字典推导式配 zip（后者还能顺便过滤掉不要的项）。\n\n关键坑：zip 默认按短的截断、静默丢数据。三个键配两个值只会得到两组，第三个键凭空消失还不报错。要防丢数据得开严格模式，那是 3.10 起才有的参数。\n\n用于两列表拼字典、表头配数据行。注意键必须可哈希且唯一，重复键是后者覆盖前者。"}, "q93": {"detail": "输出 `1 [2, 3, 4]`，注意 rest 是列表。\n\n完整形式是「名字, 星号名字 = 可迭代对象」，带星号的目标收集剩下所有元素成一个列表，3.0 起支持；星号也可以放中间，前后各留一个名字。\n\n等价老写法是先取第一个元素，再切片取其余，两行，而且切片还多复制一份数据。\n\n实测要点：星号目标一定是列表，哪怕原对象是元组或字符串；一个赋值里只能有一个星号；元素不够会报值错误。\n\n用于解析一行逗号分隔的数据、取命令名和其余参数。注意别和函数调用时的星号混淆，那是把序列摊成实参，方向和这里相反。\n\n坑：星号目标不能单独裸写，必须放在列表或元组形式里，也就是后面得跟个逗号，否则是语法错误。"}, "q94": {"detail": "答案是 `ValueError`。\n\n默认行为是按最短的序列截断，多出来的元素被静默丢弃：三个元素配两个字符只会得到两组，第三个凭空消失。数据本该一一对应时，这是最难发现的 bug。\n\n完整形式是 zip 加关键字参数 strict，默认假。开成严格模式后长度不一致直接抛 ValueError，这个参数 3.10 起才有。实测两个方向都报：第二个短了提示 shorter，长了提示 longer。\n\n错项：第一项是没开严格模式的默认结果，少了第三个；第二项以为会用 None 补齐，但 zip 从不补齐，那是另一个专门函数干的事；第四项说 TypeError 不对，异常类型是 ValueError。\n\n等价老写法是先比较两边长度、不等就自己抛异常，再 zip。想补齐而不是报错，用带填充值的那个函数。\n\n读两份本该等长的数据（表头配值、编号配姓名）强烈建议开严格模式，把静默错误变成显式崩溃。"}, "q95": {"detail": "输出 `前进`。\n\n完整形式 match 加若干 case，3.10 起支持。它是结构匹配而不是条件判断：按值的形状和内容比对，case 后面不能写任意布尔表达式，那种需求要用守卫。\n\n竖线是或模式：一个 case 里用竖线连多个值，等于其中任一就命中，等价于用 in 判断。两边都绑同一个名字才合法，绑不同名字会语法错误。\n\n下划线是通配符兜底，作用像 switch 的 default，匹配一切且不绑定变量。它必须放最后——实测放前面会报「通配符使后面的模式不可达」。\n\n错项：停需要命令等于 stop；未知只在前面都不匹配时才走；说语法错误不对，这段完全合法。\n\n坑：裸名字是捕获模式，会吃掉一切，放在前面直接报不可达；要匹配常量得用带点的名字，或者加守卫。"}, "q96": {"detail": "输出 `在 y 轴上，y=5`。\n\n完整形式是序列模式：case 后面写圆括号或方括号包住的若干模式，两者等价，都能匹配列表、元组、range 这类序列。按位置比对，第二个位置的名字会绑到对应元素，3.10 起支持。\n\n匹配顺序：先试原点模式，第二个元素 5 不等于 0，跳过；再试第二个分支，0 相等、名字绑到 5，命中。\n\n能力要点：长度必须正好相等，除非用星号——星号可以收中间段；模式还能嵌套，写成元组套元组。\n\n实测细节：序列模式不匹配字符串和 bytes。拿两个字符的字符串去匹配两元素序列模式不会命中，会落到兜底分支，所以不用担心字符串被当序列拆开。\n\n等价老写法要先判长度再逐个取，容易下标越界。坑：模式里的名字是捕获不是比较，想和某个变量比大小或相等，得加守卫。"}, "q97": {"detail": "输出 `3`。\n\n完整形式是字典模式：case 后面写花括号包住的「键: 模式」对，3.10 起支持。按键匹配、按值绑定变量，而且允许字典里有多余的键——这点和序列模式不同。\n\n过程：type 的值等于字面量 add，x 绑到 1、y 绑到 2，整体命中，打印两者之和得 3。\n\n实测细节：只检查你写出来的键，多加一个键照样命中；键必须是字面量，写成变量会语法错误；双星号能收集剩余键，剩下的两项会进一个新字典。\n\n等价老写法是用 get 取出 type 判断，再逐个取 x 和 y，要判缺失、要防键不存在，啰嗦得多。\n\n用于处理接口返回的 JSON、按类型分派配置、消息路由。坑：模式只要求键存在、不做类型检查；忘写兜底分支时，不匹配就静默什么都不做。"}, "q98": {"detail": "输出 `minor`。\n\n完整形式是 case 模式后面再跟 if 条件，这个 if 叫守卫，3.10 起支持。流程是先做结构匹配、绑定变量，再算守卫；守卫为假就当这个 case 没匹配上，继续试下一个。\n\n过程：年龄 15 先绑到名字，15 大于等于 18 为假，跳过；落到兜底分支，打印 minor。\n\n错项：adult 要年龄够 18；说语法错误不对，守卫是合法语法；说「什么都不输出」是混淆了没有兜底的情况——删掉兜底分支时 15 确实一个分支都不进、静默无输出，但有兜底就会打印 minor。\n\n为什么需要它：纯结构匹配表达不了大小比较、取模、成员测试这类条件，守卫正好补上这一块。模式绑的名字在守卫里已经可用；通配符加守卫也合法，相当于带条件的默认分支。\n\n坑：守卫里别写有副作用的表达式，它可能被多次求值；守卫为假不报错也不停住，会继续往下匹配。"}, "q99": {"detail": "输出是 a、bb、ccc，即选项 1。\n\n完整形式是 sorted 加关键字参数 key 和 reverse。key 收一个函数，先对每个元素算出「排序依据」再比大小；列表自带的 sort 是原地版。\n\n本例用长度做依据，把三个字符串映射成长度 1、2、3，升序就排成 a、bb、ccc。等价老写法是传取长度的匿名函数，直接写 len 更简洁。\n\n不写 key 是按字典序逐字符比。实测 aa、b、ccc 默认排成 aa、b、ccc，按长度排成 b、aa、ccc，差别明显；本题输入两种排法恰好一样，是巧合。\n\n错项：第二项是降序，要开 reverse；第三项没有对应的排序规则；第四项说类型错误不对，用 len 当 key 对字符串完全合法。\n\n用于按长度、绝对值、字段、忽略大小写、多级排序。坑：key 返回类型必须能互相比较，混整数和 None 会报错；len 别写成调用形式。"}, "q100": {"detail": "输出 `1-2-3`。\n\n完整形式是调用处的星号：把序列摊开成多个位置实参，等价于手写三个参数。对应的双星号是把字典摊成关键字实参，3.0 起可用。\n\n机制：print 的分隔符作用在多个参数之间，摊开后正好是三个参数，于是用横线连起来；数字被自动转成字符串，不会报类型错误。\n\n实测坑：把横线当普通参数跟在后面是错的——它成了第四个参数，输出变成三个数字加一个横线。要连字符必须用分隔符关键字参数。\n\n等价老写法是先把每个元素转成字符串，再用横线做连接，得手动转换，元素不是字符串会直接报类型错误。\n\n用于把已有列表当参数传给函数、拼列表字面量。坑：星号只能用在调用、字面量和赋值目标里，写在赋值号右边裸用是语法错误。"}, "q101": {"detail": "输出 `True False`，也就是选项 1。\n\n完整形式：any 只要有一个真就返回 True，遇到真立刻短路；all 必须全部为真才返回 True，遇到假立刻短路。它们判断的是真值，不是「非空」本身。\n\n本例：第一个列表里有 3 这个真值，所以 any 为 True；第二个列表里有 0 这个假值，所以 all 为 False。\n\n什么算假：0、0.0、空字符串、空列表、空字典、空元组、空集合、None、False。注意字符串 `'0'` 和只含空格的字符串是非空字符串，都算真。\n\n错项：两个都 True 是忘了 all 要求全真；两个都 False 是把 any 的语义搞反了；后一个 True 是正好两个都反了。\n\n用于批量校验、权限任一命中、配生成器省内存。坑：空序列时 any 是 False 而 all 是 True，这是空真值约定，校验空数据会意外通过；生成器只能消费一次。"}, "q102": {"detail": "答案是第二个：返回值类型提示，运行时不检查。\n\n完整形式是参数后用冒号标类型，参数列表后用箭头标返回类型。语法上很早就能写，typing 模块 3.5 起提供容器类型支持。\n\n关键性质：标注只是塞进注解字典的元数据，运行时不校验、不转换、不影响性能。实测声明返回整数却返回字符串，也不报错。\n\n错项：「强制返回整数否则报错」是常见误解，Python 不是静态类型语言；「把函数声明成整数」误解了语法；「必须导入 typing」也不对——内置类型直接写就行，方括号容器标注 3.9 起可用，只有可选、联合类型需要 typing。\n\n用于编辑器补全、mypy 或 pyright 检查、FastAPI 这类框架的运行时校验。真要检查得跑静态工具。\n\n坑：3.14 起标注默认惰性求值，写了未定义的名字调用函数也不报错，但访问注解字典时才抛 NameError；箭头后写 None 表示没有返回值。"}, "q103": {"detail": "答案是第一项，三个元组。\n\n完整形式是 itertools 的 batched，传可迭代对象和批次大小，每 n 个切一批，3.12 起新增；strict 关键字参数是 3.13 才加的，本机实测签名确实如此。\n\n返回类型要注意：它返回一个惰性的 batched 迭代器，每批是元组而不是列表，所以最后一批是带逗号的单元素元组。惰性意味着不复制整个数据，处理大文件省内存。\n\n错项：第二项括号里的字符串只是加了括号的字符串，等于它本身，类型就错了；第三项同样是字符串列表；说不能整除就报错也不对，默认允许最后一批不足，要报错得开严格模式，实测抛的是 ValueError。\n\n等价老写法是按步长切片，只适用于序列；用 zip 配迭代器复制的技巧会把尾部不足一批的元素丢掉。\n\n坑：批次大小必须是正整数，传 0 会抛 ValueError；输入是迭代器时只能遍历一次；3.11 及更早没有，得自己写。"}, "py158": {"detail": "答案是第三个：报 NameError，因为 y 是函数内的局部变量，外面访问不到。\n\n机制：函数体里赋过值的名字默认是局部变量，存在局部命名空间里；函数一返回，命名空间就销毁，模块层面根本没有这个名字。\n\n补充：单独写一行函数调用也不会显示 11——return 的结果没人接、也没打印，直接被丢掉（这点和前面那道 return 题一致）。想看到就写成打印函数调用。\n\n错项：输出 11 和输出 10 都把「函数内部算出来了」当成「外面能拿到」；说语法错误不对，语法完全合法，是运行到那行打印才抛。\n\n想在外部拿到值有三条路：用 return 交出来（首选）、用可变对象在函数里改、或者声明 global（不推荐，副作用难追踪）。\n\n坑：函数内先读后赋值同一个名字会报 UnboundLocalError，它是 NameError 的子类，比如先打印再赋值，因为整个函数体内该名字都被判定为局部变量。"}, "q01": {"detail": "脚本模式下解释器只执行语句，不会把表达式的值回显；回显是交互模式（`>>>`）独有的待遇。\n\n`1 + 2` 这行语法完全合法，Python 会算出 3，然后把结果直接丢掉，因为它既没被赋值也没被打印。屏幕上出现什么，只取决于谁调用了 print。\n\n- 选 `3`：把脚本模式当成了 REPL，只有在 `>>>` 后敲 `1 + 2` 才有回显。\n- 选 `SyntaxError`：裸表达式是合法语句，构造不出语法错误。\n- 选 `None`：混淆了「结果被丢弃」和「结果是 None」，None 也得 print 才看得见。\n\n坑：脚本里写 `input('x: ')`、`sorted(a)` 却不 print，同样是跑完屏幕空白。\n\n记忆点：脚本模式只干活不吭声；要它吭声，必须 print。"}, "q02": {"detail": "交互模式的提示符是 `>>>`，它背后是一个真实的 Python 解释器进程；`exit()` 和 `quit()` 是解释器内置的退出函数，敲回车后进程结束、回到命令行。\n\n`exit()` 后面必须带括号，因为它是一次函数调用；只敲 `exit` 得到的是它的说明文字，不会退出。Windows 上按 Ctrl+Z 再回车（发送 EOF）效果相同。\n\n- `stop()` 不存在，会 NameError。\n- `close()` 也不是退出函数，同样 NameError。\n- Ctrl+Alt+Del 是系统热键，跟退出解释器无关。\n\n坑：退出后提示符消失，此时再敲 Python 代码就是在命令行里乱敲，会提示「不是内部或外部命令」。\n\n记忆点：`exit()` 或 `quit()`，括号别丢；脚本模式本来就没有 `>>>`。"}, "q03": {"detail": "Python 只有 `#` 一种注释符号，规则是「从 `#` 到行尾全部忽略」，所以多行注释就是每行各写一个 `#`。\n\n`#` 既能站行首让整行失效，也能跟在代码后面解释这一行；两种写法都只管到行尾，下一行不受影响。\n\n- `/* ... */` 是 C/Java 的块注释，Python 没有，实测 `SyntaxError: invalid syntax`。\n- `//` 在 Python 里是整除运算符，拿它写注释同样语法错误。\n- 三引号字符串能跨行，但它本质是字符串对象（`type` 是 `str`），只有放在模块或函数开头才按 docstring 特殊处理。\n\n坑：三引号字符串写在函数体中间不报错，但它是字符串表达式，不是注释，也不会产生任何输出。\n\n记忆点：注释只有 `#`；三引号是字符串，不是注释语法。"}, "q04": {"detail": "print 可以接收任意多个参数，`sep` 决定相邻两个参数之间插什么字符，默认是一个空格。\n\n这行有两个参数 `'a'`、`'b'`，`sep='-'` 把中间的默认空格换成 `-`，所以输出 `a-b`。\n\n- `a b` 是没写 sep 的默认结果。\n- `a - b` 是以为 `-` 两边会自动补空格，sep 只插字符，不补空格。\n- `ab` 是 `sep=''` 的结果。\n\n坑：sep 只作用在参数之间，结尾不补，所以不会出现 `a-b-`；开头也不补。\n\n记忆点：sep 管「之间」，默认空格；改了 sep 就是改这一段。"}, "q05": {"detail": "print 的多个参数默认用空格连接；`5 + 10` 是参数位置上的表达式，先算成 15，再交给 print。\n\n执行顺序：先求 `5 + 10` 得 15，再按默认 sep 用空格把 `'Sum:'` 和 `15` 接起来，最后补一个换行。\n\n- `Sum:15` 是以为不会加空格，默认 sep 会补。\n- `Sum: 5 + 10` 是以为 print 打印源码，其实打印的是算好的值。\n- `15` 丢了前缀，只看到最后一个参数。\n\n坑：数字会被自动转成字符串，所以字符串和整数放一起不报错；换成 `'Sum:' + 15` 就直接 TypeError。\n\n记忆点：先算表达式，再用空格拼接，最后换行。"}, "q06": {"detail": "`input()` 的返回值永远是 str，哪怕用户敲的是纯数字；`'100' * 2` 走的是字符串重复，把整串再复制一遍。\n\n执行顺序：input 先输出提示符 `Price: `，读到 `'100'`（引号内是三个字符）；乘 2 不是 200，而是把 `'100'` 复制成 `'100100'`。\n\n- `200` 是以为 input 会自己识别数字，它不会，只负责读字符。\n- `100 100` 是把 `*` 当成带空格拼接，`*` 不加任何分隔符。\n- `100100` 才是答案（前面带上提示符的写法也接受）。\n\n坑：要算数必须 `int(input())` 或 `float(input())`，实测改成 int 后同一个输入输出 200。\n\n记忆点：input 交货单一律是 str；想算数，就在读入那一行转型。"}, "q07": {"detail": "这是「输入 — 计算 — 输出」的完整三步：`float(input())` 转型，`0.2 * net_price + net_price` 计算，f-string 格式化。\n\n推导：`float('100')` 得 `100.0`；`0.2 * 100.0` 是加价部分 `20.0`；加回原价得 `120.0`；f-string 把 float 原样插进去，所以输出 `Final price = 120.0`，末尾 `.0` 不会省。\n\n- `20.0` 是只算了加价，忘了加原价。\n- `120` 少了 `.0`：参与运算的是 float，结果就是 float。\n- `1.2` 是只算了倍数，没乘原价。\n\n坑：忘了 float 就退化成字符串重复；本题用 int 读入也能得 120.0，但价格带小数时会被截断。\n\n记忆点：先转型、再计算、后格式化，三步各管一件事。"}, "q08": {"detail": "print 有两个管排版的参数：`sep` 管多个参数之间插什么，`end` 管这一行结束补什么，`end` 默认是换行符 `\\n`。\n\n想让两次 print 留在同一行，就把第一行的结尾从换行改成空串：`print('a', end='')` 之后紧跟 `print('b')`，输出 `ab`。\n\n- `sep=''` 只改一次调用内部的分隔，两次调用之间照样换行，实测输出的是两行 `a`、`b`。\n- `flush=True` 管缓冲区是否立刻刷新，不改变换行。\n- `same_line=True` 不存在，会 TypeError。\n\n坑：`end=' '` 是常用变体，得到 `a b`；想拼一整行又怕少空格，就自己决定 end 里放什么。\n\n记忆点：sep 管横着拼，end 管竖着换。"}, "q09": {"detail": "赋值是「把名字贴到对象上」，不是把值复制进盒子；`m = n` 只让两个名字指向同一个整数对象。\n\n推导：`n = 3000` 建对象并贴名；`m = n` 让 m 也指向它（实测 `id(n) == id(m)` 为 True）；`m = 6000` 是给 m 重新贴标签指向新对象，n 的标签没动。\n\n- `6000 6000` 是以为重新赋值会改掉被共享的那个对象。\n- `3000 3000` 是以为 `m = n` 之后 m 就被锁死了。\n- 只有 `3000 6000` 符合「两个名字各指各的」。\n\n坑：整数不可变，所以看不到连带效果；换成列表用 `append` 就会两边一起变，那是原地修改。\n\n记忆点：重新赋值只动名字，原地修改才动对象。"}, "q10": {"detail": "多重赋值的形式是 `目标1, 目标2 = 表达式1, 表达式2`，规则是右边整体先求值，再按位置赋给左边。\n\n推导：`a, b = 1, 2` 之后 a 是 1、b 是 2；`a, b = b, a` 先把右边算成元组 `(2, 1)`，两步之间旧值已经取好，再一次性赋回去，于是 a 得 2、b 得 1。\n\n- `1 2` 是以为交换没生效。\n- `2 2` 是把它想成先 `a = b` 再 `b = a`，第二步读到的已是新 a。\n- `1 1` 是把顺序彻底想反了。\n\n坑：拆成两行普通赋值必然出错，必须借临时变量；一行能交换，靠的正是「右边先全部算完」。\n\n记忆点：右边先成元组，左边再挨个落位；`a, b = b, a` 就是最短的交换。"}, "q11": {"detail": "多重赋值的硬性要求是两边个数一致：左边几个名字，右边就得有几个值。\n\n`x, y = 'one', 'two', 'three'` 左边 2 个、右边 3 个，解包时多出来的 `'three'` 无处可放，抛 `ValueError: too many values to unpack (expected 2, got 3)`。\n\n- 「多的丢掉」不成立，Python 不会静默丢弃，靠报错保护你。\n- 「x 得到整个元组」是把 `x = ...` 和 `x, y = ...` 搞混。\n- `TypeError` 不对，类型都没错，是数量不匹配，属于 ValueError。\n\n坑：反过来少给值报的是 `not enough values to unpack`；确实想接住剩余项就写 `x, *y = ...`，实测 y 会拿到 `['two', 'three']`。\n\n记忆点：个数必须相等；要收余量，用星号。"}, "q12": {"detail": "`is` 比的是「是不是同一个对象」（同一块内存），`==` 比的是「值相不相等」，两个问题互不等价。\n\n推导：`a = [1, 2]` 建一个列表；`b = a` 让 b 指向同一个对象，`a is b` 为 True；`c = [1, 2]` 又建了一个内容相同的新列表，所以 `a is c` 为 False，而 `a == c` 为 True。\n\n- `True True True` 是以为内容相同就是同一对象。\n- `False True True` 把前两个判断看反了。\n- `True False False` 是以为内容相同的两个列表 `==` 也不相等。\n\n坑：小整数和短字符串有缓存复用，`is` 偶尔碰巧为 True，所以别拿它比数值，只拿它比 `None`。\n\n记忆点：is 问身份，== 问内容；一个对象可有多个名字，多个对象可有同样内容。"}, "q13": {"detail": "描述变量通常看五个特征：名字、值（对象）、类型、作用域、生命周期。作用域（scope）说的是「这个名字在哪些代码里能被找到」。\n\n名字存在命名空间里：函数内部赋过值的名字默认是局部的，出了函数就查不到；模块顶部赋值的名字是全局的，整个文件都能用。\n\n- 「变量里存的值」是值/对象，不是作用域。\n- 「对象占多少内存」是大小，和名字的可见范围无关。\n- 「从创建到销毁的时间」是生命周期（lifetime），和作用域相邻但不同。\n\n坑：作用域看的是「名字写在哪」，不是「值从哪来」；全局名字在函数里只读没问题，一旦赋值就变成局部名字。\n\n记忆点：scope 管「能不能看见」，lifetime 管「活多久」。"}, "q14": {"detail": "变量名的硬性规则三条：只能用字母、数字、下划线组成；不能以数字开头；不能用关键字。\n\n逐个看：`my_number` 全小写加下划线，合法；`99redBallons` 数字开头，实测 `SyntaxError: invalid decimal literal`；`my-number` 里的 `-` 是减号，会被当成表达式 `my - number`，报 NameError；`class` 是关键字，赋值直接 SyntaxError。\n\n- 数字开头不是「起名不好」，而是根本解析不成名字，报语法错误。\n- 连字符在 Python 里只表示减法，名字中间不允许出现。\n\n坑：中文、`@`、空格同样不行；名字区分大小写，`Age` 和 `age` 是两个变量。\n\n记忆点：字母数字下划线、不数字开头、不撞关键字。"}, "q15": {"detail": "`class` 是保留关键字，语法层面就禁止当名字，写 `class = 'x'` 直接 `SyntaxError: invalid syntax`，程序一行都跑不起来。\n\n`print`、`input`、`list` 不是关键字，只是内置函数的名字；它们躺在内置命名空间里，可以被同名变量覆盖——语法允许，但覆盖后原函数就没了。\n\n- 选 `print`：能执行 `print = 1`，只是之后再也打印不了东西。\n- 选 `input`、`list` 同理，属于「不推荐」而不是「不允许」。\n\n坑：覆盖后的报错很晚，`input = 5` 之后再调 `input('n: ')` 才抛 `TypeError: 'int' object is not callable`。\n\n记忆点：关键字碰不得（语法拦），内置名碰得但别碰（运行时报错）。"}, "q16": {"detail": "命名约定按「这个名字代表什么」分三档：普通变量和函数用 snake_case（全小写加下划线），类名用 PascalCase（每个单词首字母大写），常量全大写加下划线。\n\n「不会再变的上限值」属于常量，所以写 `MAXIMUM`；多个单词就是 `MAX_SIZE`、`MAX_RETRY`。\n\n- `Maximum` 是 PascalCase，那是类名的写法。\n- `maximum` 是 snake_case，会被当成普通变量。\n- `max_imum` 只是单词拆错了，风格上仍是普通变量。\n\n坑：全大写只是给读代码的人看的约定，解释器不拦；改它照样能改，只是违背了作者意图。\n\n记忆点：变量小写下划线，类名大驼峰，常量全大写。"}, "q17": {"detail": "变量名允许的字符就三类：字母、数字、下划线 `_`，而且不能以数字开头。\n\n所以括号里填「下划线」，符号写成 `_`。它是 ASCII 的下划线字符，不是连字符 `-`，也不是空格。\n\n- 填「连字符」错：`-` 是减号，`my-name` 会被解析成表达式。\n- 填「空格」错：名字中间不允许有空格。\n- 只写英文 `underscore` 也算对，但正式答案优先写 `_`。\n\n坑：下划线可以开头（`_a`、`__init__`），也可以连续多个，但名字以数字打头立刻语法错误。\n\n记忆点：字母 + 数字 + 下划线，数字不开头，关键字不碰。"}, "q18": {"detail": "`int()` 对浮点数做的是「向零截断」：直接砍掉小数部分，不看小数有多大，既不四舍五入也不向下取整。\n\n`int(9.8)` 砍掉 `.8` 得 9；想四舍五入得写 `round(9.8)`，实测是 10。\n\n- `10` 是把 int 当成了 round，最常见。\n- `9.8` 是以为 int 只换类型不换值，其实返回的是 int 对象。\n- `ValueError` 不会出现，9.8 是合法数值，类型和值都没问题。\n\n坑：负数才见真章，`int(-3.9)` 是 `-3` 而不是 `-4`；要向下取整用 `math.floor`，实测得 -4，`-3.9 // 1` 得 -4.0。\n\n记忆点：int 朝 0 砍，round 看奇偶，floor 往下走。"}, "q19": {"detail": "`int()` 接受字符串时，要求这段文字本身就是整数写法：可选正负号加十进制数字，允许两边空白。\n\n`'9.8'` 里有个小数点，不属于整数写法，所以转换直接失败。\n\n报错原文是 `ValueError: invalid literal for int() with base 10: '9.8'`：类型是对的（确实是 str），错在内容不合法，所以是 ValueError 而不是 TypeError。\n\n- 选 `9` 是以为 int 会自动先转 float，它不会。\n- 选 `9.8` 是以为 int 会返回小数。\n- 选 `TypeError` 是把「值不对」错当成「类型不对」。\n\n坑：`'9.0'` 同样报 ValueError；要小数先转 float，实测 `int(float('9.8'))` 得 `9`。\n\n记忆点：int 只认整数写法；带点先 float，再 int。"}, "q20": {"detail": "`bool` 是 `int` 的子类（实测 `issubclass(bool, int)` 为 True），`True` 当 1 用、`False` 当 0 用，参与算术完全合法。\n\n推导：`True + 1` 等价于 `1 + 1` 得 2；同理 `True + True` 是 2、`False + 0` 是 0、`True * 3` 是 3。\n\n- `True1` 是以为会做字符串拼接，bool 不是 str。\n- `1` 是漏掉了加号后面的 1。\n- `TypeError` 不成立，bool 和 int 之间的运算有定义。\n\n坑：反方向不成立，int 不会自动变 bool；`True == 1` 是 True，但 `type(True)` 仍是 `<class 'bool'>`，别拿 `==` 判断类型。\n\n记忆点：True 就是 1，False 就是 0，bool 是带名字的 int。"}, "q21": {"detail": "四个转换里只有 `int('abc')` 会报错：类型没错，错在内容不是整数写法，报 `ValueError: invalid literal for int() with base 10`。\n\n另外三个都合法：`float('3.14')` 得 `3.14`，`str(42)` 得 `'42'`，`bool(0)` 得 `False`。\n\n- `float('3.14')` 是标准用法，字符串里写的就是浮点。\n- `str(42)` 数字转字符串，永远成功。\n- `bool(0)` 常被误以为不能转，其实假值转换正是它的本职。\n\n坑：`int('abc')` 是 ValueError；换成 `int(None)` 或 `int([])` 才是 TypeError。\n\n记忆点：类型错报 TypeError，值错报 ValueError；bool 对万物都有答案。"}, "q22": {"detail": "`type(x)` 返回的是「x 的类型对象」本身，不是字符串；只是 print 打印它时用的是 repr，长成 `<class 'float'>`。\n\n所以输出必须连尖括号和单引号一起写：`<class 'float'>`。它们是 repr 的固定格式，不是装饰。\n\n- `float` 只是类型名，漏了外壳。\n- `float()` 是调用构造函数，得 0.0，不是类型显示。\n- `type: float` 不是 Python 的任何显示格式。\n\n坑：`type(3)` 是 `<class 'int'>`、`type('a')` 是 `<class 'str'>`；想比类型写 `type(x) == float` 或 `isinstance(x, float)`，别比字符串。\n\n记忆点：type 给对象，print 显示成 `<class '名字'>`。"}, "py104": {"detail": "脚本从上往下执行三条语句：`x = 10` 绑定名字，`x + 5` 算出 15 但没人接，`print(x)` 打印 x 当前的值。\n\n关键在于中间那行：它是裸表达式，脚本模式不回显，也不会把 15 存回 x——`x + 5` 不改变 x，只有 `x = x + 5` 才会。所以输出只有 10。\n\n- `15` 是把裸表达式当成了 print。\n- `10 15` 是以为脚本会回显中间结果。\n- 想看到 15 就得自己写 `print(x + 5)`，x 本身仍是 10。\n\n坑：这类「算了但没用上」的代码不报错、不留痕，调试时最好在关键位置补 print。\n\n记忆点：只算不打印等于没算；`x + 5` 不是赋值，`x = x + 5` 才是。"}, "py105": {"detail": "REPL 的回显规则很窄：只有「表达式的值」会被自动打印，语句不会。赋值语句属于语句，所以敲完回车屏幕上什么都不显示。\n\n推导：`x = 3 + 4` 执行完，x 已经是 7，但 REPL 不打印赋值结果；想看到 7 得再敲 `x`（表达式，会回显 7）或 `print(x)`。\n\n- 选 `7` 是把「语句执行成功」当成了「会回显」。\n- 选 `x = 7` 是以为 REPL 会回显整个语句。\n- 选 SyntaxError 不成立，赋值语法完全合法。\n\n坑：别把两句话记反——脚本模式什么都不回显，REPL 只回显表达式，赋值在两边都不出声。\n\n记忆点：REPL 打印「值」，不打印「动作」；赋值是动作。"}, "py106": {"detail": "`python hello.py` 是操作系统命令行的写法，不是 Python 语句。REPL 只认 Python 代码，两个名字挨在一起过不了语法检查。\n\n实测报 `SyntaxError: invalid syntax`，插入符打在 `hello` 下面：`python` 被当成一个名字、`hello.py` 又是一个名字，中间缺运算符。\n\n- 选「运行 hello.py」是把 REPL 当成了命令行。\n- 选「进入下一层解释器」不成立，得先退出再敲命令。\n- 选 NameError 是以为 `python` 这个名字没定义；实际连语法都没过，轮不到查名字。\n\n坑：正确顺序是先 `exit()` 退出 REPL，回到命令行再敲 `python hello.py`。\n\n记忆点：`>>>` 里面只写 Python；想敲系统命令，先退出。"}, "py107": {"detail": "`#` 的规则是「从这里到行尾全部忽略」，所以它既能站行首废掉整行，也能跟在代码后面做说明。\n\n推导：第一行 `#print('A')` 的 `#` 在行首，整个 print 失效，A 不输出；第二行的 `print('B')` 在 `#` 之前，照常执行，输出 B。\n\n- `A B` 是以为行首注释不生效。\n- 只输出空行是以为整行都被吃掉。\n- `B 打印 B` 是以为注释会变成输出。\n\n坑：注释永远不会出现在屏幕上；`#` 之后写什么都不会执行，包括看起来像代码的东西。\n\n记忆点：`#` 管到行尾，前面照跑，后面全哑。"}, "py108": {"detail": "`#` 只有在「字符串外面」才是注释符号；一旦被引号包住，它就是普通字符，和 a、b 没有区别。\n\n`print('a#b')` 里参数是完整的字符串 `'a#b'`，三个字符原样输出 `a#b`，不会从 `#` 处截断。\n\n- `a` 是以为字符串里的 `#` 也开注释。\n- 空行是以为整个参数都被注释掉。\n- `a b` 是把 `#` 当成了分隔符。\n\n坑：同理 `print('#')` 输出一个 `#`；而 `print('a') # b` 里的 `#` 在引号外，那才是真注释。\n\n记忆点：引号优先，引号里的符号一律是内容。"}, "py109": {"detail": "三条语句里只有两条带 print，中间 `3 + 4` 是裸表达式：脚本模式会算出 7，然后丢掉，不显示。\n\n推导：第一行输出 3；第二行什么都不输出（这是最容易漏的一行）；第三行输出 end。屏幕上是两行 `3` 和 `end`，写成一行就是 `3 end`。\n\n- `3 7 end` 是以为脚本会回显中间结果。\n- `3` 是漏了最后一行。\n- `3 7` 是既回显又漏行。\n\n坑：同一段代码在 REPL 里逐行敲，7 才会出现——换个运行环境结果就不同。\n\n记忆点：脚本模式里，没有 print 就没有输出；那个 7 不会自己冒出来。"}, "py110": {"detail": "`#` 把赋值整行废掉，`total` 这个名字从来没有绑定过任何对象；`print(total)` 执行到这才去查名字，查不到就抛错。\n\n实测报 `NameError: name 'total' is not defined`。\n\n- 选「输出 100」是没注意到行首的 `#`。\n- 选「什么都不输出」是把运行时错误当成了静默失败。\n- 选 SyntaxError 不对：语法完全合法，程序能启动，跑到第二行才崩。\n\n坑：这类错误 IDE 不一定提前标红，因为「先注释掉、以后再补回来」很常见，只有真跑才发现。\n\n记忆点：注释掉定义、保留使用，必然 NameError；删代码要连使用处一起看。"}, "py111": {"detail": "print 的排版由两个参数分工：`sep` 管多个参数之间插什么，`end` 管整行收尾补什么；本题只考 `sep` 的位置规则。\n\n`sep` 只在相邻两个参数「之间」插入，第一个参数前面不插、最后一个参数后面也不插。这行只有 `'x'` 和 `'y'`，中间插一个 `,`，所以是 `x,y`。\n\n- `x,y,` 是以为结尾也会补一个分隔符。\n- `,x,y` 是以为开头也补。\n- `x y` 是没写 sep 的默认结果。\n\n坑：参数变成三个时 sep 会插两次，`print('x', 'y', 'z', sep=',')` 得 `x,y,z`，两头依然干净。\n\n记忆点：n 个参数之间有 n-1 个 sep，两头都没有。"}, "py112": {"detail": "`end` 决定一次 print 结束后补什么字符，默认是换行 `\\n`；把它改成 `-`，光标就停在行尾不换行。\n\n推导：第一行打印 a 后补 `-`，屏幕上是 `a-`；第二行接着打印 b 并补默认换行，合起来 `a-b`。\n\n- 两行 `a`、`b` 是没改 end 的默认效果。\n- `a-b-` 是以为第二行也继承了 end。\n- `a b` 是把 end 和 sep 搞混了。\n\n坑：`end` 只对写它的那一次 print 生效，下一行又回到默认换行。\n\n记忆点：sep 管参数之间，end 管这一行收尾；一个管中间，一个管尾巴。"}, "py113": {"detail": "`input()` 两次拿到的都是 str，`+` 作用在字符串上是拼接，不是加法。\n\n推导：用户敲 3，得到 `'3'`；敲 4，得到 `'4'`；`'3' + '4'` 把两串接起来，输出 `34`。\n\n- `7` 是以为 input 会转成数字。\n- `3 4` 是以为 print 会补空格，这里只有一个参数。\n- `'34'` 带了引号，print 不显示字符串的引号。\n\n坑：这比报错更阴——不抛异常，结果却完全不对。实测改成 `int(a) + int(b)` 才得 7。\n\n记忆点：input 一律给 str；`+` 遇到 str 就是接起来。"}, "py114": {"detail": "`sep` 和 `end` 是两个独立参数，可以同时写：`sep` 管这次调用里参数之间，`end` 管这次调用结束时补什么。\n\n推导：第一行两个参数 `1`、`2` 用 `+` 连接得 `1+2`，结尾不换行而是补 `=`，屏幕上是 `1+2=`；第二行接着打印 3 并换行，合起来 `1+2=3`。\n\n- `1+2= 3` 是以为第二行前面会自动补空格。\n- `1+2` 是忽略了 end 里的 `=`。\n- 多一个空行是又把 end 想回了默认换行。\n\n坑：两行能拼成一行，靠的是第一行没换行；只要第一行用了默认 end，后面就接不上。\n\n记忆点：sep 在中间，end 在末尾，互不干扰，可同时用。"}, "py115": {"detail": "`input()` 返回 str，`age + 1` 就是 `'20' + 1`：字符串和整数之间没有定义 `+`，直接抛异常。\n\n实测报 `TypeError: can only concatenate str`，并指出 int 不能拼到 str 上——`+` 只允许 str 和 str 拼接。\n\n- `21` 是以为 input 会自动转数字。\n- `age: 21` 是把提示符也算进了结果。\n- 选 ValueError 是把「类型不匹配」错当成「值不对」。\n\n坑：ValueError 和 TypeError 要分清：`int('abc')` 是类型对、值不对，报 ValueError；`'20' + 1` 是类型不匹配，报 TypeError。修法是 `int(input('age: ')) + 1`。\n\n记忆点：str 加 int 必 TypeError；读数字就在读入那行转型。"}, "py116": {"detail": "`/` 是真除（true division）：只要用了 `/`，结果类型一定是 float，即使除得尽也一样。\n\n推导：两个输入都先用 `int()` 转成整数 12 和 5，`12 / 5` 得 `2.4`，print 输出 `2.4`。\n\n- `2` 是把它当成了整除，整除要写 `//`。\n- `2.0` 是把 12 ÷ 5 当成了 12 ÷ 6。\n- `2.5` 是算错了，12 ÷ 5 = 2.4。\n\n坑：`4 / 2` 得 `2.0` 而不是 `2`；`/` 永远不会给你 int。想整除用 `//`，但它在负数上向下取整：实测 `-7 // 2` 得 `-4`。\n\n记忆点：`/` 出 float，`//` 出整数并向下取整，`%` 出余数。"}, "py117": {"detail": "`print('Hi,', name)` 是两个参数：第一个字符串本身以逗号结尾，第二个是 name 的值。\n\nprint 在两个参数之间补一个默认空格，所以是 `Hi,` 加空格再加 `Tom`，输出 `Hi, Tom`。\n\n- `Hi,Tom` 是用 `+` 拼接的结果，实测 `print('Hi,' + name)` 就是它，少一个空格。\n- `Hi, 'Tom'` 是以为 print 会带引号，print 不显示字符串的引号。\n- `Hi, name` 是把变量名当成了字面量。\n\n坑：`print('Hi, ' + name)` 自己带空格也得到 `Hi, Tom`，两种写法结果一样，但 `'Hi,' + name` 就差一个字符。\n\n记忆点：逗号分隔的参数之间有空格；`+` 拼接不产生任何额外字符。"}, "py118": {"detail": "`b = a` 不复制列表，只是给同一个对象又贴了一个名字（别名）。\n\n推导：`a = [1, 2]` 建列表；`b = a` 后两个名字指向同一块内存；`b.append(3)` 是原地修改，改的就是那个列表本身；再打印 a，看到 `[1, 2, 3]`。\n\n- `[1, 2]` 是以为赋值会复制一份。\n- `[3]` 是把 append 当成了替换整个列表。\n- `[1, 2, 3]` 是正确答案，说明改的是共享对象。\n\n坑：想独立得写 `b = a.copy()`、`b = a[:]` 或 `b = list(a)`，实测这三种都得到 `[1, 2] [1, 2, 3]`。\n\n记忆点：`=` 只加名字，`append` 改对象；要真复制，显式 copy。"}, "py119": {"detail": "四个选项都是「先给 b 起名，再 append(3)」，差别只在第一步是别名还是复制。\n\n题面问的是「执行完之后 a 会不会变」，所以关键只看 append 改的是谁的内存。\n\n- `b = a` 是别名，`b.append(3)` 改的就是 a，a 变 `[1, 2, 3]`，这是唯一符合题意的。\n- `b = a[:]` 用切片造新列表，实测 a 仍是 `[1, 2]`。\n- `b = a.copy()` 与切片等价，也是浅复制。\n- `b = list(a)` 同样新建一个列表。\n\n坑：三种复制都只复制最外层；列表里若嵌着列表，内层对象仍共享，那时得用 `copy.deepcopy`。\n\n记忆点：`=` 加名字，`[:]`、`copy()`、`list()` 造新壳。"}, "py120": {"detail": "多重赋值的顺序是死的：先把右边整个算完，再一次性赋给左边。\n\n推导：此时 b 是 2、a 是 1，右边 `(b, a + b)` 算成 `(2, 3)`，然后 a 得 2、b 得 3，输出 `2 3`。\n\n- `1 3` 是以为 a 没被更新。\n- `2 4` 是拆成两行普通赋值的结果：实测 `a = b` 后 a 已是 2，再 `b = a + b` 得 4。\n- `1 2` 是以为这行没执行。\n\n坑：这类「用旧值算新值」的更新，一旦拆成多行就必须借临时变量，否则后面的表达式读到的是已经改过的名字。\n\n记忆点：右边先冻结成元组，左边再落位；一行写对，拆行必错。"}, "py121": {"detail": "字符串不可变：`x + 'd'` 不改原来的 `'abc'`，而是造一个新字符串 `'abcd'`，再让 x 指过去。\n\n推导：`x = 'abc'` 建串；`y = x` 让 y 也指向它；`x = x + 'd'` 只给 x 换标签；打印 y 仍是 `abc`。\n\n- `abcd` 是以为 `+` 会原地改。\n- `abc` 才对，y 的标签始终没动过。\n- `NameError` 不成立，y 早就绑好了。\n\n坑：这题和列表 append 那题看着像、结果相反；判断依据是「重新赋值」还是「原地修改」。可变对象原地改会连带，不可变对象只能重新赋值。\n\n记忆点：str 不可变，`+` 造新对象；名字换了，别人不受影响。"}, "py122": {"detail": "`a = b = c = 0` 是链式赋值，从右往左执行：先把 0 赋给 c，再把同一个 0 赋给 b，最后给 a。三个名字都指向同一个 0 对象（实测 `id` 相同）。\n\n但名字之间没有绑定关系，`b = 5` 只是给 b 换标签，a 和 c 还指着 0，所以输出 `0 5 0`。\n\n- `5 5 5` 是以为链式赋值把三个变量绑成一体。\n- `0 0 0` 是以为 `b = 5` 没生效。\n- `0 5 5` 是以为 c 也跟着 b 走。\n\n坑：若初值是可变对象，比如 `a = b = [0]`，`a.append(1)` 会连带 b——实测是 `[0, 1] [0, 1]`，因为改的是共享对象。\n\n记忆点：链式赋值是多个名字各贴一次，不是一根绳上的蚂蚱。"}, "py123": {"detail": "本题考概念，四个选项各代表一种常见误解；判断标准只有一个：名字和对象是多对一，赋值是贴标签而不是复制。\n\n选项不是代码而是四句断言，逐句对照这套模型判断真假即可。\n\n- 说「重新赋值会连带改掉其他名字」——错，重新赋值只动被赋的那个名字。\n- 说「多个名字指向同一对象，改其中一个名字不影响其他名字」——对，这是答案。\n- 说「变量里存的是值本身，赋值一定复制」——错，变量只存引用。\n- 说「同一对象只能有一个名字」——错，别名可以任意多。\n\n坑：会被连带的是对可变对象的原地修改（`append`、`+=`），不是重新赋值，两者要分开。验证办法是比 `id()`，相同就是同一个对象。\n\n记忆点：名字多对一，赋值换标签，修改才动对象。"}, "py125": {"detail": "Python 的名字区分大小写，`age` 和 `Age` 是两个互不相干的变量，各自独立绑定。\n\n推导：`age = 20`、`Age = 30`，两次赋值互不覆盖；`print(age + Age)` 就是 20 + 30，输出 50。\n\n- `30` 是以为第二次赋值覆盖了第一次。\n- `20` 是反过来只取了一个。\n- `NameError` 不成立，两个名字都定义过。\n\n坑：`Total`、`total`、`TOTAL` 同文件共存不会报错，但读代码的人极易看错；区分大小写不等于应该靠大小写区分。\n\n记忆点：大小写不同就是两个名字；风格统一比能跑更重要。"}, "py126": {"detail": "`True`、`False`、`None` 在 Python 3 里是关键字，不是普通变量，语法层面就不允许当赋值目标。\n\n实测 `True = 0` 报 `SyntaxError: cannot assign to True`，`None = 1` 同样被拦。语法错误发生在解析阶段，程序连第一行都跑不起来。\n\n- 「True 变成 0」是把关键字当成普通名字。\n- 「正常运行」不成立，解析就失败。\n- `NameError` 是运行时找不到名字，这里是语法阶段就被拒绝。\n\n坑：想临时改「真」的含义只能另起名字，比如 `flag = 0`；覆盖内置名（`print`）可以，覆盖关键字不行。\n\n记忆点：True/False/None 是关键字，赋值即 SyntaxError。"}, "py127": {"detail": "关键字判断逐字符比较，只有小写 `for` 才是关键字，`For`、`FOR`、`_for` 都不是。\n\n实测 `for = 1` 报 `SyntaxError: invalid syntax`；另外三个都能正常赋值，打印出来是 `1 1 1`。\n\n- `For = 1` 合法，只是风格很差。\n- `FOR = 1` 合法，全大写通常留给常量。\n- `_for = 1` 合法，下划线开头不算关键字。\n- 只有小写 `for` 被保留。\n\n坑：能跑不代表该写，`For` 和 `for` 混用会让人一眼看漏；判断关键字时大小写必须完全一致。\n\n记忆点：关键字表全小写，改个大小写能逃过检查，但逃不过评审。"}, "py128": {"detail": "逐个按三条规则验：字母数字下划线组成、不数字开头、不撞关键字。\n\n题面要求「两个都合法」，只要有一个违规，整组就出局。\n\n- `_a` 和 `a1`：下划线开头合法，字母后跟数字也合法，两个都行，是答案。\n- `1a`：数字开头，实测 `SyntaxError: invalid decimal literal`。\n- `a-b`：`-` 是减号，会被当成表达式 `a - b`，是运算不是名字。\n- `class`：关键字，赋值即语法错误。\n\n坑：`a1` 合法而 `1a` 不合法，说明「含数字」和「以数字开头」是两回事；下划线开头（`_a`、`__x`）完全合法，常表示内部使用。\n\n记忆点：数字可以出现在中间和结尾，就是不能打头。"}, "py129": {"detail": "`input = 5` 语法上完全允许，它把内置函数 input 这个名字盖掉了：从此 `input` 就是一个整数。\n\n推导：`print(input + 1)` 输出 6（5 + 1）；`input('n: ')` 等于 `5('n: ')`，整数不可调用，报 `TypeError: 'int' object is not callable`。\n\n- 「正常读入一个数」是以为内置函数还在。\n- 「TypeError」才对，而且前面的 6 已经打印出来了。\n- SyntaxError 不成立，覆盖内置名合法。\n- NameError 也不对，名字存在，只是指向整数。\n\n坑：错误埋在后面，程序前半段照跑，最难查；print、input、list、sum 这些内置名都别当变量名。\n\n记忆点：内置名可以被覆盖，覆盖后功能就没了；语法拦不住这种错。"}, "py130": {"detail": "这种「全小写加下划线分隔单词」的风格叫 snake_case（蛇形命名），Python 的变量名和函数名都用它。\n\n`student_name` 拆成 `student` 和 `name` 两个词，中间一个下划线，读起来像一句话，这是它被选为默认风格的原因。\n\n- PascalCase（大驼峰）是类名，如 `StudentRecord`。\n- camelCase（小驼峰）在 Python 里基本不用。\n- 常量全大写加下划线，如 `MAX_SIZE`。\n\n坑：风格不影响运行，只影响可读性；同一个项目混用三种风格，别人读代码要多花时间。\n\n记忆点：变量函数 snake_case，类 PascalCase，常量 UPPER_CASE。"}, "py131": {"detail": "Python 没有真正的常量机制，`MAX_SIZE = 100` 只是一个普通变量，全大写是写给读代码的人看的约定。\n\n所以再写 `MAX_SIZE = 200` 完全合法，实测打印出来是 200，不报错、不警告。\n\n- 「报错：常量不能修改」是把别的语言（如 C 的 const）的规则搬过来了。\n- 「MAX_SIZE 保持 100」不成立，重新赋值就是覆盖。\n- 「SyntaxError」也不对，语法完全合法。\n\n坑：解释器不保护，只能靠约定加代码评审；真要只读，可以用 `enum`、只读属性或冻结的数据结构。\n\n记忆点：全大写等于「请别改」，不是「不能改」；Python 信任程序员。"}, "py132": {"detail": "`0.1` 和 `0.2` 在二进制浮点里都存不准，它们只是最接近的近似值；相加后误差累积，结果是 `0.30000000000000004`。\n\n所以 `0.1 + 0.2 == 0.3` 是 False，实测确认。这不是 Python 的 bug，任何用 IEEE 754 双精度的语言都一样。\n\n- `0.3` 是数学直觉，不是计算机结果。\n- `0.30000000000000004` 才是 print 出来的原文，末位是 4。\n- `0.3000000000000004` 少一个 0，位数必须精确。\n\n坑：判断浮点相等要写 `abs(a - b) < 1e-9`（实测为 True），或先 `round(x, 10)`；金额计算用 `decimal.Decimal`。\n\n记忆点：浮点是近似值，别用 `==` 比；要容差，要精确就用 Decimal。"}, "py133": {"detail": "`int()` 对浮点数做的是「向零截断」：小数部分全部砍掉，方向朝 0，不是朝负无穷。\n\n`int(-3.9)` 砍掉 `.9` 得 `-3`——注意是 -3 而不是 -4，因为 -3 离 0 更近。\n\n- `-4` 是「向下取整」（floor）的结果，实测 `math.floor(-3.9)` 得 -4、`-3.9 // 1` 得 -4.0。\n- `-3.9` 是以为 int 只换类型不换值。\n- `ValueError` 不会出现，-3.9 是合法数值。\n\n坑：正数时截断和向下取整结果一样，一到负数就分道扬镳；`round(-3.9)` 又是第三个数 -4。\n\n记忆点：int 朝 0 砍，floor 朝下走，round 看奇偶；三个别混。"}, "py134": {"detail": "`bool()` 对字符串只看一件事：空不空。空串是 False，任何非空字符串都是 True。\n\n`'False'` 有 5 个字符，属于非空，所以是 True——bool 不看内容像不像布尔值。\n\n- 选 False 是把字符串内容当成了布尔含义。\n- 选 0 是以为 bool 返回数字，它返回 True/False。\n- ValueError 不会出现，任何对象都能转 bool。\n\n坑：为假的只有 0、0.0、空串、空列表、空字典、空集合、空元组、None 和 False；`'0'`、`' '`、`'False'` 全为真，实测确认。\n\n记忆点：字符串只认长度，不认内容；`'False'` 是真，`''` 才是假。"}, "py135": {"detail": "`/` 在 Python 3 里是真除，结果类型固定是 float，跟能不能整除无关。\n\n`4 / 2` 数学上得 2，但类型仍是 float，所以 print 输出 `2.0`，末尾的 `.0` 不会省。\n\n- `2` 是以为除得尽就返回 int。\n- `2.5` 是算错了。\n- `0.5` 是把 4 和 2 的位置弄反了。\n\n坑：想得到整数用 `//`，`4 // 2` 得 2；但 `//` 对负数是向下取整，实测 `-3 // 2` 得 `-2`，不是 -1。\n\n记忆点：`/` 必出 float，`//` 出整数并向下取整；看到 `.0` 就是真除的痕迹。"}, "py136": {"detail": "`==` 比的是值，不是类型；但两边类型差太远、又没有定义跨类型比较时，结果就是 False，而不是报错。\n\n推导：`3 == 3.0` 里 int 和 float 可以按数值比，3 等于 3.0，得 True；`'3' == 3` 一边 str 一边 int，没有相等关系，得 False。输出 `True False`。\n\n- `True True` 是以为字符串 `'3'` 会自动转数字。\n- `False False` 是以为类型不同就一定不等。\n- `True False` 才对，注意它不抛异常。\n\n坑：不报错所以难查，`input()` 读进来的 `'3'` 和 `3` 比会永远 False；真要比先转型。\n\n记忆点：`==` 看值不看壳，但壳差太远就只给 False。"}, "py137": {"detail": "Python 3 的 `round()` 用的是「四舍六入五成双」（银行家舍入）：正好落在 .5 时，结果取最近的偶数。\n\n推导：`round(2.5)` 的 2 和 3 距离一样，选偶数的 2；`round(3.5)` 选偶数的 4。所以是 `2 4`。\n\n- `3 4` 是「遇 5 就进」的直觉。\n- `2 3` 是「遇 5 就舍」。\n- `2 4` 才对，实测 `round(0.5)` 是 0、`round(1.5)` 是 2、`round(-2.5)` 是 -2。\n\n坑：只有恰好 .5 才看奇偶，`round(9.8)` 照样是 10；`round(x, 2)` 保留两位也遵循同一规则，做报表和金额要留意。\n\n记忆点：round 不是四舍五入；.5 时向偶数靠。"}, "py138": {"detail": "`*` 是运算符重载：左边是 str 时表示重复，左边是数字时才是乘法。\n\n推导：`'5' * 2` 把字符串 `'5'` 复制两遍得 `'55'`；`int('5') * 2` 先转成整数 5 再乘 2 得 10。输出 `55 10`。\n\n- `10 10` 是以为字符串会自动转数字。\n- `55 55` 是以为第二个也走重复。\n- `10 55` 是把两个参数的位置看反了。\n\n坑：`'5' + '2'` 得 `'52'`（拼接），`'5' + 2` 直接 TypeError；`*` 能容忍 str 和 int，`+` 不能——同样像算术，行为完全不同。\n\n记忆点：先看类型再算；输入来的数字不转型，`*` 就是复制。"}};
  [window.QB.py, window.QB.c, window.QB.ref].forEach(function(b){
    if(!b) return;
    b.q.forEach(function(q){ if(P[q.id]){ q.detail = P[q.id].detail; if(P[q.id].why) q.why = P[q.id].why; } });
  });
})();

</script>
<script>
/* ============================================================
   多题库引擎：Python / C 语言 / 册子原题
   ============================================================ */
const QB = window.QB || {};
const BV = 'BV1dr4y1n7vA';
const BILINK = p => 'https://www.bilibili.com/video/' + BV + '/?p=' + p;

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc = s => String(s).replace(/[&<>"']/g, c => ESC[c]);
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const norm = s => String(s).trim().toLowerCase()
  .replace(/[\u201c\u201d\u300c\u300d]/g, '"').replace(/[\u2018\u2019]/g, "'")
  .replace(/[\uff0c\u3001]/g, ',').replace(/\uff1a/g, ':').replace(/\uff1b/g, ';')
  .replace(/\uff08/g, '(').replace(/\uff09/g, ')').replace(/\u3010/g, '[').replace(/\u3011/g, ']')
  .replace(/[\s\u00a0]+/g, '')
  .replace(/^['"]+|['"]+$/g, '')
  .replace(/\u3002+$/g, '');
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function sampleSpread(pool, n) {
  const by = {};
  pool.forEach(q => { (by[q.ch] = by[q.ch] || []).push(q); });
  let out = shuffle(Object.keys(by).map(k => shuffle(by[k])[0])).slice(0, n);
  if (out.length < n) {
    const rest = shuffle(pool.filter(q => out.indexOf(q) < 0));
    out = out.concat(rest.slice(0, n - out.length));
  }
  return shuffle(out);
}

/* ---------- 存储 ---------- */
const LS_LAST = k => 'pyquiz.v3.last.' + k;
const LS_SESS = k => 'pyquiz.v3.session.' + k;
function readLS(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } }
function writeLS(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
function dropLS(key) { try { localStorage.removeItem(key); } catch (e) {} }

/* ---------- 掌握记录：答对次数 / 已删除 ---------- */
const LS_MEM = k => 'pyquiz.v4.mem.' + k;
const MEM = {};
function mem(bank) {
  bank = bank || cur;
  if (!MEM[bank]) {
    const o = readLS(LS_MEM(bank)) || {};
    MEM[bank] = { st: o.st || {}, del: o.del || [], seeded: !!o.seeded };
  }
  return MEM[bank];
}
function saveMem(bank) { writeLS(LS_MEM(bank || cur), mem(bank)); }
function hitsOf(id) { return mem().st[id] || 0; }
function isDel(id) { return mem().del.indexOf(id) >= 0; }
function bump(id, ok) {
  if (!ok) return hitsOf(id);
  const m = mem();
  m.st[id] = (m.st[id] || 0) + 1;
  saveMem();
  return m.st[id];
}
function skipIdsOf(bank) {
  const m = mem(bank || cur);
  const ids = Object.keys(m.st).filter(k => m.st[k] >= 2 && m.del.indexOf(k) < 0);
  const bankQ = (QB[bank || cur] || {}).q || [];
  const have = new Set(bankQ.map(q => q.id));
  return ids.filter(k => have.has(k));
}

/* 把旧版的「最近一次成绩」换算成答对次数（只在上次做满全库时可用） */
function seedMem() {
  const m = mem('py');
  if (m.seeded) return;
  const last = readLS(LS_LAST('py'));
  if (last && last.total === 103 && QB.py) {
    const wrong = new Set(last.wrong || []);
    const have = new Set(QB.py.q.map(q => q.id));
    for (let i = 1; i <= 103; i++) {
      const id = 'q' + String(i).padStart(2, '0');
      if (!have.has(id)) continue;
      if (m.st[id] == null) m.st[id] = wrong.has(id) ? 0 : 1;
    }
  }
  m.seeded = true;
  saveMem('py');
}


function migrateV1() {
  try {
    if (!localStorage.getItem(LS_LAST('py'))) {
      const o = localStorage.getItem('pyquiz.v1');
      if (o) localStorage.setItem(LS_LAST('py'), o);
    }
    if (!localStorage.getItem(LS_SESS('py'))) {
      const s = localStorage.getItem('pyquiz.v1.session');
      if (s) localStorage.setItem(LS_SESS('py'), s);
    }
  } catch (e) {}
}

/* ---------- 当前题库 ---------- */
let cur = 'py';
let st = null;
const SELS = {};
const ORDER = ['py', 'c', 'fix', 'ref'];

const B = () => QB[cur].q;
const C = () => QB[cur].ch;
const chKeys = () => Object.keys(C()).map(Number).sort((a, b) => a - b);
const countCh = n => B().filter(q => q.ch === n).length;

function initSel() {
  ORDER.forEach(k => { if (QB[k]) SELS[k] = new Set(Object.keys(QB[k].ch).map(Number)); });
}
const sel = () => SELS[cur];
function poolNow() { return B().filter(q => sel().has(q.ch) && !isDel(q.id)); }
function wrongPool() {
  const l = readLS(LS_LAST(cur));
  const w = new Set((l && l.wrong) || []);
  return B().filter(q => w.has(q.id) && !isDel(q.id));
}

/* ---------- 会话 ---------- */
function saveSession() {
  if (!st || st.bank !== cur) return;
  try {
    const done = Math.min(st.res.length, st.pool.length);
    if (done >= st.pool.length) { dropLS(LS_SESS(cur)); return; }
    writeLS(LS_SESS(cur), {
      mode: st.mode, elapsed: Date.now() - st.t0,
      pool: st.pool.map(q => q.id),
      res: st.res.slice(0, done).map(r => ({ id: r.q.id, ok: r.ok, score: r.score, skip: r.skip, given: r.given }))
    });
  } catch (e) {}
}
function readSession(k) {
  try {
    const o = readLS(LS_SESS(k || cur));
    if (!o || !Array.isArray(o.pool)) return null;
    const bank = QB[k || cur].q;
    const pool = o.pool.map(id => bank.find(q => q.id === id)).filter(Boolean);
    if (!pool.length) return null;
    const res = (o.res || []).map(r => {
      const q = bank.find(x => x.id === r.id);
      return q ? { q, ok: !!r.ok, score: typeof r.score === 'number' ? r.score : (r.ok ? 1 : 0), skip: !!r.skip, given: r.given || '' } : null;
    }).filter(Boolean);
    if (res.length >= pool.length) return null;
    return { mode: o.mode || 'full', elapsed: o.elapsed || 0, pool, res };
  } catch (e) { return null; }
}

/* ---------- 通用工具 ---------- */
function easeTarget() { return document.getElementById('ov'); }
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2000);
}
function shake() {
  const m = $('#modal');
  m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake');
}
function storageOK() {
  try { localStorage.setItem('__probe', '1'); localStorage.removeItem('__probe'); return true; }
  catch (e) { return false; }
}
function pctColor(p) { return p >= 85 ? '#16a34a' : p >= 60 ? '#f59e0b' : '#dc2626'; }
function fmtNum(n) {
  const v = Math.round(Number(n) * 10) / 10;
  return Number.isInteger(v) ? String(v) : v.toFixed(1);
}

/* 把纯文本解析渲染成段落 / 列表（支持 `code`、以 "- " 开头的要点） */
function rich(s) {
  const lines = String(s).split(/\n/);
  let out = '', buf = [], inUl = false;
  const flushP = () => { if (buf.length) { out += '<p>' + fmt(buf.join(' ')) + '</p>'; buf = []; } };
  const closeUl = () => { if (inUl) { out += '</ul>'; inUl = false; } };
  lines.forEach(raw => {
    const line = raw.trim();
    if (!line) { flushP(); closeUl(); return; }
    if (line.indexOf('- ') === 0) {
      flushP();
      if (!inUl) { out += '<ul class="dl">'; inUl = true; }
      out += '<li>' + fmt(line.slice(2)) + '</li>';
      return;
    }
    closeUl(); buf.push(line);
  });
  flushP(); closeUl();
  return out;
}


/* ---------- 标签页 ---------- */
function renderTabs() {
  $('#tabs').innerHTML = ORDER.filter(k => QB[k]).map(k => {
    const b = QB[k];

function startIds(ids, mode) {
