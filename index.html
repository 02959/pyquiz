      q: "外层 `if (x > 0)` 里套了一层 `if (x > 10)`，x=5 时那个 `else` 会配给谁？",
      opts: ["外层 if", "内层 if", "编译错误", "两个都配"], ans: 1,
      why: "else 与最近的、还没配对的 if 配对——也就是内层的 `if (x > 10)`。x=5 时外层为真进入内层，内层 `5 > 10` 为假，于是执行 else，打印 small。"
    },
    {
      id: "ra07", ch: 1, topic: "A7 分号的位置", sec: "P29", p: 29, type: "choice",
      q: "`if ( ... );` 后面多写了一个分号，后面的 `total = amount;` 还会受 if 控制吗？",
      opts: ["会，条件成立才执行", "不会，会无条件执行", "编译错误", "不确定"], ans: 1,
      why: "那个分号让 if 控制了一条空语句，下面的赋值与 if 无关，无条件执行。去掉分号，total 才可能是 0。顺手的习惯：一律加大括号。"
    },
    {
      id: "ra08", ch: 1, topic: "A8 switch 的穿透", sec: "P32", p: 32, type: "choice",
      q: "`case 2` 里没有 break，执行完会怎样？",
      opts: ["只执行 case 2", "接着往下执行 case 3 的语句", "编译错误", "跳出 switch"], ans: 1,
      why: "switch 跳到 case 2 后一路往下执行，先打印 B 再打印 C，遇到 break 才跳出，所以输出 BC。反过来，穿透也能故意用：`case 10: case 9:` 共用一段代码。"
    },
    {
      id: "ra09", ch: 1, topic: "A9 while 与 do-while", sec: "P34/P35", p: 34, type: "choice",
      q: "关于 while 和 do-while，下面哪句是对的？",
      opts: ["两者都至少执行一次循环体", "while 至少执行一次，do-while 可能一次都不执行", "do-while 至少执行一次，while 可能一次都不执行", "两者完全等价"], ans: 2,
      why: "while 先判断后执行，条件一开始就不成立时循环体一次也不跑；do-while 先执行后判断，循环体至少跑一遍。所以「数位数」用 do-while 时，输入 0 也能得到 1 位。"
    },
    {
      id: "ra10", ch: 1, topic: "A10 复合赋值", sec: "P20", p: 20, type: "choice",
      q: "`total *= sum + 12;` 等价于下面哪个？",
      opts: ["total = total * sum + 12;", "total = total * (sum + 12);", "total = total * sum + total * 12;", "total = (total * sum) + 12;"], ans: 1,
      why: "复合赋值把右边整体先算完再与左边结合，相当于自带括号，所以是 `total = total * (sum + 12)`。"
    },
    {
      id: "ra11", ch: 1, topic: "A11 自增运算符", sec: "P20", p: 20, type: "choice",
      q: "`printf(\"%d\", a++);` 之后又打印了一次 a，输出和 a 的值分别是？",
      opts: ["输出 10，a 变成 11", "输出 11，a 变成 11", "输出 10，a 还是 10", "输出 11，a 变成 12"], ans: 0,
      why: "后缀 `a++` 的值是加 1 之前的值（10），但变量 a 本身确实加了 1（变成 11）。前缀 `++a` 才是「先加 1，再用加完的值」。"
    },
    {
      id: "ra12", ch: 1, topic: "A12 scanf 的格式串", sec: "P14/P22", p: 14, type: "choice",
      q: "想让用户输入两个整数，下面哪个写法是对的？",
      opts: ["scanf(\"请输入%d %d\", &a, &b);", "scanf(\"%d,%d\", &a, &b);（用户输入 1 2）", "scanf(\"%d %d\", &a, &b);", "scanf(\"%d %d\", a, b);"], ans: 2,
      why: "A 的格式串里写了中文，要求用户真的敲出「请输入」；B 的格式串里是逗号，用户得输入 1,2；D 漏了 &，会把读到的值写到无效地址。只有 C 对。提示语要用 printf 输出。"
    },
    {
      id: "rc01", ch: 2, topic: "C25 if 后面多了一个分号", sec: "P29", p: 29, type: "choice",
      q: "`if ( score >= 60 );` 然后 `printf(\"pass\");`，这段代码的问题是？",
      opts: ["if 后面多了分号，printf 变成无条件执行", "printf 少了参数", "大括号不配对", "score 没定义"], ans: 0,
      why: "`if (...);` 让 if 控制一条空语句，printf 变成无条件执行，不管多少分都打印 pass。改法：删掉分号，并养成一律加大括号的习惯。"
    },
    {
      id: "rc02", ch: 2, topic: "C26 scanf 漏了 &", sec: "P13/P14", p: 14, type: "choice",
      q: "`scanf(\"%d %d\", a, b);` 这段代码的问题是？",
      opts: ["scanf 少了两个 &", "scanf 格式串写错", "变量没有初始化", "printf 少了换行"], ans: 0,
      why: "`&` 是取地址，告诉 scanf 把读到的值放到哪里。漏了它，scanf 会往无效地址写，程序可能崩溃或读到垃圾值。正确写法是 `scanf(\"%d %d\", &a, &b);`。"
    },
    {
      id: "rc03", ch: 2, topic: "C27 死循环漏了 x /= 10", sec: "P34", p: 34, type: "choice",
      q: "`while ( x > 0 ) { n++; }` 直接数位数，问题在哪？",
      opts: ["死循环，漏了 x /= 10;", "while 条件写反了", "x 没有初始化", "n 没有初始化"], ans: 0,
      why: "循环体里没有任何语句改变 x，`x > 0` 永远成立，程序永远出不来，在 PAT 上表现为「运行超时」。循环体里必须有机会改变循环条件。"
    },
    {
      id: "rc04", ch: 2, topic: "C28 case 漏 break", sec: "P32", p: 32, type: "choice",
      q: "`case 2` 里的 printf 后面忘了 break，会怎样？",
      opts: ["输出 BC（穿透到 case 3）", "只输出 B", "编译错误", "跳到 default"], ans: 0,
      why: "没有 break 就继续往下穿透执行 case 3，所以输出 BC。如果本意只输出 B，case 2 的 printf 后面要加 `break;`。"
    },
    {
      id: "rc05", ch: 2, topic: "C29 大括号不配对", sec: "P28/P29", p: 28, type: "choice",
      q: "`if ( a > b ) { max = a; else { max = b; }` 报 expected '}' before 'else'，原因是？",
      opts: ["if 的 { 没有对应的 }", "else 前面不能有 }", "if 条件缺括号", "max 未定义"], ans: 0,
      why: "if 的 `{` 没有对应 `}`，else 前面又是 `{` 没有闭合。正确写法是每个分支各自成对：`if (a > b) { max = a; } else { max = b; }`。"
    },
    {
      id: "rc06", ch: 2, topic: "C30 类型截断 + 逻辑不完整", sec: "P23/P16", p: 23, type: "choice",
      q: "把身高从厘米换算成英尺，`int foot = cm / 30.48;` 之后只 printf 了 foot，问题是什么？",
      opts: ["只输出了英尺、漏了英寸，且 cm/30.48 赋给 int 会截断", "cm 必须定义成 int", "30.48 应该写成 30", "printf 的格式符用错了"], ans: 0,
      why: "`cm / 30.48` 是 double 运算，赋给 int 会截断（170/30.48 ≈ 5.577 → 5），得到英尺数 5；但题目要求「几英尺几英寸」，还得算 `inch = (cm/30.48 - foot) * 12`，约等于 7。完整答案是 5 英尺 7 英寸。"
    },
    {
      id: "rd01", ch: 3, topic: "D31 三个数的最大值", sec: "P30", p: 30, type: "fill",
      q: "输入 `4 5 6`，用嵌套 if 求三个数的最大值，输出什么？",
      a: ["6"],
      why: "先用 a>b 分成两支，各支里再和 c 比：a 不大于 b，进 else 那支，再看 b 是否大于 c——5 不大于 6，所以 max 取 c=6。每个分支都要给 max 赋值，不能有漏网的情况。"
    },
    {
      id: "rd02", ch: 3, topic: "D32 数位数", sec: "P34", p: 34, type: "fill",
      q: "输入 `352`，输出它的位数（用 while 或 do-while 数位数），输出什么？",
      a: ["3"],
      why: "352→35→3→0，分别 n=1、2、3，退出时 n 是 3。用 do-while 写的话，输入 0 也能得到 1 位，while 版要额外判断 0。"
    },
    {
      id: "rd03", ch: 3, topic: "D33 统计个数与平均数", sec: "P37", p: 37, type: "fill",
      q: "读入正整数直到 -1 结束，依次输出个数、总和、平均数（保留 2 位小数）。输入 `1 2 3 4 -1`，输出什么？",
      a: ["4 10 2.50", "4 10 2.5"],
      why: "个数 4、总和 10；平均数必须写成 `1.0 * sum / count`，否则整数除法得 2，`%.2f` 输出 2.00。三个坑：循环体里要再 scanf 一次、用 1.0* 防整数除法、没输入时 sum/count 会除以 0。"
    },
    {
      id: "rd04", ch: 3, topic: "D34 逆序输出（两种要求）", sec: "P38", p: 38, type: "multi",
      q: "输入 `700`，逆序输出。两种处理方式结果不同：",
      parts: [
        { type: "fill", q: "情况一：当数值处理（用 ret = ret*10 + x%10 累积），输出什么？", a: ["7"], why: "ret 是数值，末尾的 0 在整数里不存在，所以是 7 而不是 007。" },
        { type: "fill", q: "情况二：当字符串处理（每取一位就直接 printf），输出什么？", a: ["007"], why: "边取边输出，每一位都打印出来，所以 0 也留着，得到 007。" }
      ],
      why: "区别就在「攒到最后输出」还是「边取边输出」：前者是数值，前导 0 会消失；后者是字符流，0 保留。",
      sec: "P38", p: 38
    },
    {
      id: "rd05", ch: 3, topic: "D35 分段函数", sec: "P31", p: 31, type: "fill",
      q: "分段函数：x<0 得 -1，x=0 得 0，x>0 得 2x。输入 `3`，输出什么？",
      a: ["6"],
      why: "用级联 if-else：`if (x < 0) f = -1; else if (x == 0) f = 0; else f = 2 * x;`，最后只 printf 一次。x=3 走最后一支，得 6。"
    }
  ]
};

</script>
<script>
/* ============================================================
   多题库引擎：Python / C 语言 / 册子原题
   ============================================================ */
const QB = window.QB || {};
const BV = 'BV1dr4y1n7vA';
const BILINK = p => 'https://www.bilibili.com/video/' + BV + '/?p=' + p;

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc = s => String(s).replace(/[&<>"']/g, c => ESC[c]);
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const norm = s => String(s).trim().toLowerCase()
  .replace(/[\u201c\u201d\u300c\u300d]/g, '"').replace(/[\u2018\u2019]/g, "'")
  .replace(/[\uff0c\u3001]/g, ',').replace(/\uff1a/g, ':').replace(/\uff1b/g, ';')
  .replace(/\uff08/g, '(').replace(/\uff09/g, ')').replace(/\u3010/g, '[').replace(/\u3011/g, ']')
  .replace(/[\s\u00a0]+/g, '')
  .replace(/^['"]+|['"]+$/g, '')
  .replace(/\u3002+$/g, '');
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function sampleSpread(pool, n) {
  const by = {};
  pool.forEach(q => { (by[q.ch] = by[q.ch] || []).push(q); });
  let out = shuffle(Object.keys(by).map(k => shuffle(by[k])[0])).slice(0, n);
  if (out.length < n) {
    const rest = shuffle(pool.filter(q => out.indexOf(q) < 0));
    out = out.concat(rest.slice(0, n - out.length));
  }
  return shuffle(out);
}

/* ---------- 存储 ---------- */
const LS_LAST = k => 'pyquiz.v3.last.' + k;
const LS_SESS = k => 'pyquiz.v3.session.' + k;
function readLS(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } }
function writeLS(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
function dropLS(key) { try { localStorage.removeItem(key); } catch (e) {} }

function migrateV1() {
  try {
    if (!localStorage.getItem(LS_LAST('py'))) {
      const o = localStorage.getItem('pyquiz.v1');
      if (o) localStorage.setItem(LS_LAST('py'), o);
    }
    if (!localStorage.getItem(LS_SESS('py'))) {
      const s = localStorage.getItem('pyquiz.v1.session');
      if (s) localStorage.setItem(LS_SESS('py'), s);
    }
  } catch (e) {}
}

/* ---------- 当前题库 ---------- */
let cur = 'py';
let st = null;
const SELS = {};
const ORDER = ['py', 'c', 'ref'];

const B = () => QB[cur].q;
const C = () => QB[cur].ch;
const chKeys = () => Object.keys(C()).map(Number).sort((a, b) => a - b);
const countCh = n => B().filter(q => q.ch === n).length;

function initSel() {
  ORDER.forEach(k => { if (QB[k]) SELS[k] = new Set(Object.keys(QB[k].ch).map(Number)); });
}
const sel = () => SELS[cur];
function poolNow() { return B().filter(q => sel().has(q.ch)); }
function wrongPool() {
  const l = readLS(LS_LAST(cur));
  const w = new Set((l && l.wrong) || []);
  return B().filter(q => w.has(q.id));
}

/* ---------- 会话 ---------- */
function saveSession() {
  if (!st || st.bank !== cur) return;
  try {
    const done = Math.min(st.res.length, st.pool.length);
    if (done >= st.pool.length) { dropLS(LS_SESS(cur)); return; }
    writeLS(LS_SESS(cur), {
      mode: st.mode, elapsed: Date.now() - st.t0,
      pool: st.pool.map(q => q.id),
      res: st.res.slice(0, done).map(r => ({ id: r.q.id, ok: r.ok, score: r.score, skip: r.skip, given: r.given }))
    });
  } catch (e) {}
}
function readSession(k) {
  try {
    const o = readLS(LS_SESS(k || cur));
    if (!o || !Array.isArray(o.pool)) return null;
    const bank = QB[k || cur].q;
    const pool = o.pool.map(id => bank.find(q => q.id === id)).filter(Boolean);
    if (!pool.length) return null;
    const res = (o.res || []).map(r => {
      const q = bank.find(x => x.id === r.id);
      return q ? { q, ok: !!r.ok, score: typeof r.score === 'number' ? r.score : (r.ok ? 1 : 0), skip: !!r.skip, given: r.given || '' } : null;
    }).filter(Boolean);
    if (res.length >= pool.length) return null;
    return { mode: o.mode || 'full', elapsed: o.elapsed || 0, pool, res };
  } catch (e) { return null; }
}

/* ---------- 通用工具 ---------- */
function easeTarget() { return document.getElementById('ov'); }
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2000);
}
function shake() {
  const m = $('#modal');
  m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake');
}
function storageOK() {
  try { localStorage.setItem('__probe', '1'); localStorage.removeItem('__probe'); return true; }
  catch (e) { return false; }
}
function pctColor(p) { return p >= 85 ? '#16a34a' : p >= 60 ? '#f59e0b' : '#dc2626'; }

/* ---------- 标签页 ---------- */
function renderTabs() {
  $('#tabs').innerHTML = ORDER.filter(k => QB[k]).map(k => {
    const b = QB[k];
    const n = b.q.length;
    return `<button class="tab${k === cur ? ' on' : ''}" data-bank="${k}">${esc(b.label)}<i>${n}</i></button>`;
  }).join('');
}

/* ---------- 首页 ---------- */
function renderHome() {
  const b = QB[cur], chs = C();
  renderTabs();

  const hero = b.hero || {};
  const isC = cur === 'c';
  const html = `
  <div class="hero">
    <div>
      <h2>${esc(hero.title || '先摸个底')}</h2>
      <p>${esc(hero.desc || '')}</p>
      <div class="kbd-hint"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> 或 <kbd>A</kbd><kbd>B</kbd><kbd>C</kbd><kbd>D</kbd> 选项 · <kbd>Enter</kbd> 确认 / 下一题${isC ? ' · <kbd>P##</kbd> 点开回看视频' : ''}</div>
    </div>
    <div class="hero-r">
      <div><b>${b.q.length}</b><span>题</span></div>
      <div><b>${chKeys().length}</b><span>章</span></div>
      <div><b>${b.q.filter(q => q.type === 'multi').length || 0}</b><span>综合</span></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-h"><h3>选范围</h3><div class="chips-ctrl"><button id="allOn">全选</button><button id="allOff">清空</button></div></div>
    <div class="chips">${chKeys().map(n => `<button class="chip${sel().has(n) ? ' on' : ''}" data-ch="${n}">${n}. ${esc(chs[n].short)}<i>${countCh(n)}</i></button>`).join('')}</div>
    <div class="resume-bar hide" id="resumeBar">
      <span>上次做到第 <b id="rb-pos">-</b> 题，已答对 <b id="rb-ok">-</b> 题</span>
      <span class="sp"></span>
      <button class="btn primary small" id="resumeBtn">继续上次 →</button>
      <button class="btn subtle small" id="discardBtn">丢弃</button>
    </div>
    <div class="startrow">
      <button class="btn primary lg" id="startBtn">开始测评</button>
      <button class="btn ghost" id="quickBtn">随机 20 题</button>
      <button class="btn ghost" id="wrongBtn">只练错题</button>
      <span class="laststat" id="laststat"></span>
    </div>
    <p class="laststat" id="storeState" style="margin:10px 2px 0"></p>
    <div class="startrow" style="margin-top:8px">
      <button class="btn subtle small" id="shareBtn">📋 复制成绩码（发给老师看薄弱点）</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-h"><h3>知识点地图</h3><span class="muted">点开看考点 · 每章可单练</span></div>
    <div>${chKeys().map(n => {
      const c = chs[n];
      return `<details class="kcard">
        <summary><span class="cn">Ch ${n}</span><span class="kt">${esc(c.name)}</span><span class="kc">${countCh(n)} 题${c.range ? ' · ' + esc(c.range) : ''}</span><i class="chev"></i></summary>
        <div class="kbody">
          <ul>${c.points.map(p => `<li>${fmt(p)}</li>`).join('')}</ul>
          <p class="pit">⚠️ ${fmt(c.pit)}</p>
          <button class="btn ghost small" data-practice="${n}">只练这一章 →</button>
        </div></details>`;
    }).join('')}</div>
  </div>`;
  $('#homeView').innerHTML = html;

  $('#title').textContent = b.label + ' 摸底测评';
  $('#subtitle').textContent = hero.sub || '';
  $('#hstat').textContent = `${b.q.length} 题 · ${chKeys().length} 章`;
  renderLast(); updateStart(); renderStoreState();
}

function renderLast() {
  const l = readLS(LS_LAST(cur));
  const el = $('#laststat');
  if (!el) return;
  if (!l) { el.textContent = '还没有记录，做完一次就会显示薄弱点'; return; }
  const d = new Date(l.ts);
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  el.textContent = `上次：${l.right}/${l.total}（${l.pct}%）· ${d.getMonth() + 1}月${d.getDate()}日 ${hm}`;
}

function renderStoreState() {
  const el = $('#storeState');
  if (!el) return;
  const ok = storageOK();
  const local = /^file:/i.test(location.protocol);
  el.style.color = ok ? '#16a34a' : '#dc2626';
  if (ok) el.textContent = '进度保存：可用 ✅ 关掉页面再打开，点「继续上次」就能接着做';
  else el.textContent = local
    ? '⚠️ 当前是用本地文件打开的，这个浏览器不允许本地文件存进度。挂个网址（https）打开即可恢复。'
    : '⚠️ 当前浏览器禁止了本地存储（可能是无痕模式），进度无法保存。';
}

function updateStart() {
  const n = poolNow().length;
  const b = $('#startBtn');
  if (!b) return;
  b.textContent = n ? `开始测评 · ${n} 题` : '先选几章';
  b.disabled = !n;
  $('#quickBtn').disabled = !n;
  const w = wrongPool().filter(q => sel().has(q.ch)).length;
  const wb = $('#wrongBtn');
  wb.disabled = !w;
  wb.textContent = w ? `只练错题 · ${w}` : '只练错题';
  renderResume();
  const sb = $('#shareBtn');
  if (sb) sb.style.display = readLS(LS_LAST(cur)) ? '' : 'none';
}

function renderResume() {
  const bar = $('#resumeBar');
  if (!bar) return;
  const s = readSession(cur);
  if (!s) { bar.classList.add('hide'); return; }
  bar.classList.remove('hide');
  $('#rb-pos').textContent = (s.res.length + 1) + ' / ' + s.pool.length;
  $('#rb-ok').textContent = s.res.reduce((a, r) => a + (r.score || 0), 0);
}

/* ---------- 开始 ---------- */
function start(mode, only) {
  let pool = (only != null) ? B().filter(q => q.ch === only) : poolNow();
  if (mode === 'quick') pool = sampleSpread(pool, Math.min(20, pool.length));
  if (mode === 'wrong') {
    const w = new Set((readLS(LS_LAST(cur)) || {}).wrong || []);
    pool = pool.filter(q => w.has(q.id));
  }
  if (!pool.length) { toast('这里没有题目，先选几章'); return; }
  st = { bank: cur, pool, i: 0, res: [], t0: Date.now(), mode, answered: false };
  saveSession();
  $('#homeView').classList.add('hide');
  $('#resultView').classList.add('hide');
  $('#ov').classList.add('show');
  renderQ();
}

function resume() {
  const s = readSession(cur);
  if (!s) { toast('没有可恢复的进度'); renderResume(); return; }
  st = { bank: cur, pool: s.pool, i: s.res.length, t0: Date.now() - (s.elapsed || 0), mode: s.mode, res: s.res.slice() };
  $('#homeView').classList.add('hide');
  $('#resultView').classList.add('hide');
  $('#ov').classList.add('show');
  renderQ();
}

/* ---------- 渲染题目 ---------- */
function partHtml(p, pi, q) {
  const label = q.type === 'multi' ? `<span class="plabel">${pi + 1}</span>` : '';
  if (p.type === 'choice') {
    return `<div class="part" data-part="${pi}">
      ${label}<p class="qtext">${fmt(p.q)}</p>
      ${p.code ? `<pre class="code"><code>${esc(p.code)}</code></pre>` : ''}
      <div class="opts">${p.opts.map((o, i) => `<div class="opt" data-part="${pi}" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span class="t">${fmt(o)}</span></div>`).join('')}</div>
      <div class="pfb" data-pfb="${pi}"></div>
    </div>`;
  }
  return `<div class="part" data-part="${pi}">
    ${label}<p class="qtext">${fmt(p.q)}</p>
    ${p.code ? `<pre class="code"><code>${esc(p.code)}</code></pre>` : ''}
    <input class="ans" data-part="${pi}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(p.ph || (q.type === 'multi' ? '填这一小题的答案…' : '填写输出结果或关键字…'))}">
    <div class="pfb" data-pfb="${pi}"></div>
  </div>`;
}

function renderQ() {
  const q = st.pool[st.i], c = C()[q.ch];
  st.answered = false; st.picks = {}; st.texts = {};
  const pct = Math.round(st.i / st.pool.length * 100);
  const multi = q.type === 'multi';
  const parts = multi ? q.parts : [{ type: q.type, q: q.q, code: q.code, opts: q.opts, ans: q.ans, a: q.a }];

  $('#modal').innerHTML = `
    <div class="m-head">
      <div class="m-crumb"><b>第 ${st.i + 1} / ${st.pool.length} 题</b><span>·</span><span>Ch ${q.ch} ${esc(c.short)}</span></div>
      <button class="x" id="quit" title="退出（Esc）">✕</button>
    </div>
    <div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="m-body">
      <div class="qmeta">
        <span class="badge ${multi ? 'multi' : q.type}">${multi ? '综合题' : q.type === 'choice' ? '单选题' : '填空题'}</span>
        <span class="topic">${esc(q.topic)}</span>
        ${q.sec ? `<span class="ver">${esc(q.sec)}</span>` : ''}
        ${q.ref ? `<button class="refchip" data-ref="${esc(q.ref)}">📎 册子原题</button>` : ''}
      </div>
      ${multi ? '' : `<p class="qtext">${fmt(q.q)}</p>${q.code ? `<pre class="code"><code>${esc(q.code)}</code></pre>` : ''}`}
      ${parts.map((p, i) => partHtml(p, i, q)).join('')}
      <div id="fb"></div>
    </div>
    <div class="m-foot">
      <button class="btn subtle" id="skip">我不会</button>
      <button class="btn primary" id="submit">确认作答</button>
    </div>`;
  bind();
  const first = $('#modal .ans');
  if (first) setTimeout(() => first.focus(), 60);
  $('#modal').scrollTop = 0;
}

function bind() {
  $$('#modal .opt').forEach(el => el.addEventListener('click', () => pick(+el.dataset.part, +el.dataset.i)));
  $$('#modal .ans').forEach(el => el.addEventListener('input', () => el.classList.remove('wrong')));
  $('#submit').addEventListener('click', () => st.answered ? next() : grade(false));
  $('#skip').addEventListener('click', () => st.answered ? next() : grade(true));
  $('#quit').addEventListener('click', quit);
  $$('#modal .refchip').forEach(el => el.addEventListener('click', () => openRef(el.dataset.ref)));
}

function pick(pi, i) {
  if (!st || st.answered) return;
  st.picks[pi] = i;
  $$(`#modal .opt[data-part="${pi}"]`).forEach((el, k) => el.classList.toggle('sel', k === i));
}

function gradePart(p, pi) {
  if (p.type === 'choice') return { ok: st.picks[pi] === p.ans, given: p.opts[st.picks[pi]] || '', resp: st.picks[pi] };
  const inp = $(`#modal .ans[data-part="${pi}"]`);
  const given = inp ? inp.value : '';
  return { ok: given.trim() !== '' && p.a.some(x => norm(x) === norm(given)), given, resp: given };
}

function grade(skip) {
  if (!st || st.answered) return;
  const q = st.pool[st.i];
  const multi = q.type === 'multi';
  const parts = multi ? q.parts : [{ type: q.type, q: q.q, opts: q.opts, ans: q.ans, a: q.a }];

  if (!skip) {
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      if (p.type === 'choice' && st.picks[i] == null) { shake(); toast('先选一个选项，或点「我不会」'); return; }
      if (p.type === 'fill') {
        const el = $(`#modal .ans[data-part="${i}"]`);
        if (el && !el.value.trim()) { el.classList.add('wrong'); el.focus(); toast('写点什么，或点「我不会」'); return; }
      }
    }
  }

  const resp = parts.map((p, i) => skip ? { ok: false, given: '', resp: null } : gradePart(p, i));
  const score = skip ? 0 : resp.filter(r => r.ok).length / parts.length;
  const ok = score === 1;
  st.res.push({ q, ok, score: skip ? 0 : (multi ? score : (ok ? 1 : 0)), skip, given: multi ? resp.map(r => r.given).join(' | ') : resp[0].given, parts: resp });
  st.answered = true;
  saveSession();
  paint(q, resp, skip, score);
}

function paint(q, resp, skip, score) {
  const parts = q.type === 'multi' ? q.parts : [{ type: q.type, q: q.q, opts: q.opts, ans: q.ans, a: q.a, why: q.why }];

  parts.forEach((p, i) => {
    const r = resp[i] || { ok: false, given: '', resp: null };
    if (p.type === 'choice') {
      $$(`#modal .opt[data-part="${i}"]`).forEach((el, k) => {
        el.classList.add('lock'); el.classList.remove('sel');
        if (k === p.ans) el.classList.add('ok');
        else if (k === r.resp) el.classList.add('bad');
        else el.classList.add('dim');
      });
    } else {
      const inp = $(`#modal .ans[data-part="${i}"]`);
      if (inp) { inp.disabled = true; inp.classList.add(r.ok ? 'right' : 'wrong'); }
    }
    const box = $(`#modal .pfb[data-pfb="${i}"]`);
    if (box && q.type === 'multi') {
      const correct = p.type === 'choice' ? p.opts[p.ans] : p.a[0];
      box.innerHTML = `<div class="fb ${r.ok ? 'ok' : (skip ? 'neutral' : 'bad')} mini">
        <div class="fb-h">${r.ok ? '✓ 对' : (skip ? '— 跳过' : '✗ 错')}</div>
        <div class="fb-row"><b>答案</b><span>${esc(correct)}</span></div>
        ${(!r.ok && p.why) ? `<div class="fb-why">${fmt(p.why)}</div>` : ''}
      </div>`;
    }
  });

  const correct = parts.map(p => p.type === 'choice' ? p.opts[p.ans] : p.a[0]);
  const lastQ = st.i === st.pool.length - 1;
  const head = q.type === 'multi'
    ? `${score === 1 ? '✓ 全部答对' : skip ? '— 这题先放过' : `✗ 对 ${Math.round(score * parts.length)} / ${parts.length} 小题`}`
    : (score === 1 ? '✓ 答对了' : skip ? '— 这题先放过' : '✗ 答错了');
  const cls = score === 1 ? 'ok' : (skip ? 'neutral' : 'bad');

  $('#fb').innerHTML = `<div class="fb ${cls}">
    <div class="fb-h">${head}</div>
    ${q.type === 'multi' ? '' : `<div class="fb-row"><b>正确答案</b><span>${esc(correct[0])}</span></div>`}
    ${(!skip && score < 1 && q.type !== 'multi' && parts[0].type === 'fill') ? `<div class="fb-row"><b>你的答案</b><span>${esc(resp[0].given)}</span></div>` : ''}
    <div class="fb-why">${fmt(q.why || '')}</div>
    <div class="fb-src">${esc(q.sec || '')}${q.p ? ` · <a class="blink" href="${BILINK(q.p)}" target="_blank" rel="noopener">🎬 回看 ${esc(q.sec)}</a>` : ''}</div>
  </div>`;

  $('#skip').style.display = 'none';
  $('#submit').textContent = lastQ ? '查看测评报告 →' : '下一题 →';
  const body = $('#modal .m-body');
  if (body) body.scrollTo({ top: body.scrollHeight, behavior: 'smooth' });
}

function next() {
  if (st.i < st.pool.length - 1) { st.i++; renderQ(); }
  else finish();
}

/* ---------- 交卷 ---------- */
function finish() {
  const secs = Math.round((Date.now() - st.t0) / 1000);
  const total = st.res.length;
  const right = st.res.reduce((a, r) => a + r.score, 0);
  const pct = total ? Math.round(right / total * 100) : 0;
  const chStat = {};
  st.res.forEach(r => {
    const n = r.q.ch;
    chStat[n] = chStat[n] || [0, 0];
    chStat[n][0] += r.score; chStat[n][1] += 1;
  });
  const rec = {
    ts: Date.now(), total, right: Math.round(right * 10) / 10, pct, secs, ch: chStat,
    wrong: st.res.filter(r => r.score < 1).map(r => r.q.id)
  };
  writeLS(LS_LAST(cur), rec);
  dropLS(LS_SESS(cur));
  const bank = cur;
  $('#ov').classList.remove('show');
  $('#homeView').classList.add('hide');
  $('#resultView').classList.remove('hide');
  renderResult(bank, st.res, secs);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- 报告 ---------- */
function renderResult(bank, res, secs) {
  const chs = QB[bank].ch;
  const by = {};
  res.forEach(r => {
    const n = r.q.ch;
    by[n] = by[n] || { t: 0, c: 0, bad: [] };
    by[n].t += 1; by[n].c += r.score;
    if (r.score < 1) by[n].bad.push(r.q);
  });
  const total = res.length;
  const right = res.reduce((a, r) => a + r.score, 0);
  const pct = total ? Math.round(right / total * 100) : 0;
  const mm = Math.floor(secs / 60), ss = secs % 60;
  const verdict = pct >= 90 ? '很稳，细节也抓得住' : pct >= 75 ? '主干懂了，丢分集中在坑上' : pct >= 55 ? '半懂：概念有印象，一写就错' : '建议先按清单回看，再测一次';

  let weakest = null;
  Object.keys(by).forEach(k => {
    const s = by[k];
    if (s.t >= 2 && (!weakest || s.c / s.t < weakest.rate)) weakest = { n: +k, rate: s.c / s.t };
  });

  const chRows = Object.keys(chs).map(Number).sort((a, b) => a - b).map(n => {
    const s = by[n]; if (!s) return '';
    const p = Math.round(s.c / s.t * 100), col = pctColor(p);
    const tags = [...new Set(s.bad.map(q => q.topic))];
    return `<div class="crow">
      <div class="crow-h"><span>${n}. ${esc(chs[n].short)}</span><b style="color:${col}">${Math.round(s.c * 10) / 10}/${s.t} · ${p}%</b></div>
      <div class="bar"><i style="width:${p}%;background:${col}"></i></div>
      ${tags.length ? `<div class="ctags">${tags.map(t => `<span>${fmt(t)}</span>`).join('')}</div>` : ''}
    </div>`;
  }).join('');

  const seen = new Set(), groups = {};
  res.filter(r => r.score < 1).forEach(r => {
    if (seen.has(r.q.topic)) return; seen.add(r.q.topic);
    (groups[r.q.ch] = groups[r.q.ch] || []).push(r.q);
  });
  const weakHtml = Object.keys(groups).length
    ? Object.keys(groups).map(k => {
      const n = +k;
      return `<div class="wk"><h4>Ch ${n} · ${esc(chs[n].name)}</h4>
        <ul>${groups[k].map(q => `<li>${fmt(q.topic)}<span>${esc(q.sec || '')}</span></li>`).join('')}</ul>
        <p>${fmt(chs[n].points.slice(0, 2).join('；'))}</p></div>`;
    }).join('')
    : '<p class="muted">这次全部答对，没有需要回看的点 ✅</p>';

  const detail = res.map((r, i) => {
    const q = r.q;
    const correct = q.type === 'multi'
      ? q.parts.map((p, k) => `${k + 1}. ${p.type === 'choice' ? p.opts[p.ans] : p.a[0]}`).join('　')
      : (q.type === 'choice' ? q.opts[q.ans] : q.a[0]);
    return `<div class="drow ${r.score === 1 ? 'ok' : 'bad'}">
      <div class="dh"><span>${i + 1}. ${esc(q.topic)}</span><i class="${r.score === 1 ? 'y' : 'n'}">${r.score === 1 ? '✓' : Math.round(r.score * 100) + '%'}</i></div>
      <div class="dq">${fmt(q.q)}${q.code ? `<pre class="code sm"><code>${esc(q.code)}</code></pre>` : ''}</div>
      <div class="da">你的答案：${esc(r.skip ? '（点了我不会）' : (r.given || '—'))}　｜　正确：${esc(correct)}</div>
      <div class="dw">${fmt(q.why || '')}</div>
    </div>`;
  }).join('');

  const wcount = res.filter(r => r.score < 1).length;
  $('#resultView').innerHTML = `
    <div class="res-hero">
      <div class="ring" style="--p:${pct};--c:${pctColor(pct)}"><div class="ring-in"><b>${pct}</b><span>%</span></div></div>
      <div>
        <h2>${verdict}</h2>
        <p>答对 <b>${Math.round(right * 10) / 10}</b> / ${total} 题　·　用时 ${mm} 分 ${String(ss).padStart(2, '0')} 秒</p>
        <p class="muted">${weakest ? `最需要补：第 ${weakest.n} 章 ${esc(chs[weakest.n].name)}（${Math.round(weakest.rate * 100)}%）` : '每章都覆盖到了'}</p>
      </div>
    </div>
    <div class="grid2">
      <div class="panel"><div class="panel-h"><h3>章节掌握度</h3><span class="muted">绿 ≥85% · 黄 ≥60% · 红 &lt;60%</span></div>${chRows}</div>
      <div class="panel"><div class="panel-h"><h3>需要回看</h3><span class="muted">按章归类的具体考点</span></div>${weakHtml}</div>
    </div>
    <div class="panel">
      <div class="panel-h"><h3>全部题目明细</h3><span class="muted">含解析与出处</span></div>
      <details class="kcard"><summary><span class="kt">展开 ${total} 道题的作答记录</span><i class="chev"></i></summary><div class="kbody">${detail}</div></details>
    </div>
    <div class="startrow" style="margin-bottom:40px">
      ${wcount ? `<button class="btn primary" onclick="retryWrong()">只练错的 ${wcount} 题</button>` : ''}
      <button class="btn ghost" onclick="shareCode()">📋 复制成绩码</button>
      <button class="btn ghost" onclick="start('full')">重新测一次</button>
      <button class="btn ghost" onclick="exportMd()">导出报告 (.md)</button>
      <button class="btn subtle" onclick="goHome()">回到首页</button>
    </div>`;
}

/* ---------- 成绩码 ---------- */
function buildCode() {
  let res = null, rec = null;
  if (st && st.bank === cur && st.res && st.res.length) res = st.res;
  else rec = readLS(LS_LAST(cur));
  if (!res && !rec) return null;

  let total, right, pct, chs = {}, wrong = [];
  if (res) {
    total = res.length;
    right = Math.round(res.reduce((a, r) => a + r.score, 0) * 10) / 10;
    pct = total ? Math.round(right / total * 100) : 0;
    res.forEach(r => {
      const n = r.q.ch;
      chs[n] = chs[n] || [0, 0];
      chs[n][0] += r.score; chs[n][1] += 1;
      if (r.score < 1) wrong.push(r.q.id);
    });
  } else {
    total = rec.total; right = rec.right; pct = rec.pct; chs = rec.ch || {}; wrong = rec.wrong || [];
  }
  const chTxt = Object.keys(chs).sort((a, b) => a - b)
    .map(k => `${k}:${Math.round(chs[k][0] * 10) / 10}/${chs[k][1]}`).join(',');
  return `PYC1|${cur}|${total}|${right}|${pct}|${chTxt}|${wrong.slice(0, 80).join(',')}`;
}

function shareCode() {
  const code = buildCode();
  if (!code) { toast('还没有成绩，先做一轮测评'); return; }
  $('#codeBody').innerHTML = `
    <div class="m-head">
      <div class="m-crumb"><b>成绩码</b><span>·</span><span>复制后发给我</span></div>
      <button class="x" id="codeClose">✕</button>
    </div>
    <div class="m-body">
      <p class="muted" style="margin:0 0 10px">长按下面这段文字 → 全选 → 复制。用微信发**文字**就行，不用传文件。</p>
      <textarea id="codeTa" readonly class="ans codebox">${esc(code)}</textarea>
      <div class="startrow" style="margin-top:12px">
        <button class="btn primary" id="codeCopy">复制</button>
        <span class="muted" id="codeTip"></span>
      </div>
    </div>`;
  $('#codeOv').classList.add('show');
  const ta = $('#codeTa');
  setTimeout(() => { ta.focus(); ta.select(); }, 60);
  $('#codeClose').addEventListener('click', closeCode);
  $('#codeCopy').addEventListener('click', async () => {
    ta.focus(); ta.select();
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(code);
        $('#codeTip').textContent = '已复制 ✓ 直接粘到微信';
      } else throw new Error('no api');
    } catch (e) {
      $('#codeTip').textContent = '已全选，按 Ctrl+C 或长按复制';
    }
  });
}
function closeCode() { $('#codeOv').classList.remove('show'); }

function retryWrong() {
  const l = readLS(LS_LAST(cur));
  const w = new Set((l && l.wrong) || []);
  const pool = B().filter(q => w.has(q.id));
  if (!pool.length) { toast('没有错题'); return; }
  st = { bank: cur, pool, i: 0, res: [], t0: Date.now(), mode: 'wrong' };
  saveSession();
  $('#resultView').classList.add('hide');
  $('#ov').classList.add('show');
  renderQ();
}

function goHome() {
  $('#resultView').classList.add('hide');
  $('#homeView').classList.remove('hide');
  renderHome();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function exportMd() {
  if (!st) return;
  const b = QB[cur];
  const total = st.res.length;
  const right = st.res.reduce((a, r) => a + r.score, 0);
  const d = new Date();
  const L = [`# ${b.label} 测评报告`, ` `,
    `- 时间：${d.toLocaleString('zh-CN')}`,
    `- 成绩：${Math.round(right * 10) / 10} / ${total}（${total ? Math.round(right / total * 100) : 0}%）`, ` `,
    `## 错题与考点`];
  const wrong = st.res.filter(r => r.score < 1);
  if (!wrong.length) L.push('全部答对。');
  wrong.forEach((r, i) => {
    const q = r.q;
    L.push(`${i + 1}. **${q.topic}**（${q.sec || ''}）`);
    L.push('   - 题目：' + q.q.replace(/\n/g, ' '));
    if (q.code) L.push('   ```\n' + q.code.split('\n').map(l => '   ' + l).join('\n') + '\n   ```');
    L.push(`   - 你的答案：${r.skip ? '（我不会）' : (r.given || '—')}`);
    L.push(`   - 解析：${q.why}`);
  });
  L.push('', '## 逐题记录');
  st.res.forEach((r, i) => L.push(`${i + 1}. ${r.score === 1 ? '✅' : '❌'} ${r.q.topic} — ${r.q.sec || ''}`));
  const blob = new Blob([L.join('\n')], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${b.label}-测评报告-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.md`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast('报告已下载');
}

/* ---------- 册子原题浮层 ---------- */
function openRef(id) {
  const bank = QB.ref;
  if (!bank) return;
  const q = bank.q.find(x => x.id === id);
  if (!q) { toast('没有找到对应的册子题'); return; }
  const correct = q.type === 'choice' ? q.opts[q.ans] : q.a[0];
  $('#refBody').innerHTML = `
    <div class="m-head"><div class="m-crumb"><b>📎 册子原题</b><span>·</span><span>${esc(q.topic)}</span></div>
      <button class="x" id="refClose">✕</button></div>
    <div class="m-body">
      <p class="qtext">${fmt(q.q)}</p>
      ${q.code ? `<pre class="code"><code>${esc(q.code)}</code></pre>` : ''}
      ${q.opts ? `<div class="opts">${q.opts.map((o, i) => `<div class="opt${i === q.ans ? ' ok' : ' dim'} lock"><span class="k">${'ABCD'[i]}</span><span class="t">${fmt(o)}</span></div>`).join('')}</div>` : ''}
      <div class="fb ok" style="margin-top:12px">
        <div class="fb-h">答案</div>
        <div class="fb-row"><span>${esc(correct)}</span></div>
        <div class="fb-why">${fmt(q.why || '')}</div>
        <div class="fb-src">${esc(q.sec || '')}${q.p ? ` · <a class="blink" href="${BILINK(q.p)}" target="_blank" rel="noopener">🎬 回看 ${esc(q.sec)}</a>` : ''}</div>
      </div>
      ${q.note ? `<p class="muted" style="margin-top:10px">${fmt(q.note)}</p>` : ''}
    </div>`;
  $('#refOv').classList.add('show');
  $('#refClose').addEventListener('click', closeRef);
}
function closeRef() { $('#refOv').classList.remove('show'); }

/* ---------- 退出 ---------- */
function quit() {
  if (!st) return;
  if (st.res.length >= st.pool.length) { finish(); return; }
  saveSession();
  if (!confirm('退出本次测评？已答的题目已保存，下次打开可以接着做。')) return;
  $('#ov').classList.remove('show');
  st = null;
  goHome();
}

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-bank]');
  if (tab) {
    if (st) { toast('先把当前测评做完或退出'); return; }
    cur = tab.dataset.bank;
    $('#resultView').classList.add('hide');
    renderHome();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  const chip = e.target.closest('[data-ch]');
  if (chip) {
    const n = +chip.dataset.ch;
    sel().has(n) ? sel().delete(n) : sel().add(n);
    renderHome();
    return;
  }
  const pr = e.target.closest('[data-practice]');
  if (pr) { start('full', +pr.dataset.practice); return; }
  if (e.target.id === 'allOn') { SELS[cur] = new Set(chKeys()); renderHome(); return; }
  if (e.target.id === 'allOff') { SELS[cur] = new Set(); renderHome(); return; }
  if (e.target.id === 'startBtn') { start('full'); return; }
  if (e.target.id === 'quickBtn') { start('quick'); return; }
  if (e.target.id === 'wrongBtn') { start('wrong'); return; }
  if (e.target.id === 'shareBtn') { shareCode(); return; }
  if (e.target.id === 'resumeBtn') { resume(); return; }
  if (e.target.id === 'discardBtn') { dropLS(LS_SESS(cur)); renderResume(); toast('已丢弃上次进度'); return; }
  const rc = e.target.closest('[data-ref]');
  if (rc) { openRef(rc.dataset.ref); return; }
});

document.addEventListener('keydown', e => {
  if ($('#codeOv').classList.contains('show')) {
    if (e.key === 'Escape') { closeCode(); e.preventDefault(); }
    return;
  }
  if ($('#refOv').classList.contains('show')) {
    if (e.key === 'Escape') { closeRef(); e.preventDefault(); }
    return;
  }
  if (!$('#ov').classList.contains('show') || !st) return;
  if (e.key === 'Escape') { e.preventDefault(); quit(); return; }
  const q = st.pool[st.i];
  if (!q) return;
  if (st.answered) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); }
    return;
  }
  if (e.key === 'Enter') { e.preventDefault(); grade(false); return; }
  if (q.type === 'choice') {
    const k = e.key.toUpperCase();
    let idx = -1;
    if (k.length === 1 && k >= '1' && k <= '9') idx = +k - 1;
    else if (k.length === 1 && 'ABCD'.indexOf(k) >= 0) idx = 'ABCD'.indexOf(k);
    if (idx >= 0 && idx < q.opts.length) { e.preventDefault(); pick(0, idx); }
  }
});

window.addEventListener('beforeunload', () => { if (st) saveSession(); });
window.addEventListener('pagehide', () => { if (st) saveSession(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && st) saveSession(); });

/* ---------- 启动 ---------- */
migrateV1();
initSel();
if (!QB[cur]) cur = ORDER.find(k => QB[k]) || 'py';
renderHome();


</script>
</body>
</html>
