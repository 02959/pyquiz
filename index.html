one)` 这种类型不对的才抛 TypeError。\n\n记忆点：`int()` 默认只认十进制，换进制要靠第二个参数开口。"}, {"id": "py501", "ch": 5, "topic": "5.3 int() 会忽略首尾空白", "sec": "§5.3", "type": "fill", "q": "下面代码输出什么？", "code": "print(int(' 9 '), int('\\t7\\n'))", "a": ["9 7"], "why": "`int()` 转换前会先去掉字符串首尾的空白字符（空格、`\\t`、`\\n` 都算），所以两个值分别是 9 和 7。但空白只能出现在两头，夹在数字中间的 `int('9 8')` 仍是 ValueError。", "detail": "答案是 `9 7`。`int()` 的解析规则允许首尾有空白，相当于先 `strip()` 再转。\n\n`' 9 '` 去掉两端空格得 `'9'`，转成 9；`'\\t7\\n'` 去掉制表符和换行得 `'7'`，转成 7。\n\n所以从文件或 `input()` 读进来带换行的数字可以直接转，不用先手动 strip。\n\n坑在中间：`int('9 8')` 是 ValueError，因为去掉两头空白后中间还夹着一个空格，不是合法整数。\n\n对照 `float()` 有同样的宽容度：`float('  2 ')` 得 2.0；`int(' 9.0 ')` 仍然报错，因为小数点跟空白无关。\n\n记忆点：两头空白随便有，中间一个都不行。"}, {"id": "py502", "ch": 5, "topic": "5.3 float('1e3') 与两步转换", "sec": "§5.3", "type": "fill", "q": "下面代码输出什么？", "code": "print(float('1e3'), int(float('1e3')))", "a": ["1000.0 1000"], "why": "`float()` 认科学计数法，`'1e3'` 就是 1000.0；`int('1e3')` 反而不认 e，所以必须先 `float` 再 `int`，第二次转换把 1000.0 截成 1000。", "detail": "答案是 `1000.0 1000`。同一个字符串，`float()` 能转、`int()` 不能转。\n\n`float()` 支持科学计数法：`'1e3'` 是 1×10³，`'1E-2'` 是 0.01，`'1.5e2'` 是 150.0，都带小数点或指数。\n\n`int()` 只接受整数字符串，`int('1e3')` 报 ValueError；`int(1e3)` 却是合法的，因为那是先有 float 对象再截断，得 1000。\n\n所以“字符串里带小数点或 e”一律走两步：`int(float(s))`，别直接 `int(s)`。\n\n反过来 `float('10')` 也得 10.0，宽进严出：float 什么数字字符串都收，int 只收纯整数。\n\n记忆点：字符串带 e 或小数点，先 float 后 int。"}, {"id": "py503", "ch": 5, "topic": "5.3 int() 向零截断（-0.5 得 0）", "sec": "§5.3", "type": "fill", "q": "下面代码输出什么？", "code": "print(int(-2.9), int(-0.5))", "a": ["-2 0"], "why": "`int()` 对小数是朝 0 截断，不是向下取整：-2.9 砍掉小数得 -2，-0.5 砍掉小数得 0（既不是 -1，也不是 -0）。对照 `//` 才是向下取整。", "detail": "答案是 `-2 0`。记住“截断 = 朝 0 方向砍”，正数变小、负数变大。\n\n-2.9 的小数部分被直接丢弃，得 -2；如果按向下取整会得 -3，那是 `-2.9 // 1` 的结果。\n\n-0.5 更容易错：截断后是 0，不是 -1，也不是 -0（Python 的 int 没有 -0）。\n\n想验证方向，比较 `int(-2.9)` 与 `-2.9 // 1`：前者 -2，后者 -3，一个朝 0、一个朝负无穷。\n\n正数上两者恰好一致，所以只拿正数练手会掩盖这条差别。\n\n记忆点：`int()` 朝 0 砍，`//` 朝负无穷踩。"}, {"id": "py504", "ch": 5, "topic": "5.1 str() 给人看，repr() 给解释器看", "sec": "§5.1", "type": "choice", "q": "下面代码输出什么？", "code": "print(str('hi'), repr('hi'))", "opts": ["hi hi", "hi 'hi'", "'hi' 'hi'", "hi \"hi\""], "ans": 1, "why": "`str()` 返回字符串本身的内容，打印出来就是 hi；`repr()` 返回“能重建这个对象的写法”，字符串会带上引号，所以是 `'hi'`。`print` 里两种结果并排出现，就成了 hi 'hi'。", "detail": "答案是 `hi 'hi'`：`str('hi')` 是 hi，`repr('hi')` 是 `'hi'`（含引号）。\n\n`str()` 面向用户，只给内容；`repr()` 面向开发者，目标是“把这个值原样写回代码还能得到它”，所以字符串必须带引号、换行必须写成 `\\n`。\n\n在交互模式（`>>>`）里直接敲变量，回显用的就是 `repr`；`print()` 用的是 `str`，这条差别决定了你在 REPL 里看到引号、在脚本输出里看不到。\n\n容器也一样：`print(['hi'])` 显示 `['hi']`，因为列表内部元素用的是 repr。\n\n所以调试时想看清字符串的首尾空格或换行，用 `print(repr(s))` 比 `print(s)` 靠谱得多。\n\n记忆点：str 脱引号给人看，repr 留引号给机器看。"}, {"id": "py505", "ch": 5, "topic": "5.1 repr() 把换行写成 \\n", "sec": "§5.1", "type": "fill", "q": "下面代码输出什么？（原样写出这一行，不要真的换行）", "code": "print(repr('a\\nb'))", "a": ["'a\\nb'"], "why": "`repr()` 会把字符串里的真实换行显示成两个字符：反斜杠和 n，所以这一行里看不到换行效果，输出就是 `'a\\nb'`（外面还带一层引号）。直接 `print('a\\nb')` 才是真的换行两行。", "detail": "答案是 `'a\\nb'`：六个字符，前后单引号，中间是反斜杠加 n。\n\n`'a\\nb'` 这个字符串实际只含 3 个字符：a、换行、b。`repr()` 的任务是把它写成能读回代码的形式，于是换行被转义成 `\\n` 两个可见字符。\n\n所以 `print(repr(s))` 永远只占一行，这也是它适合打日志的原因：多行内容不会把日志撑乱。\n\n而 `print('a\\nb')` 走的是 `str`，反斜杠 n 在源码里就已经是换行，打印出来是两行 a、b。\n\n`len(repr('a\\nb'))` 得 6（多加了一对引号，换行变成两个字符），`len('a\\nb')` 是 3。\n\n记忆点：repr 里的 `\\n` 是字面的两个字符，不是换行。"}, {"id": "py506", "ch": 5, "topic": "5.1 type() == 与 isinstance() 的差别", "sec": "§5.1", "type": "choice", "q": "下面代码输出什么？", "code": "print(type(True) == int, isinstance(True, int))", "opts": ["True True", "False True", "True False", "False False"], "ans": 1, "why": "`type(True)` 是 `bool`，和 `int` 严格不相等，所以第一个是 False；但 bool 是 int 的子类，`isinstance` 认继承关系，所以第二个是 True。判类型时 `isinstance()` 通常更合适。", "detail": "答案是 `False True`。同一个 True，两种判断给出相反结果。\n\n`type()` 返回精确类型：`type(True)` 是 `<class 'bool'>`，`bool == int` 为 False，因为它比的是“完全同一个类型”。\n\n`isinstance(x, T)` 问的是“x 是不是 T 或 T 的子类实例”，`bool` 继承自 `int`，所以 `isinstance(True, int)` 是 True。\n\n判断“能不能当数字用”就用 `isinstance`；确实要排除子类（比如拒绝 bool）才用 `type(x) is int`。\n\n记忆点：type 比“一模一样”，isinstance 认“子孙后代”。"}, {"id": "py507", "ch": 5, "topic": "5.1 哪个 isinstance 判断是 False", "sec": "§5.1", "type": "choice", "q": "下面哪个表达式的结果是 False？", "opts": ["`isinstance(True, int)`", "`type(3) is int`", "`isinstance(3, float)`", "`isinstance('3', str)`"], "ans": 2, "why": "3 是 int，不是 float，`isinstance(3, float)` 得 False。`isinstance(True, int)` 是 True，因为 bool 是 int 的子类。", "detail": "答案是 `isinstance(3, float)`：整数不是浮点数，两者在 Python 里是没有继承关系的不同类型。\n\n`isinstance(True, int)` 得 True：`bool` 是 `int` 的子类，这也是 `True + 1` 得 2 的原因。\n\n`type(3) is int` 得 True：`type` 返回的就是 int 这个类对象，`is` 比身份，同一个类当然为真。\n\n`isinstance('3', str)` 得 True：`'3'` 是带引号的字符串，长得像数字也不改变类型。\n\n对比 `isinstance(3, (int, float))` 得 True，第二个参数写元组表示“任一是就算”，适合写“只要是数字就行”的校验。\n\n记忆点：值是 int 就不会同时是 float，数字外形骗不了类型。"}, {"id": "py508", "ch": 5, "topic": "5.2 int 与 float 相加自动提升", "sec": "§5.2", "type": "fill", "q": "下面代码输出什么？", "code": "print(1 + 2.0, type(1 + 2.0))", "a": ["3.0 <class 'float'>"], "why": "int 和 float 混合运算时 int 先被提升成 float，结果是 3.0 而不是 3；`type()` 打印出来是 `<class 'float'>`，尖括号和引号都不能少。", "detail": "答案是 `3.0 <class 'float'>`。只要有一个操作数是 float，整个结果就是 float。\n\n“提升”的方向是 int → float → complex：精度低的向精度高的看齐，所以 `1 + 2.0` 里 1 先变成 1.0，再相加得 3.0。\n\n因此 `1 + 2` 得 3（int），`1 + 2.0` 得 3.0（float），`1 + 0.0` 也得 1.0——即使小数部分是 0，类型也已经是 float。\n\n`type()` 的打印格式是 `<class 'float'>`，写答案时尖括号和单引号都算字符，只写 float 是错的。\n\n坑：`3.0 == 3` 是 True，但 `print` 出来一个是 3.0 一个是 3，做输出题必须按实际显示写。\n\n记忆点：混合运算先提升，打印时小数点不省。"}, {"id": "py509", "ch": 5, "topic": "5.3 真除的结果一定是 float", "sec": "§5.3", "type": "fill", "q": "下面代码输出什么？", "code": "print(int(7 / 2), 7 / 2)", "a": ["3 3.5"], "why": "`/` 是真除，7 / 2 得 3.5（float），再用 `int()` 截断才变成 3。想要整除要用 `//`，别用 `int(a / b)` 代替。", "detail": "答案是 `3 3.5`。表达式里 `/` 先算，`int()` 只是把 7/2 的结果截断。\n\nPython 3 的 `/` 永远是真除：`4 / 2` 得 2.0 而不是 2，`7 / 2` 得 3.5，结果类型一定是 float。\n\n`int(3.5)` 朝 0 截断得 3，所以第一项是 3；第二项直接把 3.5 打印出来。\n\n用 `int(a / b)` 求整商有两个隐患：一是绕了一圈 float，大整数会丢精度；二是负数上 `int(-7 / 2)` 得 -3，而 `-7 // 2` 得 -4，两者含义不同。\n\n所以整除就写 `//`，别拿 `/` 加 `int()` 硬凑。\n\n记忆点：`/` 出门必带小数点，取整交给 `//`。"}, {"id": "py510", "ch": 5, "topic": "5.2 bool() 只看空不空、零不零", "sec": "§5.2", "type": "choice", "q": "下面代码输出什么？", "code": "print(bool([]), bool(' '), bool(0.0))", "opts": ["False True False", "False False False", "True True False", "False True True"], "ans": 0, "why": "空列表是“空”，bool 为 False；`' '` 里有一个空格字符，非空就是 True；0.0 是零，False。判断依据是“空/零”，不是“看着有没有内容”。", "detail": "答案是 `False True False`。三个值的真假分别看空不空、空不空、零不零。\n\n`bool([])` 是 False：空列表长度为 0，属于假值；同类的还有 `''`、`{}`、`()`、`set()`。\n\n`bool(' ')` 是 True：里面有一个空格字符，长度 1，非空字符串一律为真，哪怕看上去“什么都没有”。\n\n`bool(0.0)` 是 False：数值零（int 0、0.0、0j）都是假值，非零全是真。\n\n真正容易错的是把 `'0'`、`'False'`、`' '` 当假：字符串只看长度，不看内容像不像假值。\n\n记忆点：假值只有 None、False、数值 0、空容器，其余一律真。"}, {"id": "py511", "ch": 5, "topic": "5.3 类型不匹配抛 TypeError", "sec": "§5.3", "type": "choice", "q": "下面代码运行结果是什么？", "code": "print('1' + 1)", "opts": ["输出 2", "输出 11", "抛 TypeError", "抛 ValueError"], "ans": 2, "why": "`+` 两边类型必须一致：字符串只能加字符串，`'1' + 1` 抛 TypeError：can only concatenate str (not \"int\") to str。想要 11 得写 `'1' + str(1)`，想要 2 得写 `int('1') + 1`。", "detail": "答案是抛 TypeError，完整信息是 `can only concatenate str (not \"int\") to str`。\n\n`+` 对字符串是拼接，要求两边都是 str；右边是 int，Python 不会替你偷偷转型，直接报错。\n\n为什么不是 ValueError：ValueError 是“类型对、值不行”，比如 `int('abc')`；这里是类型组合本身不合法。\n\n对照 `'1' * 3` 得 `'111'`，因为 `*` 对字符串接受 int，只有 `+` 这么挑剔。\n\n修法看你要什么：拼文本写 `'1' + str(1)`，做加法写 `int('1') + 1`，别指望自动转换。\n\n记忆点：str 的 `+` 只认 str，转换要自己写。"}, {"id": "py512", "ch": 5, "topic": "5.3 截断与地板除差在哪", "sec": "§5.3", "type": "fill", "q": "下面代码输出什么？", "code": "print(int(-7 / 2), -7 // 2)", "a": ["-3 -4"], "why": "`-7 / 2` 是 -3.5：`int()` 朝 0 截断得 -3，`//` 向下取整得 -4。同一个负数，两条取整规则差 1。", "detail": "答案是 `-3 -4`。两个表达式算的是同一个商，取整方向不同所以差 1。\n\n`-7 / 2` 得 -3.5；`int(-3.5)` 朝 0 砍掉小数得 -3。\n\n`-7 // 2` 是地板除，取“不大于 -3.5 的最大整数”，即 -4。\n\n正数上感觉不到差别：`int(7 / 2)` 和 `7 // 2` 都是 3，所以负数才暴露问题。\n\n验证恒等式：`-7 == 2 * (-4) + (-7 % 2)`，而 `-7 % 2` 是 1，`-8 + 1 = -7`，说明 `//` 与 `%` 是配套的。\n\n记忆点：`int()` 朝 0 砍，`//` 朝负无穷踩，负数上差 1。"}, {"id": "py513", "ch": 5, "topic": "5.1 repr() 多出来的引号是真实字符", "sec": "§5.1", "type": "choice", "q": "下面代码输出什么？", "code": "print(len(str('hi')), len(repr('hi')))", "opts": ["2 4", "4 2", "2 2", "4 4"], "ans": 0, "why": "`str('hi')` 就是 hi 两个字符；`repr('hi')` 是带引号的 `'hi'`，引号也算字符，所以长度是 4。`repr` 不是“加装饰显示”，它真的多出两个字符。", "detail": "答案是 `2 4`。同一份内容，repr 的字符串比 str 长 2，多出的正是首尾引号。\n\n`str('hi')` 返回 `hi`，长度 2；`repr('hi')` 返回 `'hi'`，字符是单引号、h、i、单引号，长度 4。\n\n所以 `print(repr(s))` 看到的引号不是排版，而是内容的一部分；`print(repr(''))` 会显示 `''`，而 `print('')` 什么都不显示。\n\n这也解释了为什么 `print([1, 'a'])` 里字符串带引号：列表的 str 会用元素的 repr 来显示。\n\n反过来用 `len()` 量之前先想清楚量的是谁：`len(s)` 是内容长度，`len(repr(s))` 还含引号和转义。\n\n记忆点：repr 的引号是实打实的两个字符。"}, {"id": "py514", "ch": 5, "topic": "5.3 float() 也忽略首尾空白", "sec": "§5.3", "type": "choice", "q": "下面代码输出什么？", "code": "print(float('  2 '), float('-1.5'))", "opts": ["2.0 -1.5", "2 -1.5", "2.0 -2.0", "抛 ValueError"], "ans": 0, "why": "`float()` 和 `int()` 一样会跳过首尾空白，`'  2 '` 得 2.0；float 按浮点格式打印，2.0 不会显示成 2。`'-1.5'` 是合法小数，负号原样保留。", "detail": "答案是 `2.0 -1.5`。空白被忽略，负号被保留，整数字符串也变成 float。\n\n`float('  2 ')` 先去空白得 `'2'`，转成 2.0；注意打印是 `2.0`，float 不会因为小数部分为 0 就省掉 `.0`。\n\n`float('-1.5')` 直接得 -1.5，负号属于数字的一部分，不会被当成非法字符。\n\n`float()` 认的写法比 `int()` 宽：`'1e3'`、`'1E-2'`、`'.5'`、`'2.'`、`'-0.0'` 都合法。\n\n但中间有空白照样报错：`float('1 5')` 是 ValueError；`float('1,5')` 也报错，千分位逗号不认。\n\n记忆点：float 宽容两头空白和科学计数法，整数结果也显示成 2.0 这种样子。"}, {"id": "py515", "ch": 5, "topic": "5.1 isinstance 的第二个参数可以是元组", "sec": "§5.1", "type": "fill", "q": "下面代码输出什么？", "code": "print(isinstance('3', (int, str)), isinstance(3.0, (int, float)))", "a": ["True True"], "why": "`isinstance` 的第二个参数写成元组表示“是其中任一个类型就算”，`'3'` 命中 str，3.0 命中 float，两个都是 True。", "detail": "答案是 `True True`。元组写法是 `isinstance` 特有的便利，一次问多个类型。\n\n`isinstance('3', (int, str))`：`'3'` 是 str，元组里第二个类型命中，得 True。\n\n`isinstance(3.0, (int, float))`：3.0 是 float，命中第二个，得 True。\n\n它等价于 `isinstance(x, int) or isinstance(x, str)`，但只算一次类型判断，读起来也更像“只要是数字就行”。\n\n坑：第二个参数不能写成 `[int, str]` 列表，必须是类型或类型元组，否则报 TypeError: isinstance() arg 2 must be a type...\n\n记忆点：多个类型用元组包起来，任意一个命中就算真。"}, {"id": "py516", "ch": 5, "topic": "5.2 bool 参与运算按 1 和 0", "sec": "§5.2", "type": "choice", "q": "下面代码输出什么？", "code": "print(True + 0.5)", "opts": ["1.5", "1", "0.5", "抛 TypeError"], "ans": 0, "why": "`True` 在算术里就是 1，`1 + 0.5` 得 1.5；int 与 float 混合还会提升成 float。`bool` 是 `int` 的子类，所以合法，不会报 TypeError。", "detail": "答案是 `1.5`。True 当 1 用，False 当 0 用，这是 bool 继承 int 的直接后果。\n\n`True + 1` 得 2，`False + 1` 得 1，`True * 2.5` 得 2.5，`True / 2` 得 0.5。\n\n本例中 1 和 0.5 混合，结果提升成 float，所以显示 1.5 而不是 3/2 的分数形式。\n\n`sum([True, True, False])` 得 2，这是统计“满足条件个数”的常用写法，比如 `sum(x > 60 for x in scores)`。\n\n坑：`True + 'a'` 仍是 TypeError，提升只发生在数值类型之间；`True == 1` 为 True，但 `'True' == True` 是 False。\n\n记忆点：bool 是穿了马甲的 1 和 0。"}, {"id": "py517", "ch": 5, "topic": "5.3 round 与 int 在负数上的分野", "sec": "§5.3", "type": "fill", "q": "下面代码输出什么？", "code": "print(round(-3.5), int(-3.5))", "a": ["-4 -3"], "why": "`round(-3.5)` 遇到正好 .5 取偶数方向，-4 是偶数，所以得 -4；`int(-3.5)` 朝 0 截断得 -3。四舍五入和截断在负数上方向不同。", "detail": "答案是 `-4 -3`。同一个 -3.5，一个取到 -4，一个砍成 -3。\n\n`round()` 的规则是“四舍六入五成双”：正好 .5 时向偶数靠，所以 `round(-3.5)` 得 -4（偶数），`round(-2.5)` 得 -2。\n\n`int()` 是截断，朝 0 砍掉小数，`int(-3.5)` 得 -3，`int(-2.9)` 也得 -2。\n\n注意 `round()` 返回的仍是数值：`round(3.5)` 显示 4（int），`round(2.5, 1)` 显示 2.5，末尾的 0 不会补。\n\n坑：别把 `round()` 当“严格四舍五入”用来做金额，`.5` 时它可能不进位；金额用 `decimal.Decimal`。\n\n记忆点：round 五成双，int 朝零砍，负数上两者不是一个方向。"}, {"id": "py518", "ch": 6, "topic": "6.2 % 也能用在小数上", "sec": "§6.2", "type": "fill", "q": "下面代码输出什么？", "code": "print(7.5 % 2, -7.5 % 2)", "a": ["1.5 0.5"], "why": "`%` 不只对整数有效，小数也能取模且结果带小数：7.5 % 2 得 1.5。负数同样遵循“余数符号跟除数走”，-7.5 % 2 得 0.5 而不是 -1.5。", "detail": "答案是 `1.5 0.5`。小数取模的算法和整数一样：`n % d = n - d * (n // d)`。\n\n`7.5 // 2` 是 3.0，`7.5 - 2 * 3.0` 得 1.5；`-7.5 // 2` 是 -4.0（向下取整），`-7.5 - 2 * (-4.0)` 得 0.5。\n\n所以负的被除数并不会让余数变负：余数的符号只看除数，除数是 2（正），结果必在 [0, 2) 之间。\n\n浮点取模常用来做“角度归一”或“时间取余”，比如 `seconds % 60` 得小数秒。\n\n坑：浮点有误差，`5.1 % 0.3` 不会是漂亮的 0，而是 0.2999999999999998 之类，判断相等要留容差。\n\n记忆点：% 不看整数还是小数，只看“补到整数倍还差多少”。"}, {"id": "py519", "ch": 6, "topic": "6.2 浮点数的 // 结果仍是 float", "sec": "§6.2", "type": "choice", "q": "下面代码输出什么？", "code": "print(7 // 2.0, -7 // 2.0)", "opts": ["3.0 -4.0", "3 -4", "3.5 -3.5", "3.0 -3.0"], "ans": 0, "why": "`//` 只要有一个操作数是 float，结果就是 float：7 // 2.0 得 3.0。取整方向仍是向下，-3.5 向下取到 -4.0，所以第二个是 -4.0 不是 -3.0。", "detail": "答案是 `3.0 -4.0`。两件事同时发生：结果类型提升成 float，取整方向仍然朝负无穷。\n\n`7 / 2.0` 是 3.5，地板除取不大于它的最大整数 3，类型跟着操作数走成 3.0。\n\n`-7 / 2.0` 是 -3.5，向下取整得 -4，写成 -4.0；如果按截断会得 -3，那是 `int()` 的规则。\n\n对比记忆：`7 // 2` 得 3（int），`7 // 2.0` 得 3.0（float），值一样但打印不同，输出题必须写全。\n\n坑：`-7 // 2.0` 得 -4.0 而不是 -3.0，别把负数上的 `//` 当成“砍小数”。\n\n记忆点：// 先向下取整，再按操作数里最高的类型出结果。"}, {"id": "py520", "ch": 6, "topic": "6.2 负指数返回 float", "sec": "§6.2", "type": "fill", "q": "下面代码输出什么？", "code": "print(2 ** -1, 4 ** 0.5)", "a": ["0.5 2.0"], "why": "`2 ** -1` 等于 1/2，得 0.5；负指数和分数指数都返回 float。`4 ** 0.5` 是开平方得 2.0，即使结果是整数也显示成 2.0。", "detail": "答案是 `0.5 2.0`。`**` 的两个“非整数”用法都会让结果变成 float。\n\n`2 ** -1` 按数学定义是 1/2¹ = 0.5；负指数不会报错，也不会得 0，只是取倒数。\n\n`4 ** 0.5` 是 4 的 1/2 次方，即平方根 2，但类型是 float，打印成 2.0。\n\n同理 `2 ** 0.5` 得 1.4142135623730951，`9 ** -0.5` 得 0.3333333333333333。\n\n坑：`2 ** -1` 和 `-2 ** 1` 完全不同，前者是负指数，后者是“负号在幂外面”，得 -2；括号位置决定意思。\n\n记忆点：指数里出现负数或小数，结果就跑进 float 世界。"}, {"id": "py521", "ch": 6, "topic": "6.3 ** 比一元负号优先级高", "sec": "§6.3", "type": "fill", "q": "下面代码输出什么？", "code": "print(-2 ** 2, (-2) ** 2)", "a": ["-4 4"], "why": "`**` 的优先级高于一元负号，`-2 ** 2` 读作 `-(2 ** 2)`，得 -4；加括号写成 `(-2) ** 2` 才是 4。负号在幂外面还是在底数里，结果差一个符号。", "detail": "答案是 `-4 4`。同一个 -2 的平方，括号位置不同结果相反。\n\nPython 的优先级里 `**` 比一元负号高，所以 `-2 ** 2` 先把 2 平方得 4，再取负得 -4。\n\n想要“负二的平方”必须写 `(-2) ** 2`，先算括号里的 -2，再平方得 4。\n\n右侧同理：`2 ** -1` 是合法的，因为负号在指数位置，属于 `**` 的右操作数，不算“一元负号在幂外面”。\n\n坑：`-2 ** 2` 不报错，只是悄悄得 -4，数学课上写 -2² 也常被读成 -4，但编程里必须靠括号表达意图。\n\n记忆点：幂先算，负号后贴；要负底数就加括号。"}, {"id": "py522", "ch": 6, "topic": "6.6 and / or 返回操作数本身", "sec": "§6.6", "type": "choice", "q": "下面代码输出什么？", "code": "print(0 and 1, 1 or 2, '' or 0)", "opts": ["0 1 0", "False True False", "1 1 0", "0 2 0"], "ans": 0, "why": "`and` / `or` 返回的是决定结果的那个操作数，不是 True/False：`0 and 1` 左边假直接返回 0；`1 or 2` 左边真直接返回 1；`'' or 0` 左边空串假，返回右边的 0。", "detail": "答案是 `0 1 0`。三个结果分别是 int、int、int，连一个 bool 都没有。\n\n`and` 的规则：左边为假就返回左边，左边为真就返回右边。`0 and 1` 左边 0 是假，直接返回 0，右边看都不看。\n\n`or` 的规则：左边为真就返回左边，左边为假就返回右边。`1 or 2` 返回 1；`'' or 0` 左边空串为假，返回 0。\n\n实用写法 `name = input() or '匿名'`：输入为空串就落到默认值，靠的正是这个返回值规则。\n\n坑：`if x and y:` 判断为真，但 `print(x and y)` 打出来的不是 True，别在输出题里写成 True。\n\n记忆点：and 遇假就交人，or 遇真就交人，交的都是操作数本身。"}, {"id": "py523", "ch": 6, "topic": "6.6 短路让右侧的副作用不发生", "sec": "§6.6", "type": "choice", "q": "下面代码输出什么？", "code": "n = 0\n\ndef hit():\n    global n\n    n += 1\n    return True\n\nprint(True or hit(), n)", "opts": ["True 0", "True 1", "True True", "抛 NameError"], "ans": 0, "why": "`True or hit()` 左边已经是真，`or` 直接返回 True，`hit()` 根本不会被调用，所以 n 仍是 0。短路不只是省一次计算，它会跳过函数调用带来的副作用。", "detail": "答案是 `True 0`。`hit()` 一次都没跑，所以 n 停在 0。\n\n`or` 求值时先看左边，`True` 已经能定结果，右侧表达式整体被跳过；跳过的是“调用”这件事，不只是返回值。\n\n把左边换成 `False`，`hit()` 就会被调用，n 变成 1；`and` 则相反，左边为假时跳过右边。\n\n这条规则的价值在于把“危险操作”放在右边：`if x != 0 and 10 / x > 1:` 里，x 为 0 时除法根本不会执行，不会崩。\n\n副作用包括函数内的 `print`、`append`、计数自增、抛异常，短路全都能一并躲过。\n\n坑：依赖短路的写法必须保证顺序，`10 / x > 1 and x != 0` 把危险操作放前面就白搭了。\n\n记忆点：短路跳过的是整个右边，副作用也跟着一起跳。"}, {"id": "py524", "ch": 6, "topic": "6.5 == 比值，is 比身份", "sec": "§6.5", "type": "choice", "q": "下面代码输出什么？", "code": "a = [1, 2]\nb = [1, 2]\nprint(a == b, a is b)", "opts": ["True True", "True False", "False False", "False True"], "ans": 1, "why": "a 和 b 内容一样，所以 `==` 是 True；但它们是两个独立创建的列表对象，身份不同，`is` 是 False。判内容用 `==`，判是不是同一个对象才用 `is`。", "detail": "答案是 `True False`。内容相等不代表是同一个对象。\n\n`==` 调用 `__eq__` 逐项比较，两个列表都是 [1, 2]，所以 True。\n\n`is` 比的是 `id()`，每条 `[...]` 都会新建一个列表对象，两个对象地址不同，所以 False。\n\n`b = a` 之后再 `a is b` 才是 True：那是一个对象挂了两个名字，改 a 会看到 b 也变。\n\n`is` 的正当用途基本只有判 `None`（`x is None`）和判单例；判数值、判字符串内容一律用 `==`，别依赖小整数缓存。\n\n坑：`[1, 2] == [1, 2]` 是 True，这说明 `==` 会深入容器内部递归比较，不是只比外壳。\n\n记忆点：== 看长相，is 看身份证。"}, {"id": "py525", "ch": 6, "topic": "6.7 in 在 str / list / dict 上查的不一样", "sec": "§6.7", "type": "fill", "q": "下面代码输出什么？", "code": "print('at' in 'cat', 1 in {'a': 1}, 'a' in {'a': 1})", "a": ["True False True"], "why": "`in` 用在字符串上查子串，`'at'` 是 `'cat'` 的一部分所以 True；用在列表上查元素；用在字典上查的是**键**，所以 `1 in {'a': 1}` 是 False，`'a' in {'a': 1}` 才是 True。", "detail": "答案是 `True False True`。同一个 `in`，三种容器查的对象不同。\n\nstr：查子串，`'at' in 'cat'` 为 True，`'ct' in 'cat'` 为 False（必须是连续的一段）。\n\nlist / tuple / set：查元素是否在里面，`1 in [1, 2]` 为 True。\n\ndict：查**键**，不看值。`{'a': 1}` 的键是 `'a'`、值是 1，所以 `'a' in d` 为 True，`1 in d` 为 False。\n\n坑：数字查字符串会直接报错，`1 in '123'` 是 TypeError: 'in <string>' requires string as left operand, not int。\n\n记忆点：字典的 in 只认键，字符串的 in 认子串。"}, {"id": "py526", "ch": 6, "topic": "6.4 += 对 int 是重新绑定", "sec": "§6.4", "type": "fill", "q": "下面代码输出什么？", "code": "x = 1\ny = x\nx += 1\nprint(x, y)", "a": ["2 1"], "why": "int 不可变，`x += 1` 实际是算出 2 再让 x 指向新对象，原来的 1 没变，y 还指着 1。所以输出 2 1，两个名字从此分道扬镳。", "detail": "答案是 `2 1`。`x += 1` 没有改动 y 指向的东西，只是把 x 换了个对象。\n\n`y = x` 对不可变对象来说只是复制了引用：x 和 y 都指向 1 这个对象。\n\nint 不可变，`x += 1` 只能新建 2，再把名字 x 绑到 2 上；y 仍然绑在 1 上。\n\n对照可变对象：`a = [1]; b = a; a += [2]` 之后 a 和 b 都变成 [1, 2]，因为列表是原地改。\n\n所以“`+=` 有没有副作用”取决于左边对象的类型，不能一概而论。\n\n坑：以为 `y = x` 是拷贝，后面改 x 发现 y 没变就以为出了 bug，其实一直是这个规则。\n\n记忆点：不可变对象上 `+=` 等于 `x = x + 1`，改名不改物。"}, {"id": "py527", "ch": 6, "topic": "6.4 += 对列表是原地修改", "sec": "§6.4", "type": "fill", "q": "下面代码输出什么？", "code": "a = [1]\nb = a\na += [2]\nprint(a, b)", "a": ["[1, 2] [1, 2]"], "why": "列表的 `+=` 等价于 `extend`，直接在原列表上追加，不新建对象；b 和 a 是同一个列表，所以两边都变成 [1, 2]。", "detail": "答案是 `[1, 2] [1, 2]`。b 跟着变了，因为从头到尾只有一个列表。\n\n`b = a` 让两个名字指向同一个列表对象，`id(a) == id(b)` 为 True。\n\n列表的 `+=` 实现成原地追加（相当于 `a.extend([2])`），没有创建新列表，对象还是那一个。\n\n所以 `print(a, b)` 两次读到的是同一份内容，都是 [1, 2]。\n\n对照 `a = a + [2]`：`+` 会生成新列表再绑回 a，b 仍指向旧列表，输出是 `[1, 2] [1]`。\n\n坑：`+=` 与 `+` 在列表上的差别不是“写法不同”，而是“改原对象”和“换新对象”，会在别名、函数传参时暴露出来。\n\n记忆点：列表 += 是原地长个儿，列表 + 是另起炉灶。"}, {"id": "py528", "ch": 6, "topic": "6.4 `a = a + [2]` 不共享结果", "sec": "§6.4", "type": "choice", "q": "下面代码输出什么？", "code": "a = [1]\nb = a\na = a + [2]\nprint(a, b)", "opts": ["[1, 2] [1, 2]", "[1, 2] [1]", "[1] [1, 2]", "[1] [1]"], "ans": 1, "why": "`a + [2]` 生成一个新列表，再让 a 指向它；b 还指着原来那个 [1]，所以输出 `[1, 2] [1]`。这与 `a += [2]` 的原地修改结果不同。", "detail": "答案是 `[1, 2] [1]`。换了写法，别名关系就断了。\n\n`+` 对列表是“拼接并返回新列表”，`a + [2]` 得到一个新的 [1, 2]，原来的 [1] 毫发无损。\n\n`a = ...` 只是把名字 a 重新绑到新列表上，b 依旧绑在旧列表 [1]。\n\n所以两个名字看到的内容第一次出现分叉：a 是 [1, 2]，b 是 [1]。\n\n把这一行换成 `a += [2]`，结果是 `[1, 2] [1, 2]`，因为 `+=` 是原地 extend。\n\n同样地，`a.append(2)` 也是原地改，b 会跟着变；而 `a = a + [2]` 和 `a = a.copy(); a.append(2)` 都能断开共享。\n\n记忆点：看到 `a = a + ...` 就知道换了对象，别名不再同步。"}, {"id": "py529", "ch": 6, "topic": "6.3 * 先于 +：重复再拼接", "sec": "§6.3", "type": "choice", "q": "下面代码输出什么？", "code": "print('=' * 3 + '>' * 2)", "opts": ["===>>", "=>=>=>", "=>>", "抛 TypeError"], "ans": 0, "why": "`*` 的优先级高于 `+`，先把 `'=' * 3` 得 `'==='`、`'>' * 2` 得 `'>>'`，再拼起来就是 `===>>`。两边都是字符串，`+` 合法。", "detail": "答案是 `===>>`：三个等号接两个大于号。\n\n先算 `*`：`'=' * 3` 得 `'==='`，`'>' * 2` 得 `'>>'`，重复只作用于紧挨着的那个字符串。\n\n再算 `+`：两个字符串拼接得 `'===>>'`，`+` 同级从左到右，这里只有一个加号。\n\n如果是 `'=' * (3 + '>' * 2)` 就会在 `3 + '>>'` 那里报 TypeError，括号改变的只是结合方式，不改变“字符串只能加字符串”。\n\n这类写法常用来画分隔线：`print('-' * 30)`、`print('=' * 10 + ' 标题 ' + '=' * 10)`。\n\n坑：`'=' * 3 + 2` 会在 `+` 处报 TypeError，因为 `*` 已经把左边变成字符串，不能再加 int。\n\n记忆点：先乘后加，字符串重复只吃紧邻的那个串。"}, {"id": "py530", "ch": 6, "topic": "6.4 %= 也遵循余数跟除数走", "sec": "§6.4", "type": "fill", "q": "下面代码输出什么？", "code": "x = -7\nx %= 3\nprint(x)", "a": ["2"], "why": "`x %= 3` 就是 `x = x % 3`，-7 % 3 按“余数符号跟除数走”得 2，所以 x 变成 2。新手常答 -1，那是 C 语言取余的结果。", "detail": "答案是 `2`。`%=` 只是把 `%` 的结果写回左边，规则完全一样。\n\n`-7 // 3` 是 -3（向下取整），代回恒等式 `3 * (-3) + 2 = -7`，余数是 2。\n\n所以 `x %= 3` 之后 x 是 2，不是 -1；-1 是“向 0 截断再取余”的算法，Python 不采用。\n\n作用上，`%=` 常用来把数值压回某个范围：`i %= 7` 让 i 在 0..6 之间循环，负数也会被“掰正”。\n\n坑：`-7 % 3` 得 2，`7 % -3` 得 -2，两题一起背才不会记错方向。\n\n记忆点：%= 是 % 的缩写，先算余数再赋回去，余数符号看除数。"}, {"id": "py531", "ch": 6, "topic": "6.6 and 的优先级高于 or", "sec": "§6.6", "type": "choice", "q": "下面代码输出什么？", "code": "print(True or False and False)", "opts": ["True", "False", "SyntaxError", "None"], "ans": 0, "why": "`and` 比 `or` 先算，`False and False` 得 False，整个式子变成 `True or False`，`or` 左边为真直接返回 True。写成 `(True or False) and False` 才是 False。", "detail": "答案是 `True`。括号加错位置就会变成 False。\n\n优先级顺序是 `not` > `and` > `or`，所以 `True or False and False` 等价于 `True or (False and False)`。\n\n先算括号里：`False and False` 得 False（返回第一个假操作数）。\n\n再算 `True or False`：`or` 左边是真，直接返回 True，右边不再看。\n\n若写成 `(True or False) and False`，先得 True，再 `True and False` 得 False，可见括号能翻转结论。\n\n坑：`a or b and c` 永远按 `a or (b and c)` 算，别顺着读成从左到右。\n\n记忆点：not 最紧，and 其次，or 最松，拿不准就加括号。"}, {"id": "py532", "ch": 6, "topic": "6.3 not 的优先级低于比较", "sec": "§6.3", "type": "fill", "q": "下面代码输出什么？", "code": "print(not 0, not 1 == 1)", "a": ["True False"], "why": "`not` 的优先级低于比较运算符，`not 1 == 1` 读作 `not (1 == 1)`，先得 True 再取反，所以是 False；`not 0` 里 0 是假值，取反得 True。想验证优先级得换 `not 1 == 2`，那才分得出两种读法。", "detail": "答案是 `True False`。两个 not 一个作用在数字上，一个作用在比较结果上。\n\n`not 0` 里 0 是假值，取非得 True。\n\n`not 1 == 1`：比较的优先级高于 `not`，先算 `1 == 1` 得 True，再取非得 False。\n\n这道题靠巧合也能蒙对：错读成 `(not 1) == 1` 同样得 False，所以得换个例子才看得出优先级。\n\n用 `not 1 == 2`：正确读法 `not (1 == 2)` 得 True；错读成 `(not 1) == 2` 就是 `False == 2`，得 False，答案就分叉。\n\n所以 `not a == b` 的真实意思是“a 不等于 b”，写 `a != b` 更好读；`not` 作用在整个关系上。\n\n记忆点：比较先算，not 后算；作用在关系上就是“整个条件取反”。"}, {"id": "py533", "ch": 6, "topic": "6.4 **= 与 //= 连着用", "sec": "§6.4", "type": "fill", "q": "下面代码输出什么？", "code": "x = 2\nx **= 3\nx //= 3\nprint(x)", "a": ["2"], "why": "`x **= 3` 先算 2³ 得 8，`x //= 3` 再算 8 // 3 得 2。增强赋值从上一行接着算，每一步都是“先算右边再写回”。", "detail": "答案是 `2`。两行增强赋值各自独立，前一行的结果就是后一行的输入。\n\n第一行 `x **= 3` 等价于 `x = x ** 3`，2³ 得 8。\n\n第二行 `x //= 3` 等价于 `x = x // 3`，8 // 3 得 2，整除不留小数。\n\n`**=`、`//=`、`%=` 这些运算符都可以和 `=` 组合，规则统一：先按原优先级算，再把结果赋回左边的名字。\n\n坑：`x //= 3` 不是“除以 3 后取整再赋”，而是整除一次；负数上 `-8 // 3` 得 -3，与 `int(-8 / 3)` 的 -2 不同。\n\n另外 `x **= 0.5` 会让 x 变成 float，类型也跟着变。\n\n记忆点：增强赋值一行一步，先算后写回，类型可能被悄悄换掉。"}, {"id": "py534", "ch": 6, "topic": "6.3 % 与 * 同级、** 先算", "sec": "§6.3", "type": "choice", "q": "下面代码输出什么？", "code": "print(10 % 3 * 2 ** 2)", "opts": ["4", "12", "40", "36"], "ans": 0, "why": "`**` 最先算，2 ** 2 得 4；`%` 与 `*` 同级，从左到右：先 10 % 3 得 1，再 1 * 4 得 4。若先算 3 * 4 就会错得 10 % 12。", "detail": "答案是 `4`。三步：先幂，再取模，最后乘，顺序由优先级和结合性共同决定。\n\n`**` 优先级最高，`2 ** 2` 得 4，式子变成 `10 % 3 * 4`。\n\n`%` 和 `*` 同级，同级从左到右，所以先算 `10 % 3` 得 1，再 `1 * 4` 得 4。\n\n如果误以为 `*` 先于 `%`，会算成 `10 % 12` 得 10，选项里没有 10，但换成别的数字就可能撞上错误答案。\n\n同级左结合意味着 `a % b * c` 与 `(a % b) * c` 相同，和 `a % (b * c)` 不同。\n\n想避免争议就加括号：`(10 % 3) * 2 ** 2`，读代码的人不用背表。\n\n记忆点：幂最高，乘除取模同级左到右，加减最低。"}, {"id": "py535", "ch": 6, "topic": "6.7 not in 是 in 取反", "sec": "§6.7", "type": "choice", "q": "下面代码输出什么？", "code": "print(1 not in [1, 2], 'x' not in 'abc')", "opts": ["False True", "True False", "False False", "SyntaxError"], "ans": 0, "why": "`not in` 是 `in` 的整体取反：1 在 [1, 2] 里，`1 not in [1, 2]` 得 False；`'x'` 不在 `'abc'` 里，得 True。它不是“先算 not 再算 in”。", "detail": "答案是 `False True`。两个判断都先做成员测试，再把结果取反。\n\n`1 not in [1, 2]`：1 在列表里，`in` 为 True，取反得 False。\n\n`'x' not in 'abc'`：子串 `'x'` 不在 `'abc'` 里，`in` 为 False，取反得 True。\n\n`not in` 是一个整体运算符，优先级和 `in` 一样，不是 `not (x) in y` 那种拆开算。\n\n它读起来比 `not (x in y)` 顺，`if x not in names:` 是标准写法。\n\n坑：`x not in y and z` 会先算 `x not in y`，`in` 属于比较类运算符，优先级高于 `and`。\n\n记忆点：not in 是 in 的反面，一次判断一件事。"}, {"id": "py536", "ch": 8, "topic": "8.3 .2f 的舍入是五成双", "sec": "§8.3", "type": "choice", "q": "下面代码输出什么？", "code": "print(f'{0.125:.2f}')", "opts": ["0.12", "0.13", "0.1", "0.125"], "ans": 0, "why": "`0.125` 在二进制里是精确值，第三位正好是 5，`.2f` 走“五成双”向偶数靠，得 0.12 而不是 0.13。要严格四舍五入得用 `decimal.Decimal` 的 `ROUND_HALF_UP`。", "detail": "答案是 `0.12`。这是一次真正的“正好一半”，结果却向下走了。\n\n`0.125` 等于 1/8，二进制能精确表示，所以第 3 位小数确实是 5，没有误差干扰。\n\n格式化沿用 `round()` 的规则：正好一半时取“使末位为偶数”的方向，0.12 的末位 2 是偶数，0.13 的 3 是奇数，所以取 0.12。\n\n对照 `f'{0.135:.2f}'` 得 `0.14`：0.135 在二进制里并不精确，实际存的是稍大于 0.135 的数，于是正常向上进位，不是“五成双”失效。\n\n所以“为什么有时进有时不进”要看两件事：这个值在二进制里是否精确、精确时末位取偶。\n\n记忆点：`.2f` 也是银行家舍入，遇到整 5 先看偶数位。"}, {"id": "py537", "ch": 8, "topic": "8.3 .0f 同样按 5 取偶", "sec": "§8.3", "type": "choice", "q": "下面代码输出什么？", "code": "print(f'{0.5:.0f}', f'{1.5:.0f}', f'{2.5:.0f}')", "opts": ["0 2 2", "1 2 3", "0 1 2", "1 1 3"], "ans": 0, "why": "`.0f` 保留 0 位小数，也按“五成双”：0.5 取 0，1.5 取 2，2.5 也取 2。三个数都正好是 .5，所以结果不是直觉的 1 2 3。", "detail": "答案是 `0 2 2`。三连问专治“四舍五入”的直觉。\n\n`0.5` 的候选是 0 和 1，取偶数得 0；`1.5` 的候选是 1 和 2，取偶数得 2；`2.5` 的候选是 2 和 3，取偶数得 2。\n\n所以 1.5 和 2.5 都进到 2，看起来像“一半进一半不进”，其实是每次都找偶数。\n\n同样的规则在 `round()` 上一致：`round(2.5)` 得 2，`round(3.5)` 得 4。\n\n如果不是正好 .5，就按普通舍入：`f'{2.4:.0f}'` 得 2，`f'{2.6:.0f}'` 得 3。\n\n坑：用 `.0f` 做“四舍五入统计”会在 .5 处系统性偏低或偏高，成绩、金额这类场景要显式指定规则。\n\n记忆点：.5 不是“一律进位”，是“往偶数那边站”。"}, {"id": "py538", "ch": 8, "topic": "8.3 round() 给数值，f-string 给补零文本", "sec": "§8.3", "type": "fill", "q": "下面代码输出什么？", "code": "print(round(1.005, 2), f'{1.005:.2f}')", "a": ["1.0 1.00"], "why": "`1.005` 在二进制里存成略小于 1.005 的数，所以两者都舍到 1.00：`round()` 返回 float，打印成 `1.0`（末尾的 0 不显示）；f-string 返回字符串，补齐两位小数打印成 `1.00`。", "detail": "答案是 `1.0 1.00`。数值一样，显示完全不同，差别来自返回类型。\n\n`round(1.005, 2)` 返回 float，值是 1.0；float 打印时不会为了凑位数补 0，所以显示 `1.0`。\n\n`f'{1.005:.2f}'` 返回 str，`.2f` 规定“小数点后必须两位”，于是补成 `1.00`。\n\n这也说明两者的用途不同：还要继续算就用 `round()`，只是显示给人看就用格式化。\n\n顺带解释为什么不是 1.01：1.005 存成二进制是 1.00499999...，真正参与舍入的值比 1.005 小，所以舍到 1.00。\n\n坑：以为 `round(x, 2)` 能保证两位小数，结果 `print` 出来是 1.0，被当成 bug。\n\n记忆点：round 改数值不补零，format 出文本必补零。"}, {"id": "py539", "ch": 8, "topic": "8.1 %d 对负小数也是向零截断", "sec": "§8.1", "type": "fill", "q": "下面代码输出什么？", "code": "print('%d' % -3.9, int(-3.9))", "a": ["-3 -3"], "why": "`%d` 对浮点数就是取整截断，和 `int()` 一样朝 0 砍：-3.9 得 -3，不是 -4。它不会四舍五入，也不会向下取整。", "detail": "答案是 `-3 -3`。`%d` 与 `int()` 在负数上步调一致，都朝 0 截断。\n\n`'%d' % -3.9` 先把 -3.9 转成整数 -3，再按十进制打印，负号保留。\n\n注意 `%d` 不会像 `%.0f` 那样舍入：`'%.0f' % -3.9` 得 `-4`，因为 `%.0f` 走的是浮点舍入，两者常被混为一谈。\n\n它也不会向下取整：`'%d' % -3.9` 是 -3，`-3.9 // 1` 才是 -4。\n\n坑：`'%d' % 3.9` 得 3，`'%.0f' % 3.9` 得 4，一个截断一个舍入，两个百分号指令别混用。\n\n记忆点：%d 等于 int()，砍小数不商量。"}, {"id": "py540", "ch": 8, "topic": "8.1 %s 用 str，!r 用 repr", "sec": "§8.1", "type": "choice", "q": "下面代码输出什么？", "code": "print('%s' % 'x', '{!r}'.format('x'))", "opts": ["x 'x'", "'x' 'x'", "x x", "'x' x"], "ans": 0, "why": "`%s` 和默认的 `{}` 都调用 `str()`，字符串不带引号，得 x；`{!r}` 里 `!r` 表示改用 `repr()`，字符串带引号，得 `'x'`。", "detail": "答案是 `x 'x'`。同一个字符串，一个按内容显示，一个按可重建形式显示。\n\n`'%s' % 'x'` 里的 `%s` 调用 `str('x')`，得到 x，打印时没有引号。\n\n`'{!r}'.format('x')` 里的 `!r` 是转换标志，表示“用 repr 而不是 str”，得到 `'x'`，引号是内容的一部分。\n\nf-string 里有同样写法：`f'{x!r}'`，调试时打带引号的字符串很方便。\n\n对照 `!s` 是显式指定 str，`!a` 是 ascii()（非 ASCII 字符会转成 `\\uXXXX`）。\n\n坑：`'%r' % 'x'` 也能用，和 `%s` 只差一个字母，输出却多两个引号，看题时别漏。\n\n记忆点：%s / {} 走 str，%r / !r 走 repr。"}, {"id": "py541", "ch": 8, "topic": "8.5 join 用分隔符把列表粘起来", "sec": "§8.5", "type": "fill", "q": "下面代码输出什么？", "code": "print('-'.join(['a', 'b', 'c']))", "a": ["a-b-c"], "why": "`join` 是“分隔符”的方法，写法是 `分隔符.join(列表)`：用 `-` 把 a、b、c 依次接起来，得 a-b-c。分隔符只出现在元素之间，首尾不会多出来。", "detail": "答案是 `a-b-c`。`join` 的主语是分隔符，不是列表，这是最容易写反的地方。\n\n`'-'.join(['a', 'b', 'c'])` 把列表里的三个字符串用 `-` 连起来，中间两个 `-`，首尾没有。\n\n空分隔符就变成纯拼接：`''.join(['a', 'b', 'c'])` 得 `abc`，比循环 `+=` 快得多。\n\n元素必须全是 str：`'-'.join([1, 2])` 直接报 TypeError，得先 `map(str, ...)` 或列表推导转一遍。\n\n坑：写成 `['a', 'b'].join('-')` 会报 AttributeError: 'list' object has no attribute 'join'，方向反了。\n\n记忆点：分隔符在左，可迭代对象在右，join 只吃 str。"}, {"id": "py542", "ch": 8, "topic": "8.5 join 的元素必须都是 str", "sec": "§8.5", "type": "choice", "q": "下面代码运行结果是什么？", "code": "print('-'.join(['a', 1]))", "opts": ["输出 a-1", "输出 a1", "抛 TypeError", "抛 ValueError"], "ans": 2, "why": "`join` 只接受元素全为字符串的可迭代对象，列表里有个 int 1，抛 TypeError：sequence item 1: expected str instance, int found。想拼数字要先 `str(1)`。", "detail": "答案是抛 TypeError，完整信息是 `sequence item 1: expected str instance, int found`。\n\n消息里的 `item 1` 指下标 1 的那个元素，也就是 1 这个整数，不是“第 1 个”。\n\n`join` 内部会逐个检查元素类型，要求都是 str，因为它要把它们直接拼进一个字符串，不做隐式转换。\n\n为什么不是 ValueError：这是类型不匹配，不是值不合法。\n\n修法有两种：`'-'.join(['a', str(1)])`，或者 `'-'.join(map(str, ['a', 1]))`，后者对整批数据更省事。\n\n坑：`'-'.join([1, 2])` 报的是 `item 0`，下标从 0 开始，照着消息改对应位置即可。\n\n记忆点：join 不做类型转换，数字先转成字符串再拼。"}, {"id": "py543", "ch": 8, "topic": "8.5 split 会保留空字段", "sec": "§8.5", "type": "fill", "q": "下面代码输出什么？", "code": "print('a,b,,c'.split(','))", "a": ["['a', 'b', '', 'c']"], "why": "两个逗号之间什么都没有，`split` 仍然切出一个空字符串，所以列表是 4 个元素，中间那个是 `''`。要去掉空段得自己过滤，比如 `[x for x in s.split(',') if x]`。", "detail": "答案是 `['a', 'b', '', 'c']`。连续的分隔符不会合并，空字段照样保留。\n\n从字符串开头切：`a` 到逗号、`b` 到逗号、然后是两个逗号之间“空”、最后是 `c`，一共 4 段。\n\n所以空字段是切分位置的必然产物，`split` 不会替你去掉它。\n\n`'a,b,,c'` 里有 3 个逗号，段数就是 3 + 1 = 4，规则是“逗号数加一”。\n\n想过滤空串：`[x for x in s.split(',') if x]`，或者先 `strip` 再判断。\n\n对照不带参数的 `split()`：它按任意空白切分并自动丢弃空段，两种行为完全不同。\n\n记忆点：带分隔符的 split 一个不落，空字段也算一个元素。"}, {"id": "py544", "ch": 8, "topic": "8.5 不带参数的 split() 按空白切", "sec": "§8.5", "type": "choice", "q": "下面代码输出什么？", "code": "print('  a  b '.split(), ''.split())", "opts": ["['a', 'b'] []", "['', 'a', '', 'b', ''] ['']", "['a', 'b'] ['']", "['  a  b '] []"], "ans": 0, "why": "不带参数的 `split()` 把任意长度的空白当作一个分隔符，并丢掉首尾和中间的空段，所以第一个得 `['a', 'b']`；空字符串没有任何内容，切出来是空列表 `[]`，不是 `['']`。", "detail": "答案是 `['a', 'b'] []`。无参 split 和带参 split 是两套规则。\n\n无参 `split()` 里，空格、制表符、换行都算分隔符，连续空白被折成一个，首尾空白不产生空段，所以 `'  a  b '` 只切出 a 和 b 两个元素。\n\n空串 `''` 切出来是 `[]`：没有任何内容，不是 `['']`。\n\n对照带参：`''.split(',')` 得 `['']`，因为这里只有“一段空内容”，规则不同。\n\n同样 `'a,b'.split()` 得 `['a,b']`，没有空白就整段返回，逗号不算分隔符。\n\n坑：`input().split()` 读一行多个数最常用，但 `''.split()` 得 []，直接取 `[0]` 会 IndexError。\n\n记忆点：无参 split 按空白切、丢空段；空串得空列表。"}, {"id": "py545", "ch": 8, "topic": "8.5 strip 去的是字符集不是子串", "sec": "§8.5", "type": "choice", "q": "下面代码输出什么？", "code": "print('xyhixy'.strip('xy'))", "opts": ["hi", "hixy", "xyhi", "h"], "ans": 0, "why": "`strip('xy')` 的参数是“字符集合”，不是要删的子串：它从两端反复删掉 x 或 y，直到遇到别的字符，所以两端各去掉 xy，中间的 i 保留，得 hi。", "detail": "答案是 `hi`。参数里的 x 和 y 是两个可用字符，不分顺序、不要求连成子串。\n\n从左端看：x 在集合里，删；y 在集合里，删；h 不在，停。从右端同理删掉 y、x，遇到 i 停。\n\n所以两端各少了两个字符，剩下 `hi`。\n\n如果按“删子串 xy”理解，会以为只删一个 xy，要么得 `hixy` 要么得 `xyhi`，都不对。\n\n`lstrip` / `rstrip` 是单边版本：`'xyhixy'.lstrip('xy')` 得 `hixy`，`rstrip` 得 `xyhi`。\n\n坑：想删固定前缀用 `removeprefix`，别用 `strip`：`'abab'.removeprefix('ab')` 得 `ab`，`lstrip('ab')` 得空串。\n\n记忆点：strip 认字符集合，不认子串，而且两端一起削。"}, {"id": "py546", "ch": 8, "topic": "8.5 replace 返回新串，原串不动", "sec": "§8.5", "type": "fill", "q": "下面代码输出什么？", "code": "s = 'abc'\nt = s.replace('b', 'X')\nprint(s, t)", "a": ["abc aXc"], "why": "字符串不可变，`replace` 不会改 s，而是返回一个新字符串；s 仍是 abc，t 是替换后的 aXc，所以输出 abc aXc。想让 s 变必须写 `s = s.replace(...)`。", "detail": "答案是 `abc aXc`。replace 只负责造新串，不负责改旧串。\n\n`s.replace('b', 'X')` 扫描 s，把 b 换成 X，拼出一个新字符串 aXc 返回；s 本身一个字符都没变。\n\n`t = ...` 把这个新串绑到 t 上，于是两个名字指向两个不同对象。\n\n所有字符串方法都是这个风格：`upper()`、`strip()`、`replace()` 都返回新串，原串永远不变。\n\n所以 `s.upper()` 单独一行是无效代码，结果被丢掉，必须 `s = s.upper()` 或直接 `print(s.upper())`。\n\n坑：以为 `s.replace('b', 'X')` 已经改好 s，后面打印发现没变——这不是 bug，是设计。\n\n记忆点：字符串方法不改原件，改的是复印件，别忘接住返回值。"}, {"id": "py547", "ch": 8, "topic": "8.6 字符串不可变，不能改单个字符", "sec": "§8.6", "type": "choice", "q": "下面代码运行结果是什么？", "code": "s = 'abc'\ns[0] = 'A'", "opts": ["s 变成 Abc", "不报错，但 s 不变", "抛 TypeError", "抛 ValueError"], "ans": 2, "why": "字符串不可变，不支持按下标赋值，`s[0] = 'A'` 抛 TypeError：'str' object does not support item assignment。要改得造新串，比如 `'A' + s[1:]` 或 `s.replace('a', 'A')`。", "detail": "答案是抛 TypeError，完整信息是 `'str' object does not support item assignment`。\n\n字符串创建后内容固定，任何“改一个字符”的操作都会失败，这是不可变的含义。\n\n列表可以 `a[0] = 'A'`，因为列表可变；字符串和元组都不行，元组报的是 `'tuple' object does not support item assignment`。\n\n要改的写法是造新串：`s = 'A' + s[1:]` 得 `Abc`，或者 `s = s.replace('a', 'A')`。\n\n坑：`s[0].upper()` 也不改 s，它返回新字符然后被丢弃，必须写成 `s = s[0].upper() + s[1:]`。\n\n记忆点：字符串只读，改字符等于造新串。"}, {"id": "py548", "ch": 8, "topic": "8.6 切片含头不含尾，步长 -1 反转", "sec": "§8.6", "type": "choice", "q": "下面代码输出什么？", "code": "print('Python'[1:4], 'Python'[::-1])", "opts": ["yth nohtyP", "ythP nohtyP", "yth Python", "ythP Python"], "ans": 0, "why": "切片 `[1:4]` 含头不含尾，取下标 1、2、3 得 yth（不含第 4 位的 o）；`[::-1]` 步长为 -1，从头到尾反过来，得 nohtyP。", "detail": "答案是 `yth nohtyP`。两个切片各考一条规则：范围含头不含尾，步长负数反向走。\n\n`'Python'` 下标：0=P、1=y、2=t、3=h、4=o、5=n。\n\n`[1:4]` 取 1、2、3 三位，得 `yth`；如果写成 `[1:5]` 才含 o，得 `ytho`。\n\n`[::-1]` 省略起止、步长 -1，相当于整体反转，得 `nohtyP`。\n\n同理 `[-2:]` 得 `on`（最后两个字符），`[:3]` 得 `Pyt`，`[::2]` 得 `Pto`（隔一个取一个）。\n\n坑：切片越界不报错，`'ab'[0:99]` 得 `ab`；但单下标越界会 IndexError，`'ab'[99]` 直接崩。\n\n记忆点：切片含头不含尾、越界不报错、步长 -1 就是反转。"}, {"id": "py549", "ch": 8, "topic": "8.5 lstrip 削字符集，removeprefix 削真前缀", "sec": "§8.5", "type": "fill", "q": "下面代码输出什么？", "code": "print(repr('abab'.lstrip('ab')), repr('abab'.removeprefix('ab')))", "a": ["'' 'ab'"], "why": "`lstrip('ab')` 把左边所有 a、b 字符全削掉，`abab` 全是这两个字母，削成空串；`removeprefix('ab')` 只删一次真正的前缀，剩下 ab。一个按字符集，一个按整段前缀。", "detail": "答案是 `'' 'ab'`。同样的参数，两个方法给出的结果完全不同。\n\n`lstrip('ab')` 看的是字符集合 {a, b}：从左边逐个判断，a 在集合里删、b 在、a 在、b 在，四个字符全删完，剩空串。\n\n`removeprefix('ab')` 看的是完整前缀 `'ab'`：开头确实是 ab，删掉这一段就停，剩下 `ab`。\n\n`repr` 把结果包上引号，空串显示成 `''`，否则 print 出来什么都看不见，分不清是空串还是没输出。\n\n坑：`'abc'.lstrip('ab')` 得 `c`，但 `'abc'.removeprefix('ba')` 得 `abc`（前缀不匹配就不动），而 `'abc'.lstrip('ba')` 仍然得 `c`。\n\n记忆点：strip 系按字符集反复削，removeprefix 按整段前缀削一次。"}, {"id": "py550", "ch": 9, "topic": "9.7 range 三参数：起点、终点、步长", "sec": "§9.7", "type": "fill", "q": "下面这段循环会依次打印哪几个数？（写成一行，用空格分隔）", "code": "for i in range(2, 11, 3):\n    print(i)", "a": ["2 5 8"], "why": "`range(2, 11, 3)` 从 2 起、每次加 3、到 11 之前停：2、5、8。下一个是 11，已经等于终点，取不到。终点是「不超过」，不是「到达」。", "detail": "三个数是 2、5、8，写成一行就是 `2 5 8`。\n\n`range(start, stop, step)` 三个参数各管一件事：从 start 出发，每次加 step，只要还小于 stop 就继续。2 → 5 → 8，下一次算出来是 11，而 11 不小于 11，循环停在这里。\n\n所以步长 3 既不等于「打印 3 个数」，也不等于「数到 11 为止」。想知道个数可以写 `len(range(2, 11, 3))`，实测是 3。\n\n常见错法有两种：把终点当成包含，写成 `2 5 8 11`；或者把起点当 0，写成 `0 3 6 9`。\n\n记忆点：终点永远取不到，最后一个数由起点加上若干个步长决定。"}, {"id": "py551", "ch": 9, "topic": "9.7 负步长 range 的方向", "sec": "§9.7", "type": "fill", "q": "步长为负的 range，下面这行输出什么？", "code": "print(list(range(10, 3, -3)))", "a": ["[10, 7, 4]"], "why": "从 10 开始每次减 3：10、7、4，下一个是 1，已经小于终点 3，于是停下。负步长时「还没到终点」指大于终点。", "detail": "结果是 `[10, 7, 4]`。\n\n负步长的规则和正步长镜像：从 10 出发，每次减 3，只要当前值还大于 stop=3 就继续。10 → 7 → 4 → 1，1 越过了 3，所以停在 4 之后。\n\n很多人把终点 3 当成要打印的数，写成 `[10, 7, 4, 1]`。range 的终点从不参与，正负步长都一样。\n\n步长也不必整除区间长度：`list(range(10, 3, -4))` 得 `[10, 6]`，下一个 2 又越界了。\n\n记忆点：正步长往上够、负步长往下够，终点那一格永远踩不到。"}, {"id": "py552", "ch": 9, "topic": "9.7 负步长不会自动带上 0", "sec": "§9.7", "type": "fill", "q": "下面这行输出的列表里没有 0，请写出完整结果。", "code": "print(list(range(6, 0, -2)))", "a": ["[6, 4, 2]"], "why": "6、4、2，再下一个正好是 0，而 0 就是终点，不含，所以列表里没有 0。", "detail": "结果 `[6, 4, 2]`，列表里没有 0。\n\n6 → 4 → 2 → 0，最后一步刚好落在 stop 上。range 的终点是开区间，踩到那一格就停，所以 0 被挡在门外。\n\n想连 0 一起要，得把终点再退一格：`list(range(6, -1, -2))` 得 `[6, 4, 2, 0]`（实测）。\n\n这个坑在倒计时题里最常见：从 10 数到 0，写 `range(10, 0, -1)` 会漏掉 0，`list(range(10, 0, -1))` 只到 1。\n\n记忆点：负步长想包含终点，stop 要再往后退一格。"}, {"id": "py553", "ch": 9, "topic": "9.7 空 range 也会执行 for 的 else", "sec": "§9.7", "type": "fill", "q": "空 range 后面的 else 会执行吗？写出这行的输出。", "code": "total = 0\nfor i in range(3, 3):\n    total += i\nelse:\n    print('empty', total)", "a": ["empty 0"], "why": "`range(3, 3)` 起点等于终点，一个数都没有，循环体零次；没有 break，所以 else 照常执行，打印 `empty 0`。", "detail": "输出一行 `empty 0`。\n\n`range(3, 3)` 的起点和终点相同，长度是 0。for 拿到的是空序列，`total += i` 一次都没跑，total 还是初值 0。\n\n关键在 else：for 的 else 只在循环「自然结束」时执行。空序列也算自然结束——它没有被 break 打断，所以 else 一定会跑。\n\n反过来对照：循环体里第一轮就 break，else 不执行；一次都没进循环，else 反而一定执行。这两种情况常被混为一谈。\n\n记忆点：空 range 不跑循环体，但一定跑 else。"}, {"id": "py554", "ch": 9, "topic": "9.7 方向反了的 range 是空的", "sec": "§9.7", "type": "fill", "q": "下面这段循环跑完后 `print(n)` 输出什么？", "code": "n = 0\nfor i in range(1, 6, -1):\n    n += 1\nprint(n)", "a": ["0"], "why": "起点 1 小于终点 6，步长却是 -1，方向反了，range 一开始就是空的，循环体零次，n 保持 0。", "detail": "输出 0。\n\n步长为负时，range 要求起点大于终点才产数。这里 1 比 6 小，再减只会更小，条件一开始就不成立。\n\n`len(range(1, 6, -1))` 也是 0。判断办法很简单：先看方向，负步长要从大到小，再看区间。\n\n想要 5、4、3、2、1，得写 `range(5, 0, -1)`：起点换成大的那头，终点写成目标再退一格。\n\n记忆点：方向反了不报错、不警告，只是悄悄变成空 range，循环体一次都不跑。"}, {"id": "py555", "ch": 9, "topic": "9.12 while 与 for 的等价改写", "sec": "§9.12", "type": "choice", "q": "下面这段 while 循环的输出，与哪个 for 循环完全相同？", "code": "i = 0\nwhile i < 10:\n    print(i)\n    i += 3", "opts": ["for i in range(0, 10, 3): print(i)", "for i in range(0, 10): print(i)", "for i in range(3, 10): print(i)", "for i in range(0, 13, 3): print(i)"], "ans": 0, "why": "while 的 i 是 0、3、6、9，下一轮 12 不满足 i<10，正好是 `range(0, 10, 3)`。其余三个分别打 0~9、3~9、还有多一个 12。", "detail": "两者输出都是 0、3、6、9。\n\nwhile 的三件套要一一对上：初值 `i = 0` 对应 start，条件 `i < 10` 对应 stop 的开区间，`i += 3` 对应 step。\n\n四个选项差在参数：`range(0, 10)` 少了步长变成逐 1，打 0 到 9；`range(3, 10)` 起点抬高，少了 0；`range(0, 13, 3)` 终点放到 13，12 混了进来（实测 0 3 6 9 12）。\n\n还有一处顺序：`i += 3` 写在 print 之后，所以第一轮打印 0；如果改成先加后打，序列整体右移成 3、6、9、12，就不再等价。\n\n记忆点：while 改 for，找三样——初值、条件边界、每轮增量。"}, {"id": "py556", "ch": 9, "topic": "9.12 for 改写成 while", "sec": "§9.12", "type": "fill", "q": "把 `for i in range(1, 6): print(i)` 改写成下面这段 while，横线处应填什么？", "code": "i = 1\nwhile ______:\n    print(i)\n    i += 1", "a": ["i < 6", "i <= 5"], "why": "range(1, 6) 给的是 1、2、3、4、5，终点 6 取不到，所以条件是 `i < 6`；写 `i <= 6` 会多打一个 6。", "detail": "填 `i < 6`，写 `i <= 5` 也对，两种都只让 1~5 进循环。\n\nrange 的 stop 是开区间，循环在 i 等于 6 之前就该退出，所以条件是严格小于。\n\n初值 `i = 1` 已经给出，对应 range 的 start；`i += 1` 对应默认步长 1。三件套齐了，两个循环就完全等价。\n\n两个常见错法：写 `while i <= 6` 多跑一轮打出 6；或者把初值写成 0，第一行变成 0。\n\n记忆点：for 的 stop 取不到，翻成 while 就是「严格小于」。"}, {"id": "py557", "ch": 9, "topic": "9.8 for 循环结束后循环变量的值", "sec": "§9.8", "type": "fill", "q": "循环结束后 `print(i)` 输出什么？", "code": "for i in range(3):\n    pass\nprint(i)", "a": ["2"], "why": "range(3) 依次给出 0、1、2，Python 的 for 变量是普通变量，循环结束后仍保留最后一轮的值 2。", "detail": "输出 2。\n\nPython 的 for 不是「循环结束变量就消失」的语义。i 只是普通变量，每轮被赋一次值，最后一轮拿到 2 后就停在那里。\n\n所以 range(3) 跑完，i 是 2 而不是 3：3 从来没被赋给 i，它只是「下一个要取的值」，还没进循环体。\n\n和 while 对照一下：`i = 0; while i < 3: i += 1` 结束后 i 是 3，因为 3 是自增算出来的、写在变量里的。\n\n记忆点：for 的循环变量停在最后一个元素上，while 的计数器停在让条件变假的那个值上。"}, {"id": "py558", "ch": 9, "topic": "9.8 while 结束后计数器的值", "sec": "§9.8", "type": "fill", "q": "循环结束后 `print(i)` 输出什么？", "code": "i = 0\nwhile i < 3:\n    i += 1\nprint(i)", "a": ["3"], "why": "条件 `i < 3` 一直为真，直到 i 变成 3 才为假；循环停下时 i 已经是 3，不是 2。", "detail": "输出 3。\n\n执行顺序是这样：0<3 真，i 变 1；1<3 真，变 2；2<3 真，变 3；3<3 假，退出。退出时 i 就是 3。\n\n所以 while 的计数器总比「最后一轮的编号」大 1。这个性质常被拿来数次数：循环结束时 i 正好等于循环体执行了几次。\n\n换成 for 写同一件事，`for i in range(3): pass` 结束后 i 是 2，两者差 1，对答案时容易错。\n\n记忆点：while 停下时变量已经越界，for 停下时变量还在界内。"}, {"id": "py559", "ch": 9, "topic": "9.8 空循环之后循环变量不存在", "sec": "§9.8", "type": "choice", "q": "运行这段代码会看到什么？", "code": "for i in range(0):\n    print(i)\nprint(i)", "opts": ["什么都不输出", "NameError: name 'i' is not defined", "输出 0", "输出 None"], "ans": 1, "why": "range(0) 是空序列，循环体一次都不执行，i 从来没被赋过值；最后一行用到未定义的名字，抛 NameError。", "detail": "会抛 NameError，屏幕上没有任何输出。\n\nfor 的循环变量是在「取到元素、准备进循环体」那一刻才被赋值的。空 range 一个元素都没有，赋值动作从未发生。\n\n所以最后一行里的 i 是个从没出现过的名字。名字不存在是 NameError，不是 ValueError，也不是输出 0。\n\n对照一下：`for i in range(1)` 结束后 i 是 0，能正常打印（实测）。差别只在序列空不空。\n\n记忆点：空循环里，循环变量等于不存在。"}, {"id": "py560", "ch": 9, "topic": "9.4 for-else：找到就 break", "sec": "§9.4", "type": "fill", "q": "这段带 else 的 for 循环会打印什么？", "code": "nums = [3, 7, 12, 5]\nfor n in nums:\n    if n % 2 == 0:\n        print('found', n)\n        break\nelse:\n    print('none')", "a": ["found 12"], "why": "12 是第一个偶数，打印后立刻 break，循环被打断，else 被跳过，所以只有一行 `found 12`。", "detail": "输出一行 `found 12`。\n\nfor 依次拿到 3、7，都过不了 `n % 2 == 0`，到 12 才进 if：先 print 再 break。\n\nbreak 让循环「非自然结束」，else 整块被跳过；后面的 5 也不会再看。\n\n如果列表里全是奇数，break 从来不执行，循环自己走完，else 才会打印 `none`。\n\n记忆点：for-else 的 else 就是「没被 break 打断」那条分支，是 Python 版的「没找到」。"}, {"id": "py561", "ch": 9, "topic": "9.4 for-else：一次都没 break", "sec": "§9.4", "type": "fill", "q": "下面这个 for 循环会打印什么？", "code": "for n in [1, 3, 5]:\n    if n > 10:\n        break\nelse:\n    print('all small')", "a": ["all small"], "why": "1、3、5 都不大于 10，if 一次也没命中，break 没执行，循环自然走完，else 执行并打印 `all small`。", "detail": "输出 `all small`。\n\n这个 else 挂在 for 上，不属于 if。它的缩进和 for 对齐，属于整个循环。\n\n三个数都过不了 `n > 10`，break 一次都没执行，循环把自己迭代完，这叫自然结束，else 照常执行。\n\n坑：很多人以为 else 表示「有元素满足条件」，其实正相反——else 是「一个 break 都没触发」时才走的分支。\n\n记忆点：else 跟着 for 走，看的是有没有 break，不是条件真假。"}, {"id": "py562", "ch": 9, "topic": "9.9 break 只结束内层，外层继续", "sec": "§9.9", "type": "fill", "q": "下面这段双层循环，最后打印的 count 是多少？", "code": "count = 0\nfor i in range(1, 4):\n    for j in range(1, 4):\n        if j > i:\n            break\n        count += 1\nprint(count)", "a": ["6"], "why": "break 只结束内层。i=1 时内层加 1 次、i=2 加 2 次、i=3 加 3 次，外层不受影响，合计 6。", "detail": "输出 6。\n\n内层遇到 `j > i` 就 break：i=1 时 j 取 1 加一次，j=2 立刻 break；i=2 时 j 取 1、2 各加一次；i=3 时 j 取 1、2、3 加三次。\n\nbreak 只作用于内层，外层的 i 循环照常进入下一轮，所以三轮的 1、2、3 次全都保留。\n\n合计 1+2+3 = 6。要是 break 能跳两层，i=1 那轮结束整个循环就完了，count 只会是 1。\n\n坑：把 `j > i` 看成 `j >= i`，每轮少加一次，结果变成 0+1+2 = 3。\n\n记忆点：break 只跳一层；先数清每轮内层加了几次，再相加。"}, {"id": "py563", "ch": 9, "topic": "9.9 continue 只跳过内层这一轮", "sec": "§9.9", "type": "fill", "q": "下面这段双层循环最后打印什么？", "code": "count = 0\nfor i in range(1, 4):\n    for j in range(1, 4):\n        if j == 2:\n            continue\n        count += 1\nprint(count)", "a": ["6"], "why": "continue 只放弃最内层当前这一轮。每个 i 里 j 取 1、3 各加一次，共 2 次，外层 3 轮得 6。", "detail": "输出 6。\n\n内层 j 取 1、2、3：j=1 加 1；j=2 命中 continue，跳过本轮剩下的语句；j=3 再加 1。每个外层轮次加 2 次。\n\ncontinue 不是结束整个循环，也不是结束内层，只是放弃当前这一轮。j=3 这一轮照常执行。\n\n外层 3 轮 × 每轮 2 次 = 6。常见错答有 9（以为 continue 不生效）和 3（以为它结束了内层）。\n\n记忆点：continue 只丢当前一轮，break 才结束整层。"}, {"id": "py564", "ch": 9, "topic": "9.3 continue 与自增的先后顺序", "sec": "§9.3", "type": "fill", "q": "下面这段 while 循环最后打印什么？", "code": "i = 0\ntotal = 0\nwhile i < 6:\n    i += 1\n    if i % 2:\n        continue\n    total += i\nprint(total)", "a": ["12"], "why": "自增写在 continue 前面，i 每轮一定变大：1 跳过、2 累加、3 跳过、4 累加、5 跳过、6 累加，得 12。", "detail": "输出 12。\n\n2 + 4 + 6 = 12。i 依次变成 1 到 6，奇数被 continue 跳过，偶数累加。\n\n这里的顺序是安全的：`i += 1` 在 continue 之前，所以每轮 i 都会推进，循环能正常结束。\n\n要是把自增挪到 continue 后面，i=1 时 `i % 2` 为真，continue 直接跳回条件判断，`i += 1` 永远执行不到，i 卡在 1 不动——用计数器封顶实测，跑 21 轮后 i 仍是 1。\n\n记忆点：while 里的 continue 前面，必须先把计数器推进。"}, {"id": "py565", "ch": 9, "topic": "9.11 累加的初值必须是 0", "sec": "§9.11", "type": "fill", "q": "下面这段累加代码打印什么？", "code": "total = 1\nfor i in range(1, 5):\n    total += i\nprint(total)", "a": ["11"], "why": "累加初值该写 0。这里从 1 起步再累加 1+2+3+4，多算了一个 1，结果 11 而不是 10。", "detail": "输出 11。\n\n循环加的是 1、2、3、4，和是 10；total 又从 1 起步，等于凭空多了一个 1。\n\n累加的初值必须是 0，它代表「空的和」。这样第一轮 `total += 1` 才是 0+1。\n\n初值选错不会报错，结果只是整体平移一格，测试时最难查。\n\n顺带一提，Python 自带 `sum(range(1, 5))` 也是 10，可以拿来验算。\n\n记忆点：加法初值 0，乘法初值 1，写反就是差 1 或全 0。"}, {"id": "py566", "ch": 9, "topic": "9.11 累乘的初值必须是 1", "sec": "§9.11", "type": "fill", "q": "下面这段累乘代码打印什么？", "code": "prod = 0\nfor i in range(1, 5):\n    prod *= i\nprint(prod)", "a": ["0"], "why": "累乘初值必须是 1。这里初值 0，而 0 乘任何数还是 0，四轮之后仍然是 0。", "detail": "输出 0，不是 24。\n\n`prod *= i` 等于 `prod = prod * i`。第一轮就是 0 * 1 = 0，之后 0 * 2、0 * 3 一直保持 0。\n\n乘法里 0 是吸收元，一旦沾上就再也出不来。加法那边对应的坑是初值写成 1，只会多 1。\n\n改成 `prod = 1`，得到 1×2×3×4 = 24（实测）。\n\n记忆点：累乘写 1，累加写 0；反了都不报错，只会算错。"}, {"id": "py567", "ch": 9, "topic": "9.3 死循环的识别与计数器封顶", "sec": "§9.3", "type": "fill", "q": "下面这段本来会死循环，为了验证在里面加了计数器保护。`print(steps)` 输出什么？", "code": "i = 0\nsteps = 0\nwhile i < 5:\n    if steps > 20:\n        break\n    i -= 1\n    steps += 1\nprint(steps)", "a": ["21"], "why": "i 只减不增，`i < 5` 永远为真，本身就是死循环；保护条件 `steps > 20` 在第 21 轮后触发 break，所以输出 21。", "detail": "输出 21。\n\ni 从 0 开始只减：-1、-2、-3……永远小于 5，循环条件永远成立。没有保护就是死循环。\n\n保护写在循环体开头：steps 从 0 一路加上去，到 21 时 `steps > 20` 第一次为真，break 退出，此时已经跑完 21 轮。\n\n所以这题考两件事：看出它是死循环，读懂保护条件为什么在 21 停下。\n\n真跑这种代码必须加计数器封顶，否则解释器会一直转，只能手动杀进程。\n\n记忆点：循环变量朝反方向走，条件永远为真；验证死循环只能靠计数器封顶。"}, {"id": "py568", "ch": 12, "topic": "12.1 形参与实参", "sec": "§12.1", "type": "choice", "q": "这段代码里 `name`、`msg` 与调用时的 `'Tom'` 分别叫什么？", "code": "def greet(name, msg='hi'):\n    print(msg, name)\ngreet('Tom')", "opts": ["name、msg 是形参，'Tom' 是实参", "name、msg 是实参，'Tom' 是形参", "两者都是实参", "两者都是形参"], "ans": 0, "why": "def 括号里列出的 `name`、`msg` 是形参，只是占位的名字；调用时真正传进去的 `'Tom'` 是实参。", "detail": "这段代码输出 `hi Tom`，但题目问的是这几个名字的身份。\n\ndef 那一行列出的 `name`、`msg` 是形参：只是占位的名字，此刻它们还没有任何值。\n\n调用 `greet('Tom')` 时括号里的 `'Tom'` 是实参：真正交给函数的值，按位置绑定给 name。\n\nmsg 有默认值 `'hi'`，这次没传，就用默认值补上。所以打印出来是 `hi Tom`，顺序按 print 里的 msg、name。\n\n记忆点：定义处是形参，调用处是实参；形参是名字，实参是值。"}, {"id": "py569", "ch": 12, "topic": "12.2 函数里的 print 与 return", "sec": "§12.2", "type": "choice", "q": "单独运行下面这段，屏幕上会显示什么？", "code": "def double(n):\n    print('in', n)\n    return n * 2\ndouble(3)", "opts": ["in 3", "6", "in 3 然后 6", "什么都不显示"], "ans": 0, "why": "函数体里的 print 会显示 `in 3`；`return n * 2` 只是把 6 交回调用处，外面没有 print 接住，所以 6 不显示。", "detail": "屏幕只有一行 `in 3`。\n\nprint 负责「显示」，return 负责「交回」，这两件事互不替代：print 完还得 return 才有返回值。\n\n调用写成 `double(3)`，返回值 6 算出来就被扔掉了，没有任何语句去打印它。\n\n想让 6 出现，得改成 `print(double(3))`，那样屏幕是两行：`in 3` 和 `6`（实测）。\n\n记忆点：函数里的 print 是副作用，return 才是结果；外面不接，结果就消失。"}, {"id": "py570", "ch": 12, "topic": "12.2 裸 return 也返回 None", "sec": "§12.2", "type": "fill", "q": "调用这个函数再把结果打印出来，看到什么？", "code": "def f(n):\n    if n > 0:\n        return\nprint(f(5))", "a": ["None"], "why": "`return` 后面没写值，函数返回 None；外面用 print 接住，于是打印 None。", "detail": "输出 None。\n\n裸 `return` 的意思是「现在结束函数」，它等价于 `return None`，和完全不写 return 的返回值一样。\n\n这里 n=5 满足 `n > 0`，函数在 if 里就退出，后面的代码不再执行。\n\n传 0 或负数时 if 不成立，函数一路走到末尾，返回值同样是 None（实测 f(0) 也是 None）。两条路径殊途同归。\n\n记忆点：return 不带值、或者根本不写 return，得到的都是 None。"}, {"id": "py571", "ch": 12, "topic": "12.6 名字在调用时才查", "sec": "§12.6", "type": "fill", "q": "两个函数一前一后定义，最后一行打印什么？", "code": "def outer():\n    return inner()\ndef inner():\n    return 1\nprint(outer())", "a": ["1"], "why": "函数体里的名字在调用那一刻才查找。执行 `outer()` 时 inner 早已定义好，所以正常返回 1。", "detail": "输出 1。\n\ndef 只是把函数对象绑到名字上，函数体此刻并不执行；`inner` 这个名字要等真正调用 outer() 时才被查找。\n\n执行到最后一行时，`outer` 和 `inner` 两个名字都已经存在，所以函数体里引用后定义的函数完全合法。\n\n对照一下：如果在两个 def 之前就写 `print(outer())`，那时 outer 还没绑定，直接 NameError（实测）。\n\n记忆点：函数体是调用时才执行的，名字查得晚，后定义也能用；但调用语句本身必须排在被调函数定义之后。"}, {"id": "py572", "ch": 12, "topic": "12.5 函数内赋值默认是局部变量", "sec": "§12.5", "type": "fill", "q": "函数里也有一个 x，最后一行打印什么？", "code": "x = 5\ndef f():\n    x = 10\n    return x\nprint(f(), x)", "a": ["10 5"], "why": "函数里的 `x = 10` 创建的是局部变量，不会动外面的 x；f() 返回 10，外面的 x 仍是 5。", "detail": "输出 `10 5`。\n\n函数一执行 `x = 10` 就创建了一个属于 f 的局部变量，它和模块里那个 x 同名，但不是同一个。\n\nreturn 交回的是局部变量 10；函数结束后局部变量消失，模块里的 x 从头到尾没被碰过，还是 5。\n\n想改外面的 x，必须在函数里先写 `global x`，否则赋值永远是「新建局部变量」。\n\n记忆点：函数内赋值默认造局部变量；读全局可以，写全局要 global。"}, {"id": "py573", "ch": 12, "topic": "12.5 global 声明才改得动全局变量", "sec": "§12.5", "type": "fill", "q": "加上 `global` 声明之后，最后一行打印什么？", "code": "x = 5\ndef f():\n    global x\n    x = 10\nf()\nprint(x)", "a": ["10"], "why": "`global x` 声明后，函数里的 `x = 10` 写到模块那个 x 上，所以外面打印 10。", "detail": "输出 10。\n\n`global x` 不是赋值，而是一句声明：告诉解释器「这个函数里的 x 指的就是全局那个」。\n\n有了它，`x = 10` 才是修改全局变量；没有它，同样的语句会新建局部变量，外面的 5 保持不变。\n\n还要注意 f() 必须被真正调用，函数体才执行。只写 def 不调用，x 永远不会变。\n\n记忆点：改全局变量三步走——global 声明、赋值、别忘了调用函数。"}, {"id": "py574", "ch": 12, "topic": "12.2 return 提前退出函数", "sec": "§12.2", "type": "fill", "q": "这个函数返回什么？", "code": "def first_neg(nums):\n    for n in nums:\n        if n < 0:\n            return n\n    return 0\nprint(first_neg([3, -2, 5, -7]))", "a": ["-2"], "why": "循环遇到第一个负数 -2 就 return，函数立刻结束；后面的 5 和 -7 都不会再看。", "detail": "输出 -2。\n\n3 不满足 `n < 0`，继续；-2 满足，直接 return -2，整个函数在这一行结束。\n\n所以 5 和 -7 连被检查的机会都没有。这就是「提前退出」：找到就交卷，不把循环跑完。\n\n如果改成先把结果存进变量、循环结束后再 return，拿到的会是最后一个负数 -7，含义完全不同。\n\n记忆点：return 一执行，函数立刻结束，循环也一起结束。"}, {"id": "py575", "ch": 12, "topic": "12.4 返回多个值其实是元组", "sec": "§12.4", "type": "fill", "q": "这个函数的返回值打印出来长什么样？", "code": "def minmax(a, b):\n    if a < b:\n        return a, b\n    return b, a\nprint(minmax(5, 2))", "a": ["(2, 5)"], "why": "`return a, b` 实际返回的是元组；5 < 2 不成立，走第二个 return，得到 (2, 5)。", "detail": "输出 `(2, 5)`，带圆括号，是元组。\n\n`return a, b` 里的逗号把两个值打包成一个元组，等价于 `return (a, b)`。Python 没有真正意义上的「返回两个值」。\n\n5 < 2 不成立，跳过第一个 return，落到 `return b, a`，顺序变成 2、5。\n\n外面打印元组会带上括号和逗号；也可以写 `lo, hi = minmax(5, 2)` 直接拆开成两个变量。\n\n记忆点：逗号就是打包，多个返回值其实是一整个元组。"}, {"id": "py576", "ch": 12, "topic": "12.4 返回值里的下标与切片", "sec": "§12.4", "type": "fill", "q": "返回值打印出来是什么样子？", "code": "def split(s):\n    return s[0], s[1:]\nprint(split('hello'))", "a": ["('h', 'ello')"], "why": "`s[0]` 是 'h'，`s[1:]` 是 'ello'，逗号把它们打包成元组打印出来。", "detail": "输出 `('h', 'ello')`。\n\n`s[0]` 取第一个字符；`s[1:]` 从下标 1 切到末尾，含头不含尾，得到 'ello'。\n\n两个值用逗号隔开，return 把它们打包成元组，print 打印时就带上了圆括号和单引号。\n\n注意 `s[0]` 得到的 'h' 是字符串，不是别的类型，Python 里没有单独的字符类型。\n\n记忆点：return 后面加逗号就变成元组；切片含头不含尾。"}, {"id": "py577", "ch": 12, "topic": "12.3 函数名不带括号不是调用", "sec": "§12.3", "type": "choice", "q": "下面代码会显示什么？", "code": "def square(n):\n    return n * n\nprint(square)", "opts": ["25", "打印函数对象，类似 `<function square at 0x...>`", "None", "TypeError"], "ans": 1, "why": "`square` 后面没有括号，交给 print 的是函数对象本身，显示的是它的表示形式；要调用必须写 `square(5)`。", "detail": "会打印类似 `<function square at 0x000001...>` 的一行。\n\n函数名是一个变量，指向函数对象。写 `square` 只是把这个对象交给 print，并不会执行函数体。\n\n加上括号才是调用：`square(5)` 才会跑 `return n * n` 拿到 25。\n\n括号里忘填参数也会报错，那是 TypeError（缺少位置参数），和这里「根本没调用」是两码事。\n\n记忆点：函数名不带括号是对象，带括号才是调用。"}, {"id": "py578", "ch": 13, "topic": "13.2 KeyError：字典缺键", "sec": "§13.2", "type": "fill", "q": "运行下面这行，会抛出哪种异常？填异常类名。", "code": "d = {'a': 1, 'b': 2}\nprint(d['c'])", "a": ["KeyError"], "why": "字典里没有 'c' 这个键，用方括号取不存在的键抛 KeyError，不是 IndexError。", "detail": "抛 KeyError: 'c'。\n\n字典的方括号是按「键」查，不存在的键没有默认值，直接抛 KeyError。\n\n列表越界抛的是 IndexError，两者都是「取不到」，但异常类型不同，取决于容器是列表还是字典。\n\n不想让它崩，可以用 `d.get('c')`，取不到返回 None；或者 `d.get('c', 0)` 给个默认值。\n\n记忆点：列表越界 IndexError，字典缺键 KeyError。"}, {"id": "py579", "ch": 13, "topic": "13.2 TypeError：字符串加数字", "sec": "§13.2", "type": "fill", "q": "下面这行会报什么错？填异常类名。", "code": "print('3' + 3)", "a": ["TypeError"], "why": "`+` 两边类型不同：str 只能和 str 相加，int 只能和 int 相加，混着来抛 TypeError。", "detail": "抛 TypeError。\n\n`+` 对字符串是拼接、对数字是加法，它不会自动转型，所以 `'3' + 3` 直接报类型不匹配。\n\n想拼接就先 `str(3)`，想相加就先 `int('3')`：`'3' + str(3)` 得 '33'，`int('3') + 3` 得 6。\n\n别和 ValueError 混：ValueError 是类型对、值不对（如 `int('abc')`）；TypeError 是类型本身就不对。\n\n记忆点：str 加 int 不会自动转换，只会 TypeError。"}, {"id": "py580", "ch": 13, "topic": "13.2 同一种写法，TypeError 还是 IndexError", "sec": "§13.2", "type": "choice", "q": "下面四行里，哪一行会抛 TypeError？", "opts": ["print([1, 2, 3][1])", "print([1, 2, 3]['1'])", "print([1, 2, 3][3])", "print('abc'[1])"], "ans": 1, "why": "列表下标必须是整数，写字符串 '1' 是类型错误 → TypeError；下标 3 是整数但越界，那才是 IndexError。", "detail": "第二行抛 TypeError。\n\n`[1, 2, 3][1]` 正常取到 2；`[1, 2, 3]['1']` 下标类型不对，列表不接受字符串下标。\n\n`[1, 2, 3][3]` 下标是整数，但长度只有 3、最大下标 2，越界 → IndexError。\n\n`'abc'[1]` 字符串也支持整数下标，得到 'b'，不报错。\n\n记忆点：先看下标类型（不对就 TypeError），再看范围（超了就 IndexError），顺序不能反。"}, {"id": "py581", "ch": 13, "topic": "13.1 IndentationError：缩进也是语法", "sec": "§13.1", "type": "choice", "q": "下面哪一种情况会报 IndentationError？", "opts": ["`for i in range(3):` 的下一行 `print(i)` 顶格写", "`for i in range(3)` 结尾忘了冒号", "`print('a' + 'b')`", "`x = [1, 2` 少了右括号"], "ans": 0, "why": "冒号后面必须有缩进块，下一行跟 for 顶格就是缺块 → IndentationError；忘冒号、少括号都是 SyntaxError。", "detail": "第一种是 IndentationError。\n\n`for` 行结尾有冒号，解释器期待下一行缩进；结果下一行跟 for 对齐顶格，Python 不知道循环体是什么，报 expected an indented block。\n\n第二种少了冒号，属于语法结构不完整，抛 SyntaxError（实测）。\n\n第四种括号没闭合，同样是 SyntaxError（实测）。第三种本身没问题，正常打印 ab。\n\n记忆点：缩进也是语法，缺块报 IndentationError；符号缺了报 SyntaxError。"}, {"id": "py582", "ch": 13, "topic": "13.1 语法错误在运行之前", "sec": "§13.1", "type": "choice", "q": "把下面内容存成文件运行，会出现什么？", "code": "print('start')\nfor i in range(3)\n    print(i)", "opts": ["先打印 start，再报 SyntaxError", "什么都不打印，直接报 SyntaxError", "打印 0 1 2", "报 IndentationError"], "ans": 1, "why": "SyntaxError 在编译阶段就被发现，整个文件一行都不会执行，所以 start 也不会出现。", "detail": "程序根本起不来，屏幕上只有 SyntaxError 的报错信息。\n\nPython 先把整个文件编译成字节码，再开始执行。第二行的 for 少了冒号，编译这一步就失败了。\n\n编译失败意味着没有任何语句被执行过，第一行的 `print('start')` 也不会留下输出（实测输出为空）。这正是它和运行时错误最大的区别。\n\n把冒号补上，才会先打印 start，再打印 0、1、2。\n\n记忆点：语法错误发生在执行之前，一行都跑不到。"}, {"id": "py583", "ch": 13, "topic": "13.2 IndexError 与 KeyError 的分界", "sec": "§13.2", "type": "choice", "q": "下面代码运行到 `print(a[2])` 时会怎样？", "code": "a = [10, 20]\nd = {0: 10, 1: 20}\nprint(a[2])", "opts": ["抛 IndexError；把这一行换成 `print(d[2])` 则抛 KeyError", "两行都会抛 IndexError", "抛 KeyError，因为 2 不在列表里", "打印 None，然后继续"], "ans": 0, "why": "列表只有下标 0、1，a[2] 越界 → IndexError；字典的方括号按键查，键 2 不存在 → KeyError。", "detail": "抛 IndexError: list index out of range。\n\n列表按位置数，合法下标是 0 到 len-1。长度 2，所以只有 0 和 1，a[2] 越界。\n\n字典的方括号是按 key 查，d 里只有键 0 和 1，查 2 就是缺键，抛 KeyError: 2（实测两种异常确实不同）。\n\n同样的方括号、同样是「取不到」，异常类型取决于容器的查找方式。排查时先看被查对象是列表还是字典。\n\n记忆点：位置越界 IndexError，键不存在 KeyError，都是取不到但名字不同。"}, {"id": "py584", "ch": 15, "topic": "综合 函数里的循环累加与初值", "sec": "综合", "type": "multi", "q": "函数把列表里的数累加起来。先算两次调用的结果，再看改掉累加初值会怎样。", "code": "def total(nums):\n    s = 0\n    for n in nums:\n        s += n\n    return s\nprint(total([1, 2, 3]))\nprint(total([]))", "why": "两行分别是 6 和 0：空列表时循环零次、返回初值 0；把初值改成 1，两个结果就都跟着加 1。", "detail": "第 1 问是 6 和 0；第 2 问把初值改成 1 后变成 7 和 1。\n\n累加先想初值：`s = 0` 才代表「空的和」。循环把元素一个个加进来，`[1, 2, 3]` 得 6。\n\n空列表 `[]` 是合法输入。for 一次都不跑，直接 `return s`，拿到初值 0——不是 None，也不报错。\n\n初值改成 1 等于凭空多一个 1：第一问 7，第二问 1。函数不会因为列表空就把初值丢掉。\n\n坑：初值写 1 还觉得「反正加的是元素」，结果两种调用都偏 1，测试全对不上。\n\n记忆点：累加初值 0，空列表返回 0；初值动 1，所有结果跟着动 1。", "parts": [{"type": "fill", "q": "两行 print 依次输出什么？（写成一行，用空格分隔）", "a": ["6 0"], "why": "1+2+3 得 6；空列表循环体不执行，s 保持初值 0。"}, {"type": "choice", "q": "把 `s = 0` 改成 `s = 1`，两次输出变成什么？", "opts": ["7 1", "6 0", "7 0", "报错"], "ans": 0, "why": "初值多 1，两个结果都加 1：6 变 7、0 变 1。空列表调用也照样带着初值返回。"}]}, {"id": "py585", "ch": 15, "topic": "综合 函数返回了 sort 的结果", "sec": "综合", "type": "multi", "q": "函数的本意是把列表排好序交回去。先看实际输出，再想办法修好它。", "code": "def sort_list(nums):\n    return nums.sort()\ndata = [3, 1, 2]\nresult = sort_list(data)\nprint(data)\nprint(result)", "why": "`list.sort()` 原地排序、返回值固定是 None，所以 data 被排好了，result 却是 None。", "detail": "第 1 问：`[1, 2, 3]` 和 None；第 2 问：两条修法都能用。\n\n`sort()` 是原地方法，它的返回值固定是 None。函数写 `return nums.sort()`，交回的自然是 None。\n\n但排序本身成功了：nums 和外面的 data 指向同一个列表对象，所以 data 变成 `[1, 2, 3]`。\n\n修法一：先 `nums.sort()` 再 `return nums`，保留原地排序的效果。\n\n修法二：`return sorted(nums)`，返回一个新列表，原列表不动。要不要保留原顺序，决定选哪种。\n\n记忆点：sort 返回 None，sorted 返回新列表；return 一个原地方法等于 return None。", "parts": [{"type": "fill", "q": "两行 print 依次输出什么？（写成一行，用空格分隔）", "a": ["[1, 2, 3] None"], "why": "sort 原地改了 nums 这份列表本身（和 data 是同一个对象），而返回值 None 被 return 交了出去。"}, {"type": "choice", "q": "想让函数交出排好序的列表，下面哪种说法对？", "opts": ["只能把 `return nums.sort()` 换成先 `nums.sort()` 再 `return nums`", "只能换成 `return sorted(nums)`", "上面两种改法都能交出排好序的列表", "两种都不行，必须改调用处"], "ans": 2, "why": "`nums.sort()` 之后手动 return nums 可以；`sorted(nums)` 返回新列表也可以。区别只在要不要保留原列表。"}]}, {"id": "py586", "ch": 15, "topic": "综合 遍历字符串 + 判断 + 计数", "sec": "综合", "type": "multi", "q": "函数数一个字符串里有多少个小写元音。先算一次，再把参数换成大写看看。", "code": "def count_vowel(s):\n    n = 0\n    for ch in s:\n        if ch in 'aeiou':\n            n += 1\n    return n\nprint(count_vowel('education'))", "why": "逐字符判断是否在 'aeiou' 里，education 命中 e、u、a、i、o 共 5 个；换成大写后一个都不匹配。", "detail": "第 1 问 5，第 2 问 0。\n\n`ch in 'aeiou'` 是子串判断：单个字符在不在这个 5 字符串里，等价于「是不是小写元音」。\n\neducation 的字母是 e、d、u、c、a、t、i、o、n，其中 e、u、a、i、o 命中，n 累加到 5。\n\n换成 'AEIOU' 后一个都不匹配：`in` 比的是字符本身，不忽略大小写。\n\n要兼容两种写法，可以先把字符串统一小写：`s = s.lower()`，或者判断 `ch.lower() in 'aeiou'`。\n\n记忆点：`in` 是精确匹配，大小写不同就是不同字符。", "parts": [{"type": "fill", "q": "`print(count_vowel('education'))` 输出什么？", "a": ["5"], "why": "e、u、a、i、o 各命中一次，共 5 次；辅音 d、c、t、n 不加。"}, {"type": "choice", "q": "把调用改成 `count_vowel('AEIOU')`，返回什么？", "opts": ["5", "0", "1", "报错"], "ans": 1, "why": "`in 'aeiou'` 区分大小写，五个大写元音一个都不匹配，返回初值 0。"}]}, {"id": "py587", "ch": 15, "topic": "综合 用 range 当下标遍历列表的一段", "sec": "综合", "type": "multi", "q": "用 range 生成的数字当列表下标，把中间一段元素累加起来。", "code": "nums = [10, 20, 30, 40, 50]\ntotal = 0\nfor i in range(1, 4):\n    total += nums[i]\nprint(total)", "why": "range(1, 4) 给出 1、2、3，取 nums[1]、nums[2]、nums[3] 即 20+30+40 = 90。", "detail": "第 1 问 90；第 2 问把终点改成 5 后是 140。\n\n`range(1, 4)` 的终点 4 取不到，只给 1、2、3，于是跳过首元素，也不碰最后一个。\n\n下标 3 对应 40，下标 4 对应 50。改成 `range(1, 5)` 就把 50 也算进来。\n\n为什么不是 IndexError？列表长度 5，合法下标 0~4，只有 5 才会越界；这里最大取到 4。\n\n如果把终点写成 6，才会在 `nums[5]` 处抛 IndexError——边界多一格就翻车。\n\n记忆点：range 的 stop 和列表的 len 不是一回事，改边界前先数清下标上界。", "parts": [{"type": "fill", "q": "输出什么？", "a": ["90"], "why": "下标 1、2、3 对应 20、30、40，和是 90；下标 0 和 4 没参与。"}, {"type": "choice", "q": "把 `range(1, 4)` 改成 `range(1, 5)`，输出变成什么？", "opts": ["90", "140", "150", "IndexError"], "ans": 1, "why": "range(1, 5) 多取一个下标 4，即 50，90+50 = 140。下标 4 合法，不会越界。"}]}, {"id": "py588", "ch": 15, "topic": "综合 嵌套循环拼字符串", "sec": "综合", "type": "multi", "q": "外层决定拼哪个数字，内层决定拼几个。先看原版的输出，再放大外层范围。", "code": "s = ''\nfor i in range(1, 3):\n    for j in range(i):\n        s += str(i)\nprint(s)", "why": "i=1 时内层跑 1 次拼一个 '1'，i=2 时跑 2 次拼两个 '2'，接起来是 '122'。", "detail": "第 1 问 122；第 2 问外层扩到 range(1, 4) 后是 122333。\n\n内层 `range(i)` 的长度随外层变化：i 是几，内层就转几圈，字符串里就多几个同一个数字。\n\ni=1 拼 '1'，i=2 拼 '22'，接起来是 '122'。注意这是字符串拼接，不是数字相加。\n\n扩到 `range(1, 4)` 只多了 i=3 这一组，追加 '333'，前面完全不变。\n\n坑：把 `s += str(i)` 写成 `s += i` 会抛 TypeError，字符串只能和字符串相加。\n\n记忆点：内层次数跟着外层变量走，拼出来是「阶梯」形。", "parts": [{"type": "fill", "q": "输出什么？", "a": ["122"], "why": "i 取 1、2；内层 `range(i)` 分别跑 1 次和 2 次，拼出 1 个 '1' 和 2 个 '2'。"}, {"type": "choice", "q": "把外层改成 `range(1, 4)`，输出变成什么？", "opts": ["122333", "123123", "123", "1223"], "ans": 0, "why": "i 取 1、2、3，各拼 1、2、3 个，得到 1 后接 22 再接 333。"}]}, {"id": "py589", "ch": 15, "topic": "综合 while 拆数字 + 函数返回累加", "sec": "综合", "type": "multi", "q": "函数用取余和整除把每一位数字拆下来累加。先算一次，再问一个边界输入。", "code": "def digit_sum(n):\n    total = 0\n    while n > 0:\n        total += n % 10\n        n //= 10\n    return total\nprint(digit_sum(1234))", "why": "每轮用 `n % 10` 取个位累加，再 `n //= 10` 去掉个位，直到 n 为 0；1+2+3+4 = 10。", "detail": "第 1 问 10，第 2 问传 0 时返回 0。\n\n拆数字是两步固定搭配：`n % 10` 拿个位，`n //= 10` 把个位砍掉。1234 依次拿出 4、3、2、1。\n\n循环条件 `n > 0` 保证拿到最后一位后停下，此时 n 已经是 0，不会多跑。\n\n传 0 时条件一开始就假，循环体零次，返回累加初值 0。这是 while 版拆位的天然优势，不用特判。\n\n坑：条件写成 `n >= 0` 会死循环，因为 0 // 10 还是 0，永远出不去（用计数器封顶实测确实卡住）。\n\n记忆点：% 10 取位，// 10 移位，条件写 n > 0。", "parts": [{"type": "fill", "q": "`print(digit_sum(1234))` 输出什么？", "a": ["10"], "why": "1234 → 4、123 → 3、12 → 2、1 → 1，累加得 10，n 变成 0 时循环结束。"}, {"type": "choice", "q": "调用 `digit_sum(0)` 返回什么？", "opts": ["0", "1", "None", "报错"], "ans": 0, "why": "0 不满足 `n > 0`，while 一次都不执行，直接 `return total`，也就是初值 0。"}]}, {"id": "py590", "ch": 15, "topic": "综合 字典计数：get 给默认值", "sec": "综合", "type": "multi", "q": "函数统计字符串里每个字符出现的次数，结果装进字典。", "code": "def freq(s):\n    d = {}\n    for ch in s:\n        d[ch] = d.get(ch, 0) + 1\n    return d\nprint(freq('aab'))", "why": "遍历字符，用 `dict.get` 取旧计数、没有就按 0 起，累加后写回；'a' 出现两次、'b' 一次。", "detail": "第 1 问 `{'a': 2, 'b': 1}`，第 2 问空字符串返回 `{}`。\n\n计数套路是 `d[ch] = d.get(ch, 0) + 1`：有就取旧值，没有就按 0 起，然后加 1 写回。\n\n去掉 get 直接写 `d[ch] += 1`，第一次遇到某个字符就 KeyError，因为键还不存在（实测）。\n\n字典按插入顺序打印，'a' 先出现所以在前面。这是 3.7 之后的语言保证，不是碰巧。\n\n空字符串循环零次，返回的是空字典 `{}`，不是 None——函数里 return 的是 d 本身。\n\n记忆点：get 给默认值再累加，是字典计数不抛 KeyError 的关键。", "parts": [{"type": "fill", "q": "输出什么？", "a": ["{'a': 2, 'b': 1}"], "why": "先见到 a 记 1，再见 a 记 2，然后 b 记 1；字典保持插入顺序，a 排在前面。"}, {"type": "choice", "q": "调用 `freq('')` 返回什么？", "opts": ["{}", "None", "0", "KeyError"], "ans": 0, "why": "空字符串没有字符可遍历，循环零次，返回的还是那个空字典。"}]}, {"id": "py591", "ch": 15, "topic": "综合 找不到时函数隐式返回 None", "sec": "综合", "type": "multi", "q": "函数在列表里找目标值，找到就交回它。先看两次调用，再把返回值拿去做比较。", "code": "def find(nums, target):\n    for n in nums:\n        if n == target:\n            return n\nprint(find([1, 2, 3], 2))\nprint(find([1, 2, 3], 9))", "why": "找到就 return 元素；找不到时函数走到末尾，没有 return 被执行，隐式返回 None。", "detail": "第 1 问是 2 和 None；第 2 问会抛 TypeError。\n\n函数只在命中的那一刻 return，找不到就没有任何 return 被执行，Python 补一个 None 作为返回值。\n\nNone 不参与比较：`None > 0` 直接抛 TypeError，而不是悄悄当成假。\n\n所以「找不到」的返回值要显式设计：返回 -1，或者返回 None 后先判 `is None`，别直接拿去比大小。\n\n注意 `print(find(...))` 把 None 显示成字面 None，这是 print 的效果，不代表函数里打印过东西。\n\n记忆点：函数末尾没有 return，返回值就是 None；None 不能和数字比大小。", "parts": [{"type": "fill", "q": "两行 print 依次输出什么？（写成一行，用空格分隔）", "a": ["2 None"], "why": "2 命中直接返回；9 不在列表里，循环走完没有 return，函数返回 None。"}, {"type": "choice", "q": "如果接着写 `if find([1, 2, 3], 9) > 0:`，会怎样？", "opts": ["条件为假，直接跳过", "抛 TypeError：None 不能和 0 比大小", "返回 False", "抛 ValueError"], "ans": 1, "why": "find 返回 None，`None > 0` 在 Python 3 里直接 TypeError，不会当成 False。"}]}, {"id": "py592", "ch": 15, "topic": "综合 字符比较 + 计数 + 改条件", "sec": "综合", "type": "multi", "q": "函数用字符的大小比较数出大写字母。先算原版，再砍掉一个条件看结果怎么变。", "code": "def count_upper(s):\n    n = 0\n    for ch in s:\n        if ch >= 'A' and ch <= 'Z':\n            n += 1\n    return n\nprint(count_upper('PyThon'))", "why": "用字符编码判断是否落在 A~Z 之间，PyThon 里 P 和 T 两个大写，返回 2。", "detail": "第 1 问 2，第 2 问删掉上限后是 4。\n\n字符能直接比大小，比的是编码值。'A'~'Z' 是 65~90，'a'~'z' 是 97~122，两段不重叠。\n\n`ch >= 'A' and ch <= 'Z'` 就是「落在带大写区间」，PyThon 里只有 P、T 满足。\n\n删掉上限后，条件变成「编码不小于 97」，只剩小写字母：y、h、o、n 四个。\n\n坑：上限不是可有可无的护栏，`{` 这类符号（编码 123）也满足 `ch >= 'a'`，会被误算进去。\n\n记忆点：字符比较靠编码顺序，大写段在小写段前面。", "parts": [{"type": "fill", "q": "输出什么？", "a": ["2"], "why": "P、T 落在 A~Z 区间内；y、h、o、n 是小写，被上限挡在外面。"}, {"type": "choice", "q": "把条件改成只有 `ch >= 'a'`，再调用 `count_upper('PyThon')` 返回什么？", "opts": ["2", "4", "6", "0"], "ans": 1, "why": "只留 `ch >= 'a'`，小写 y、h、o、n 全满足，返回 4；大写字母编码比 'a' 小，反而不满足。"}]}, {"id": "py593", "ch": 15, "topic": "综合 改一个 range 边界，答案差一个", "sec": "综合", "type": "multi", "q": "函数数 1 到 n-1 里有多少个 3 的倍数。先看原版，再看边界放宽一格的后果。", "code": "def count_multiples(n):\n    c = 0\n    for i in range(1, n):\n        if i % 3 == 0:\n            c += 1\n    return c\nprint(count_multiples(12))", "why": "range(1, 12) 里 3 的倍数是 3、6、9，共 3 个；终点改成 n+1 后 12 也被算进来，变 4 个。", "detail": "第 1 问 3，第 2 问改成 `range(1, n + 1)` 后是 4。\n\n`range(1, n)` 到 n-1 为止，n=12 时只数 1~11，其中 3 的倍数是 3、6、9。\n\n改成 `range(1, n + 1)` 后区间变成 1~12，12 也是 3 的倍数，计数加 1。\n\n这题想说明：改边界不一定报错，可能只是答案悄悄变了，测试没覆盖到就发现不了。\n\n坑：如果 n 本身不是 3 的倍数（比如 10），改这一格结果不变，容易误以为改动没影响。\n\n记忆点：range 终点差一格，答案常常差一个，先用能被整除的数试。", "parts": [{"type": "fill", "q": "`print(count_multiples(12))` 输出什么？", "a": ["3"], "why": "区间是 1~11，3 的倍数只有 3、6、9，三个。"}, {"type": "choice", "q": "把 `range(1, n)` 改成 `range(1, n + 1)`，再调用 `count_multiples(12)` 返回什么？", "opts": ["3", "4", "5", "报错"], "ans": 1, "why": "终点放宽一格，12 也进来了，12 是 3 的倍数，计数从 3 变 4。"}]}, {"id": "py594", "ch": 15, "topic": "综合 for-else 与循环后 return 的等价性", "sec": "综合", "type": "multi", "q": "函数找第一个偶数，找不到就返回 -1。看看它用了什么写法。", "code": "def first_even(nums):\n    for n in nums:\n        if n % 2 == 0:\n            return n\n    else:\n        return -1\nprint(first_even([1, 3, 6, 8]))\nprint(first_even([1, 3, 5]))", "why": "找到偶数就 return 值；两个列表都不含偶数时循环自然结束，走 else 返回 -1。", "detail": "第 1 问是 6 和 -1；第 2 问问等价性，本例中答案是完全一样。\n\nfor 的 else 只在没有 break 时执行。这个函数里没有任何 break，return 一旦执行就结束函数。\n\n所以在「找到就提前 return」的模式下，else 和「循环后接着写 return」效果相同。\n\n但这只在没有 break 时成立。一旦循环里有 break，break 会跳过 else，两种写法就分道扬镳：实测带 break 的版本，else 版返回 None，平铺版返回 -1。\n\n第二个列表全是奇数，循环完整跑完，落到 else 或末尾的 return -1，都返回 -1。\n\n记忆点：没有 break 的循环，else 只是「循环结束后」的另一种写法。", "parts": [{"type": "fill", "q": "两行 print 依次输出什么？（写成一行，用空格分隔）", "a": ["6 -1"], "why": "第一个列表里 6 是第一个偶数；第二个列表全是奇数，else 分支返回 -1。"}, {"type": "choice", "q": "把 else 去掉、`return -1` 直接顶格放到函数末尾，这两行输出会变吗？", "opts": ["变成 6 和 None", "完全一样，还是 6 和 -1", "变成 6 和 6", "报 SyntaxError"], "ans": 1, "why": "本例循环里没有 break，跑完就自然往下执行到末尾的 `return -1`，与写在 else 里效果相同。"}]}, {"id": "py595", "ch": 15, "topic": "综合 阶乘：累乘初值与 range 上界", "sec": "综合", "type": "multi", "q": "函数用循环算阶乘。先看两个输入，再动一下累乘初值。", "code": "def factorial(n):\n    result = 1\n    for i in range(1, n + 1):\n        result *= i\n    return result\nprint(factorial(5))\nprint(factorial(0))", "why": "result 初值 1，乘 1~n：factorial(5) 得 120；factorial(0) 循环零次，返回 1（0! 的定义）。", "detail": "第 1 问 120 和 1；第 2 问把初值改成 0 后，factorial(5) 返回 0。\n\n`range(1, n + 1)` 才是 1 到 n：终点要加 1 才能把 n 本身算进去，这也是阶乘最容易漏乘的一项。\n\nn=0 时 `range(1, 1)` 为空，循环零次，result 保持初值 1——正好符合 0! = 1。\n\n初值改成 0 后，`result *= i` 第一步就变 0，五轮之后还是 0，不报错但全错。\n\n坑：循环写成 `range(1, n)` 会少乘 n，5! 变成 24，正好和「初值写错」的错法混在一起难以分辨。\n\n记忆点：累乘初值 1，区间上界要 +1，0 的阶乘靠空循环自然得 1。", "parts": [{"type": "fill", "q": "两行 print 依次输出什么？（写成一行，用空格分隔）", "a": ["120 1"], "why": "1×2×3×4×5 = 120；n=0 时 `range(1, 1)` 为空，直接返回初值 1。"}, {"type": "choice", "q": "把 `result = 1` 改成 `result = 0`，`factorial(5)` 返回什么？", "opts": ["0", "120", "报错", "5"], "ans": 0, "why": "0 乘任何数都是 0，第一轮就归零，之后一直保持 0。"}]}, {"id": "py596", "ch": 15, "topic": "综合 负步长 range 倒着取字符", "sec": "综合", "type": "multi", "q": "函数用 range 从后往前遍历字符串，把字符一个个接起来。", "code": "def reverse(s):\n    out = ''\n    for i in range(len(s) - 1, -1, -1):\n        out += s[i]\n    return out\nprint(reverse('abc'))", "why": "从 len-1 倒着走到 0，逐个取出字符拼接，'abc' 变成 'cba'。", "detail": "第 1 问 cba；第 2 问空字符串时循环体执行 0 次。\n\n倒着遍历的三参数：start 是 `len(s) - 1`（最后一位），stop 写 -1（要包含 0，所以再退一格），step 是 -1。\n\nstop 写 0 就漏掉第一个字符：`range(2, 0, -1)` 只给 2、1，实测取到 'cb'，不是 'cba'。\n\n空字符串时 start 是 -1，`range(-1, -1, -1)` 是空的，循环零次，函数返回空字符串，不会 IndexError。\n\n现成写法是 `s[::-1]` 切片倒序，语义一样，只是不用手写 range（实测同样是 cba）。\n\n记忆点：负步长要包含 0，stop 得写 -1。", "parts": [{"type": "fill", "q": "`print(reverse('abc'))` 输出什么？", "a": ["cba"], "why": "len('abc')-1 是 2，`range(2, -1, -1)` 给 2、1、0，依次取 c、b、a。"}, {"type": "choice", "q": "当 s 是空字符串时，这个 range 会让循环体执行几次？", "opts": ["0", "1", "2", "报错"], "ans": 0, "why": "len('')-1 是 -1，`range(-1, -1, -1)` 长度为 0，循环体不执行，函数返回空字符串。"}]}, {"id": "py597", "ch": 15, "topic": "综合 函数里新建列表与全局列表的区别", "sec": "综合", "type": "multi", "q": "函数把列表里的偶数挑出来装进新列表返回。先看两次调用，再想想列表建在哪里。", "code": "def evens(nums):\n    out = []\n    for n in nums:\n        if n % 2 == 0:\n            out.append(n)\n    return out\nprint(evens([1, 2, 4, 7]))\nprint(evens([1, 3]))", "why": "每次调用都新建一个空列表装偶数：有偶数返回 `[2, 4]`，没有就返回空列表。", "detail": "第 1 问是 `[2, 4]` 和 `[]`；第 2 问 `out` 挪到函数外后，第二行输出变成 `[2, 4]`。\n\n`out = []` 写在函数里，每次调用都重新造一个空列表，调用之间互不影响。\n\n挪到外面就成了全局列表，append 累积在同一个对象上：第一次装 2、4，第二次没有新元素，列表还是 `[2, 4]`。\n\n如果第二次传的是 `[2]`，结果会变成 `[2, 4, 2]`（实测）——数据被上一次污染，这是「函数带隐藏状态」的典型 bug。\n\n记忆点：要在函数里攒结果，列表就在函数里新建，别用全局的。", "parts": [{"type": "fill", "q": "两行 print 依次输出什么？（写成一行，用空格分隔）", "a": ["[2, 4] []"], "why": "第一个列表里 2、4 是偶数；第二个没有偶数，out 保持空列表。"}, {"type": "choice", "q": "如果把 `out = []` 挪到函数外面变成全局变量，连续调用这两次，第二行输出什么？", "opts": ["[]", "[2, 4]", "[2, 4, 2, 4]", "报 NameError"], "ans": 1, "why": "out 不再每次清空，第一次装了 2、4；第二次没有新元素可加，返回的还是同一个 `[2, 4]`。"}]}, {"id": "py598", "ch": 15, "topic": "综合 while 找下标与 for 改写的差异", "sec": "综合", "type": "multi", "q": "函数在列表里找目标的下标，用 while 让 i 自己走到停。", "code": "def find_index(nums, target):\n    i = 0\n    while i < len(nums):\n        if nums[i] == target:\n            break\n        i += 1\n    return i\nprint(find_index(['a', 'b', 'c'], 'c'))\nprint(find_index(['a', 'b', 'c'], 'z'))", "why": "'c' 在下标 2，命中后 break 保留 i=2；'z' 找不到，i 一直加到 3 才让条件变假，返回 3。", "detail": "第 1 问是 2 和 3；第 2 问改成 for 版后，找不到时返回 2。\n\nwhile 版靠 i 自己走到 `len(nums)` 才停，所以「没找到」时 i 正好等于长度 3，天然能当「没找到」的标记。\n\nfor 版的 i 由 range 分配，跑完停在最后一个元素的下标 2，永远拿不到 3。\n\n同一个函数体换个循环，找不到时的返回值就从 3 变成 2。调用方如果用 `idx == len(nums)` 判断，立刻失效。\n\n坑：空列表时 while 版直接返回 0，调用方会把它当成「下标 0」，也要额外判断。\n\n记忆点：while 的计数器是自己加的，for 的循环变量是 range 给的，终值差 1。", "parts": [{"type": "fill", "q": "两行 print 依次输出什么？（写成一行，用空格分隔）", "a": ["2 3"], "why": "找到时 break 把 i 停在 2；找不到时 i 涨到 len(nums) = 3，条件变假后返回 3。"}, {"type": "choice", "q": "如果把循环改成 `for i in range(len(nums)):`，找不到时返回什么？", "opts": ["3", "2", "-1", "None"], "ans": 1, "why": "for 的 i 只取到 2，range 走完后 i 仍是 2，返回 2；和 while 版的 3 差 1。"}]}, {"id": "py599", "ch": 15, "topic": "综合 找最长单词：比较符与空输入", "sec": "综合", "type": "multi", "q": "函数在单词列表里挑出最长的一个。先算一次，再改比较符、换空列表。", "code": "def longest(words):\n    best = ''\n    for w in words:\n        if len(w) > len(best):\n            best = w\n    return best\nprint(longest(['cat', 'horse', 'ox']))", "why": "遍历时只保留更长的那一个：'horse' 长度 5 最长；空列表时循环零次，返回空字符串。", "detail": "第 1 问 horse；第 2 问把 `>` 改成 `>=` 后返回 'dog'；第 3 问空列表返回空字符串。\n\nbest 从空字符串起步，长度 0，任何非空单词都能替换它。cat 先进，horse 更长就顶掉，ox 更短不动。\n\n`>` 只在严格更长时替换，遇到等长保留先来的；`>=` 连等长也替换，于是 ['cat', 'dog'] 返回后一个 'dog'。\n\n空列表时循环零次，返回初值 `''`，不是 None——因为 return 的 best 已经被赋过值。\n\n坑：初值写成 None，第一轮 `len(w) > len(None)` 就 TypeError（实测）；初值类型要和结果一致。\n\n记忆点：找最大值的初值要「比谁都小」，字符串就用空串。", "parts": [{"type": "fill", "q": "`print(longest(['cat', 'horse', 'ox']))` 输出什么？", "a": ["horse"], "why": "'cat' 长度 3 先入选，'horse' 长度 5 把它顶掉，'ox' 长度 2 不比 5 长，保持 horse。"}, {"type": "choice", "q": "把 `>` 改成 `>=`，`longest(['cat', 'dog'])` 返回什么？", "opts": ["'cat'", "'dog'", "空字符串", "报错"], "ans": 1, "why": "两个都是 3 个字符，`>=` 让后遇到的 'dog' 也替换，返回 'dog'。"}, {"type": "choice", "q": "`longest([])` 返回什么？", "opts": ["空字符串 ''", "None", "0", "IndexError"], "ans": 0, "why": "空列表循环零次，直接 return 初值 best，也就是空字符串。"}]}]);
