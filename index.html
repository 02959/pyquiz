<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1b2033">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Ctext x='32' y='45' font-size='28' font-family='Segoe UI,Arial,sans-serif' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EPyC%3C/text%3E%3C/svg%3E">
<title>Python / C 语言 摸底测评</title>
<style>

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:#f4f5fa;color:#1b2033;-webkit-font-smoothing:antialiased;line-height:1.6}
code,pre,.mono{font-family:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace}
.wrap{max-width:1080px;margin:0 auto;padding:26px 20px 90px}
.hide{display:none!important}

/* ---------- 顶部 ---------- */
.hdr{display:flex;gap:14px;align-items:center;margin-bottom:22px}
.logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;box-shadow:0 6px 16px rgba(79,70,229,.35);flex:none}
.hdr h1{font-size:20px;margin:0;letter-spacing:.2px}
.hdr p{margin:2px 0 0;color:#6b7280;font-size:13px}
.hstat{margin-left:auto;font-size:12.5px;color:#6b7280;background:#fff;border:1px solid #e6e8f0;padding:8px 14px;border-radius:999px;white-space:nowrap}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:30px 32px;background:linear-gradient(120deg,#4338ca,#6d28d9 55%,#7c3aed);color:#fff;display:flex;gap:28px;align-items:center;box-shadow:0 18px 40px -18px rgba(76,29,149,.7);margin-bottom:18px}
.hero::after{content:'';position:absolute;width:340px;height:340px;right:-110px;top:-150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%);pointer-events:none}
.hero h2{margin:0 0 8px;font-size:24px;letter-spacing:.3px}
.hero p{margin:0;color:#ddd9ff;font-size:14px;max-width:580px}
.hero-r{margin-left:auto;display:flex;gap:24px;text-align:center;flex:none;position:relative;z-index:1}
.hero-r b{display:block;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.hero-r span{font-size:12px;color:#cfc9ff}
.kbd-hint{margin-top:14px;font-size:12px;color:#cfc9ff}
kbd{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-family:inherit;font-size:11px;margin:0 2px}

/* ---------- 面板 ---------- */
.panel{background:#fff;border:1px solid #e8eaf2;border-radius:18px;padding:20px 22px;margin-bottom:16px;box-shadow:0 2px 10px rgba(20,25,60,.03)}
.panel-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.panel-h h3{margin:0;font-size:15px}
.muted{color:#8a90a3;font-size:12.5px}
.chips-ctrl{margin-left:auto;display:flex;gap:6px}
.chips-ctrl button{border:1px solid #e6e8f2;background:#fff;color:#6b7280;font-size:12px;border-radius:8px;padding:4px 10px;cursor:pointer;font-family:inherit}
.chips-ctrl button:hover{background:#f7f8ff;border-color:#c7cbf5;color:#4338ca}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #e2e5f0;background:#fafbff;color:#4b5268;border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit}
.chip i{font-style:normal;font-size:11px;color:#9aa0b4;background:#eef0f8;border-radius:999px;padding:0 6px;line-height:1.6}
.chip:hover{border-color:#c7cbf5}
.chip.on{background:#eef2ff;border-color:#a5b4fc;color:#3730a3}
.chip.on i{background:#dbe3ff;color:#4338ca}

.startrow{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{font-family:inherit;font-size:14px;border-radius:11px;padding:10px 18px;border:1px solid transparent;cursor:pointer;transition:.15s;font-weight:600;color:#fff;background:#4f46e5}
.btn.primary{background:linear-gradient(135deg,#4f46e5,#6d28d9);box-shadow:0 6px 18px -6px rgba(79,70,229,.7)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 9px 22px -8px rgba(79,70,229,.8)}
.btn.ghost{background:#fff;border-color:#dfe3ef;color:#3d4358}
.btn.ghost:hover{border-color:#b9c0d8;background:#fafbff}
.btn.subtle{background:#f3f4f9;color:#5b6175;font-weight:500}
.btn.subtle:hover{background:#eceef6}
.btn.lg{padding:13px 26px;font-size:15px}
.btn.small{padding:7px 13px;font-size:12.5px;font-weight:500}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none!important;box-shadow:none}
.laststat{font-size:12.5px;color:#8a90a3;margin-left:4px}

/* ---------- 恢复进度条 ---------- */
.resume-bar{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#eef2ff,#f5f3ff);border:1px solid #ddd6fe;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:#4338ca;flex-wrap:wrap}
.resume-bar b{font-variant-numeric:tabular-nums;color:#3730a3}
.resume-bar .sp{flex:1}
.resume-bar .btn{flex:none}

/* ---------- 知识点地图 ---------- */
.kcard{border:1px solid #eceef6;border-radius:14px;margin-bottom:10px;overflow:hidden;background:#fff;transition:.15s}
.kcard[open]{border-color:#dcd9fb;box-shadow:0 6px 20px -14px rgba(79,70,229,.5)}
.kcard summary{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;list-style:none;font-size:14px}
.kcard summary::-webkit-details-marker{display:none}
.cn{flex:none;font-size:11.5px;font-weight:700;color:#4f46e5;background:#eef2ff;border-radius:6px;padding:2px 7px}
.kt{font-weight:600}
.kc{margin-left:auto;font-size:11.5px;color:#9aa0b4}
.chev{width:7px;height:7px;border-right:1.6px solid #a9afc3;border-bottom:1.6px solid #a9afc3;transform:rotate(45deg);transition:.2s;flex:none;margin-left:4px}
.kcard[open] .chev{transform:rotate(-135deg);border-color:#6d6af0}
.kbody{padding:0 16px 16px;border-top:1px dashed #eef0f7}
.kbody ul{margin:12px 0;padding-left:20px;font-size:13.4px;color:#3f4559}
.kbody li{margin:5px 0}
.pit{background:#fff8ed;border-left:3px solid #f59e0b;color:#8a5a00;font-size:12.8px;padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0}
.kbody .btn{margin-top:2px}

/* ---------- 弹窗 ---------- */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(23,27,45,.55);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .18s}
.overlay.show{opacity:1;pointer-events:auto}
.modal{width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;background:#fff;border-radius:20px;box-shadow:0 30px 80px -20px rgba(10,12,30,.55);transform:translateY(10px) scale(.985);transition:transform .22s cubic-bezier(.2,.8,.3,1);overflow:hidden}
.overlay.show .modal{transform:none}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-3px)}40%,60%{transform:translateX(3px)}}
.shake{animation:shake .4s}

.m-head{display:flex;align-items:center;padding:16px 18px 12px;gap:10px}
.m-crumb{font-size:12.5px;color:#8a90a3;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.m-crumb b{color:#4f46e5;font-weight:700}
.x{margin-left:auto;border:0;background:#f3f4f9;color:#7b8194;width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:13px;flex:none}
.x:hover{background:#e8eaf3;color:#3d4358}
.pbar{height:4px;background:#eef0f7;margin:0 18px;border-radius:99px;overflow:hidden;flex:none}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#a855f7);border-radius:99px;transition:width .3s}
.m-body{padding:18px;overflow:auto;scrollbar-width:thin;flex:1 1 auto;min-height:0}
.qmeta{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.3px}
.badge.choice{background:#eef2ff;color:#4338ca}
.badge.fill{background:#ecfdf5;color:#047857}
.ver{font-size:10.5px;color:#6d28d9;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:999px;padding:2px 8px}
.topic{font-size:12.5px;color:#8a90a3}
.qtext{font-size:15.5px;line-height:1.75;margin:0 0 14px;font-weight:500}
.qtext code{background:#f1f2f9;border:1px solid #e6e8f2;border-radius:5px;padding:1px 5px;font-size:13.5px;color:#b5347a;font-weight:400}
pre.code{background:#131a2b;color:#e6e9f5;border-radius:12px;padding:14px 16px;overflow:auto;font-size:13px;line-height:1.7;margin:0 0 14px;tab-size:4}
pre.code code{font-family:inherit;color:inherit;background:none;border:0;padding:0}
pre.code.sm{padding:10px 12px;font-size:12.3px;margin:8px 0}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border:1.5px solid #e7e9f3;border-radius:12px;cursor:pointer;background:#fcfcff;transition:.13s;font-size:14px}
.opt:hover{border-color:#c7cbf5;background:#f7f8ff}
.opt .k{flex:none;width:22px;height:22px;border-radius:7px;background:#eef0f8;color:#6b7280;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.opt .t{flex:1;min-width:0}
.opt .t code{background:#eef0f8;border-radius:4px;padding:1px 5px;font-size:12.8px;color:#b5347a}
.opt.sel{border-color:#6366f1;background:#eef2ff;box-shadow:0 0 0 3px rgba(99,102,241,.13)}
.opt.sel .k{background:#4f46e5;color:#fff}
.opt.ok{border-color:#16a34a;background:#f0fdf4;box-shadow:none}
.opt.ok .k{background:#16a34a;color:#fff}
.opt.bad{border-color:#dc2626;background:#fef2f2;box-shadow:none}
.opt.bad .k{background:#dc2626;color:#fff}
.opt.dim{opacity:.45}
.opt.lock{cursor:default}

.fillwrap{margin-top:4px}
.ans{width:100%;font-family:"Cascadia Code",Consolas,monospace;font-size:16px;padding:13px 15px;border:1.5px solid #e2e5f0;border-radius:12px;background:#fcfcff;outline:none;transition:.15s;color:#1b2033}
.ans:focus{border-color:#6366f1;background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.13)}
.ans.right{border-color:#16a34a;background:#f0fdf4;color:#15803d}
.ans.wrong{border-color:#dc2626;background:#fef2f2}
.ans:disabled{opacity:1}
.fhint{font-size:12px;color:#9aa0b4;margin:8px 2px 0}

.fb{margin-top:16px;border-radius:12px;padding:13px 16px;font-size:13.5px;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fb.ok{background:#f0fdf4;border:1px solid #bbf7d0}
.fb.bad{background:#fef2f2;border:1px solid #fecaca}
.fb.neutral{background:#f6f7fb;border:1px solid #e5e7f0}
.fb-h{font-weight:700;margin-bottom:9px;font-size:14px}
.fb.ok .fb-h{color:#15803d}
.fb.bad .fb-h{color:#b91c1c}
.fb.neutral .fb-h{color:#5b6175}
.fb-row{display:flex;gap:8px;margin:5px 0;align-items:baseline;flex-wrap:wrap}
.fb-row b{flex:none;font-size:11.5px;font-weight:600;color:#8a90a3;background:#fff;border:1px solid #e6e8f2;border-radius:5px;padding:1px 6px}
.fb-row span{font-family:"Cascadia Code",Consolas,monospace;font-size:13px;word-break:break-word;color:#1b2033}
.fb-why{margin-top:8px;color:#3f4559;line-height:1.72}
.fb-src{margin-top:10px;font-size:11.5px;color:#9aa0b4}

.m-foot{display:flex;gap:10px;padding:14px 18px 18px;border-top:1px solid #f0f1f7;align-items:center;background:#fff;flex:none}
.m-foot .btn.primary{margin-left:auto}

/* ---------- 结果 ---------- */
.res-hero{display:flex;gap:26px;align-items:center;background:#fff;border:1px solid #e8eaf2;border-radius:20px;padding:26px 30px;margin-bottom:16px}
.ring{--p:0;--c:#4f46e5;width:132px;height:132px;flex:none;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#eef0f7 0);display:grid;place-items:center;position:relative}
.ring::before{content:'';position:absolute;inset:10px;border-radius:50%;background:#fff}
.ring-in{position:relative;text-align:center}
.ring-in b{font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.ring-in span{font-size:13px;color:#8a90a3;margin-left:2px}
.res-hero h2{margin:0 0 6px;font-size:21px}
.res-hero p{margin:0;color:#6b7280;font-size:14px}
.res-hero p+p{margin-top:4px}
.grid2{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.crow{padding:10px 0;border-bottom:1px dashed #f0f1f7}
.crow:last-child{border-bottom:0;padding-bottom:0}
.crow-h{display:flex;font-size:13px;margin-bottom:6px;gap:8px}
.crow-h b{margin-left:auto;font-variant-numeric:tabular-nums;font-size:12.5px}
.bar{height:7px;background:#eef0f7;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.3,1)}
.ctags{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px}
.ctags span{font-size:11.3px;color:#9a3412;background:#fff7ed;border:1px solid #fed7aa;border-radius:6px;padding:2px 7px}
.wk{margin-bottom:14px}
.wk h4{margin:0 0 6px;font-size:13px;color:#3730a3}
.wk ul{margin:0;padding-left:18px;font-size:12.8px;color:#4b5268}
.wk li{margin:3px 0}
.wk li span{color:#a9afc3;font-size:11.3px;margin-left:6px}
.wk p{background:#f8f9fd;border-radius:8px;padding:8px 10px;font-size:12.2px;color:#5b6175;margin:8px 0 0;line-height:1.65}
.drow{border:1px solid #eceef6;border-radius:12px;padding:12px 14px;margin-bottom:9px}
.drow.ok{border-left:3px solid #16a34a}
.drow.bad{border-left:3px solid #dc2626}
.dh{display:flex;gap:9px;align-items:center;font-size:13px;font-weight:600}
.dh i{margin-left:auto;font-style:normal;flex:none}
.dh i.y{color:#16a34a}
.dh i.n{color:#dc2626}
.dq{font-size:13px;color:#3f4559;margin:6px 0}
.dq code{background:#f1f2f9;border-radius:4px;padding:0 4px;font-size:12.5px;color:#b5347a}
.da{font-size:12.3px;color:#6b7280;background:#f7f8fd;border-radius:7px;padding:6px 9px;margin:6px 0;word-break:break-word}
.dw{font-size:12.5px;color:#5b6175;line-height:1.65}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#1b2033;color:#fff;font-size:13px;padding:10px 18px;border-radius:11px;opacity:0;pointer-events:none;transition:.22s;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 手机适配 ---------- */
@media(max-width:640px){
  .wrap{padding:16px 13px 64px}
  .hdr{flex-wrap:wrap;gap:10px;margin-bottom:16px}
  .hdr h1{font-size:17px}
  .hdr p{font-size:12px}
  .hstat{margin-left:0;order:3;width:100%;text-align:center;padding:7px 12px}
  .hero{flex-direction:column;align-items:flex-start;gap:18px;padding:22px 20px}
  .hero h2{font-size:19px}
  .hero p{font-size:13px}
  .hero-r{margin-left:0;width:100%;justify-content:space-between;gap:10px}
  .hero-r b{font-size:22px}
  .kbd-hint{display:none}
  .panel{padding:16px 15px;border-radius:16px}
  .startrow .btn{flex:1 1 auto;justify-content:center}
  .chip{font-size:12px;padding:6px 11px}
  .resume-bar{font-size:12px}
  .resume-bar .sp{display:none}
  .resume-bar .btn{margin-left:auto}
  .overlay{padding:0;align-items:flex-end}
  .modal{max-height:94vh;border-radius:18px 18px 0 0;width:100%}
  .m-head{padding:14px 14px 10px}
  .pbar{margin:0 14px}
  .m-body{padding:14px}
  .qtext{font-size:15px}
  .opt{font-size:13.5px;padding:10px 12px;gap:9px}
  .m-foot{padding:12px 14px 16px}
  .m-foot .btn{padding:11px 16px}
  .res-hero{flex-direction:column;text-align:center;gap:16px;padding:22px 18px}
  .res-hero h2{font-size:18px}
  .ring{width:112px;height:112px}
  .ring-in b{font-size:29px}
  pre.code{font-size:12px;padding:12px}
}


/* ---------- 多题库：标签页 ---------- */
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:12px;border:1px solid #e2e5f0;background:#fff;cursor:pointer;font-size:14px;font-weight:600;color:#5b6175;font-family:inherit;transition:.15s}
.tab:hover{border-color:#c7cbf5;color:#4338ca}
.tab.on{background:#1b2033;color:#fff;border-color:#1b2033;box-shadow:0 6px 16px -8px rgba(20,25,60,.6)}
.tab i{font-style:normal;font-size:11px;font-weight:600;background:#eef0f8;color:#8a90a3;border-radius:999px;padding:0 7px;line-height:1.7}
.tab.on i{background:rgba(255,255,255,.18);color:#fff}
.badge.multi{background:#fef3c7;color:#92400e}
.refchip{border:1px dashed #c4b5fd;background:#f5f3ff;color:#6d28d9;font-size:11.5px;font-family:inherit;border-radius:999px;padding:3px 9px;cursor:pointer}
.refchip:hover{background:#ede9fe}
.plabel{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:#1b2033;color:#fff;font-size:11px;font-weight:700;margin-right:6px;vertical-align:2px}
.part{padding:12px 0;border-top:1px dashed #eef0f7}
.part:first-of-type{border-top:0;padding-top:0}
.part .qtext{font-size:14.5px;margin-bottom:10px}
.part .opts{gap:7px}
.part .opt{padding:9px 12px;font-size:13.5px}
.fb.mini{padding:9px 12px;margin-top:10px}
.fb.mini .fb-h{font-size:12.5px;margin-bottom:5px}
.fb.mini .fb-row{margin:3px 0}
.blink{color:#4338ca;text-decoration:none;border-bottom:1px dotted #a5b4fc}
.blink:hover{border-bottom-style:solid}
.refmodal{width:min(680px,100%)}
.codebox{height:132px;resize:vertical;line-height:1.7;white-space:pre-wrap;word-break:break-all;font-size:12.5px;color:#1b2033}
#codeOv{background:rgba(23,27,45,.62)}
/* 我的题库面板 */
.memgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.memgrid{grid-template-columns:1fr}}
.memcol{background:#fafbff;border:1px solid #eef0f7;border-radius:12px;padding:12px 14px}
.memh{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px}
.memh span{margin-left:auto;font-size:12px;color:#8a90a3}
.memlist{max-height:210px;overflow:auto}
.memrow{display:flex;align-items:center;gap:8px;padding:5px 3px;font-size:12.5px;cursor:pointer;border-radius:6px}
.memrow:hover{background:#f1f2fa}
.memrow input{margin:0;flex:none}
.memrow .mid{font-family:"Cascadia Code",Consolas,monospace;color:#8a90a3;flex:none;width:58px}
.memrow .mt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#3f4559}
.memrow i{font-style:normal;font-size:11px;color:#4338ca;background:#eef2ff;border-radius:999px;padding:0 6px}
/* 改错题 */
.badge.fix{background:#fee2e2;color:#991b1b}
pre.fixcode{background:#131a2b;color:#e6e9f5;border-radius:12px;padding:12px 0;overflow:auto;font-size:12.8px;line-height:1.75;margin:0 0 12px;font-family:"Cascadia Code",Consolas,monospace}
pre.fixcode .row{display:flex;gap:10px;padding:0 14px}
pre.fixcode .row i{flex:none;width:26px;text-align:right;color:#6b7280;font-style:normal;user-select:none;font-size:12px}

<script>
window.QB = window.QB || {};

/* ===== Python 题库 ===== */
const PY_CH = {
  1:{name:'Python 是什么、怎么运行', short:'运行与注释', points:[
      '脚本模式跑 `python hello.py`；交互模式（REPL）直接敲 `python`，提示符 `>>>`',
      '交互模式表达式会自动回显，脚本模式必须 `print` 才看得到',

    ], pit:'把 `/* */` 或 `//` 当注释用，直接报错'},
  2:{name:'输出 print 与输入 input', short:'print/input', points:[
      '`print(a, b)` 多个参数默认用空格分开，结尾默认换行',
      '`sep=` 管参数之间，`end=` 管结尾',
      '`input()` 返回的永远是 `str`，做数学运算前必须 `int()` / `float()`'
    ], pit:'`price = input()` 后写 `price * 2`，得到的是 `"100100"` 不是 200'},
  3:{name:'变量与对象', short:'变量与对象', points:[
      '变量是贴在对象上的名字（引用），不是装数据的盒子',
      '`a, b = b, a` 一行交换；`x = y = z = 0` 三个名字指同一个值',
      '对象三要素：身份 `id()`、类型 `type()`、值'
    ], pit:'以为 `m = n` 是复制；`x, y = 1, 2, 3` 会 ValueError'},
  4:{name:'命名、关键字与风格', short:'命名关键字', points:[
      '只能由字母、数字、下划线组成，不能数字开头，不能是关键字，区分大小写',
      '`class`、`if`、`for` 这些是关键字，绝对不能当变量名',
      '推荐 snake_case（`my_number`）；常量约定全大写'

  5:{name:'数据类型与类型转换', short:'类型转换', points:[
      '四种基础类型：`str` / `int` / `float` / `bool`，`True`/`False` 首字母必须大写',
      'bool 本质上是 int 的子类：`True + 1 == 2`',
      '`int()` 对小数是截断不四舍五入，要四舍五入用 `round()`'
    ], pit:'`int("9.8")` 是 ValueError，得先 `float` 再 `int`'},
  6:{name:'表达式、语句与运算符', short:'运算符', points:[
      '算术七个：`+ - * / // % **`；`//` 向下取整，`%` 余数符号跟除数走',
      '优先级：`()` > `**` > `* / // %` > `+ -`，同级从左到右',
      '`and` / `or` 会短路；`==` 比值，`is` 比身份，`in` 比成员'
    ], pit:'`-5 // 2` 是 -3 不是 -2；`if x = 5:` 是语法错误'},
  7:{name:'条件语句', short:'条件语句', points:[
      '`if` / `if-else` / `if-elif-else`：条件后必须冒号，代码块缩进 4 空格',
      '`elif` 从上往下判断，命中第一个 True 就跳出整条链',
      '三元：`A if 条件 else B`；`pass` 是什么都不做的占位'
    ], pit:'缩进错层不报错，但逻辑全错——比报错更危险'},
  8:{name:'字符串格式化', short:'字符串格式化', points:[
      '三种写法 `%` / `.format()` / f-string，推荐 f-string',
      '`f"{x:.2f}"` 保留两位小数；`%d` 直接截断',
      '`+` 只能拼字符串，`*` 可以重复'
    ], pit:'`"a" + 1` 是 TypeError，要写成 `"a" + str(1)`'},
  9:{name:'循环', short:'循环', points:[
      '`while` 靠条件退出；`for` 遍历序列；`range(start, stop, step)` 含头不含尾',
      '`break` 跳出整层，`continue` 跳过本次；循环 `else` 只在自然结束时执行',
      '嵌套循环：内层计数器必须在外层循环体里重置'
    ], pit:'`continue` 写在 `i += 1` 之前 → 死循环'},
  10:{name:'列表 List', short:'列表', points:[
      '有序、可变、可重复、可异构；下标从 0 开始，`-1` 是最后一个',
      '切片含头不含尾，`a[::-1]` 反转，切片赋值长度可以不等',
      '`append` 加一个，`extend` 加一串；`sort()` 原地改并返回 None'
    ], pit:'`remove(2)` 删的是“值 2”，不是第 2 项'},
  11:{name:'字典 Dictionary', short:'字典', points:[
      '键值对存储，键唯一且必须不可变；3.7+ 保持插入顺序',
      '`d[k]` 键不存在就 KeyError，`d.get(k, 默认值)` 才安全',
      '`= ` 只是别名，`copy()` 才是复制（浅拷贝）'
    ], pit:'一边遍历一边增删键 → RuntimeError'},
  12:{name:'函数', short:'函数', points:[
      '`def 名字(参数):` 后面缩进写函数体，先定义后调用',
      '`return` 把结果交回调用处；没有 `return` 时返回 `None`',
      '`print` 是显示出来，`return` 是交回去'
    ], pit:'只写 `add(1, 2)` 不会有任何输出，得套 `print()`'},
  13:{name:'报错类型与常见异常', short:'报错类型', points:[
      '语法错误跑不起来 / 运行时错误跑到那行才崩 / 逻辑错误能跑但结果错',
      '常见异常：SyntaxError、IndentationError、NameError、TypeError、ValueError、IndexError、KeyError、ZeroDivisionError',
      '逻辑错误没有任何报错，最难查'
    ], pit:'把逻辑错误当成“程序没问题”，结果一直不对'},
  14:{name:'现代 Python 实用新语法', short:'新语法', points:[
      '海象 `:=` 在表达式里赋值；`match/case` 结构模式匹配（3.10+）',
      '`d1 | d2` 合并字典（3.9+）；`first, *rest = lst` 解包',
      '`enumerate` / `zip` / `f"{x=}"` / `removeprefix` / `sorted(key=)` 日常最常用'
    ], pit:'`match` 是“匹配”不是 `if`；`:=` 不加括号会把整个比较结果赋进去'}
};
/* 综合题专用章节（多小题） */
PY_CH[15] = {
  name: '综合 · 跨章节', short: '综合',
  points: ['把循环、列表、字典、字符串串起来用，一题往往同时考边界和类型',
           '综合题有多小题，选择/填空混排，按小题计分'],
  pit: '只盯一行代码，不追变量的最终状态'
};
const PY_BANK = [
/* ---------- Ch1 运行方式与注释 ---------- */
{id:"q01",ch:1,topic:"1.2 交互模式 vs 脚本模式",sec:"§1.2",type:"choice",
 q:"在脚本 hello.py 里只写了一行 `1 + 2`，运行 `python hello.py` 之后屏幕上会看到什么？",
 opts:["3","什么都不显示","SyntaxError","None"],ans:1,
 why:"脚本模式下表达式的结果不会自动显示，只有交互模式 >>> 才会回显。要看到结果必须写 `print(1 + 2)`。"},
{id:"q02",ch:1,topic:"1.2 两种运行方式",sec:"§1.2",type:"choice",
 q:"在交互模式（REPL，提示符 `>>>`）里想退出，通常输入什么？",
 opts:["exit()","stop()","close()","Ctrl+Alt+Del"],ans:0,
 why:"`exit()` 或 `quit()` 都能退出；Windows 上也可以按 Ctrl+Z 再回车。脚本模式没有 >>> 提示符。"},
{id:"q03",ch:1,topic:"1.3 注释写法",sec:"§1.3",type:"choice",
 q:"想在 .py 文件里写 3 行说明文字当注释，哪种做法是对的？",
 opts:["用 `/* 三行说明 */` 包起来","每行开头都写 `//`","每一行前面都加 `#`","必须写成三引号 docstring"],ans:2,
 why:"Python 只有 `#` 一种注释符号，多行就是每行都写 `#`。三引号字符串放在模块或函数开头叫 docstring，它本质仍是字符串对象，不是注释语法。"},

/* ---------- Ch2 print / input ---------- */
{id:"q04",ch:2,topic:"2.1 print 的 sep 参数",sec:"§2.1",type:"fill",
 q:"下面这行输出什么？",code:`print('a', 'b', sep='-')`,a:["a-b"],
 why:"`sep` 指定多个参数之间的分隔符，默认是空格，这里改成了 `-`。"},
{id:"q05",ch:2,topic:"2.1 print 多参数默认空格",sec:"§2.1",type:"fill",
 q:"下面这行输出什么？",code:`print('Sum:', 5 + 10)`,a:["Sum: 15"],
 why:"print 的多个参数默认用空格隔开；`5 + 10` 先算成 15 再打印。"},
{id:"q06",ch:2,topic:"2.2 input 返回的是字符串",sec:"§2.2",type:"fill",
 q:"用户输入 `100` 之后，下面代码输出什么？",code:`price = input('Price: ')
print(price * 2)`,a:["100100","Price: 100100"],
 why:"`input()` 拿到的永远是 str，`'100' * 2` 是字符串重复两遍，不是 200。要算术必须先 `float(input(...))`。"},
{id:"q07",ch:2,topic:"2.3 完整例子：加价 20%",sec:"§2.3",type:"fill",
 q:"用户输入 `100` 之后，输出的整行结果是什么？",code:`net_price = float(input('Price: '))
final_price = (0.2 * net_price) + net_price
print(f'Final price = {final_price}')`,a:["Final price = 120.0","Price: Final price = 120.0"],
 why:"先转成 float 再算 0.2×100+100=120.0；f-string 把 float 原样插进去，所以带 `.0`。"},
{id:"q08",ch:2,topic:"2.1 print 的 end 参数",sec:"§2.1",type:"choice",
 q:"想让两次 print 的结果留在同一行，应该改哪个参数？",
 opts:["`sep=''`","`end=''`","`flush=True`","`same_line=True`"],ans:1,
 why:"`end` 控制结尾字符，默认是换行符，改成空串或空格就不换行。`sep` 管的是多个参数之间。"},

/* ---------- Ch3 变量与对象 ---------- */
{id:"q09",ch:3,topic:"3.4 赋值是引用不是复制",sec:"§3.4",type:"fill",
 q:"下面代码输出什么？",code:`n = 3000
m = n
m = 6000
print(n, m)`,a:["3000 6000"],
 why:"`m = n` 只是让两个名字指向同一个对象；给 m 重新赋值只是让它改指 6000，n 不受影响。"},
{id:"q10",ch:3,topic:"3.2 多重赋值与交换",sec:"§3.2",type:"fill",
 q:"下面代码输出什么？",code:`a, b = 1, 2
a, b = b, a
print(a, b)`,a:["2 1"],
 why:"右边的 `(b, a)` 先算成一个元组，再按位置赋回去，所以一次就完成交换。"},
{id:"q11",ch:3,topic:"3.2 多重赋值个数不匹配",sec:"§3.2",type:"choice",
 q:"`x, y = 'one', 'two', 'three'` 会发生什么？",
 opts:["x 得到 'one'，y 得到 'two'，多的丢掉","ValueError: too many values to unpack","正常执行，x 得到整个元组","TypeError"],ans:1,
 why:"左边 2 个名字、右边 3 个值，个数必须一致，否则 ValueError。"},
{id:"q12",ch:3,topic:"3.3 is 与 == 的区别（对象身份）",sec:"§3.3",type:"choice",
 q:"下面代码输出什么？",code:`a = [1, 2]
b = a
c = [1, 2]
print(a is b, a is c, a == c)`,
 opts:["True True True","True False True","False True True","True False False"],ans:1,
 why:"b 和 a 是同一个对象（`is` 为 True）；c 是另建的同内容列表，值相等（`==` 为 True）但不是同一个对象（`is` 为 False）。"},
{id:"q13",ch:3,topic:"3.5 变量的五个特征",sec:"§3.5",type:"choice",
 q:"描述一个变量时，“作用域（scope）”指的是什么？",
 opts:["变量里存的值","名字能被访问到的范围","对象占多少内存","变量从创建到销毁的时间"],ans:1,
 why:"Scope 是名字能被访问的范围（局部 / 全局）；“从创建到销毁”那是生命周期（lifetime）。"},

/* ---------- Ch4 命名与关键字 ---------- */
{id:"q14",ch:4,topic:"4.1 命名的硬性规则",sec:"§4.1",type:"choice",
 q:"下面哪个变量名是合法的？",
 opts:["99redBallons","my_number","my-number","class"],ans:1,
 why:"变量名只能由字母、数字、下划线组成，不能数字开头、不能有连字符、不能用关键字。`my_number` 合规。"},
{id:"q15",ch:4,topic:"4.2 关键字",sec:"§4.2",type:"choice",
 q:"下面哪个是 Python 关键字，绝对不能拿来当变量名？",
 opts:["print","input","class","list"],ans:2,
 why:"print / input / list 都是内置函数，技术上能被同名变量覆盖（很不推荐）；`class` 是保留关键字，`class = 'x'` 直接 SyntaxError。"},
{id:"q16",ch:4,topic:"4.3 命名风格与常量",sec:"§4.3",type:"choice",
 q:"按命名约定，表示“不会再变的上限值”应该写成？",
 opts:["Maximum","maximum","MAXIMUM","max_imum"],ans:2,
 why:"常量约定全大写（MAXIMUM）；普通变量用 snake_case（my_number）；类名才用 MyClass。"},
{id:"q17",ch:4,topic:"4.1 变量名的组成字符",sec:"§4.1",type:"fill",
 q:"变量名只能由字母、数字和（　）组成。括号里填什么？",
 a:["下划线","_","underscore"],
 why:"也就是 `_`。数字不能打头，也不能包含空格、连字符、@ 等特殊字符。"},

/* ---------- Ch5 类型与转换 ---------- */
{id:"q18",ch:5,topic:"5.3 int() 是截断不是四舍五入",sec:"§5.3",type:"fill",
 q:"下面这行输出什么？",code:`print(int(9.8))`,a:["9"],
 why:"`int()` 对小数是直接截断，不是四舍五入；要四舍五入用 `round(9.8)` 得 10。"},
{id:"q19",ch:5,topic:"5.3 int 转小数形式的字符串",sec:"§5.3",type:"choice",
 q:"`print(int('9.8'))` 的结果是？",
 opts:["9","9.8","ValueError","TypeError"],ans:2,
 why:"`int()` 只接受整数字符串；`'9.8'` 得先转 float 再转 int：`int(float('9.8'))` 才是 9。"},
{id:"q20",ch:5,topic:"5.2 bool 本质上是 int",sec:"§5.2",type:"fill",
 q:"下面这行输出什么？",code:`print(True + 1)`,a:["2"],
 why:"bool 是 int 的子类，True 当 1 用、False 当 0 用，所以结果是 2。"},
{id:"q21",ch:5,topic:"5.3 哪些转换会报错",sec:"§5.3",type:"choice",
 q:"下面哪个转换会报错？",
 opts:["float('3.14')","str(42)","bool(0)","int('abc')"],ans:3,
 why:"`int('abc')` 是 ValueError（类型对、值不对）。`bool(0)` 是合法的，得到 False。"},
{id:"q22",ch:5,topic:"5.1 type() 的返回值",sec:"§5.1",type:"fill",
 q:"`print(type(3.14))` 输出什么？",
 a:["<class 'float'>"],
 why:"type() 返回对象的类型，格式是 `<class 'float'>`（尖括号和单引号都不能少）。"},

/* ---------- Ch6 运算符 ---------- */
{id:"q23",ch:6,topic:"6.2 // 向下取整（负数）",sec:"§6.2",type:"fill",
 q:"下面这行输出什么？",code:`print(-5 // 2)`,a:["-3"],
 why:"`//` 是地板除，向下取整。-2.5 向下是 -3，不是 -2——负数最容易错。"},
{id:"q24",ch:6,topic:"6.2 % 余数符号跟除数走",sec:"§6.2",type:"fill",
 q:"下面这行输出什么？",code:`print(-12 % 7)`,a:["2"],
 why:"余数的符号跟“除数”走，除数是 7（正数），所以结果是 2。可以用 `n = d * (n // d) + (n % d)` 验算。"},
{id:"q25",ch:6,topic:"6.2 负数的取余",sec:"§6.2",type:"fill",
 q:"下面这行输出什么？",code:`print(12 % -7)`,a:["-2"],
 why:"余数符号跟除数走，除数是 -7（负数），所以结果是 -2。"},
{id:"q26",ch:6,topic:"6.4 增强赋值运算符",sec:"§6.4",type:"fill",
 q:"下面代码最后输出什么？",code:`x = 10
x += 5
x -= 3
x *= 2
x //= 5
print(x)`,a:["4"],
 why:"10→15→12→24→4。`x //= 5` 就是 `x = x // 5`。"},
{id:"q27",ch:6,topic:"6.3 运算符优先级",sec:"§6.3",type:"fill",
 q:"下面这行输出什么？",code:`print(1 + 2 ** 3)`,a:["9"],
 why:"`**` 的优先级高于 `+`，先算 2**3=8，再加 1。"},
{id:"q28",ch:6,topic:"6.3 同级运算从左到右",sec:"§6.3",type:"fill",
 q:"下面这行输出什么？",code:`print(50 / 2 * 4)`,a:["100.0"],
 why:"乘除同级，从左到右：先 50/2=25.0，再 ×4。真除 `/` 的结果一定是 float，所以是 100.0。"},
{id:"q29",ch:6,topic:"6.3 优先级综合",sec:"§6.3",type:"fill",
 q:"下面这行输出什么？",code:`print(2 + 3 * 4 ** 2)`,a:["50"],
 why:"先 `**` 得 16，再 ×3 得 48，最后 +2 得 50。拿不准就加括号。"},
{id:"q30",ch:6,topic:"6.6 逻辑运算的短路",sec:"§6.6",type:"choice",
 q:"下面代码运行结果是？",code:`x = 0
if x != 0 and 10 / x > 1:
    print('big')`,
 opts:["ZeroDivisionError","什么都不输出，也不报错","输出 big","SyntaxError"],ans:1,
 why:"`and` 左边 `x != 0` 是 False 就短路，右边的 10/x 根本不会算，所以既不报除零错也不进 if。"},
{id:"q31",ch:6,topic:"6.5 = 是赋值，== 才是比较",sec:"§6.5",type:"choice",
 q:"`if x = 5:` 会怎样？",
 opts:["把 5 赋给 x，条件为真","SyntaxError：赋值不能写在 if 条件里","永远为 False","NameError"],ans:1,
 why:"`=` 是赋值，`==` 才是比较。`if x = 5:` 语法错误，程序根本跑不起来。"},
{id:"q32",ch:6,topic:"6.7 判断 None 为什么用 is",sec:"§6.7",type:"choice",
 q:"判断变量 x 是不是 None，推荐写法是？",
 opts:["x == None","x is None","x = None","not x"],ans:1,
 why:"判 None 用 `is`（比身份）。`== None` 能跑但不推荐；`not x` 会把 0、空串、空列表也判成“空”，意思就变了。"},
{id:"q33",ch:6,topic:"6.7 成员运算符 in",sec:"§6.7",type:"fill",
 q:"下面这行输出什么？",code:`print('a' in 'cat', 3 in [1, 2, 3])`,a:["True True"],
 why:"`in` 用在字符串上是查子串，用在列表上是查元素，结果都是 bool。"},

/* ---------- Ch7 条件语句 ---------- */
{id:"q34",ch:7,topic:"7.2 if-elif-else 的执行顺序",sec:"§7.2",type:"fill",
 q:"下面代码输出什么？",code:`score = 75
if score >= 90:
    print('A')
elif score >= 75:
    print('B')
elif score >= 60:
    print('C')
else:
    print('D')`,a:["B"],
 why:"从上往下命中第一个 True 就跳出整条链，所以是 B，不会再去看 `>= 60`。"},
{id:"q35",ch:7,topic:"7.4 三元运算符",sec:"§7.4",type:"fill",
 q:"下面代码输出什么？",code:`age = 20
ticket_price = 30 if age >= 18 else 15
print(ticket_price)`,a:["30"],
 why:"三元写法是“结果在前、条件在中间、否则结果在后”：`A if 条件 else B`。"},
{id:"q36",ch:7,topic:"7.3 漏缩进报什么错",sec:"§7.3",type:"choice",
 q:"下面代码会怎样？",code:`x = 5
if x > 2:
print('big')`,
 opts:["正常输出 big","IndentationError","SyntaxError","什么都不输出"],ans:1,
 why:"if 后面必须有一条缩进的语句。漏缩进报 IndentationError（缩进类错误），不是普通语法错误。"},
{id:"q37",ch:7,topic:"7.3 缩进错层 = 逻辑错误",sec:"§7.3",type:"choice",
 q:"下面代码运行结果是？",code:`age = 13
if age >= 18:
    print('可以喝酒')
print('来点威士忌！')`,
 opts:["两行都输出","只输出“来点威士忌！”","只输出“可以喝酒”","IndentationError"],ans:1,
 why:"最后一行没缩进，不在 if 里，所以 13 岁也照样打印——不报错但逻辑错，这是最危险的一类错误。"},
{id:"q38",ch:7,topic:"7.5 pass 的作用",sec:"§7.5",type:"choice",
 q:"`pass` 的作用是？",
 opts:["立即结束程序","占位：语法上要有语句，但什么都不做","跳过本次循环","结束当前函数并返回 None"],ans:1,
 why:"pass 是空语句，用来搭骨架；跳过本次循环是 `continue`，结束函数是 `return`。"},
{id:"q39",ch:7,topic:"7.2 elif 命中第一个就跳出",sec:"§7.2",type:"choice",
 q:"下面代码输出什么？",code:`x = 5
if x > 0:
    print('A')
elif x > 1:
    print('B')`,
 opts:["A","B","A 和 B 都输出","什么都不输出"],ans:0,
 why:"第一个条件已经为 True，后面的 elif 直接跳过——即使 `x > 1` 也成立。"},
/* ---------- Ch8 字符串格式化 ---------- */
{id:"q40",ch:8,topic:"8.3 f-string 控制小数位",sec:"§8.3",type:"fill",
 q:"下面代码输出什么？",code:`price = 89.5
print(f"价格：{price:.2f} 元")`,a:["价格：89.50 元"],
 why:"`:.2f` 表示保留 2 位小数，会补零，所以是 89.50 而不是 89.5。"},
{id:"q41",ch:8,topic:"8.2 %d 的截断",sec:"§8.2",type:"fill",
 q:"下面这行输出什么？",code:`print('%d' % 3.9)`,a:["3"],
 why:"`%d` 只打印整数部分（截断），不四舍五入。"},
{id:"q42",ch:8,topic:"8.4 字符串只能和字符串相加",sec:"§8.4",type:"choice",
 q:"`print('a' + 1)` 会怎样？",
 opts:["输出 a1","输出 1","TypeError","ValueError"],ans:2,
 why:"字符串只能和字符串相加，要写成 `'a' + str(1)`。"},
{id:"q43",ch:8,topic:"8.4 字符串重复",sec:"§8.4",type:"fill",
 q:"下面这行输出什么？",code:`print(len('-' * 20))`,a:["20"],
 why:"`'-' * 20` 是重复 20 次，长度就是 20。"},
{id:"q44",ch:8,topic:"8.1 三种格式化写法",sec:"§8.1",type:"choice",
 q:"要把变量塞进字符串，本课推荐用哪种写法？",
 opts:["'%s' % x","'{}'.format(x)","f'{x}'","'x' + str(x)"],ans:2,
 why:"f-string 最直观，Python 3.6+ 都有；`%` 是最老写法，`.format()` 居中。"},

/* ---------- Ch9 循环 ---------- */
{id:"q45",ch:9,topic:"9.7 range 的步长与倒序",sec:"§9.7",type:"fill",
 q:"下面这行输出什么？",code:`print(list(range(10, 0, -2)))`,a:["[10, 8, 6, 4, 2]"],
 why:"`range(start, stop, step)` 含头不含尾：从 10 开始每次 -2，到 0 之前停。"},
{id:"q46",ch:9,topic:"9.7 range(1, 8, 2)",sec:"§9.7",type:"fill",
 q:"下面代码逐行打印出什么？（写成一行，用空格分隔）",code:`for i in range(1, 8, 2):
    print(i)`,a:["1 3 5 7"],
 why:"1、3、5、7；9 已经到 8 之后了，不包含。"},
{id:"q47",ch:9,topic:"9.4 循环 else 与 break",sec:"§9.4",type:"choice",
 q:"下面代码输出什么？",code:`i = 0
while i < 3:
    if i == 1:
        break
    i += 1
else:
    print('done')`,
 opts:["done","什么都不输出","0 1 2 然后 done","SyntaxError"],ans:1,
 why:"else 只在循环“自然结束”时执行；被 break 打断就不执行。这里 i==1 就 break 了，所以什么都不输出。"},
{id:"q48",ch:9,topic:"9.3 continue 的位置陷阱",sec:"§9.3",type:"choice",
 q:"下面代码的问题是什么？",code:`i = 0
while i < 5:
    if not i % 2:
        continue
    i += 1
    print(i)`,
 opts:["正常输出 1 3 5","死循环：i 一直是 0","输出 0 2 4","IndentationError"],ans:1,
 why:"i 是 0，`not i % 2` 为 True 直接 continue，`i += 1` 永远执行不到 → 死循环。continue 之前一定要先自增。"},
{id:"q49",ch:9,topic:"9.9 嵌套循环的执行次数",sec:"§9.9",type:"fill",
 q:"`for i in range(1, 11):` 里面再套一层 `for j in range(1, 11):`，内层循环体一共执行多少次？",
 a:["100"],
 why:"外层 10 次 × 内层 10 次 = 100 次。"},
{id:"q50",ch:9,topic:"9.5 嵌套 while 的内层重置",sec:"§9.5",type:"choice",
 q:"嵌套 while 里，内层计数器 j 如果只在循环外写了一次 `j = 0`，会怎样？",
 opts:["内层每次都能完整跑完","只有第一轮外层能进内层","死循环","报 NameError"],ans:1,
 why:"第一轮结束后 j 已经是终止值，后面每轮内层条件直接为假，内层再也不跑。每进一次外层都要重新 `j = 0`。"},
{id:"q51",ch:9,topic:"9.10 迭代器与 StopIteration",sec:"§9.10",type:"choice",
 q:"下面代码最后一行会怎样？",code:`colours = ('red', 'green', 'blue')
it = iter(colours)
next(it); next(it); next(it)
print(next(it))`,
 opts:["输出 red","输出 None","StopIteration","IndexError"],ans:2,
 why:"next() 取完还取会抛 StopIteration。for 循环内部就是 iter() + 反复 next()，取完自动停。"},
{id:"q52",ch:9,topic:"9.6 字符串也能被 for 遍历",sec:"§9.6",type:"fill",
 q:"`for ch in 'JC1001':` 的循环体一共执行几次？",a:["6"],
 why:"字符串可遍历，'JC1001' 有 6 个字符。"},
{id:"q53",ch:9,topic:"9.7 range 不是列表",sec:"§9.7",type:"fill",
 q:"下面这行输出什么？",code:`print(range(5))`,a:["range(0, 5)"],
 why:"range 是惰性的序列对象，不是列表；要看内容得 `list(range(5))`。"},
{id:"q54",ch:9,topic:"9.12 while 与 for 怎么选",sec:"§9.12",type:"choice",
 q:"要“一直读用户输入，直到输入 quit 为止”（次数未知），应该用？",
 opts:["for i in range(n)","while","列表推导式","递归"],ans:1,
 why:"次数未知、靠条件退出用 while；已知次数或遍历序列才用 for。"},

/* ---------- Ch10 列表 ---------- */
{id:"q55",ch:10,topic:"10.2 负索引 -1",sec:"§10.2",type:"fill",
 q:"下面代码输出什么？",code:`a = ['item1', 'item2', 'item3', 'item4']
print(a[-1])`,a:["item4"],
 why:"`-1` 永远是最后一个元素。"},
{id:"q56",ch:10,topic:"10.2 切片含头不含尾",sec:"§10.2",type:"fill",
 q:"下面代码输出什么？",code:`a = ['item1', 'item2', 'item3', 'item4']
print(a[1:3])`,
 a:["['item2', 'item3']"],
 why:"从下标 1 到下标 2（不含 3），所以是两个元素。"},
{id:"q57",ch:10,topic:"10.2 切片反转",sec:"§10.2",type:"fill",
 q:"下面代码输出什么？",code:`a = ['item1', 'item2', 'item3', 'item4']
print(a[::-1])`,
 a:["['item4', 'item3', 'item2', 'item1']"],
 why:"步长写 -1 就是整体反转。"},
{id:"q58",ch:10,topic:"10.4 append 与 extend",sec:"§10.4",type:"choice",
 q:"下面代码输出什么？",code:`a = [1, 2]
a.append([3, 4])
print(a)`,
 opts:["[1, 2, 3, 4]","[1, 2, [3, 4]]","[3, 4, 1, 2]","TypeError"],ans:1,
 why:"append 把整个列表当成“一个元素”塞到末尾；要逐个加入用 extend。"},
{id:"q59",ch:10,topic:"10.5 remove 是按值删",sec:"§10.5",type:"choice",
 q:"下面代码会怎样？",code:`c = ['red', 'green', 'blue']
c.remove(2)`,
 opts:["删掉第 2 项 'green'","删掉 'blue'","ValueError","TypeError"],ans:2,
 why:"remove(x) 删的是“值为 x”的第一个元素，不是下标；列表里没有 2 就 ValueError。按下标删用 `pop(2)` 或 `del c[2]`。"},
{id:"q60",ch:10,topic:"10.8 sort() 的返回值",sec:"§10.8",type:"choice",
 q:"`lst.sort()` 的返回值是什么？",
 opts:["排好序的新列表","None（原地修改）","原列表本身","True"],ans:1,
 why:"sort / reverse 都是原地修改并返回 None，所以 `x = lst.sort()` 会让 x 变成 None。"},
{id:"q61",ch:10,topic:"10.8 sorted 与 sort 的区别",sec:"§10.8",type:"choice",
 q:"想“保留原列表、另外拿到一份排好序的新列表”，用哪个？",
 opts:["lst.sort()","lst.reverse()","sorted(lst)","lst.copy()"],ans:2,
 why:"sorted() 返回新列表，原列表不动。"},
{id:"q62",ch:10,topic:"10.7 列表推导式",sec:"§10.7",type:"fill",
 q:"下面这行输出什么？",code:`print([x for x in range(1, 11) if x % 2 == 0])`,
 a:["[2, 4, 6, 8, 10]"],
 why:"1 到 10 里取偶数：2、4、6、8、10。"},
{id:"q63",ch:10,topic:"10.3 切片赋值",sec:"§10.3",type:"fill",
 q:"下面代码输出什么？",code:`s = ['bread', 'noodles', 'soup', 'apples']
s[2:3] = ['pasta', 'tomato']
print(s)`,
 a:["['bread', 'noodles', 'pasta', 'tomato', 'apples']"],
 why:"切片左边“剪掉”1 个、右边贴进 2 个，长度可以不等，所以列表变长。"},
{id:"q64",ch:10,topic:"10.2 list() 拆字符串",sec:"§10.2",type:"fill",
 q:"下面这行输出什么？",code:`print(list('aeiou'))`,a:["['a', 'e', 'i', 'o', 'u']"],
 why:"list() 把字符串拆成单个字符的列表。"},
{id:"q65",ch:10,topic:"10.6 带下标遍历列表",sec:"§10.6",type:"choice",
 q:"遍历列表时还要拿到下标，最直接的写法是？",
 opts:["for i in c: print(i, c[i])","for i in range(len(c)): print(i, c[i])","for i, c[i] in c: print(i)","for i in c: print(c[i])"],ans:1,
 why:"`range(len(c))` 生成下标，再用 `c[i]` 取元素。更现代的写法是 `enumerate(c)`，第 14 章会讲。"},

/* ---------- Ch11 字典 ---------- */
{id:"q66",ch:11,topic:"11.2 方括号取不存在的键",sec:"§11.2",type:"choice",
 q:"下面代码会怎样？",code:`book = {'title': 'Python', 'year': 2021}
print(book['isbn'])`,
 opts:["输出 None","输出空字符串","KeyError","IndexError"],ans:2,
 why:"键不存在时 `d[k]` 直接 KeyError；安全取值用 `book.get('isbn')`。"},
{id:"q67",ch:11,topic:"11.2 get 的默认值",sec:"§11.2",type:"fill",
 q:"下面代码输出什么？",code:`book = {'title': 'Python', 'year': 2021}
print(book.get('isbn', '无'))`,a:["无"],
 why:"`get(k, 默认值)` 在键不存在时返回默认值，不报错。"},
{id:"q68",ch:11,topic:"11.4 popitem 删最后一个键值对",sec:"§11.4",type:"choice",
 q:"要“删掉字典最后一个键值对并把它返回”，用哪个？",
 opts:["d.pop()","d.popitem()","d.remove()","del d[-1]"],ans:1,
 why:"`pop(k)` 必须给键；`popitem()` 才是删最后一项并返回 (键, 值)。不带参数的 `pop()` 会 TypeError。"},
{id:"q69",ch:11,topic:"11.1 重复键静默覆盖",sec:"§11.1",type:"fill",
 q:"下面代码输出什么？",code:`d = {'title': 'v1', 'title': 'v2'}
print(d)`,a:["{'title': 'v2'}"],
 why:"键唯一，后写的静默覆盖前一个，而且不报错。"},
{id:"q70",ch:11,topic:"11.5 遍历字典默认拿到键",sec:"§11.5",type:"choice",
 q:"下面代码打印出什么？",code:`user = {'id': 1234, 'age': 25}
for k in user:
    print(k)`,
 opts:["id 和 age","1234 和 25","(id, 1234) 和 (age, 25)","报错"],ans:0,
 why:"`for k in d` 默认遍历键；要值用 `d.values()`，要键值对用 `d.items()`。"},
{id:"q71",ch:11,topic:"11.5 遍历时不能增删键",sec:"§11.5",type:"choice",
 q:"一边 `for k in d:` 一边 `del d[k]` 会怎样？",
 opts:["正常删除","RuntimeError: dictionary changed size during iteration","KeyError","死循环"],ans:1,
 why:"遍历过程中字典大小变了会报 RuntimeError；要改就先遍历 `list(d.keys())` 的副本。"},
{id:"q72",ch:11,topic:"11.7 = 是别名，copy() 才是复制",sec:"§11.7",type:"choice",
 q:"下面代码跑完后，`a['x']` 和 `c['x']` 分别是？",code:`a = {'x': 1}
b = a
c = a.copy()
b['x'] = 99`,
 opts:["99 和 99","99 和 1","1 和 1","1 和 99"],ans:1,
 why:"`b = a` 是别名，改 b 等于改 a；`copy()` 才是新字典，顶层独立（注意是浅拷贝）。"},
{id:"q73",ch:11,topic:"11.6 字典推导式 + 过滤",sec:"§11.6",type:"fill",
 q:"下面代码输出什么？",code:`p2 = {'drive': 90, 'bag': 25, 'cable': 10}
print({p: v for p, v in p2.items() if v < 40})`,
 a:["{'bag': 25, 'cable': 10}"],
 why:"过滤掉价格 ≥ 40 的，只留下 bag 和 cable。"},
{id:"q74",ch:11,topic:"11.8 嵌套字典取值",sec:"§11.8",type:"fill",
 q:"下面代码输出什么？",code:`cars = {'Kia': {'model': 'Rio', 'year': 2019}, 'VW': {'model': 'Golf'}}
print(cars['Kia']['model'])`,a:["Rio"],
 why:"连续用两个 `[]` 一层一层往下取。"},
{id:"q75",ch:11,topic:"11.1 键必须不可变",sec:"§11.1",type:"choice",
 q:"下面哪种类型不能当字典的键？",
 opts:["字符串","整数","元组","列表"],ans:3,
 why:"键必须不可变（可哈希）；列表可变所以不能当键，元组可以。"},

/* ---------- Ch12 函数 ---------- */
{id:"q76",ch:12,topic:"12 print 与 return 的区别",sec:"§12",type:"choice",
 q:"单独运行下面这段，屏幕上会看到什么？",code:`def add(a, b):
    return a + b
add(1, 2)`,
 opts:["3","什么都不显示","None","TypeError"],ans:1,
 why:"return 只是把结果交回调用处，不会显示；要看到得写 `print(add(1, 2))`。"},
{id:"q77",ch:12,topic:"12 没有 return 时返回 None",sec:"§12",type:"choice",
 q:"函数里没写 return，调用后得到的返回值是？",
 opts:["0","空字符串","None","报错"],ans:2,
 why:"没有 return 时函数返回 None。"},
{id:"q78",ch:12,topic:"12 返回值可以直接打印",sec:"§12",type:"fill",
 q:"下面代码输出什么？",code:`def simple_add(a, b):
    return a + b
print(simple_add(1, 2))`,a:["3"],
 why:"这次套了 print，所以能看到 3。"},
{id:"q79",ch:12,topic:"12 必须先定义后调用",sec:"§12",type:"choice",
 q:"在函数定义之前就调用它，会报什么错？",
 opts:["NameError","TypeError","SyntaxError","IndentationError"],ans:0,
 why:"名字还没绑定就使用 → NameError。Python 执行到 def 那一行才创建函数对象。"},
{id:"q80",ch:12,topic:"12 def 的语法",sec:"§12",type:"choice",
 q:"下面哪个函数定义写法是正确的？",
 opts:["def greet() {print('hi')}","def greet(): print('hi')","function greet(): print('hi')","def greet() -> print('hi')"],ans:1,
 why:"`def 名字(参数):` 后面跟缩进的函数体；单行写法也必须有冒号。其他几种都不是 Python 语法。"},

/* ---------- Ch13 报错类型 ---------- */
{id:"q81",ch:13,topic:"13.1 三类错误的分辨",sec:"§13.1",type:"choice",
 q:"哪类错误是“程序能跑完、完全不报错，但结果不对”？",
 opts:["Syntax error","Runtime error","Logic error","IndentationError"],ans:2,
 why:"逻辑错误最难查，只能靠读代码、打日志、拿测试数据比对。"},
{id:"q82",ch:13,topic:"13.2 ValueError",sec:"§13.2",type:"choice",
 q:"`int('abc')` 抛什么异常？",
 opts:["TypeError","ValueError","NameError","SyntaxError"],ans:1,
 why:"类型对（是字符串）、值不对（不是数字）→ ValueError。"},
{id:"q83",ch:13,topic:"13.2 IndexError",sec:"§13.2",type:"choice",
 q:"`print([1, 2, 3][5])` 抛什么异常？",
 opts:["KeyError","IndexError","ValueError","TypeError"],ans:1,
 why:"列表下标越界是 IndexError。"},
{id:"q84",ch:13,topic:"13.2 ZeroDivisionError",sec:"§13.2",type:"choice",
 q:"`print(10 / 0)` 抛什么异常？",
 opts:["ZeroDivisionError","ValueError","TypeError","什么都不抛"],ans:0,
 why:"除以 0 就是 ZeroDivisionError。"},
{id:"q85",ch:13,topic:"13.1 语法错误长什么样",sec:"§13.1",type:"choice",
 q:"下面哪一句是语法错误（程序根本跑不起来）？",
 opts:["if x = 5:","int('abc')","[1, 2][5]","1 / 0"],ans:0,
 why:"赋值语句不能写在 if 条件里，这是 SyntaxError；其余三个都是运行时才崩的错误。"},
/* ---------- Ch14 现代 Python 实用新语法 ---------- */
{id:"q86",ch:14,topic:"14.1 海象运算符 := 的括号",sec:"§14.1",type:"choice",ver:"3.8+",
 q:"想“先把 len(a) 存进 n，再和 3 比较”，下面哪句是对的？",
 opts:["if n := len(a) > 3:","if (n := len(a)) > 3:","if n = len(a) > 3:","if len(a) := n > 3:"],ans:1,
 why:"海象运算符优先级很低：不加括号时整个 `len(a) > 3` 先算成 True，n 变成 True——不报错但结果错。`n = ...` 写在 if 里是语法错误。"},
{id:"q87",ch:14,topic:"14.1 海象运算符实战",sec:"§14.1",type:"fill",ver:"3.8+",
 q:"下面代码输出什么？",code:`nums = [3, 7, 12, 5]
if (big := max(nums)) > 10:
    print(big)`,a:["12"],
 why:"一行里既存了变量又做了判断，省掉先 `big = max(nums)` 再 `if big > 10` 的两行。"},
{id:"q88",ch:14,topic:"14.2 f-string 的 = 调试写法",sec:"§14.2",type:"fill",ver:"3.8+",
 q:"下面代码输出什么？",code:`x = 10
y = 20
print(f'{x + y = }')`,a:["x + y = 30"],
 why:"f-string 里写 `=` 会把“表达式本身”和结果一起打印，调试时不用再手写 'x+y=' 这种标签。"},
{id:"q89",ch:14,topic:"14.3 用 | 合并字典",sec:"§14.3",type:"choice",ver:"3.9+",
 q:"下面代码输出什么？",code:`d1 = {'a': 1}
d2 = {'b': 2, 'a': 9}
print(d1 | d2)`,
 opts:["{'a': 1, 'b': 2}","{'a': 9, 'b': 2}","{'a': 1, 'a': 9, 'b': 2}","TypeError"],ans:1,
 why:"右边的同名键覆盖左边，所以 'a' 变成 9。`d1 |= d2` 是原地版本，比 `{**d1, **d2}` 更清楚。"},
{id:"q90",ch:14,topic:"14.4 removeprefix / removesuffix",sec:"§14.4",type:"fill",ver:"3.9+",
 q:"下面这行输出什么？",code:`print('test_file.py'.removesuffix('.py'))`,a:["test_file"],
 why:"removesuffix 去掉结尾的固定串，removeprefix 去掉开头的。比 `[:-3]` 或 replace 安全，不会误伤中间部分。"},
{id:"q91",ch:14,topic:"14.5 enumerate 同时拿下标和元素",sec:"§14.5",type:"choice",ver:"3.0+",
 q:"第一次循环打印出什么？",code:`for i, c in enumerate(['a', 'b'], start=1):
    print(i, c)`,
 opts:["0 a","1 a","1 b","a 1"],ans:1,
 why:"enumerate 同时给下标和元素；`start=1` 让编号从 1 开始，做排名、报表很常用。"},
{id:"q92",ch:14,topic:"14.6 zip 配对生成字典",sec:"§14.6",type:"fill",
 q:"下面这行输出什么？",code:`print(dict(zip(['a', 'b'], [90, 80])))`,
 a:["{'a': 90, 'b': 80}"],
 why:"zip 把两个序列“拉链式”配对成元组，dict() 直接把配对变成字典。"},
{id:"q93",ch:14,topic:"14.7 星号解包",sec:"§14.7",type:"fill",
 q:"下面代码输出什么？",code:`first, *rest = [1, 2, 3, 4]
print(first, rest)`,a:["1 [2, 3, 4]"],
 why:"`*rest` 收走剩下所有元素，比 `lst[0]` 加 `lst[1:]` 更直观。"},
{id:"q94",ch:14,topic:"14.6 zip(strict=True) 防丢数据",sec:"§14.6",type:"choice",ver:"3.10+",
 q:"`list(zip([1, 2, 3], 'ab', strict=True))` 会怎样？",
 opts:["[(1, 'a'), (2, 'b')]","[(1, 'a'), (2, 'b'), (3, None)]","ValueError","TypeError"],ans:2,
 why:"默认 zip 按短的截断、悄悄丢数据；`strict=True` 长度不一致直接 ValueError，更安全。"},
{id:"q95",ch:14,topic:"14.8 match 字面量分支",sec:"§14.8",type:"choice",ver:"3.10+",
 q:"下面代码输出什么？",code:`cmd = 'go'
match cmd:
    case 'go' | 'run':
        print('前进')
    case 'stop':
        print('停')
    case _:
        print('未知')`,
 opts:["前进","停","未知","SyntaxError"],ans:0,
 why:"`|` 表示“或”，匹配任一分支就执行；`case _` 是兜底（类似 default），要放在最后。"},
{id:"q96",ch:14,topic:"14.8 match 序列模式",sec:"§14.8",type:"fill",ver:"3.10+",
 q:"下面代码输出什么？",code:`point = (0, 5)
match point:
    case (0, 0):
        print('原点')
    case (0, y):
        print(f'在 y 轴上，y={y}')
    case _:
        print('其它')`,a:["在 y 轴上，y=5"],
 why:"`case (0, y)` 会把第二个元素绑到 y 上，分支里就能直接用——用 if 写要先判断长度再逐个取，麻烦得多。"},
{id:"q97",ch:14,topic:"14.8 match 字典模式",sec:"§14.8",type:"fill",ver:"3.10+",
 q:"下面代码输出什么？",code:`msg = {'type': 'add', 'x': 1, 'y': 2}
match msg:
    case {'type': 'add', 'x': a, 'y': b}:
        print(a + b)
    case _:
        print('skip')`,a:["3"],
 why:"字典模式按键匹配，同时把值绑到变量，处理 JSON、配置这类数据特别顺手。"},
{id:"q98",ch:14,topic:"14.8 match 守卫 guard",sec:"§14.8",type:"choice",ver:"3.10+",
 q:"下面代码输出什么？",code:`age = 15
match age:
    case n if n >= 18:
        print('adult')
    case _:
        print('minor')`,
 opts:["adult","minor","SyntaxError","什么都不输出"],ans:1,
 why:"`case ... if ...` 是守卫（guard），条件不成立就继续试下一个 case。"},
{id:"q99",ch:14,topic:"14.9 sorted 的 key 参数",sec:"§14.9",type:"choice",
 q:"下面这行输出什么？",code:`print(sorted(['ccc', 'a', 'bb'], key=len))`,
 opts:["['a', 'bb', 'ccc']","['ccc', 'bb', 'a']","['a', 'ccc', 'bb']","TypeError"],ans:0,
 why:"`key=len` 表示按长度排序，不写 key 才是按字典序。key 还能是 `str.lower`、lambda 等。"},
{id:"q100",ch:14,topic:"14.10 星号把列表摊成参数",sec:"§14.10",type:"fill",
 q:"下面这行输出什么？",code:`print(*[1, 2, 3], sep='-')`,a:["1-2-3"],
 why:"`*lst` 把列表摊开成多个参数，等价于 `print(1, 2, 3, sep='-')`。"},
{id:"q101",ch:14,topic:"14.11 any 与 all",sec:"§14.11",type:"choice",
 q:"下面这行输出什么？",code:`print(any([0, '', 3]), all([1, 'a', 0]))`,
 opts:["True False","True True","False False","False True"],ans:0,
 why:"any 有一个真就 True；all 必须全真。0、空串、空列表、None、False 都算假。"},
{id:"q102",ch:14,topic:"14.12 类型标注不参与运行",sec:"§14.12",type:"choice",
 q:"`def add(a: int, b: int) -> int:` 里的 `-> int` 表示什么？",
 opts:["强制返回值必须是 int，否则运行时报错","返回值类型提示，解释器运行时不检查","把函数声明成整数","必须 import typing 才能这样写"],ans:1,
 why:"类型标注只是给人和工具（IDE、mypy）看的提示，运行时不会因为类型不对而报错。`list[int]` 这种写法 3.9+ 可用。"},
{id:"q103",ch:14,topic:"14.13 itertools.batched 分批",sec:"§14.13",type:"choice",ver:"3.12+",
 q:"（已 `from itertools import batched`）`list(batched('ABCDEFG', 3))` 的结果是？",
 opts:["[('A', 'B', 'C'), ('D', 'E', 'F'), ('G',)]","[('ABC'), ('DEF'), ('G')]","['ABC', 'DEF', 'G']","报错：长度不能被 3 整除"],ans:0,
 why:"每 3 个一批，最后不足 3 个就单独成批，不会丢元素。"},
];

PY_BANK.push(...[{"id": "py104", "ch": 1, "topic": "1.2 脚本里裸表达式不会显示", "sec": "§1.2", "type": "fill", "q": "脚本 demo.py 的内容如下，运行 `python demo.py` 之后输出什么？", "code": "x = 10\nx + 5\nprint(x)", "a": ["10"], "why": "中间那行 `x + 5` 是裸表达式，脚本模式下既不显示结果，也不会把 15 存回 x——要显示必须写 `print(x + 5)`。最后一行的 `print(x)` 打印的仍是 10。§1.2：只有交互模式（>>>）才会把表达式的结果自动回显，脚本模式不会。"}, {"id": "py105", "ch": 1, "topic": "1.2 REPL 只回显表达式，不回显赋值", "sec": "§1.2", "type": "choice", "q": "在交互模式（提示符 `>>>`）里输入 `x = 3 + 4` 之后回车，屏幕上会显示什么？", "opts": ["7", "x = 7", "什么都不显示", "SyntaxError"], "ans": 2, "why": "赋值语句在 REPL 里同样不回显，只有表达式的值才会被打印出来。想看到结果得再输入 `x` 或 `print(x)`。别把“脚本模式不显示”和“REPL 什么都显示”混为一谈，REPL 只回显表达式的值。"}, {"id": "py106", "ch": 1, "topic": "1.3 命令行命令不能敲进 REPL", "sec": "§1.3", "type": "choice", "q": "已经在交互模式（提示符 `>>>`）里了，这时直接敲 `python hello.py` 会发生什么？", "opts": ["运行 hello.py", "SyntaxError：这不是合法的 Python 语句", "进入下一层解释器", "NameError"], "ans": 1, "why": "`python 文件名` 是操作系统命令行（cmd/PowerShell）的用法，不是 Python 语句。REPL 里只认 Python 代码，两个名字挨在一起就过不了语法检查，直接 SyntaxError。正确顺序是先 `exit()` 退出 REPL，再在命令行敲 `python hello.py`。"}, {"id": "py107", "ch": 1, "topic": "1.3 行首注释与行尾注释", "sec": "§1.3", "type": "fill", "q": "下面代码输出什么？", "code": "#print('A')\nprint('B')  # 打印 B", "a": ["B"], "why": "第一行开头的 `#` 让整行失效，所以 A 不会输出；第二行的 `#` 从它所在位置到行尾都被忽略，前面的 `print('B')` 照常执行。注释既可以在行首，也可以跟在代码后面，效果都是“到行尾为止”。"}, {"id": "py108", "ch": 1, "topic": "1.3 字符串里的 # 不是注释", "sec": "§1.3", "type": "fill", "q": "下面这行输出什么？", "code": "print('a#b')", "a": ["a#b"], "why": "引号里的 `#` 只是普通字符，注释只从“字符串外面”的 `#` 开始算。所以 `'a#b'` 完整打印成 a#b。同理 `print('#')` 会输出 #，而不是打出一个空行。"}, {"id": "py109", "ch": 1, "topic": "1.2 裸表达式混在 print 之间", "sec": "§1.2", "type": "fill", "q": "脚本里三行语句如下，运行后屏幕上的输出是什么？（写成一行，用空格分隔）", "code": "print(1 + 2)\n3 + 4\nprint('end')", "a": ["3 end"], "why": "第一行有 print，输出 3；中间那行 `3 + 4` 没有 print，脚本模式什么都不显示（这是最容易被忽略的一行）；最后打印 end。所以屏幕上是 3 然后是 end，中间的 7 根本不会出现。"}, {"id": "py110", "ch": 1, "topic": "1.3 注释掉赋值后再用变量", "sec": "§1.3", "type": "choice", "q": "下面代码运行会怎样？", "code": "# total = 100\nprint(total)", "opts": ["输出 100", "NameError", "什么都不输出", "SyntaxError"], "ans": 1, "why": "赋值被 `#` 注释掉了，`total` 这个名字从来没绑定过对象，用到它时就是 NameError。这不是语法错误——程序能启动，跑到这一行才崩（§13.2 的运行时错误），所以 IDE 不一定提前标红。"}, {"id": "py111", "ch": 2, "topic": "2.1 sep 只加在参数之间", "sec": "§2.1", "type": "choice", "q": "下面这行输出什么？", "code": "print('x', 'y', sep=',')", "opts": ["x,y", "x,y,", ",x,y", "x y"], "ans": 0, "why": "`sep` 只插在相邻两个参数“之间”，最后一个参数后面不会补分隔符，所以没有结尾逗号，开头也不会有。默认 sep 是空格，改成什么字符都不改变“只在中间”这一点。"}, {"id": "py112", "ch": 2, "topic": "2.1 end 把换行换成别的字符", "sec": "§2.1", "type": "fill", "q": "下面两行代码在屏幕上输出什么？", "code": "print('a', end='-')\nprint('b')", "a": ["a-b"], "why": "第一行把结尾的换行符换成了 `-`，光标停在同行；第二行接着打印 b，才由它来换行，所以整行是 a-b。`end` 管结尾、`sep` 管参数之间，两个参数别用混。"}, {"id": "py113", "ch": 2, "topic": "2.2 两个 input 直接相加是拼接", "sec": "§2.2", "type": "fill", "q": "用户依次输入 `3` 和 `4`，下面代码输出什么？", "code": "a = input()\nb = input()\nprint(a + b)", "a": ["34"], "why": "`input()` 拿到的永远是字符串，`'3' + '4'` 是拼接，得 '34' 而不是 7。要相加必须两个都转：`int(a) + int(b)`。注意这里连 `'7'` 都不是，加号在字符串上是“接起来”。"}, {"id": "py114", "ch": 2, "topic": "2.1 sep 与 end 同时用", "sec": "§2.1", "type": "fill", "q": "下面两行代码输出什么？", "code": "print(1, 2, sep='+', end='=')\nprint(3)", "a": ["1+2=3"], "why": "第一行两个参数用 `+` 连起来，结尾不换行而是写一个 `=`；第二行接着在同一行输出 3，所以是 1+2=3。`sep` 和 `end` 是两个独立参数，可以同时出现，互不影响。"}, {"id": "py115", "ch": 2, "topic": "2.2 input 忘了转型：TypeError", "sec": "§2.2", "type": "choice", "q": "用户输入 `20`，下面代码会怎样？", "code": "age = input('age: ')\nprint(age + 1)", "opts": ["输出 21", "输出 age: 21", "TypeError：str 和 int 不能相加", "ValueError"], "ans": 2, "why": "`input()` 返回 str，`'20' + 1` 是字符串加整数，类型对不上，直接 TypeError。注意它不是 ValueError（ValueError 是类型对、值不对，比如 `int('abc')`）。正确写法是 `int(input('age: ')) + 1`。"}, {"id": "py116", "ch": 2, "topic": "2.2 转型之后的真除", "sec": "§2.2", "type": "choice", "q": "用户依次输入 `12` 和 `5`，下面代码输出什么？", "code": "a = int(input())\nb = int(input())\nprint(a / b)", "opts": ["2", "2.4", "2.0", "2.5"], "ans": 1, "why": "12 / 5 = 2.4，`/` 是真除，结果一定是 float，所以是 2.4 而不是 2。如果写 `a // b` 才是 2（地板除）。两个输入都已经转成 int，所以也不会变成字符串拼接。"}, {"id": "py117", "ch": 2, "topic": "2.1 逗号写进字符串里", "sec": "§2.1", "type": "choice", "q": "用户输入 `Tom`，下面代码输出什么？", "code": "name = input()\nprint('Hi,', name)", "opts": ["Hi, Tom", "Hi,Tom", "Hi, 'Tom'", "Hi, name"], "ans": 0, "why": "`'Hi,'` 这个参数本身以逗号结尾，print 又在两个参数之间自动补一个空格，所以逗号后面正好一个空格。若改成 `print('Hi,' + name)` 自己拼接，就变成 Hi,Tom，少一个空格——这两个写法看着像，输出差一个字符。"}, {"id": "py118", "ch": 3, "topic": "3.4 两个名字指向同一个列表", "sec": "§3.4", "type": "fill", "q": "下面代码输出什么？", "code": "a = [1, 2]\nb = a\nb.append(3)\nprint(a)", "a": ["[1, 2, 3]"], "why": "`b = a` 只是给同一个列表又起了个名字，没有复制；`b.append(3)` 改的是那个列表本身，所以 a 也变成 [1, 2, 3]。想让 b 独立，得 `b = a.copy()` 或 `b = a[:]`。这和给整数重新赋值完全不同，整数不可变所以看不到这种连带效果。"}, {"id": "py119", "ch": 3, "topic": "3.4 别名 vs 浅复制", "sec": "§3.4", "type": "choice", "q": "设 `a = [1, 2]`，下面哪一段代码执行完之后 `a` 会变成 `[1, 2, 3]`？", "opts": ["`b = a` 之后 `b.append(3)`", "`b = a[:]` 之后 `b.append(3)`", "`b = a.copy()` 之后 `b.append(3)`", "`b = list(a)` 之后 `b.append(3)`"], "ans": 0, "why": "只有 `b = a` 是别名，b 和 a 是同一个对象，改 b 等于改 a。后三种都会新建一个列表，append 只影响 b，a 仍是 [1, 2]。`[:]`、`copy()`、`list()` 都是浅复制，对顶层元素来说是独立的。"}, {"id": "py120", "ch": 3, "topic": "3.2 多重赋值先算右边", "sec": "§3.2", "type": "fill", "q": "下面代码输出什么？", "code": "a, b = 1, 2\na, b = b, a + b\nprint(a, b)", "a": ["2 3"], "why": "右边的 `(b, a + b)` 先整体算成 `(2, 1 + 2)` 也就是 `(2, 3)`，再一次性赋给 a、b，所以是 2 3。如果分两行写 `a = b` 再 `b = a + b`，a 已经被改成 2，第二行就变成 2 + 2 = 4，结果就错了——右边的旧值必须在赋值前全部取好。"}, {"id": "py121", "ch": 3, "topic": "3.4 字符串不可变，重新赋值不连带", "sec": "§3.4", "type": "fill", "q": "下面代码输出什么？", "code": "x = 'abc'\ny = x\nx = x + 'd'\nprint(y)", "a": ["abc"], "why": "字符串不可变，`x + 'd'` 不是原地修改，而是造出一个新对象 'abcd'，再让 x 这个名字指过去；y 仍然指着原来的 'abc'。对比 py118：列表用 append 原地改，两个名字才会一起变。判断“另一个名字会不会跟着变”，关键看是“重新赋值”还是“原地修改”。"}, {"id": "py122", "ch": 3, "topic": "3.2 链式赋值不是绑成一体", "sec": "§3.2", "type": "choice", "q": "下面代码输出什么？", "code": "a = b = c = 0\nb = 5\nprint(a, b, c)", "opts": ["0 5 0", "5 5 5", "0 0 0", "0 5 5"], "ans": 0, "why": "`a = b = c = 0` 让三个名字分别都指向 0；之后只给 b 重新赋值，a 和 c 完全不受影响，所以是 0 5 0。链式赋值是“多个名字各自绑定”，不是把三个变量绑成一荣俱荣的一体。"}, {"id": "py123", "ch": 3, "topic": "3.1 变量是贴在对象上的名字", "sec": "§3.1", "type": "choice", "q": "关于“变量是贴在对象上的名字”，下面哪种说法是对的？", "opts": ["给一个名字重新赋值，会连带改掉指向同一对象的其他名字", "多个名字可以指向同一个对象，但给其中一个名字重新赋值不影响其他名字", "变量里存的就是值本身，所以赋值一定会复制一份对象", "同一个对象只能有一个名字"], "ans": 1, "why": "名字和对象是多对一：`b = a` 只是多贴一个标签；`b = 100` 只是把 b 这个标签撕下来贴到 100 上，a 仍指原对象。会被“连带改掉”的只有对可变对象的原地修改（append、`+=` 这类），而不是重新赋值。`id()` 相同就说明是同一个对象，可以用它验证。"}, {"id": "py124", "ch": 3, "topic": "3.2 三个变量循环右移", "sec": "§3.2", "type": "choice", "q": "下面代码输出什么？", "code": "a, b, c = 1, 2, 3\na, b, c = b, c, a\nprint(a, b, c)", "opts": ["2 3 1", "1 2 3", "3 2 1", "2 1 3"], "ans": 0, "why": "右边三个值先按顺序取好是 (2, 3, 1)，再依次赋给 a、b、c，等价于整体循环左移一位。如果写成三行普通赋值 `a = b; b = c; c = a`，a 的旧值早就被覆盖，三个变量会一起变成 2。"}, {"id": "py125", "ch": 4, "topic": "4.1 变量名区分大小写", "sec": "§4.1", "type": "fill", "q": "下面代码输出什么？", "code": "age = 20\nAge = 30\nprint(age + Age)", "a": ["50"], "why": "Python 区分大小写，`age` 和 `Age` 是两个毫不相干的变量，所以是 20 + 30 = 50。这也是为什么 `Total`、`total`、`TOTAL` 同时出现在一个文件里不会报错，却极易让人看错——命名要统一风格。"}, {"id": "py126", "ch": 4, "topic": "4.2 True 是关键字，不能赋值", "sec": "§4.2", "type": "choice", "q": "执行 `True = 0` 会发生什么？", "opts": ["True 变成 0", "SyntaxError：不能给关键字赋值", "正常运行，之后 True 就是 0", "NameError"], "ans": 1, "why": "`True`、`False`、`None` 在 Python 3 里是关键字，不是普通变量，赋值直接 SyntaxError，程序根本跑不起来。所以想临时改掉“真”的含义是做不到的，只能用普通名字（如 `flag = 0`）。"}, {"id": "py127", "ch": 4, "topic": "4.2 关键字判断区分大小写", "sec": "§4.2", "type": "choice", "q": "下面哪一行会报错？", "opts": ["`For = 1`", "`FOR = 1`", "`_for = 1`", "`for = 1`"], "ans": 3, "why": "只有 `for` 本身是关键字，赋值报 SyntaxError。`For`、`FOR`、`_for` 只是大小写或下划线的变化，都不是关键字，完全合法。也就是说“不能拿关键字当名字”这条规则是逐字符比较的，大写变体不算关键字，但可读性很差，别这么写。"}, {"id": "py128", "ch": 4, "topic": "4.1 合法变量名的组合判断", "sec": "§4.1", "type": "choice", "q": "下面哪一组变量名两个都合法？", "opts": ["`_a` 和 `a1`", "`1a` 和 `a1`", "`a-b` 和 `ab`", "`class` 和 `klass`"], "ans": 0, "why": "名字只能由字母、数字、下划线组成，且不能数字开头，所以 `1a` 非法；`a-b` 会被当成“a 减 b”的表达式，不是名字；`class` 是关键字。`_a` 以下划线开头完全合法，常用来表示“内部使用”。"}, {"id": "py129", "ch": 4, "topic": "4.1 用内置函数名当变量名的后果", "sec": "§4.1", "type": "choice", "q": "下面代码运行结果是？", "code": "input = 5\nprint(input + 1)\nprint(input('n: '))", "opts": ["输出 6，然后正常读入一个数", "输出 6，然后 TypeError：'int' object is not callable", "第一行就 SyntaxError", "输出 6，然后 NameError"], "ans": 1, "why": "`input = 5` 语法上允许，它把内置函数 input 这个名字盖掉了，之后 `input` 就是整数 5，再 `input('n: ')` 等于 `5('n: ')`，TypeError。代码能跑、前一行还正常打印，错误埋在后面——这正是“不要用内置函数名当变量名”的原因。"}, {"id": "py130", "ch": 4, "topic": "4.3 snake_case 命名风格", "sec": "§4.3", "type": "fill", "q": "按命名约定，`student_name` 这种“全小写 + 下划线分隔单词”的风格叫什么？（填英文名）", "a": ["snake_case", "蛇形命名", "下划线命名"], "why": "这就是 snake_case（蛇形命名），变量名和函数名都用它。另外两种：类名用 PascalCase（如 `StudentRecord`），常量全大写（如 `MAX_SIZE`）。风格不一致不影响运行，但会让别人读代码时多花时间。"}, {"id": "py131", "ch": 4, "topic": "4.3 常量只是约定，没有强制保护", "sec": "§4.3", "type": "choice", "q": "在 Python 里写了 `MAX_SIZE = 100`，后面又写 `MAX_SIZE = 200`，会怎样？", "opts": ["报错：常量不能修改", "正常运行，MAX_SIZE 变成 200——全大写只是约定", "报错：SyntaxError", "MAX_SIZE 保持 100 不变"], "ans": 1, "why": "Python 没有真正的常量，全大写只是“别改我”的约定，解释器不会拦。要真正保护，只能靠命名约定加代码评审，或者用 `enum`、只读属性这类额外手段。所以看到全大写名字就知道“作者希望它别变”，但改它不会报错。"}, {"id": "py132", "ch": 5, "topic": "5.4 浮点数相加的精度误差", "sec": "§5.4", "type": "fill", "q": "下面这行输出什么？", "code": "print(0.1 + 0.2)", "a": ["0.30000000000000004"], "why": "0.1 和 0.2 在二进制浮点里都存不准，相加后得到 0.30000000000000004，不等于 0.3。所以 `0.1 + 0.2 == 0.3` 是 False。判断浮点相等要写 `abs(a - b) < 1e-9`，或先 `round(x, 10)`；钱相关用 Decimal。"}, {"id": "py133", "ch": 5, "topic": "5.3 int() 朝 0 截断（负数）", "sec": "§5.3", "type": "choice", "q": "下面这行输出什么？", "code": "print(int(-3.9))", "opts": ["-3", "-4", "-3.9", "ValueError"], "ans": 0, "why": "`int()` 是朝 0 截断，-3.9 丢掉小数部分得 -3；想“向下取整”才是 -4（`//` 或 `math.floor`）。正数时两种说法结果一样，一到负数就分道扬镳，这是最容易错的地方。"}, {"id": "py134", "ch": 5, "topic": "5.2 非空字符串都是真", "sec": "§5.2", "type": "choice", "q": "下面这行输出什么？", "code": "print(bool('False'))", "opts": ["True", "False", "0", "ValueError"], "ans": 0, "why": "`bool()` 对字符串只看“空不空”，`'False'` 有 5 个字符属于非空，所以是 True。为假的只有 0、0.0、''、[]、{}、None、False 这几种；`'False'`、`'0'`、`' '` 全都是真。"}, {"id": "py135", "ch": 5, "topic": "5.3 真除的结果一定是 float", "sec": "§5.3", "type": "choice", "q": "下面这行输出什么？", "code": "print(4 / 2)", "opts": ["2", "2.0", "2.5", "0.5"], "ans": 1, "why": "`/` 是真除，只要用了它，结果就一定是 float，即使能整除也写成 2.0。想得到整数用 `//`（`4 // 2` 得 2），但 `//` 对负数是向下取整：`-3 // 2` 是 -2。"}, {"id": "py136", "ch": 5, "topic": "5.2 == 比较值，不比较类型", "sec": "§5.2", "type": "fill", "q": "下面这行输出什么？", "code": "print(3 == 3.0, '3' == 3)", "a": ["True False"], "why": "`3 == 3.0` 比的是数值，int 和 float 数值相等就是 True；`'3' == 3` 一边是字符串一边是整数，直接 False——注意它不报错，只是不相等，所以这类 bug 很难发现。别把 `==` 当成“类型也必须一样”。"}, {"id": "py137", "ch": 5, "topic": "5.4 round 是四舍六入五成双", "sec": "§5.4", "type": "fill", "q": "下面这行输出什么？", "code": "print(round(2.5), round(3.5))", "a": ["2 4"], "why": "Python 3 的 `round` 用的是银行家舍入（四舍六入五成双）：2.5 向偶数靠得 2，3.5 向偶数靠得 4。所以它不是“遇 5 就进”。`round(x, 2)` 保留两位时同样按这个规则，做报表要注意。"}, {"id": "py138", "ch": 5, "topic": "5.3 同一个 * 两种含义", "sec": "§5.3", "type": "fill", "q": "下面这行输出什么？", "code": "print('5' * 2, int('5') * 2)", "a": ["55 10"], "why": "`'5' * 2` 是字符串重复，得 '55'；`int('5') * 2` 才是算术，得 10。同一个 `*`，左边是字符串还是数字，含义完全不同。所以“输入的数字”不转型就直接算，结果常常是重复而不是乘法。"}, {"id": "py139", "ch": 6, "topic": "6.2 两个负数相除的地板除", "sec": "§6.2", "type": "fill", "q": "下面这行输出什么？", "code": "print(-7 // -2)", "a": ["3"], "why": "-7 / -2 = 3.5，地板除向下取整得 3，负负得正所以是正数。可以验算：`-7 == -2 * 3 + (-7 % -2)`，而 `-7 % -2` 是 -1。别只记住“负数 // 会变小”，要看除数和被除数的符号。"}, {"id": "py140", "ch": 6, "topic": "6.6 and / or 返回操作数本身", "sec": "§6.6", "type": "fill", "q": "下面这行输出什么？", "code": "print(0 or 'x', 2 and 3)", "a": ["x 3"], "why": "`and` / `or` 返回的是“决定结果的那个操作数”，不是 True/False：0 为假，所以 `0 or 'x'` 得 'x'；2 为真，`and` 就继续看右边，`2 and 3` 得 3。利用这一点可以写 `name = input() or '匿名'`。注意 `0 or 'x'` 在 if 里判断为真，但它的值不是 True。"}, {"id": "py141", "ch": 6, "topic": "6.3 ** 是右结合", "sec": "§6.3", "type": "choice", "q": "下面这行输出什么？", "code": "print(2 ** 3 ** 2)", "opts": ["64", "512", "12", "SyntaxError"], "ans": 1, "why": "`**` 是右结合：先算 3 ** 2 = 9，再算 2 ** 9 = 512。写成 `(2 ** 3) ** 2` 才是 64。另外 `**` 比一元负号优先级高，`-2 ** 2` 是 -(2**2) = -4，不是 4。"}, {"id": "py142", "ch": 7, "topic": "7.1 条件里的真假值", "sec": "§7.1", "type": "fill", "q": "下面这行输出什么？", "code": "print(bool('0'), bool(''))", "a": ["True False"], "why": "字符串只看空不空：`'0'` 里有一个字符，所以是 True；`''` 是空串，所以是 False。别把 `'0'` 当成数字 0——只有真正的 0 才是假。`if name:` 这种写法依赖的就是这条规则。"}, {"id": "py143", "ch": 7, "topic": "7.2 链式比较", "sec": "§7.2", "type": "choice", "q": "要判断变量 x 是否落在 0 到 10 之间（不含两端），下面哪种写法在 Python 里正确且不会误判？", "opts": ["`if 0 < x or x < 10:`", "`if 0 < x < 10:`", "`if 0 < x && x < 10:`", "`if x > 0 and < 10:`"], "ans": 1, "why": "Python 支持链式比较，`0 < x < 10` 等价于 `0 < x and x < 10`。写成 `0 < x or x < 10` 几乎永远为真——任何数至少满足其中一边（x=100 时左边就成立）；`&&` 是 C/Java 的写法，Python 里直接 SyntaxError；`and < 10` 少了左操作数，同样过不了语法。"}, {"id": "py144", "ch": 8, "topic": "8.3 f-string 补零对齐", "sec": "§8.3", "type": "choice", "q": "下面这行输出什么？", "code": "print(f'{7:03d}')", "opts": ["007", "7", "700", "0007"], "ans": 0, "why": "`03d` 读作“整数、总宽度 3 位、左边补 0”，所以 7 变成 007。宽度是总位数，不是“加三个 0”，所以 0007 是错的。要补空格才写 `:3d`（7 占 3 位宽，前面是两个空格）。生成编号、日期（如 01、02）时天天用到。"}, {"id": "py145", "ch": 8, "topic": "8.3 .2f 保留两位并补零", "sec": "§8.3", "type": "fill", "q": "下面这行输出什么？", "code": "print(f'{1 / 3:.2f}')", "a": ["0.33"], "why": "1/3 是 0.33333…，`.2f` 保留两位并按四舍五入得 0.33。`.2f` 一定会补齐两位小数，比如 0.5 会输出 0.50，而不是 0.5——它既是“保留”也是“补齐”。"}, {"id": "py146", "ch": 9, "topic": "9.7 range(1, 5) 是 1 到 4", "sec": "§9.7", "type": "fill", "q": "下面代码输出什么？", "code": "total = 0\nfor i in range(1, 5):\n    total += i\nprint(total)", "a": ["10"], "why": "`range(1, 5)` 含头不含尾，是 1、2、3、4，累加得 10 而不是 15。想加到 5 必须写 `range(1, 6)`。差一错误（off-by-one）在循环求和里最常见，写完先手算一遍边界。"}, {"id": "py147", "ch": 9, "topic": "9.7 起点大于终点的正步长 range", "sec": "§9.7", "type": "choice", "q": "下面代码会怎样？", "code": "for i in range(10, 0):\n    print(i)", "opts": ["打印 10 到 1", "一次都不执行，什么都不输出", "死循环", "SyntaxError"], "ans": 1, "why": "`range(10, 0)` 的 step 默认是 +1，从 10 往大走永远碰不到 0，所以是空序列，循环体一次都不跑，也不报错。倒着数必须写 `range(10, 0, -1)`。空 range 不报错这一点很坑，看起来像“没执行”，其实条件一开始就不成立。"}, {"id": "py148", "ch": 9, "topic": "9.4 循环 else 在自然结束时执行", "sec": "§9.4", "type": "choice", "q": "下面代码输出什么？", "code": "for i in range(3):\n    if i == 5:\n        break\nelse:\n    print('else')", "opts": ["else", "什么都不输出", "0 1 2 else", "SyntaxError"], "ans": 0, "why": "循环里 `i == 5` 永远不成立，break 一次都没进，循环自然跑完，所以执行 else，打印 else。`for...else` 的 else 是“没被 break 打断才执行”，不是“循环一次都没跑才执行”。它常用来写“找遍了都没找到”的分支。"}, {"id": "py149", "ch": 9, "topic": "9.5 break 只跳出一层", "sec": "§9.5", "type": "fill", "q": "下面代码输出什么？", "code": "for i in range(3):\n    for j in range(3):\n        if j == 1:\n            break\nprint(i, j)", "a": ["2 1"], "why": "内层 break 只跳出内层那个 for，外层照常跑完 3 轮；每轮内层都在 j == 1 时退出，所以循环全部结束后 i 是 2、j 是 1。要一次跳出两层，得加标志变量或用函数里 return。"}, {"id": "py150", "ch": 10, "topic": "10.5 pop() 删末尾并返回", "sec": "§10.5", "type": "fill", "q": "下面代码输出什么？", "code": "a = [1, 2, 3]\nx = a.pop()\nprint(x, a)", "a": ["3 [1, 2]"], "why": "不带参数的 `pop()` 删掉最后一个元素并把它的值返回，所以 x 是 3、a 变成 [1, 2]。`pop(0)` 删第一个；`remove(3)` 是按值删而且不返回；`del a[-1]` 只删不返回。"}, {"id": "py151", "ch": 10, "topic": "10.4 列表 += 是原地 extend", "sec": "§10.4", "type": "choice", "q": "下面代码输出什么？", "code": "a = [1, 2]\nb = a\na += [3]\nprint(b)", "opts": ["[1, 2]", "[1, 2, 3]", "[3]", "TypeError"], "ans": 1, "why": "列表的 `+=` 是原地扩展（内部相当于 `a.extend([3])`），改的是那个列表对象本身，所以别名 b 也一起变。如果写成 `a = a + [3]`，就是造一个新列表再让 a 指过去，b 仍然是 [1, 2]——`+=` 和 `= ... + ...` 在可变对象上不是一回事。"}, {"id": "py152", "ch": 10, "topic": "10.2 切片越界不报错，索引越界报错", "sec": "§10.2", "type": "choice", "q": "设 `a = [1, 2, 3]`，下面哪一句会报错？", "opts": ["`a[10]`", "`a[1:10]`", "`a[-10:]`", "`a[:100]`"], "ans": 0, "why": "单个下标越界是 IndexError；切片越界不报错，超出范围会自动截到边界：`a[1:10]` 得 [2, 3]，`a[-10:]` 和 `a[:100]` 都等于整个列表。所以切片可以放心写大数字，索引必须先判长度。"}, {"id": "py153", "ch": 10, "topic": "10.4 append 的返回值是 None", "sec": "§10.4", "type": "choice", "q": "`print([1, 2].append(3))` 输出什么？", "opts": ["[1, 2, 3]", "None", "3", "TypeError"], "ans": 1, "why": "`append` 是原地修改，返回值是 None，所以打印出来是 None（列表确实变成 [1, 2, 3] 了，只是没有被打印）。`sort()`、`reverse()`、`extend()` 也都返回 None，所以 `x = lst.append(3)` 会让 x 变成 None。"}, {"id": "py154", "ch": 11, "topic": "11.7 copy() 是浅拷贝", "sec": "§11.7", "type": "choice", "q": "下面代码输出什么？", "code": "a = {'x': [1, 2]}\nb = a.copy()\nb['x'].append(3)\nprint(a)", "opts": ["{'x': [1, 2]}", "{'x': [1, 2, 3]}", "{'x': [3]}", "KeyError"], "ans": 1, "why": "`copy()` 只复制最外层字典，里面的列表还是同一个对象，所以 `b['x'].append(3)` 改的是共享的那个列表，a 也看得到。要彻底独立得 `copy.deepcopy(a)`。判断依据：改的是“字典的键”还是“值指向的可变对象”。"}, {"id": "py155", "ch": 11, "topic": "11.5 in 查的是键不是值", "sec": "§11.5", "type": "fill", "q": "下面代码输出什么？", "code": "d = {'a': 1}\nprint('a' in d, 1 in d)", "a": ["True False"], "why": "`in` 用在字典上查的是键，不是值：'a' 是键所以 True，1 只是值所以 False。要查值必须写 `1 in d.values()`。这也解释了为什么 `d[k]` 里的 k 永远被当作键。"}, {"id": "py156", "ch": 11, "topic": "11.5 items() 解包成键和值", "sec": "§11.5", "type": "fill", "q": "下面代码输出什么？（两行写成一行，用空格分隔）", "code": "d = {'a': 1, 'b': 2}\nfor k, v in d.items():\n    print(k, v)", "a": ["a 1 b 2"], "why": "`items()` 每次给出一个 (键, 值) 元组，`for k, v in` 直接把它拆成两个变量，所以两行是 `a 1` 和 `b 2`。只写 `for k in d` 或 `for v in d` 拿到的都是键，这是最常犯的错；要拿值得 `d.values()`。"}, {"id": "py157", "ch": 11, "topic": "11.5 遍历时改值可以、增删键不行", "sec": "§11.5", "type": "choice", "q": "想给字典里所有值都加 1，下面哪种做法是安全的？", "opts": ["`for k in d: d[k] = d[k] + 1`", "`for k, v in d.items(): del d[k]`", "`for k in d: d[k + '_new'] = d[k]`", "`for k in d: d.pop(k)`"], "ans": 0, "why": "遍历时“改值”不改变字典的大小，安全；一旦新增或删除键，大小变了就抛 RuntimeError: dictionary changed size during iteration。要边遍历边删，先 `for k in list(d.keys())` 复制一份键再删。"}, {"id": "py158", "ch": 12, "topic": "12 函数内的局部变量外面看不到", "sec": "§12", "type": "choice", "q": "下面代码会怎样？", "code": "def f():\n    y = 10\n    return y + 1\nf()\nprint(y)", "opts": ["输出 11", "输出 10", "NameError：y 是函数内的局部变量", "SyntaxError"], "ans": 2, "why": "`y` 是在函数体里赋值的，属于局部变量，函数一返回就不存在了，外面根本访问不到，所以是 NameError。另外单独一行 `f()` 也不会显示 11，return 的结果必须 `print(f())` 或者赋给外面的变量才用得上。"}, {"id": "py159", "ch": 15, "topic": "综合 双重循环的次数与累加", "sec": "综合", "type": "multi", "q": "下面这段双重循环把每一对 i、j 的乘积累加起来，先看清 range 的边界再回答。", "code": "total = 0\nfor i in range(1, 4):\n    for j in range(1, 4):\n        total += i * j\nprint(total)", "parts": [{"type": "fill", "q": "内层循环体 `total += i * j` 一共执行多少次？", "a": ["9"], "why": "外层 `range(1, 4)` 只有 1、2、3 三个值，内层也是三个，3 × 3 = 9 次。含头不含尾，所以是 3 个不是 4 个。"}, {"type": "fill", "q": "最后 `print(total)` 输出什么？", "a": ["36"], "why": "每一对 (i, j) 都把 i*j 加了一遍，等价于 (1+2+3) × (1+2+3) = 6 × 6 = 36。手算时可以按分配律合并，不必一项项列 9 项。"}, {"type": "choice", "q": "如果把两个 `range(1, 4)` 都改成 `range(1, 4, 2)`，输出变成什么？", "opts": ["16", "36", "9", "4"], "ans": 0, "why": "`range(1, 4, 2)` 只取 1 和 3，和是 4，所以 4 × 4 = 16。步长 2 是“砍掉一半的数再重算”，不是把结果除以 2（那会得到 18）。"}], "why": "外层 `range(1, 4)` 只有 1、2、3 三个值，内层也是三个，3 × 3 = 9 次。含头不含尾，所以是 3 个不是 4 个。  每一对 (i, j) 都把 i*j 加了一遍，等价于 (1+2+3) × (1+2+3) = 6 × 6 = 36。手算时可以按分配律合并，不必一项项列 9 项。  `range(1, 4, 2)` 只取 1 和 3，和是 4，所以 4 × 4 = 16。步长 2 是“砍掉一半的数再重算”，不是把结果除以 2（那会得到 18）。"}, {"id": "py160", "ch": 15, "topic": "综合 input 的字符串与转型", "sec": "综合", "type": "multi", "q": "用户先输入 `10`，再输入 `3`。", "code": "price = input()\ncount = input()\nprint(price * 2)\nprint(int(price) * int(count))", "parts": [{"type": "fill", "q": "第一行 print 输出什么？", "a": ["1010"], "why": "`input()` 拿到的是字符串 '10'，`'10' * 2` 是重复两次得 '1010'，不是 20。想算 20 必须 `int(price) * 2`。"}, {"type": "fill", "q": "第二行 print 输出什么？", "a": ["30"], "why": "两个都 `int()` 转过了，才是算术 10 × 3 = 30。这就是为什么读数字一定要在 input() 外面套转型。"}, {"type": "choice", "q": "想让两个输入当整数相加、输出 13，正确写法是？", "opts": ["`print(price + count)`", "`print(int(price) + int(count))`", "`print(price + count * 1)`", "`print(str(price) + str(count))`"], "ans": 1, "why": "只有都转成 int 才做加法。`price + count` 是字符串拼接得 '103'，`str(price) + str(count)` 也是 '103'；`count * 1` 对字符串来说还是它自己，等于没转。"}], "why": "`input()` 拿到的是字符串 '10'，`'10' * 2` 是重复两次得 '1010'，不是 20。想算 20 必须 `int(price) * 2`。  两个都 `int()` 转过了，才是算术 10 × 3 = 30。这就是为什么读数字一定要在 input() 外面套转型。  只有都转成 int 才做加法。`price + count` 是字符串拼接得 '103'，`str(price) + str(count)` 也是 '103'；`count * 1` 对字符串来说还是它自己，等于没转。"}, {"id": "py161", "ch": 15, "topic": "综合 别名、copy 与 sort", "sec": "综合", "type": "multi", "q": "下面代码里 b 是 a 的别名，c 是从 a 复制出来的。", "code": "a = [3, 1, 2]\nb = a\nc = a.copy()\nb.sort()\na.append(4)\nprint(a, b)", "parts": [{"type": "fill", "q": "最后一行 print 输出什么？", "a": ["[1, 2, 3, 4] [1, 2, 3, 4]"], "why": "b 和 a 是同一个列表：`b.sort()` 把 a 也排好了序，`a.append(4)` 也等于给 b 加了 4，所以两个名字看到的是同一份 [1, 2, 3, 4]。sort 是原地排序、返回 None，千万别写 `b = b.sort()`。"}, {"type": "choice", "q": "此时 `c` 是什么？", "opts": ["[3, 1, 2]", "[1, 2, 3]", "[1, 2, 3, 4]", "None"], "ans": 0, "why": "`a.copy()` 在排序之前就复制了一份，之后 a 怎么改都和 c 无关，所以 c 还是复制时的 [3, 1, 2]。copy 出来的是新对象，但只是浅拷贝。"}, {"type": "choice", "q": "如果把 `c = a.copy()` 改成 `c = a`，此时 `c` 是什么？", "opts": ["[1, 2, 3, 4]", "[3, 1, 2]", "[1, 2, 3]", "None"], "ans": 0, "why": "改成别名之后，a 的排序结果和 append 都会反映到 c 上，所以是 [1, 2, 3, 4]。这一问正好和上一问对照：`=` 是同一个对象，`copy()` 才是新对象。"}], "why": "b 和 a 是同一个列表：`b.sort()` 把 a 也排好了序，`a.append(4)` 也等于给 b 加了 4，所以两个名字看到的是同一份 [1, 2, 3, 4]。sort 是原地排序、返回 None，千万别写 `b = b.sort()`。  `a.copy()` 在排序之前就复制了一份，之后 a 怎么改都和 c 无关，所以 c 还是复制时的 [3, 1, 2]。copy 出来的是新对象，但只是浅拷贝。  改成别名之后，a 的排序结果和 append 都会反映到 c 上，所以是 [1, 2, 3, 4]。这一问正好和上一问对照：`=` 是同一个对象，`copy()` 才是新对象。"}, {"id": "py162", "ch": 15, "topic": "综合 while 里的 continue 与 break", "sec": "综合", "type": "multi", "q": "下面代码用 continue 跳过偶数，只对奇数计数。", "code": "i = 0\ncount = 0\nwhile i < 5:\n    i += 1\n    if i % 2 == 0:\n        continue\n    count += 1\nprint(i, count)", "parts": [{"type": "fill", "q": "最后一行输出什么？", "a": ["5 3"], "why": "i 从 0 一路加到 5，条件 `i < 5` 不成立才退出，所以退出时 i 是 5；count 只数了 1、3、5 三个奇数。注意 `i += 1` 写在 continue 之前，不然 i 不动就死循环了。"}, {"type": "choice", "q": "如果把 `continue` 换成 `break`，输出变成什么？", "opts": ["2 1", "5 3", "1 1", "2 2"], "ans": 0, "why": "第一轮 i 自增到 1，是奇数，count 变 1；第二轮 i 变成 2，是偶数就 break，循环立刻结束，所以是 2 1。break 跳整层、continue 只跳本次，这一换差别很大。"}, {"type": "fill", "q": "如果删掉 `i += 1` 这一行，程序会怎样？（用一个词回答）", "a": ["死循环", "无限循环"], "why": "i 永远是 0，`i < 5` 永远成立，每次 continue 之后又回到循环开头，程序卡死不出结果。在 while 里用 continue 时，一定要确认“改变条件的那一步”在 continue 之前。"}], "why": "i 从 0 一路加到 5，条件 `i < 5` 不成立才退出，所以退出时 i 是 5；count 只数了 1、3、5 三个奇数。注意 `i += 1` 写在 continue 之前，不然 i 不动就死循环了。  第一轮 i 自增到 1，是奇数，count 变 1；第二轮 i 变成 2，是偶数就 break，循环立刻结束，所以是 2 1。break 跳整层、continue 只跳本次，这一换差别很大。  i 永远是 0，`i < 5` 永远成立，每次 continue 之后又回到循环开头，程序卡死不出结果。在 while 里用 continue 时，一定要确认“改变条件的那一步”在 continue 之前。"}, {"id": "py163", "ch": 15, "topic": "综合 函数返回字典与 print", "sec": "综合", "type": "multi", "q": "下面函数统计字符串里每个字符出现的次数。", "code": "def count_chars(s):\n    result = {}\n    for ch in s:\n        if ch in result:\n            result[ch] = result[ch] + 1\n        else:\n            result[ch] = 1\n    return result\nprint(count_chars('aba'))", "parts": [{"type": "fill", "q": "最后一行输出什么？", "a": ["{'a': 2, 'b': 1}"], "why": "依次遍历 'a'、'b'、'a'：第一个 a 走 else 新建计数 1，b 新建 1，第二个 a 命中 if 变成 2，所以是 {'a': 2, 'b': 1}。字典的键不会重复，重复出现的字符只是在改它的值。"}, {"type": "choice", "q": "如果把最后一行改成只写 `count_chars('aba')`（不套 print），屏幕上会显示什么？", "opts": ["{'a': 2, 'b': 1}", "什么都不显示", "None", "NameError"], "ans": 1, "why": "return 只是把结果交回调用处，不会显示；要看到必须 `print(count_chars('aba'))`。这和“没有 return 的函数返回 None”是两件事：这里函数有返回值，只是没人打印它。"}, {"type": "fill", "q": "`print(count_chars('aba')['a'])` 输出什么？", "a": ["2"], "why": "函数返回的是字典，后面直接接 `['a']` 就是取出键 'a' 对应的值 2。调用函数和下标取值可以连在一起写，先算左边的调用，再对返回的字典取键。"}], "why": "依次遍历 'a'、'b'、'a'：第一个 a 走 else 新建计数 1，b 新建 1，第二个 a 命中 if 变成 2，所以是 {'a': 2, 'b': 1}。字典的键不会重复，重复出现的字符只是在改它的值。  return 只是把结果交回调用处，不会显示；要看到必须 `print(count_chars('aba'))`。这和“没有 return 的函数返回 None”是两件事：这里函数有返回值，只是没人打印它。  函数返回的是字典，后面直接接 `['a']` 就是取出键 'a' 对应的值 2。调用函数和下标取值可以连在一起写，先算左边的调用，再对返回的字典取键。"}, {"id": "py200", "ch": 10, "topic": "10.2 切片两端都能用负下标", "sec": "§10.2", "type": "fill", "q": "下面代码输出什么？", "code": "a = [10, 20, 30, 40, 50]\nprint(a[1:-1])", "a": ["[20, 30, 40]"], "why": "`a[1:-1]` 是“从下标 1 开始，到最后一个元素之前停下”：`-1` 指向 50 本身，而切片不含尾，所以 50 被排除，只剩中间三个。", "detail": "切片是 `a[起点:终点:步长]`，起点终点都能用正负下标，负数从尾部数：`-1` 是最后一个，`-2` 是倒数第二个。\n\n本题 `a = [10, 20, 30, 40, 50]`，`a[1:-1]` 从下标 1（值 20）出发，到下标 4（值 50）之前停，取到 20、30、40。\n\n“含头不含尾”对负下标同样成立：`-1` 指向 50，但终点取不到，所以 50 不进结果——去掉首尾正好用 `a[1:-1]`。\n\n常见坑：读成“下标 1 到 -1 都算”，于是误答 `[20, 30, 40, 50]`；记住终点永远取不到就不会错。\n\n真要把最后一个也收进来，终点得省掉写 `a[1:]`，或写 `a[1:5]`。\n\n记忆点：正负下标只是从不同一头数，尾巴那一位照样不取。"}, {"id": "py201", "ch": 10, "topic": "10.2 头在尾之后切片为空", "sec": "§10.2", "type": "fill", "q": "下面代码输出什么？", "code": "a = [1, 2, 3, 4, 5]\nprint(a[3:1])", "a": ["[]"], "why": "起点 3 在终点 1 的右边，而步长是默认的 +1（从左往右），方向相反一步都走不了，切片不报错，安静地返回空列表。", "detail": "`a[3:1]` 拆开是起点 3、终点 1、步长 1；步长为正表示从左往右走，要求起点下标小于终点下标。\n\n下标 3 已经是元素 4，往右走永远到不了下标 1，所以一个元素都取不到，结果是 `[]`，而不是报错或 `None`。\n\n这和 `a[3:1:-1]` 完全是两回事：后者步长为负，方向改成从右往左，能取到 `[4, 3]`。\n\n常见坑：把空切片当成异常，或者以为 Python 会自动倒过来取；切片永远不会因为“方向不对”抛错，它只会静默返回空列表。\n\n判断口诀：先看步长符号定方向，再看起点能否沿这个方向走到终点；走不到就是 `[]`。\n\n记忆点：切片是“取一段”，取不到就是空列表；只有单个下标 `a[i]` 才会抛 IndexError。"}, {"id": "py202", "ch": 10, "topic": "10.2 负步长切片的方向", "sec": "§10.2", "type": "choice", "q": "下面代码输出什么？", "code": "a = [0, 1, 2, 3, 4, 5]\nprint(a[4:1:-1])", "opts": ["[4, 3, 2]", "[4, 3, 2, 1]", "[3, 2, 1]", "[]"], "ans": 0, "why": "步长 -1 表示从右往左走：起点 4 取到 4，向左依次经过 3、2，走到终点 1 之前停下，得 `[4, 3, 2]`。", "detail": "完整形式 `a[起点:终点:步长]`，步长为负时方向反转：从起点往左走，终点照样“取不到”。\n\n`a = [0, 1, 2, 3, 4, 5]`，`a[4:1:-1]` 从下标 4（值 4）出发，向左依次取 4、3、2，走到下标 1（值 1）之前停。\n\n下标 1 本身不被包含，所以 1 不在结果里；这就是“含头不含尾”在负步长下的样子，规则没变，变的只是方向。\n\n想连 1 一起要，终点得省略：`a[4::-1]` 得 `[4, 3, 2, 1, 0]`。\n\n常见坑：以为负步长时终点变成“包含”，于是选了 `[4, 3, 2, 1]`；只要记住终点永远取不到就行。\n\n记忆点：负步长像倒着报数，报到你写的终点前一个就停。"}, {"id": "py203", "ch": 10, "topic": "10.2 反转得到的是新列表", "sec": "§10.2", "type": "choice", "q": "下面代码输出什么？", "code": "a = [1, 2, 3, 4]\nb = a[::-1]\nb.append(5)\nprint(a)", "opts": ["[1, 2, 3, 4]", "[4, 3, 2, 1, 5]", "[1, 2, 3, 4, 5]", "[5, 4, 3, 2, 1]"], "ans": 0, "why": "`a[::-1]` 是切片，它复制出一份倒序的新列表交给 b，之后改 b 与 a 无关，所以 a 仍是 `[1, 2, 3, 4]`。", "detail": "`a[::-1]` 是“全切片 + 步长 -1”：起点终点都省略，负步长默认从最后一个元素出发，一路往左，得到倒序。\n\n切片的结果永远是新的列表对象，不是原列表的倒序“视图”；`b is a` 为 False，两者互不相干。\n\n所以 `b.append(5)` 只改 b，a 一个元素都没动，打印 a 得 `[1, 2, 3, 4]`。\n\n对比 `b = a`：那是起别名，改 b 会连累 a；而切片无论正序倒序都会复制一份。\n\n常见坑：以为 `a[::-1]` 把 a 本身倒过来了，后续代码继续用 a 却发现顺序没变；原地反转要写 `a.reverse()`，它返回 None。\n\n记忆点：`[::-1]` 是复制一份倒着放，`reverse()` 才是把原表翻过来。"}, {"id": "py204", "ch": 10, "topic": "10.2 负步长方向不对就为空", "sec": "§10.2", "type": "fill", "q": "下面代码输出什么？（三个结果写在一行，用空格隔开）", "code": "a = [0, 1, 2, 3, 4]\nprint(a[0:3:-1], a[3:1:-1], a[::-2])", "a": ["[] [3, 2] [4, 2, 0]"], "why": "第一组步长 -1 却要从下标 0 往左走，方向矛盾得 `[]`；第二组从 3 向左到 1 之前得 `[3, 2]`；第三组从尾部每跨两格取 4、2、0。", "detail": "三组切片共用同一个 `a = [0, 1, 2, 3, 4]`，先定方向，再看能取到谁。\n\n`a[0:3:-1]`：步长 -1 要从下标 0 往左走，可 0 已是最左端、终点 3 又落在右边，一步都走不了，得 `[]`。\n\n`a[3:1:-1]`：从下标 3 往左走，终点 1 不取，经过 3、2，得 `[3, 2]`。\n\n`a[::-2]`：起点终点全省略，负步长默认从下标 4 出发，每次跨两格，取 4、2、0，得 `[4, 2, 0]`。\n\n判错口诀：步长为负时只有“起点 > 终点”才可能取到东西；两者都省略时自动配对成“从尾到头”。\n\n常见坑：把 `a[0:3:-1]` 当成“倒着取 0 到 2”，方向矛盾得到空表；负步长不会替你调换起点终点。\n\n记忆点：负步长像倒着下楼梯，起点必须比终点更靠右。"}, {"id": "py205", "ch": 10, "topic": "10.2 切片越界截断、索引越界报错", "sec": "§10.2", "type": "choice", "q": "下面代码输出什么？", "code": "a = [1, 2, 3]\nprint(a[5:])\nprint(a[5])", "opts": ["先打印 `[]`，再抛 IndexError: list index out of range", "打印 `[]` 和 `None`", "直接抛 IndexError，第一行什么都不打印", "打印 `[]` 和 `[]`"], "ans": 0, "why": "切片 `a[5:]` 越界只会静默截断成空列表，第一行照常打印 `[]`；紧接着的单个下标 `a[5]` 才抛 IndexError。程序是跑到哪一行才崩的。", "detail": "同一个越界位置，两种取法完全不同命：切片“宽容”，索引“严格”。\n\n`a[5:]` 的起点 5 超出范围（合法下标只有 0~2），切片会把起点截到有效边界，取不到元素，返回 `[]`，不报错。\n\n`a[5]` 是单元素访问，下标必须真实存在，否则立刻抛 `IndexError: list index out of range`。\n\n正因为前一行已经执行完，屏幕上会先看到 `[]`，然后才是红色的 traceback——别以为“报错就一定什么都没输出”。\n\n常见坑：用 `a[5:]` 当“安全检查”，以为越界会被发现；它只会安静地给你空列表，真要判断得看 `len(a)`。\n\n记忆点：切片是“能取多少取多少”，索引是“取不到就翻脸”。"}, {"id": "py206", "ch": 10, "topic": "10.3 切片赋值可以变短", "sec": "§10.3", "type": "fill", "q": "下面代码输出什么？", "code": "a = ['a', 'b', 'c', 'd']\na[1:3] = ['X']\nprint(a)", "a": ["['a', 'X', 'd']"], "why": "切片赋值先把 `a[1:3]` 选中的 2 个元素剪掉，再把右边的 1 个元素贴进这个位置，长度可以不等，所以列表变短。", "detail": "切片赋值的形式是 `a[起点:终点] = 可迭代对象`，它做两件事：删掉左边切片选中的那段，再把右边元素按顺序插进这个位置。\n\n本题左边选中下标 1、2（值 b、c），右边只有 `'X'` 一个，于是 2 个换 1 个，列表从 4 项变 3 项。\n\n长度不相等是允许的：右边比左边多就变长，比左边少就变短，相等就原地替换。\n\n常见坑：把它当成“给切片里每个元素赋值”，以为长度不一致会报错；其实右边连列表都不必是列表，只要是可迭代对象，比如字符串。\n\n另一个坑：右边写 `'XY'` 会被拆成两个字符插进去，得到 `['a', 'X', 'Y', 'd']`，不是插入一个 `'XY'`。\n\n记忆点：切片赋值是“剪一段、贴一段”，不是“逐个覆盖”。"}, {"id": "py207", "ch": 10, "topic": "10.3 空切片赋值等于插入", "sec": "§10.3", "type": "fill", "q": "下面代码输出什么？", "code": "a = [1, 4]\na[1:1] = [2, 3]\nprint(a)", "a": ["[1, 2, 3, 4]"], "why": "`a[1:1]` 是一段长度为 0 的空切片，剪掉 0 个元素再贴进 2 个，效果就是在下标 1 处插入。", "detail": "`a[1:1]` 起点和终点相同，选中的是“下标 1 前面那条缝”，一个元素都不包含。\n\n切片赋值 = 剪掉选中的段 + 原地贴入右边；剪掉 0 个、贴入 `[2, 3]`，结果就是 `[1, 2, 3, 4]`。\n\n它和 `a.insert(1, 2)` 的区别：insert 一次只加一个对象，切片赋值可以一次插一串，并且保持顺序。\n\n常见坑：以为 `a[1:1] = ...` 什么都不做；恰好相反，这是“纯插入”的写法。\n\n同理 `a[0:0] = ['x']` 插到最前面，`a[len(a):len(a)] = ['x']` 等价于 append。\n\n记忆点：长度为 0 的切片不是“没操作”，它是一条缝，缝里可以塞东西。"}, {"id": "py208", "ch": 10, "topic": "10.3 a[:] 赋值是原地改", "sec": "§10.3", "type": "choice", "q": "下面代码输出什么？", "code": "a = [1, 2, 3]\nb = a\na[:] = [7, 8]\nprint(b)", "opts": ["[1, 2, 3]", "[7, 8]", "[]", "TypeError"], "ans": 1, "why": "`a[:] = [7, 8]` 是切片赋值，改的是 a 指向的那个列表对象本身；b 和 a 是同一个对象，所以 b 也变成 `[7, 8]`。", "detail": "先分清两种“看起来一样”的写法：`a = [7, 8]` 让 a 改指新列表，`a[:] = [7, 8]` 是往原列表里整体换内容。\n\n`b = a` 只是多了一个名字指向同一个列表对象，所以对象被改，b 看到的就是改后的样子。\n\n`a[:]` 选中全部元素，切片赋值把旧内容整段剪掉、贴入 `[7, 8]`；对象身份不变，长度也可以变。\n\n常见坑：以为“重新赋值”和“切片赋值”等价；`a = [7, 8]` 时 b 仍是 `[1, 2, 3]`，`a[:] = ...` 时 b 跟着变。\n\n验证办法：打印 `id(a)`，`a[:] = ...` 前后 id 不变，`a = ...` 之后 id 变了。\n\n记忆点：`a =` 换对象，`a[:] =` 换内容，谁受影响全看是不是同一个对象。"}, {"id": "py209", "ch": 10, "topic": "10.3 带步长的切片赋值", "sec": "§10.3", "type": "choice", "q": "下面代码输出什么？", "code": "a = [0, 1, 2, 3, 4, 5]\na[::2] = [9, 9, 9]\nprint(a)", "opts": ["[9, 1, 9, 3, 9, 5]", "[9, 9, 9, 3, 4, 5]", "[9, 9, 9]", "ValueError: 右边长度和切片长度不一致"], "ans": 0, "why": "带步长的切片选中下标 0、2、4 三个位置，右边的 3 个 9 逐个填进这些位置，其他元素保持不动。", "detail": "形式还是 `a[起点:终点:步长] = 序列`，但一旦写了步长，规则立刻变严：右边长度必须和左边选中的元素个数完全相等。\n\n`a[::2]` 在 6 个元素里选中下标 0、2、4，共 3 个位置；右边 `[9, 9, 9]` 正好 3 个，逐个替换得 `[9, 1, 9, 3, 9, 5]`。\n\n不带步长时长度可以不等（剪一段贴一段），带步长时是“一对一填空”，既不能变长也不能变短。\n\n长度不匹配会抛 `ValueError: attempt to assign sequence of size 2 to extended slice of size 3`。\n\n常见坑：把带步长的切片赋值也当成“可长可短”，写出长度不等的右边，运行到那行才崩。\n\n记忆点：无步长＝剪贴（长度自由），有步长＝填空（长度必须相等）。"}, {"id": "py210", "ch": 10, "topic": "10.2 list() 把字符串按字符拆开", "sec": "§10.2", "type": "fill", "q": "下面代码输出什么？", "code": "s = 'a b'\nprint(list(s), len(list(s)))", "a": ["['a', ' ', 'b'] 3"], "why": "`list(字符串)` 把字符串按字符逐个拆开，空格也是一个字符，所以列表有 3 个元素，长度是 3 而不是 2。", "detail": "`list()` 是构造器，接受任意可迭代对象把它“摊开”成列表；字符串本身可迭代，一次给一个字符。\n\n`s = 'a b'` 有三个字符：`'a'`、空格、`'b'`，所以 `list(s)` 得 `['a', ' ', 'b']`，`len` 为 3。\n\n空格也是字符，不会被自动去掉；想按空格切词要用 `s.split()`，得到 `['a', 'b']`，长度 2。\n\n同理 `list('aeiou')` 得 5 个单字符，`list('')` 得 `[]`，`list(range(3))` 得 `[0, 1, 2]`。\n\n常见坑：把 `list(s)` 当成 `s.split()`，以为会按空白分词；也别指望它顺手去掉空格。\n\n记忆点：list 只负责拆成一个个元素，怎么算一个元素由原对象决定。"}, {"id": "py211", "ch": 10, "topic": "10.2 list() 只接受可迭代对象", "sec": "§10.2", "type": "choice", "q": "下面代码会怎样？", "code": "print(list(123))", "opts": ["输出 [1, 2, 3]", "输出 ['1', '2', '3']", "TypeError: 'int' object is not iterable", "输出 [123]"], "ans": 2, "why": "整数不是可迭代对象，`list()` 没法把它逐个取出来，直接抛 `TypeError: 'int' object is not iterable`。", "detail": "`list(x)` 的内部动作是“对 x 做迭代，把每次拿到的元素收进列表”，所以 x 必须是可迭代对象。\n\n可迭代的有：字符串、列表、元组、字典（迭代出键）、range、集合；整数、浮点数、布尔值、None 都不是。\n\n`list(123)` 想表达“把 123 拆成数字”，但 Python 不干这种事，报 `TypeError: 'int' object is not iterable`。\n\n想要 `['1', '2', '3']`，得先变成字符串再拆：`list(str(123))`，拿到的是字符不是整数。\n\n常见坑：把 `list()` 当成万能转换器；数字转列表没有默认语义，必须自己写转换逻辑。\n\n记忆点：`list()` 只摊开可迭代对象，摊不开就 TypeError。"}, {"id": "py212", "ch": 10, "topic": "10.4 extend 接受任意可迭代对象", "sec": "§10.4", "type": "choice", "q": "下面代码输出什么？", "code": "a = []\na.extend('ab')\nprint(a)", "opts": ["['a', 'b']", "['ab']", "[['a', 'b']]", "TypeError"], "ans": 0, "why": "`extend` 接受任意
