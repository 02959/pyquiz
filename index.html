/* ---------- 开始 ---------- */
function start(mode, only) {
  let pool = (only != null) ? B().filter(q => q.ch === only && !isDel(q.id)) : poolNow();
  if (mode === 'quick') pool = sampleSpread(pool, Math.min(20, pool.length));
  if (mode === 'wrong') {
    const w = new Set((readLS(LS_LAST(cur)) || {}).wrong || []);
    pool = pool.filter(q => w.has(q.id));
  }
  if (!pool.length) { toast('这里没有题目，先选几章'); return; }
  st = { bank: cur, pool, i: 0, res: [], t0: Date.now(), mode, answered: false };
  saveSession();
  $('#homeView').classList.add('hide');
  $('#resultView').classList.add('hide');
  $('#ov').classList.add('show');
  renderQ();
}

function resume() {
  const s = readSession(cur);
  if (!s) { toast('没有可恢复的进度'); renderResume(); return; }
  st = { bank: cur, pool: s.pool, i: s.res.length, t0: Date.now() - (s.elapsed || 0), mode: s.mode, res: s.res.slice() };
  $('#homeView').classList.add('hide');
  $('#resultView').classList.add('hide');
  $('#ov').classList.add('show');
  renderQ();
}

/* ---------- 渲染题目 ---------- */
function partHtml(p, pi, q) {
  const label = q.type === 'multi' ? `<span class="plabel">${pi + 1}</span>` : '';
  if (p.type === 'choice') {
    return `<div class="part" data-part="${pi}">
      ${label}<p class="qtext">${fmt(p.q)}</p>
      ${p.code ? `<pre class="code"><code>${esc(p.code)}</code></pre>` : ''}
      <div class="opts">${p.opts.map((o, i) => `<div class="opt" data-part="${pi}" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span class="t">${fmt(o)}</span></div>`).join('')}</div>
      <div class="pfb" data-pfb="${pi}"></div>
    </div>`;
  }
  return `<div class="part" data-part="${pi}">
    ${label}<p class="qtext">${fmt(p.q)}</p>
    ${p.code ? `<pre class="code"><code>${esc(p.code)}</code></pre>` : ''}
    <input class="ans" data-part="${pi}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(p.ph || (q.type === 'multi' ? '填这一小题的答案…' : '填写输出结果或关键字…'))}">
    <div class="pfb" data-pfb="${pi}"></div>
  </div>`;
}

function renderQ() {
  const q0 = st.pool[st.i];
  if (q0 && q0.type === 'fix') { renderFixQ(q0); return; }
  const q = st.pool[st.i], c = C()[q.ch];
  st.answered = false; st.picks = {}; st.texts = {};
  const pct = Math.round(st.i / st.pool.length * 100);
  const multi = q.type === 'multi';
  const parts = multi ? q.parts : [{ type: q.type, q: q.q, code: q.code, opts: q.opts, ans: q.ans, a: q.a }];

  $('#modal').innerHTML = `
    <div class="m-head">
      <div class="m-crumb"><b>第 ${st.i + 1} / ${st.pool.length} 题</b><span>·</span><span>Ch ${q.ch} ${esc(c.short)}</span></div>
      <button class="x" id="quit" title="退出（Esc）">✕</button>
    </div>
    <div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="m-body">
      <div class="qmeta">
        <span class="badge ${multi ? 'multi' : q.type}">${multi ? '综合题' : q.type === 'choice' ? '单选题' : '填空题'}</span>
        <span class="topic">${esc(q.topic)}</span>
        ${q.sec ? `<span class="ver">${esc(q.sec)}</span>` : ''}
        ${q.ref ? `<button class="refchip" data-ref="${esc(q.ref)}">📎 册子原题</button>` : ''}
      </div>
      <p class="qtext">${fmt(q.q)}</p>
      ${q.code ? `<pre class="code"><code>${esc(q.code)}</code></pre>` : ''}
      ${parts.map((p, i) => partHtml(p, i, q)).join('')}
      <div id="fb"></div>
    </div>
    <div class="m-foot">
      <button class="btn subtle" id="skip">我不会</button>
      <button class="btn primary" id="submit">确认作答</button>
    </div>`;
  bind();
  const first = $('#modal .ans');
  if (first) setTimeout(() => first.focus(), 60);
  $('#modal').scrollTop = 0;
}

function bind() {
  $$('#modal .opt').forEach(el => el.addEventListener('click', () => pick(+el.dataset.part, +el.dataset.i)));
  $$('#modal .ans').forEach(el => el.addEventListener('input', () => el.classList.remove('wrong')));
  $('#submit').addEventListener('click', () => st.answered ? next() : grade(false));
  $('#skip').addEventListener('click', () => st.answered ? next() : grade(true));
  $('#quit').addEventListener('click', quit);
  $$('#modal .refchip').forEach(el => el.addEventListener('click', () => openRef(el.dataset.ref)));
}

function pick(pi, i) {
  if (!st || st.answered) return;
  st.picks[pi] = i;
  $$(`#modal .opt[data-part="${pi}"]`).forEach((el, k) => el.classList.toggle('sel', k === i));
}

function gradePart(p, pi) {
  if (p.type === 'choice') return { ok: st.picks[pi] === p.ans, given: p.opts[st.picks[pi]] || '', resp: st.picks[pi] };
  const inp = $(`#modal .ans[data-part="${pi}"]`);
  const given = inp ? inp.value : '';
  return { ok: given.trim() !== '' && p.a.some(x => norm(x) === norm(given)), given, resp: given };
}

function grade(skip) {
  if (!st || st.answered) return;
  const q = st.pool[st.i];
  const multi = q.type === 'multi';
  const parts = multi ? q.parts : [{ type: q.type, q: q.q, opts: q.opts, ans: q.ans, a: q.a }];

  if (!skip) {
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      if (p.type === 'choice' && st.picks[i] == null) { shake(); toast('先选一个选项，或点「我不会」'); return; }
      if (p.type === 'fill') {
        const el = $(`#modal .ans[data-part="${i}"]`);
        if (el && !el.value.trim()) { el.classList.add('wrong'); el.focus(); toast('写点什么，或点「我不会」'); return; }
      }
    }
  }

  const resp = parts.map((p, i) => skip ? { ok: false, given: '', resp: null } : gradePart(p, i));
  const score = skip ? 0 : resp.filter(r => r.ok).length / parts.length;
  const ok = score === 1;
  st.res.push({ q, ok, score: skip ? 0 : (multi ? score : (ok ? 1 : 0)), skip, given: multi ? resp.map(r => r.given).join(' | ') : resp[0].given, parts: resp });
  st.answered = true;
  saveSession();
  const n = bump(q.id, ok && score === 1);
  if (ok && score === 1 && n === 2) setTimeout(() => toast('这题已答对 2 次，标记为「已掌握」'), 700);
  paint(q, resp, skip, score);
}

function paint(q, resp, skip, score) {
  const parts = q.type === 'multi' ? q.parts : [{ type: q.type, q: q.q, opts: q.opts, ans: q.ans, a: q.a, why: q.why }];

  parts.forEach((p, i) => {
    const r = resp[i] || { ok: false, given: '', resp: null };
    if (p.type === 'choice') {
      $$(`#modal .opt[data-part="${i}"]`).forEach((el, k) => {
        el.classList.add('lock'); el.classList.remove('sel');
        if (k === p.ans) el.classList.add('ok');
        else if (k === r.resp) el.classList.add('bad');
        else el.classList.add('dim');
      });
    } else {
      const inp = $(`#modal .ans[data-part="${i}"]`);
      if (inp) { inp.disabled = true; inp.classList.add(r.ok ? 'right' : 'wrong'); }
    }
    const box = $(`#modal .pfb[data-pfb="${i}"]`);
    if (box && q.type === 'multi') {
      const correct = p.type === 'choice' ? p.opts[p.ans] : p.a[0];
      box.innerHTML = `<div class="fb ${r.ok ? 'ok' : (skip ? 'neutral' : 'bad')} mini">
        <div class="fb-h">${r.ok ? '✓ 对' : (skip ? '— 跳过' : '✗ 错')}</div>
        <div class="fb-row"><b>答案</b><span>${esc(correct)}</span></div>
        ${(!r.ok && p.why) ? `<div class="fb-why">${fmt(p.why)}</div>` : ''}
      </div>`;
    }
  });

  const correct = parts.map(p => p.type === 'choice' ? p.opts[p.ans] : p.a[0]);
  const lastQ = st.i === st.pool.length - 1;
  const head = q.type === 'multi'
    ? `${score === 1 ? '✓ 全部答对' : skip ? '— 这题先放过' : `✗ 对 ${Math.round(score * parts.length)} / ${parts.length} 小题`}`
    : (score === 1 ? '✓ 答对了' : skip ? '— 这题先放过' : '✗ 答错了');
  const cls = score === 1 ? 'ok' : (skip ? 'neutral' : 'bad');

  $('#fb').innerHTML = `<div class="fb ${cls}">
    <div class="fb-h">${head}</div>
    ${q.type === 'multi' ? '' : `<div class="fb-row"><b>正确答案</b><span>${esc(correct[0])}</span></div>`}
    ${(!skip && score < 1 && q.type !== 'multi' && parts[0].type === 'fill') ? `<div class="fb-row"><b>你的答案</b><span>${esc(resp[0].given)}</span></div>` : ''}
    <div class="fb-why">${fmt(q.why || '')}</div>
    ${q.detail ? `<details class="detail"><summary>📖 详细讲解</summary><div class="dbody">${rich(q.detail)}</div></details>` : ''}
    <div class="fb-src">${esc(q.sec || '')}${q.p ? ` · <a class="blink" href="${BILINK(q.p)}" target="_blank" rel="noopener">🎬 回看 ${esc(q.sec)}</a>` : ''}</div>
  </div>`;

  $('#skip').style.display = 'none';
  $('#submit').textContent = lastQ ? '查看测评报告 →' : '下一题 →';
  const body = $('#modal .m-body');
  if (body) body.scrollTo({ top: body.scrollHeight, behavior: 'smooth' });
}

function next() {
  if (st.i < st.pool.length - 1) { st.i++; renderQ(); }
  else finish();
}

/* ---------- 交卷 ---------- */
function finish() {
  if (QB[cur].noScore) {
    const n = st.res.length;
    dropLS(LS_SESS(cur));
    writeLS(LS_LAST(cur), { ts: Date.now(), total: n, right: n, pct: 100, secs: 0, ch: {}, wrong: [] });
    $('#ov').classList.remove('show');
    st = null;
    goHome();
    toast('本轮看了 ' + n + ' 题，参考答案在每题提交后显示');
    return;
  }
  const secs = Math.round((Date.now() - st.t0) / 1000);
  const total = st.res.length;
  const right = st.res.reduce((a, r) => a + r.score, 0);
  const pct = total ? Math.round(right / total * 100) : 0;
  const chStat = {};
  st.res.forEach(r => {
    const n = r.q.ch;
    chStat[n] = chStat[n] || [0, 0];
    chStat[n][0] += r.score; chStat[n][1] += 1;
  });
  const rec = {
    ts: Date.now(), total, right: Math.round(right * 10) / 10, pct, secs, ch: chStat,
    wrong: st.res.filter(r => r.score < 1).map(r => r.q.id)
  };
  writeLS(LS_LAST(cur), rec);
  dropLS(LS_SESS(cur));
  const bank = cur;
  $('#ov').classList.remove('show');
  $('#homeView').classList.add('hide');
  $('#resultView').classList.remove('hide');
  renderResult(bank, st.res, secs);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- 报告 ---------- */
function renderResult(bank, res, secs) {
  const chs = QB[bank].ch;
  const by = {};
  res.forEach(r => {
    const n = r.q.ch;
    by[n] = by[n] || { t: 0, c: 0, bad: [] };
    by[n].t += 1; by[n].c += r.score;
    if (r.score < 1) by[n].bad.push(r.q);
  });
  const total = res.length;
  const right = res.reduce((a, r) => a + r.score, 0);
  const pct = total ? Math.round(right / total * 100) : 0;
  const mm = Math.floor(secs / 60), ss = secs % 60;
  const verdict = pct >= 90 ? '很稳，细节也抓得住' : pct >= 75 ? '主干懂了，丢分集中在坑上' : pct >= 55 ? '半懂：概念有印象，一写就错' : '建议先按清单回看，再测一次';

  let weakest = null;
  Object.keys(by).forEach(k => {
    const s = by[k];
    if (s.t >= 2 && (!weakest || s.c / s.t < weakest.rate)) weakest = { n: +k, rate: s.c / s.t };
  });

  const chRows = Object.keys(chs).map(Number).sort((a, b) => a - b).map(n => {
    const s = by[n]; if (!s) return '';
    const p = Math.round(s.c / s.t * 100), col = pctColor(p);
    const tags = [...new Set(s.bad.map(q => q.topic))];
    return `<div class="crow">
      <div class="crow-h"><span>${n}. ${esc(chs[n].short)}</span><b style="color:${col}">${Math.round(s.c * 10) / 10}/${s.t} · ${p}%</b></div>
      <div class="bar"><i style="width:${p}%;background:${col}"></i></div>
      ${tags.length ? `<div class="ctags">${tags.map(t => `<span>${fmt(t)}</span>`).join('')}</div>` : ''}
    </div>`;
  }).join('');

  const seen = new Set(), groups = {};
  res.filter(r => r.score < 1).forEach(r => {
    if (seen.has(r.q.topic)) return; seen.add(r.q.topic);
    (groups[r.q.ch] = groups[r.q.ch] || []).push(r.q);
  });
  const weakHtml = Object.keys(groups).length
    ? Object.keys(groups).map(k => {
      const n = +k;
      return `<div class="wk"><h4>Ch ${n} · ${esc(chs[n].name)}</h4>
        <ul>${groups[k].map(q => `<li>${fmt(q.topic)}<span>${esc(q.sec || '')}</span></li>`).join('')}</ul>
        <p>${fmt(chs[n].points.slice(0, 2).join('；'))}</p></div>`;
    }).join('')
    : '<p class="muted">这次全部答对，没有需要回看的点 ✅</p>';

  const detail = res.map((r, i) => {
    const q = r.q;
    const correct = q.type === 'multi'
      ? q.parts.map((p, k) => `${k + 1}. ${p.type === 'choice' ? p.opts[p.ans] : p.a[0]}`).join('　')
      : (q.type === 'choice' ? q.opts[q.ans] : q.a[0]);
    return `<div class="drow ${r.score === 1 ? 'ok' : 'bad'}">
      <div class="dh"><span>${i + 1}. ${esc(q.topic)}</span><i class="${r.score === 1 ? 'y' : 'n'}">${r.score === 1 ? '✓' : Math.round(r.score * 100) + '%'}</i></div>
      <div class="dq">${fmt(q.q)}${q.code ? `<pre class="code sm"><code>${esc(q.code)}</code></pre>` : ''}</div>
      <div class="da">你的答案：${esc(r.skip ? '（点了我不会）' : (r.given || '—'))}　｜　正确：${esc(correct)}</div>
      <div class="dw">${fmt(q.why || '')}</div>
      ${q.detail ? `<details class="detail"><summary>📖 详细讲解</summary><div class="dbody">${rich(q.detail)}</div></details>` : ''}
    </div>`;
  }).join('');

  const wcount = res.filter(r => r.score < 1).length;
  $('#resultView').innerHTML = `
    <div class="res-hero">
      <div class="ring" style="--p:${pct};--c:${pctColor(pct)}"><div class="ring-in"><b>${pct}</b><span>%</span></div></div>
      <div>
        <h2>${verdict}</h2>
        <p>答对 <b>${fmtNum(right)}</b> / ${total} 题　·　用时 ${mm} 分 ${String(ss).padStart(2, '0')} 秒</p>
        <p class="muted">${weakest ? `最需要补：第 ${weakest.n} 章 ${esc(chs[weakest.n].name)}（${Math.round(weakest.rate * 100)}%）` : '每章都覆盖到了'}</p>
      </div>
    </div>
    <div class="grid2">
      <div class="panel"><div class="panel-h"><h3>章节掌握度</h3><span class="muted">绿 ≥85% · 黄 ≥60% · 红 &lt;60%</span></div>${chRows}</div>
      <div class="panel"><div class="panel-h"><h3>需要回看</h3><span class="muted">按章归类的具体考点</span></div>${weakHtml}</div>
    </div>
    <div class="panel">
      <div class="panel-h"><h3>全部题目明细</h3><span class="muted">含解析与出处</span></div>
      <details class="kcard"><summary><span class="kt">展开 ${total} 道题的作答记录</span><i class="chev"></i></summary><div class="kbody">${detail}</div></details>
    </div>
    <div class="startrow" style="margin-bottom:40px">
      ${wcount ? `<button class="btn primary" onclick="retryWrong()">只练错的 ${wcount} 题</button>` : ''}
      <button class="btn ghost" onclick="shareCode()">📋 复制成绩码</button>
      <button class="btn ghost" onclick="start('full')">重新测一次</button>
      <button class="btn ghost" onclick="exportMd()">导出报告 (.md)</button>
      <button class="btn subtle" onclick="goHome()">回到首页</button>
    </div>`;
}

/* ---------- 成绩码 ---------- */
function buildCode() {
  let res = null, rec = null;
  if (st && st.bank === cur && st.res && st.res.length) res = st.res;
  else rec = readLS(LS_LAST(cur));
  if (!res && !rec) return null;

  let total, right, pct, chs = {}, wrong = [];
  if (res) {
    total = res.length;
    right = Math.round(res.reduce((a, r) => a + r.score, 0) * 10) / 10;
    pct = total ? Math.round(right / total * 100) : 0;
    res.forEach(r => {
      const n = r.q.ch;
      chs[n] = chs[n] || [0, 0];
      chs[n][0] += r.score; chs[n][1] += 1;
      if (r.score < 1) wrong.push(r.q.id);
    });
  } else {
    total = rec.total; right = rec.right; pct = rec.pct; chs = rec.ch || {}; wrong = rec.wrong || [];
  }
  const chTxt = Object.keys(chs).sort((a, b) => a - b)
    .map(k => `${k}:${Math.round(chs[k][0] * 10) / 10}/${chs[k][1]}`).join(',');
  return `PYC1|${cur}|${total}|${right}|${pct}|${chTxt}|${wrong.slice(0, 80).join(',')}`;
}

function shareCode() {
  const code = buildCode();
  if (!code) { toast('还没有成绩，先做一轮测评'); return; }
  $('#codeBody').innerHTML = `
    <div class="m-head">
      <div class="m-crumb"><b>成绩码</b><span>·</span><span>复制后发给我</span></div>
      <button class="x" id="codeClose">✕</button>
    </div>
    <div class="m-body">
      <p class="muted" style="margin:0 0 10px">长按下面这段文字 → 全选 → 复制。用微信发**文字**就行，不用传文件。</p>
      <textarea id="codeTa" readonly class="ans codebox">${esc(code)}</textarea>
      <div class="startrow" style="margin-top:12px">
        <button class="btn primary" id="codeCopy">复制</button>
        <span class="muted" id="codeTip"></span>
      </div>
    </div>`;
  $('#codeOv').classList.add('show');
  const ta = $('#codeTa');
  setTimeout(() => { ta.focus(); ta.select(); }, 60);
  $('#codeClose').addEventListener('click', closeCode);
  $('#codeCopy').addEventListener('click', async () => {
    ta.focus(); ta.select();
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(code);
        $('#codeTip').textContent = '已复制 ✓ 直接粘到微信';
      } else throw new Error('no api');
    } catch (e) {
      $('#codeTip').textContent = '已全选，按 Ctrl+C 或长按复制';
    }
  });
}
function closeCode() { $('#codeOv').classList.remove('show'); }

function retryWrong() {
  const l = readLS(LS_LAST(cur));
  const w = new Set((l && l.wrong) || []);
  const pool = B().filter(q => w.has(q.id));
  if (!pool.length) { toast('没有错题'); return; }
  st = { bank: cur, pool, i: 0, res: [], t0: Date.now(), mode: 'wrong' };
  saveSession();
  $('#resultView').classList.add('hide');
  $('#ov').classList.add('show');
  renderQ();
}

function goHome() {
  $('#resultView').classList.add('hide');
  $('#homeView').classList.remove('hide');
  renderHome();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function exportMd() {
  if (!st) return;
  const b = QB[cur];
  const total = st.res.length;
  const right = st.res.reduce((a, r) => a + r.score, 0);
  const d = new Date();
  const L = [`# ${b.label} 测评报告`, ` `,
    `- 时间：${d.toLocaleString('zh-CN')}`,
    `- 成绩：${fmtNum(right)} / ${total}（${total ? Math.round(right / total * 100) : 0}%）`, ` `,
    `## 错题与考点`];
  const wrong = st.res.filter(r => r.score < 1);
  if (!wrong.length) L.push('全部答对。');
  wrong.forEach((r, i) => {
    const q = r.q;
    L.push(`${i + 1}. **${q.topic}**（${q.sec || ''}）`);
    L.push('   - 题目：' + q.q.replace(/\n/g, ' '));
    if (q.code) L.push('   ```\n' + q.code.split('\n').map(l => '   ' + l).join('\n') + '\n   ```');
    L.push(`   - 你的答案：${r.skip ? '（我不会）' : (r.given || '—')}`);
    L.push(`   - 解析：${q.why}`);
  });
  L.push('', '## 逐题记录');
  st.res.forEach((r, i) => L.push(`${i + 1}. ${r.score === 1 ? '✅' : '❌'} ${r.q.topic} — ${r.q.sec || ''}`));
  const blob = new Blob([L.join('\n')], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${b.label}-测评报告-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.md`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast('报告已下载');
}

/* ---------- 册子原题浮层 ---------- */
function openRef(id) {
  const bank = QB.ref;
  if (!bank) return;
  const q = bank.q.find(x => x.id === id);
  if (!q) { toast('没有找到对应的册子题'); return; }
  const correct = q.type === 'choice' ? q.opts[q.ans] : q.a[0];
  $('#refBody').innerHTML = `
    <div class="m-head"><div class="m-crumb"><b>📎 册子原题</b><span>·</span><span>${esc(q.topic)}</span></div>
      <button class="x" id="refClose">✕</button></div>
    <div class="m-body">
      <p class="qtext">${fmt(q.q)}</p>
      ${q.code ? `<pre class="code"><code>${esc(q.code)}</code></pre>` : ''}
      ${q.opts ? `<div class="opts">${q.opts.map((o, i) => `<div class="opt${i === q.ans ? ' ok' : ' dim'} lock"><span class="k">${'ABCD'[i]}</span><span class="t">${fmt(o)}</span></div>`).join('')}</div>` : ''}
      <div class="fb ok" style="margin-top:12px">
        <div class="fb-h">答案</div>
        <div class="fb-row"><span>${esc(correct)}</span></div>
        <div class="fb-why">${fmt(q.why || '')}</div>
        <div class="fb-src">${esc(q.sec || '')}${q.p ? ` · <a class="blink" href="${BILINK(q.p)}" target="_blank" rel="noopener">🎬 回看 ${esc(q.sec)}</a>` : ''}</div>
      </div>
      ${q.note ? `<p class="muted" style="margin-top:10px">${fmt(q.note)}</p>` : ''}
    </div>`;
  $('#refOv').classList.add('show');
  $('#refClose').addEventListener('click', closeRef);
}
function closeRef() { $('#refOv').classList.remove('show'); }

/* ---------- 退出 ---------- */
function quit() {
  if (!st) return;
  if (st.res.length >= st.pool.length) { finish(); return; }
  saveSession();
  if (!confirm('退出本次测评？已答的题目已保存，下次打开可以接着做。')) return;
  $('#ov').classList.remove('show');
  st = null;
  goHome();
}

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-bank]');
  if (tab) {
    if (st) { toast('先把当前测评做完或退出'); return; }
    cur = tab.dataset.bank;
    $('#resultView').classList.add('hide');
    renderHome();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  const chip = e.target.closest('[data-ch]');
  if (chip) {
    const n = +chip.dataset.ch;
    sel().has(n) ? sel().delete(n) : sel().add(n);
    renderHome();
    return;
  }
  const pr = e.target.closest('[data-practice]');
  if (pr) { start('full', +pr.dataset.practice); return; }
  if (e.target.id === 'toDel') {
    const ids = checkedMem(0);
    if (!ids.length) { toast('先在「已掌握」里勾选题目'); return; }
    const m = mem();
    ids.forEach(id => { if (m.del.indexOf(id) < 0) m.del.push(id); });
    saveMem(); renderMem(); toast(`已移到「已删除」${ids.length} 题，以后不再出现`);
    return;
  }
  if (e.target.id === 'restoreDel') {
    const ids = checkedMem(1);
    if (!ids.length) { toast('先在「已删除」里勾选题目'); return; }
    const m = mem();
    m.del = m.del.filter(id => ids.indexOf(id) < 0);
    ids.forEach(id => { m.st[id] = 0; });
    saveMem(); renderMem(); toast(`已恢复 ${ids.length} 题，计数清零`);
    return;
  }
  if (e.target.id === 'pracSkip') { startIds(skipIdsOf(), 'skip'); return; }
  if (e.target.id === 'pracDel') { startIds(mem().del.slice(), 'review'); return; }
  if (e.target.id === 'allOn') { SELS[cur] = new Set(chKeys()); renderHome(); return; }
  if (e.target.id === 'allOff') { SELS[cur] = new Set(); renderHome(); return; }
  if (e.target.id === 'startBtn') { start('full'); return; }
  if (e.target.id === 'quickBtn') { start('quick'); return; }
  if (e.target.id === 'wrongBtn') { start('wrong'); return; }
  if (e.target.id === 'shareBtn') { shareCode(); return; }
  if (e.target.id === 'resumeBtn') { resume(); return; }
  if (e.target.id === 'discardBtn') { dropLS(LS_SESS(cur)); renderResume(); toast('已丢弃上次进度'); return; }
  const rc = e.target.closest('[data-ref]');
  if (rc) { openRef(rc.dataset.ref); return; }
});

document.addEventListener('keydown', e => {
  if ($('#codeOv').classList.contains('show')) {
    if (e.key === 'Escape') { closeCode(); e.preventDefault(); }
    return;
  }
  if ($('#refOv').classList.contains('show')) {
    if (e.key === 'Escape') { closeRef(); e.preventDefault(); }
    return;
  }
  if (!$('#ov').classList.contains('show') || !st) return;
  if (e.key === 'Escape') { e.preventDefault(); quit(); return; }
  const q = st.pool[st.i];
  if (!q) return;
  if (st.answered) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); }
    return;
  }
  if (e.key === 'Enter') { e.preventDefault(); grade(false); return; }
  if (q.type === 'choice') {
    const k = e.key.toUpperCase();
    let idx = -1;
    if (k.length === 1 && k >= '1' && k <= '9') idx = +k - 1;
    else if (k.length === 1 && 'ABCD'.indexOf(k) >= 0) idx = 'ABCD'.indexOf(k);
    if (idx >= 0 && idx < q.opts.length) { e.preventDefault(); pick(0, idx); }
  }
});

window.addEventListener('beforeunload', () => { if (st) saveSession(); });
window.addEventListener('pagehide', () => { if (st) saveSession(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && st) saveSession(); });

/* ---------- 启动 ---------- */
migrateV1();
initSel();
seedMem();
if (!QB[cur]) cur = ORDER.find(k => QB[k]) || 'py';
renderHome();




</script>
<script>
/* ============================================================
   改错题（type: "fix"）
   数据格式：
   { id, ch, topic, sec, type:"fix", q?, code,
     answers:[ { lines:[3] 或 [3,4], code:"替换后的代码", why:"思路" } ],
     detail: "整段思路 / 更优写法" }
   ============================================================ */
const normCode = s => String(s || '').split('\n')
  .map(l => l.replace(/[ \t]+/g, ' ').trim())
  .filter(l => l).join('\n');

function parseRange(s) {
  const out = new Set();
  String(s || '').replace(/[，、,;；]/g, ' ').split(/\s+/).filter(Boolean).forEach(part => {
    const m = part.match(/^(\d+)(?:[-~—](\d+))?$/);
    if (!m) return;
    const a = +m[1], b = m[2] ? +m[2] : a;
    for (let k = Math.min(a, b); k <= Math.max(a, b); k++) out.add(k);
  });
  return [...out].sort((x, y) => x - y);
}
function sameRange(a, b) {
  const x = parseRange(a), y = Array.isArray(b) ? b.slice().sort((p, q) => p - q) : parseRange(b);
  return x.length === y.length && x.every((v, i) => v === y[i]);
}

function renderFixQ(q) {
  st.answered = false;
  st.fix = [{ lines: '', code: '' }];
  const pct = Math.round(st.i / st.pool.length * 100);
  const ch = C()[q.ch];
  const lines = String(q.code).replace(/\s+$/, '').split('\n');
  const codeHtml = lines.map((l, i) =>
    `<span class="row"><i>${i + 1}</i><b>${esc(l) || ' '}</b></span>`).join('');

  $('#modal').innerHTML = `
    <div class="m-head">
      <div class="m-crumb"><b>第 ${st.i + 1} / ${st.pool.length} 题</b><span>·</span><span>Ch ${q.ch} ${esc(ch.short)}</span></div>
      <button class="x" id="quit" title="退出（Esc）">✕</button>
    </div>
    <div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="m-body">
      <div class="qmeta">
        <span class="badge fix">改错题</span>
        <span class="topic">${esc(q.topic)}</span>
        ${q.sec ? `<span class="ver">${esc(q.sec)}</span>` : ''}
      </div>
      <p class="qtext">${fmt(q.q || '下面的程序有问题。找出错误的行，写出改正后的代码（可以整段替换若干行）。')}</p>
      <pre class="fixcode">${codeHtml}</pre>
      <div id="boxes"></div>
      <button class="btn ghost small" id="addBox">＋ 新建修改框</button>
      <div id="fb"></div>
    </div>
    <div class="m-foot">
      <button class="btn subtle" id="skip">直接看答案</button>
      <button class="btn primary" id="submit">提交修改</button>
    </div>`;

  renderBoxes();
  $('#addBox').addEventListener('click', () => { st.fix.push({ lines: '', code: '' }); renderBoxes(); });
  $('#submit').addEventListener('click', () => st.answered ? next() : gradeFix(false));
  $('#skip').addEventListener('click', () => st.answered ? next() : gradeFix(true));
  $('#quit').addEventListener('click', quit);
  $('#modal').scrollTop = 0;
}

function renderBoxes() {
  const wrap = $('#boxes');
  if (!wrap) return;
  wrap.innerHTML = st.fix.map((b, i) => `
    <div class="fixbox" data-i="${i}">
      <div class="fixrow">
        <label>要改的行号</label>
        <input class="fx-lines" data-i="${i}" value="${esc(b.lines)}" placeholder="如 3 或 3-5">
        ${st.fix.length > 1 ? `<button class="fx-del" data-i="${i}">删除</button>` : ''}
      </div>
      <textarea class="fx-code" data-i="${i}" placeholder="替换这几行的代码（可以是多行）">${esc(b.code)}</textarea>
    </div>`).join('');
  $$('#boxes .fx-lines').forEach(el => el.addEventListener('input', () => { st.fix[+el.dataset.i].lines = el.value; }));
  $$('#boxes .fx-code').forEach(el => el.addEventListener('input', () => { st.fix[+el.dataset.i].code = el.value; }));
  $$('#boxes .fx-del').forEach(el => el.addEventListener('click', () => { st.fix.splice(+el.dataset.i, 1); renderBoxes(); }));
}

function fixMatch(q, boxes) {
  return q.answers.map(a => boxes.some(b => sameRange(b.lines, a.lines) && normCode(b.code) === normCode(a.code)));
}

function gradeFix(skip) {
  const q = st.pool[st.i];
  const boxes = st.fix.map(b => ({ lines: b.lines, code: b.code }));
  if (!skip && !boxes.some(b => String(b.lines).trim() || String(b.code).trim())) {
    toast('先写一条修改，或点「我不会」');
    return;
  }
  const m = skip ? q.answers.map(() => false) : fixMatch(q, boxes);
  const results = q.answers.map((a, i) => ({ ref: a, hit: m[i] }));
  st.res.push({ q, score: 0, noscore: true, skip, given: '', parts: [] });
  st.answered = true;
  saveSession();
  paintFix(q, results, boxes, skip);
}

function paintFix(q, results, boxes, skip) {
  // 每个框：只有和参考答案完全一致时才标记
  $$('#boxes .fixbox').forEach((boxEl, i) => {
    const b = boxes[i];
    const hit = q.answers.some(a => sameRange(b.lines, a.lines) && normCode(b.code) === normCode(a.code));
    if (hit) {
      const tip = document.createElement('div');
      tip.className = 'fixmark ok';
      tip.textContent = '✓ 与参考答案一致';
      boxEl.appendChild(tip);
    }
    boxEl.querySelectorAll('input,textarea').forEach(el => { el.disabled = true; });
  });

  const refsHtml = q.answers.map((a, i) => `
    <div class="refbox">
      <div class="refhead">参考答案 ${i + 1} · 第 ${a.lines.join(',')} 行${results[i].hit ? '<span class="refok">你改对了</span>' : ''}</div>
      <pre class="code sm"><code>${esc(a.code || '（删除这几行）')}</code></pre>
      <div class="fb-why">${fmt(a.why || '')}</div>
    </div>`).join('');

  $('#fb').innerHTML = `
    <div class="fb neutral">
      <div class="fb-h">参考答案</div>
      <div class="refs">${refsHtml}</div>
      ${q.detail ? `<div class="dbody" style="margin-top:12px">${rich(q.detail)}</div>` : ''}
      ${q.sec ? `<div class="fb-src">${esc(q.sec)}</div>` : ''}
    </div>`;

  $('#skip').style.display = 'none';
  $('#submit').textContent = st.i === st.pool.length - 1 ? '完成 →' : '下一题 →';
  const body = $('#modal .m-body');
  if (body) body.scrollTo({ top: body.scrollHeight, behavior: 'smooth' });
}

</script>
